# Modern Docker Compose configuration for Trazo Django development
# Based on 2024-2025 best practices

services:
  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: trazo-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-trazo_dev}
      POSTGRES_USER: ${DATABASE_USER:-postgres}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-postgres}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --lc-collate=C --lc-ctype=C"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    ports:
      - "${DATABASE_PORT:-5432}:5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DATABASE_USER:-postgres} -d ${DATABASE_NAME:-trazo_dev}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - trazo-network
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  # Redis for caching and Celery broker
  redis:
    image: redis:7.2-alpine
    container_name: trazo-redis
    restart: unless-stopped
    command: >
      redis-server 
      --appendonly yes 
      --appendfsync everysec
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - trazo-network
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

  # MailDev for email testing
  maildev:
    image: maildev/maildev:2.1.0
    container_name: trazo-maildev
    restart: unless-stopped
    ports:
      - "1080:1080" # Web interface
      - "2525:1025" # SMTP server (changed to port 2525)
    environment:
      MAILDEV_WEB_PORT: 1080
      MAILDEV_SMTP_PORT: 1025
    networks:
      - trazo-network
    deploy:
      resources:
        limits:
          memory: 128M

  # Django web application
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
      target: development
    container_name: trazo-web
    restart: unless-stopped
    command: /app/scripts/start-django.sh
    volumes:
      - .:/app
      - django_static:/app/staticfiles
      - django_media:/app/media
    ports:
      - "${DJANGO_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=backend.settings.dev
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - trazo-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/admin/login/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  # Celery worker for background tasks
  celery-worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
      target: development
    container_name: trazo-celery-worker
    restart: unless-stopped
    command: /app/scripts/start-celery-worker.sh
    volumes:
      - .:/app
      - django_media:/app/media
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=backend.settings.dev
    depends_on:
      web:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - trazo-network
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  # Celery beat for scheduled tasks
  celery-beat:
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
      target: development
    container_name: trazo-celery-beat
    restart: unless-stopped
    command: /app/scripts/start-celery-beat.sh
    volumes:
      - .:/app
      - celery_beat_data:/app/celerybeat-schedule
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=backend.settings.dev
    depends_on:
      web:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - trazo-network
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

  # Flower for monitoring Celery
  flower:
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
      target: development
    container_name: trazo-flower
    restart: unless-stopped
    command: /app/scripts/start-flower.sh
    ports:
      - "${FLOWER_PORT:-5555}:5555"
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=backend.settings.dev
    depends_on:
      celery-worker:
        condition: service_started
      redis:
        condition: service_healthy
    networks:
      - trazo-network
    deploy:
      resources:
        limits:
          memory: 256M

networks:
  trazo-network:
    driver: bridge
    name: trazo-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  django_static:
    driver: local
  django_media:
    driver: local
  celery_beat_data:
    driver: local
