[tool.poetry]
name = "trazo-back"
version = "0.1.0"
description = "Trazo Agricultural Carbon Transparency Platform"
authors = ["Oscar Muñoz <osmunogue@gmail.com>"]
readme = "README.md"
packages = [
    { include = "backend" },
]

[tool.poetry.dependencies]
# ── Django 5.2 LTS upgrade, 2026-09-07 (ADR-010) ────────────────────────────────────────
# Django 4.1.4 reached EOL on 2023-12-01 and ran in production for 33 months with no
# security release. 4.2 LTS is ALSO dead (EOL 2026-04-07), so 5.2 LTS — supported to
# 2028-04-30 — is the only target. Django 5.x requires Python >= 3.10.
#
# The root cause was the PIN STYLE, not neglect. Fifteen packages below used to be listed
# here as exact pins despite being purely TRANSITIVE (certifi, cffi, charset-normalizer,
# click, defusedxml, idna, oauthlib, pathspec, platformdirs, pycparser, python3-openid,
# pytz, requests-oauthlib, sqlparse, tomli, urllib3). Verified 2026-09-07: not one of them
# is imported anywhere in this codebase. Pinning them held the entire dependency tree at its
# 2022 resolution. They are removed so the resolver can do its job; Renovate
# (renovate.json5) now keeps the real direct dependencies current.
python = "^3.11"
asgiref = "^3.8"
# ^46 was not enough: 46.0.7 still carries 6 advisories whose fixes land in 49.0.0 / 50.0.0
# (PYSEC-2026-3552/3553/3554, GHSA-537c-gmf6-5ccf). Verified before jumping four majors that
# usage is Fernet / hashes / PBKDF2HMAC only — the most stable surface in the library.
cryptography = "^50.0"
dj-database-url = "^2.3"
django = "^5.2"
django-allauth = "^65.0"
django-cors-headers = "^4.7"
djangorestframework = "^3.16"
djangorestframework-simplejwt = "^5.5"
gunicorn = "^23.0"
mypy-extensions = "^1.0.0"
# 12.x clears FIFTEEN advisories carried by 11.3.0 (pip-audit, 2026-09-07). This is the
# library that decodes farmer-uploaded photos — i.e. it parses untrusted input on every
# upload — so it is the highest-value bump in the tree, major version or not.
# Verified before bumping: usage is Image / ImageDraw / ImageStat / ExifTags only, none of
# the APIs Pillow removed across 10.x-12.x (no ANTIALIAS, no tostring, no textsize).
pillow = "^12.0"
psycopg2-binary = "^2.9"
pyjwt = {extras = ["crypto"], version = "^2.10.1"}
python-dotenv = "^1.0"
qrcode = "^8.0"
requests = "^2.32"
typing-extensions = "^4.5.0"
whitenoise = "^6.8"
python-decouple = "^3.7"
geoip2 = "^4.7.0"
ipython = "^8.14.0"
boto3 = "^1.28.57"
django-storages = "^1.14.1"
drf-nested-routers = "^0.93.4"
celery = "^5.3.6"
redis = "^5.0.1"
stripe = "^11.6.0"
django-celery-beat = "^2.5.0"
django-redis = "^5.4.0"
reportlab = "^4.4.1"
web3 = "^7.12.0"
openai = "^1.90.0"
django-ratelimit = "^4.1.0"
psutil = "^7.0.0"
channels = "^4.2"
channels-redis = "^4.2.1"
daphne = "^4.2.1"
argon2-cffi = "^25.1.0"
google-cloud-vision = "^3.9.0"  # MVP Photo Verification - AI content validation
sentry-sdk = "^2.54.0"
openpyxl = "^3.1.5"
pillow-heif = {version = ">=0.16.0", python = ">=3.10"}
drf-spectacular = "^0.27.2"  # OpenAPI 3.1 schema generation for frontend TypeScript codegen
# django-auditlog 3.x is the first release series that supports Django 5.x.
django-auditlog = "^3.0"
# UNDECLARED UNTIL 2026-09-07. 22 modules import pdfminer/pdfplumber — 21 test files that
# assert on generated packet TEXT, plus history/management/commands/audit_sample_farm.py.
# It had never been in pyproject.toml or poetry.lock; it reached the maintainer's virtualenv
# by a manual `pip install` (pip reported `Required-by:` empty). So it worked on one laptop
# and ImportError'd on every fresh install — found by the first CI run that got far enough to
# import the test modules. Declared in the MAIN group, not dev, because a management command
# imports it. pdfplumber pulls pdfminer.six.
pdfplumber = "^0.11.9"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-django = "^4.8.0"
pytest-cov = "^4.1.0"
black = "^25.1.0"
isort = "^5.12.0"
flake8 = "^6.0.0"
mypy = "^1.3.0"
bandit = "^1.7.5"
coverage = "^7.0.0"
factory-boy = "^3.3.0"
moto = "^5.1.6"
locust = "^2.15.1"
safety = "^2.3.5"
django-debug-toolbar = "^4.1.0"
pytest-asyncio = "^1.1.0"
autoflake = "^2.3.1"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "backend.settings.dev"
python_files = ["test_*.py", "*_test.py", "testing/python/*.py"]
testpaths = [
    ".",
    "tests/",
    "carbon/tests",
    "users/tests", 
    "common/tests",
    "subscriptions/tests",
    "company/tests",
    "education/tests",
    "history/tests",
    "product/tests",
    "reviews/tests",
    "support/tests"
]
addopts = [
    "-v",
    "--tb=short", 
    "--strict-markers",
    "--reuse-db",
    "--nomigrations"
]
asyncio_mode = "auto"
markers = [
    "unit: Unit tests",
    "integration: Integration tests", 
    "performance: Performance tests",
    "slow: Slow tests",
]

[tool.coverage.run]
source = ["."]
omit = [
    "*/migrations/*",
    "*/venv/*",
    "*/env/*",
    "manage.py",
    "*/settings/*",
    "*/tests/*",
    "*/__pycache__/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
]

[tool.black]
line-length = 120
target-version = ['py39']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
  | migrations
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 120
known_django = "django"
known_first_party = ["trazo"]
sections = ["FUTURE", "STDLIB", "DJANGO", "THIRDPARTY", "FIRSTPARTY", "LOCALFOLDER"]
skip_glob = ["*/migrations/*.py"]

[tool.flake8]
max-line-length = 120
extend-ignore = ["E203", "W503", "E501"]
exclude = [
    ".git",
    "__pycache__",
    "*/migrations/*.py",
    ".venv",
    "build",
    "dist"
]

[tool.mypy]
python_version = "3.9"
check_untyped_defs = true
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
exclude = [
    "migrations/",
    "venv/",
    ".venv/"
]

[tool.bandit]
exclude_dirs = ["tests", "migrations"]
skips = ["B101", "B601"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"