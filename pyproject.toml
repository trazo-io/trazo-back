[tool.poetry]
name = "trazo-back"
version = "0.1.0"
description = "Trazo Agricultural Carbon Transparency Platform"
authors = ["Oscar Muñoz <osmunogue@gmail.com>"]
readme = "README.md"
packages = [
    { include = "backend" },
]

[tool.poetry.dependencies]
python = "^3.9"
asgiref = "3.6.0"
certifi = "2022.12.7"
cffi = "1.17.1"
charset-normalizer = "2.1.1"
click = "8.1.3"
cryptography = "38.0.4"
defusedxml = "0.7.1"
dj-database-url = "1.2.0"
django = "4.1.4"
django-allauth = "0.51.0"
django-cors-headers = "3.13.0"
djangorestframework = "3.14.0"
djangorestframework-simplejwt = "5.2.2"
gunicorn = "20.1.0"
idna = "3.4"
mypy-extensions = "^1.0.0"
oauthlib = "3.2.2"
pathspec = "0.10.3"
pillow = "11.0.0"
platformdirs = "2.6.2"
psycopg2-binary = "2.9.10"
pycparser = "2.21"
pyjwt = {extras = ["crypto"], version = "^2.10.1"}
python-dotenv = "0.21.0"
python3-openid = "3.2.0"
pytz = "2022.7"
qrcode = "7.3.1"
requests = "2.28.1"
requests-oauthlib = "1.3.1"
sqlparse = "0.4.3"
tomli = "2.0.1"
typing-extensions = "^4.5.0"
urllib3 = "1.26.13"
whitenoise = "6.2.0"
python-decouple = "^3.7"
geoip2 = "^4.7.0"
ipython = "^8.14.0"
boto3 = "^1.28.57"
django-storages = "^1.14.1"
drf-nested-routers = "^0.93.4"
celery = "^5.3.6"
redis = "^5.0.1"
stripe = "^11.6.0"
django-celery-beat = "^2.5.0"
django-redis = "^5.4.0"
reportlab = "^4.4.1"
web3 = "^7.12.0"
openai = "^1.90.0"
django-ratelimit = "^4.1.0"
psutil = "^7.0.0"
channels = "4.0.0"
channels-redis = "^4.2.1"
daphne = "^4.2.1"
argon2-cffi = "^25.1.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-django = "^4.8.0"
pytest-cov = "^4.1.0"
black = "^25.1.0"
isort = "^5.12.0"
flake8 = "^6.0.0"
mypy = "^1.3.0"
bandit = "^1.7.5"
coverage = "^7.0.0"
factory-boy = "^3.3.0"
moto = "^5.1.6"
locust = "^2.15.1"
safety = "^2.3.5"
django-debug-toolbar = "^4.1.0"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "backend.settings.dev"
python_files = ["test_*.py", "*_test.py", "testing/python/*.py"]
testpaths = [
    ".",
    "tests/",
    "carbon/tests",
    "users/tests", 
    "common/tests",
    "subscriptions/tests",
    "company/tests",
    "education/tests",
    "history/tests",
    "product/tests",
    "reviews/tests",
    "support/tests"
]
addopts = [
    "-v",
    "--tb=short", 
    "--strict-markers",
    "--reuse-db",
    "--nomigrations"
]
markers = [
    "unit: Unit tests",
    "integration: Integration tests", 
    "performance: Performance tests",
    "slow: Slow tests",
]

[tool.coverage.run]
source = ["."]
omit = [
    "*/migrations/*",
    "*/venv/*",
    "*/env/*",
    "manage.py",
    "*/settings/*",
    "*/tests/*",
    "*/__pycache__/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
]

[tool.black]
line-length = 120
target-version = ['py39']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
  | migrations
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 120
known_django = "django"
known_first_party = ["trazo"]
sections = ["FUTURE", "STDLIB", "DJANGO", "THIRDPARTY", "FIRSTPARTY", "LOCALFOLDER"]
skip_glob = ["*/migrations/*.py"]

[tool.flake8]
max-line-length = 120
extend-ignore = ["E203", "W503", "E501"]
exclude = [
    ".git",
    "__pycache__",
    "*/migrations/*.py",
    ".venv",
    "build",
    "dist"
]

[tool.mypy]
python_version = "3.9"
check_untyped_defs = true
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
exclude = [
    "migrations/",
    "venv/",
    ".venv/"
]

[tool.bandit]
exclude_dirs = ["tests", "migrations"]
skips = ["B101", "B601"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"