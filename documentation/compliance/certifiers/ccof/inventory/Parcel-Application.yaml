overrides:
- op: add
  ref: A (separate copy per parcel)
  after: ''
  kind: instruction
  text: 'Complete a separate copy of this form for each: physically separate, non-adjacent area you wish to certify;
    area with a different organic eligibility date, even if adjacent.'
  reason: Unnumbered instruction bullets at the head of section A.
- op: set
  ref: B
  kind: instruction
  reason: Section B is an explanation of CCOF's transitional status; it asks nothing.
- op: rename
  ref: G
  to: G (currently certified)
  reason: Section G's requirements are unnumbered bullets; each gets a descriptive ref.
- op: add
  ref: G (affidavit)
  after: G (currently certified)
  text: If the field is not currently certified organic, provide one or more copies of the Affidavit of Land History,
    signed and dated by each person identified in question F6, or alternative documents.
  reason: Unnumbered bullet in section G.
- op: add
  ref: G (container)
  after: G (affidavit)
  text: 'For container systems: provide one of the following. Not applicable, all crops are grown in ground.'
  reason: Unnumbered bullet in section G.
- op: add
  ref: C (not used for livestock)
  after: B
  text: 'C. Livestock Use: Not used for organic livestock'
  reason: The section heading carries its own checkbox, which gates C1 to C4.
- op: rename
  ref: A
  to: Affidavit A
  reason: The form prints the Affidavit of Land History's own sections A to D after section G; prefixed so they
    are not read as the application's.
- op: rename
  ref: B (2)
  to: Affidavit B
  reason: The form prints the Affidavit of Land History's own sections A to D after section G; prefixed so they
    are not read as the application's.
- op: rename
  ref: C
  to: Affidavit C
  reason: The form prints the Affidavit of Land History's own sections A to D after section G; prefixed so they
    are not read as the application's.
- op: rename
  ref: D
  to: Affidavit D
  reason: The form prints the Affidavit of Land History's own sections A to D after section G; prefixed so they
    are not read as the application's.
