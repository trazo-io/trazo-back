items:
- ref: Preamble (applicability)
  text: Complete this form if you source products from other operations and/or sell products directly to consumers.
  kind: question
- ref: A1
  text: Do you source organic crops/products from other operations?
  kind: question
- ref: A2
  text: Attach organic certificates for all suppliers listed above. Attached
  kind: question
- ref: A3
  text: How do you verify that incoming products do not contact prohibited substances during transport from the
    supplier to your operation?
  kind: question
- ref: A4
  text: How do you ensure that organic products are not commingled with nonorganic during transport from the supplier
    to your operation?
  kind: question
- ref: B1
  text: Describe all direct marketing venues below or attach a list. Include CSAs, farm stands, Farmers’ Markets,
    U-Pick, and online sales.
  kind: question
- ref: B1a
  text: Farmers’ Markets Not applicable, no sales at farmers’ markets.
  kind: question
- ref: B1b
  text: Other direct marketing venues (CSA, farm stand, u-pick, online/website sales, etc.) Not applicable, none
    of these
  kind: question
- ref: C1
  text: How do you differentiate organic and non-organic products to consumers?
  kind: question
