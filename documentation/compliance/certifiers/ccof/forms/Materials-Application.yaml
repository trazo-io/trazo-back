form:
  code: ''
  title: Grower Materials Application (OSP Materials List)
  document_id: ORGB41
  revision: V2, 12/31/2023
  url: https://www.ccof.org/resource/grower-materials-application-osp-materials-list/
  pdf: https://www.ccof.org/wp-content/uploads/2026/10/Grower-Materials-Application-ORGB41.pdf
  retrieved: 2026-10-24
  nop_cites:
  - § 205.105
  - § 205.201
  - § 205.203
  - § 205.206
  - § 205.271
  - § 205.272
  - § 205.601
  - § 205.602
  - § 205.605
  guide_trigger: Item 1 — apply for CCOF organic certification for crop production
  required_of_every_grower: true
  # The Materials List workbook lists every product the records and the plan name, with maker,
  # reason for use and in-use status — this form's own columns — so the coverage page names it
  # first. The module page is the plan's approved list alone (WSDA desk read, 2026-09-10).
  packet_documents:
  - workbooks/Materials List.xlsx
  trazo_module: materials_application
  register_status: complete
  source_sha256: 51b30edccaffddf01fba8c0de65ae8aaf5efc07eac23ae57752f1d48644b810a
items:
- ref: Header (citations)
  kind: instruction
  asks: Header cites §§ 205.105, 205.201, 205.203, 205.206, 205.271, 205.272, 205.601, 205.602, 205.605 — the
    form's scope covers crop inputs, handling sanitizers, and facility pest control materials.
  note: 'The module''s own nop_cites: The module''s `nop_cites` now names § 205.105, § 205.601, § 205.605 and
    § 205.206(e) — § 205.605 added 2026-09-12 with the post-harvest contact block (§D). § 205.203, § 205.271,
    § 205.272 and § 205.602 are still not cited, matching the fact that facility pest-control materials (§F/§G)
    have no structured capture yet.'
- ref: Preamble (submit with application)
  kind: instruction
  asks: Submit this form with your application for certification.
- ref: Preamble (list all materials)
  asks: List all materials used or planned for use.
  status: partial
  severity: P2
  trazo:
    questions:
    - materials_application.materials_list_panel
    prints: modules/materials_application.pdf; narrative snapshot (a)(2)
  gap: Adding a catalog material to the registry is independent of any logged event, so a planned product can
    be added ahead of use — but nothing records whether a row is planned, in use, or discontinued, and the
    narrative compiler asserts 'used or planned' identically for every row regardless.
  fix: Add a `status` field (planned / in use / discontinued) to the registry row; print it; suggest 'in use'
    from an application dated inside the plan year, with the operator confirming.
- ref: Preamble (review all sections)
  asks: Review all sections for applicability to your operation. Complete each one or mark 'Not applicable'
    as appropriate.
  status: covered
  trazo:
    questions:
    - materials_application.no_materials_used
    - materials_application.fertilizers_none_used
    - materials_application.pest_disease_weed_none_used
    - materials_application.production_aids_none_used
    - materials_application.post_harvest_contact_none_used
    - materials_application.materials_list_complete
    models:
    - certifications.services.plan_materials.none_used_contradictions
    prints: modules/materials_application.pdf §A — 'The operator states that no input materials or substances
      are used…' when stated; §B — one 'none used' statement per category, each hiding that category's completeness
      attestation; narrative § 205.201(a)(2); a statement the plan's rows or the logged applications contradict
      is flagged '[REVIEW]' beside it
  note: 'Closed 2026-09-09: each category is tri-state — none used (its own boolean, compiled as a statement),
    all listed (the attestation), or not yet complete (the attestation answered No) — and a module-level `no_materials_used`
    replaces the empty-list sentence that read as an unfinished list. Both are checked against the plan and
    the logged applications and flagged, never silently accepted.'
- ref: Preamble (CCOF review)
  asks: CCOF will review all materials listed and provide you with a copy of your OSP Materials List listing
    approved materials.
  status: covered
  trazo:
    questions:
    - materials_application.materials_list_panel
    - materials_application.materials_list_complete
    models:
    - certifications.PlanMaterialEntry.agent_review (requested / approved / not_approved / review_incomplete, with
      the date and the list or letter, as the operator records it from CCOF's OSP Materials List)
    prints: modules/materials_application.pdf §A (each material's line); workbooks/Materials List.xlsx (Comments)
    where: 'modules/materials_application.pdf: Section A, each material''s line; workbooks/Materials List.xlsx: Comments'
  # Covered 2026-11-04. The agent's review is its own record per material, separate from the listing basis
  # (an OMRI listing is not CCOF's approval), set by the operator from CCOF's list, never inferred, the agent
  # set by the server. It prints as "on CCOF's approved materials list dated ..., as recorded by the operator".
  # The old "certifier letter" listing basis was folded into it (migration 0068).
- ref: Preamble (adding or removing materials)
  asks: To add or remove materials after your initial application, update your OSP Materials List (MyCCOF Material
    Search, email, or other notice to CCOF).
  status: partial
  severity: P2
  trazo:
    where: not in this packet; the operation's audit export, a separate document, carries the change log
    models:
    - certifications.models.ApprovedInputChangeLog
    - certifications.models.OSPChangeNotification
    prints: history/audit-export dossier (change log); plan_review flags inputs_changed
  gap: 'Catalog-attached additions and removals are logged (`ApprovedInputChangeLog`, written by the add/remove
    views) and `plan_review` flags them. An operator-entered `PlanMaterialEntry` added mid-year carries only
    `created_at`: no change-log row is written for it, so `plan_review` cannot surface the addition and the
    audit export''s change log omits it.'
  fix: Write an `ApprovedInputChangeLog` row on `PlanMaterialEntry` create and delete, or have `plan_review`
    read `PlanMaterialEntry.created_at` beside the log.
- ref: Preamble (only listed materials)
  asks: It is your responsibility to verify that all materials are allowed prior to use. Only materials included
    in your OSP Materials List may be used.
  status: partial
  severity: P2
  trazo:
    questions:
    - materials_application.materials_list_panel
    - materials_application.materials_list_complete
    models:
    - certifications.services.plan_materials
    - certifications.services.common_osp_workbooks (Materials List)
    prints: modules/materials_application.pdf §A; workbooks/Materials List.xlsx; narrative § 205.201(a)(2)
  gap: 'Since 2026-11-04 the attestation is gated on reconciliation: "Yes" is refused while the records name a
    product the plan''s list does not hold, by exact name or a current identity decision, and the category
    statements are gated on their own products. The operator can add their own material as they name it (an
    operator row), so the gate never demands an attestation they cannot satisfy. Still open, and why this is
    P2: enforcement stays after the fact. The activity wizard does not offer the plan''s own rows when an
    application is logged, so a name that matches nothing on the list can still be typed, and is caught only
    by the drift detector and this gate.'
  fix: Offer the plan's materials list in the activity wizard's product field when an application is logged.
  root_cause: materials-lists-disagree
- ref: A
  asks: 'List all fertilizers, compost, manure, gypsum, limestone, micronutrients, or other fertilizers/soil
    amendments planned for use: Full product name (including formulation), Full manufacturer name, Reason for
    use. Or check ''Not applicable, none of these.'''
  status: partial
  severity: P2
  trazo:
    questions:
    - materials_application.materials_list_panel
    models:
    - certifications.PlanMaterialEntry.product_name
    - certifications.PlanMaterialEntry.manufacturer
    - certifications.PlanMaterialEntry.reason_for_use
    - certifications.PlanMaterialEntry.listing_basis
    prints: modules/materials_application.pdf §A; narrative § 205.201(a)(2)
  gap: 'Column by column: product name: Closed 2026-09-09 (fix/parcel-page-land-history, materials cut): the
    certifier-facing line (`PlanMaterial.display(stated_absences=True)`, used by the module PDF and the plan
    snapshot) states a missing cell as missing — ''manufacturer not stated'', ''reason for use not stated'',
    and for a bare National List substance ''brand and formulation not stated'' — instead of omitting it, so
    a row that needs the cell no longer reads like a row that never did. The Materials List workbook already
    counts each blank per row (`fix_hint="materials_list"`) and the editor names where it is answered. Remaining:
    there is no separate `formulation` field — `product_name` carries the formulation only when the operator
    typed it — and a National List attach does not require the operator row that names the brand actually applied.
    manufacturer: Closed 2026-09-09 (fix/parcel-page-land-history, materials cut): the certifier-facing line
    (`PlanMaterial.display(stated_absences=True)`, used by the module PDF and the plan snapshot) states a missing
    cell as missing — ''manufacturer not stated'', ''reason for use not stated'', and for a bare National List
    substance ''brand and formulation not stated'' — instead of omitting it, so a row that needs the cell no
    longer reads like a row that never did. The Materials List workbook already counts each blank per row (`fix_hint="materials_list"`)
    and the editor names where it is answered. Remaining: nothing REQUIRES the cell before a row is saved.
    The ''add my own material'' path posts the name alone and the operator fills the maker in the list panel
    afterwards, so a hard requirement at create would break the flow the editor is built around. reason for
    use: `PlanMaterialEntry.reason_for_use` exists (migration 0035) and is what the workbook''s reason column
    prints when the operator wrote one; catalog-only rows with no entry still fall back to `_material_reason()`''s
    category word (''Fertilizer'', ''Pest control''), and the reason does not print in the module PDF.'
  fix: Add a `formulation` field the editor asks for by name; on a National List attach, require the operator
    row (brand + formulation) alongside the FK. Require `manufacturer` at the point the row is marked in use
    or the plan is submitted (a completion gate, not a create-time refusal); prompt for brand and maker on
    a National List attach. Print `reason_for_use` in the module PDF row; prompt for it when a catalog material
    is attached without an entry.
  note: 'Re-cut 2026-09-30 (OSP alignment audit, T26): the form does not number these; refs follow the printed
    text.'
- ref: B (lead-in)
  kind: instruction
  asks: You may use crop pest control materials only if preventative practices and mechanical/physical controls
    are not sufficient to prevent or control pests.
  note: The hierarchy is asked on G5.0 (`applies_pest_weed_disease_inputs`, `input_use_conditions`).
- ref: B
  asks: 'List all insecticides, fungicides, pesticides, herbicides, or other pest, weed, or disease control
    materials: Full product name (including formulation), Full manufacturer name, Reason for Use. Or check
    ''Not applicable, none of these.'''
  status: partial
  severity: P2
  trazo:
    questions:
    - materials_application.materials_list_panel
    - materials_application.pest_disease_weed_listed
    models:
    - certifications.PlanMaterialEntry.product_name
    - certifications.PlanMaterialEntry.manufacturer
    - certifications.PlanMaterialEntry.reason_for_use
    - certifications.PlanMaterialEntry.listing_basis
    prints: modules/materials_application.pdf §A; narrative § 205.201(a)(2)
  gap: 'Closed 2026-09-09 (fix/parcel-page-land-history, materials cut): the certifier-facing line (`PlanMaterial.display(stated_absences=True)`,
    used by the module PDF and the plan snapshot) states a missing cell as missing — ''manufacturer not stated'',
    ''reason for use not stated'', and for a bare National List substance ''brand and formulation not stated''
    — instead of omitting it, so a row that needs the cell no longer reads like a row that never did. The Materials
    List workbook already counts each blank per row (`fix_hint="materials_list"`) and the editor names where
    it is answered. The module PDF and snapshot no longer substitute a category word for the reason: a catalog-only
    row prints ''reason for use not stated''. Remaining: the workbook''s fallback still prints the event subtype
    (''Pest control'') in the reason column, and nothing requires the three cells before submission.'
  fix: Same completion-gate fix as A (manufacturer); make the workbook's reason fallback read 'reason for use
    not stated (Pest control)' so the category word is labelled as a fallback.
  note: 'Re-cut 2026-09-30 (OSP alignment audit, T26): the form does not number these; refs follow the printed
    text.'
- ref: B (listing evidence)
  kind: interpretation
  asks: '(The evidentiary basis for §B''s category attestations: the operator confirms that every pest, disease
    and weed-control material used or planned is on the list.)'
  trazo:
    questions:
    - materials_application.pest_disease_weed_listed
    - materials_application.fertilizers_listed
    - materials_application.post_harvest_contact_listed
    models:
    - certifications.services.osp_prefill (materials_category_evidence)
    prints: modules/materials_application.pdf §B; narrative § 205.201(a)(2)
  reason: 'Not on the form: Trazo''s reading of what evidence backs the category attestations. Its gap is carried
    by ''Preamble (only listed materials)'', the official item it supports.'
- ref: C
  asks: 'List any other crop production materials not listed in §A/§B — seed treatments (coatings, pelleting,
    inoculants), growing media (substrate, planting mix, potting soil), adjuvants, etc.: Full product
    name, Full manufacturer name, Reason for Use. Or check ''Not applicable, none of these.'''
  status: partial
  severity: P1
  trazo:
    questions:
    - materials_application.production_aids_listed
    prints: —
  gap: 'Seed treatments are attested (`seed_treatment` free text on planting events, plus a boolean) but
    never enumerated onto a list or the workbook. Adjuvant partners already exist as structured data (`tank_mix_partners`:
    name, manufacturer, organic-approved) but nothing reads them into §C. Growing media/substrate has
    no field anywhere. The register previously also carried a second §C row whose `asks` was a paraphrase
    of Trazo''s own G3.0 seed-treatment verification rather than CCOF''s text, marked `covered`. Deleted
    2026-08-28: §C asks for a LIST — product, manufacturer, reason, including growing media and adjuvants
    — and `treatment_verification` lists none of that. Answering a different question well is not coverage.'
  fix: Read `seed_treatment` names and `tank_mix_partners` into the materials rows (category C); add a
    growing-media field to the operator-authored row for container/nursery operations.
- ref: D
  asks: 'If you conduct post-harvest handling: list materials that directly contact organic crops during handling
    (wash water additives, sanitizers, gases): Brand Name, Manufacturer, Reason for use. Or check ''Not applicable,
    no post-harvest handling OR none of these used.'''
  status: partial
  severity: P1
  trazo:
    questions:
    - materials_application.post_harvest_contact_listed
    - materials_application.post_harvest_contact_none_used
    - g6_4_handling.water_source_sanitizer
    - g6_4_handling.wash_water_additives_added
    - g6_4_handling.equipment_sanitizer_where_used
    models:
    - certifications.PlanMaterialEntry.category
    - certifications.services.plan_materials.logged_post_harvest_sanitizers
    - history.ProductionEvent.sanitizer_name
    prints: 'modules/materials_application.pdf §A — ''Post-harvest contact materials'' block (rows filed under
      the post_harvest category: product — manufacturer — listing — reason); workbooks/Materials List.xlsx
      (logged wash-water sanitizers as rows of their own); the [REVIEW] reconciliation line on both'
  gap: 'The row shape is CCOF''s (brand, manufacturer, reason — a missing cell stated as missing) and the N/A
    is the operator''s `post_harvest_contact_none_used` statement, checked against the post-harvest records
    since 2026-09-12. Two things remain: the logged sanitizer (`sanitizer_name`, a brand or a substance as
    the operator typed it) reaches the Materials List workbook and the [REVIEW] unmatched-names line, but is
    not resolved to the plan''s row by anything smarter than an exact name match — ''SaniDate 5.0'' on the
    log and ''Peracetic acid'' on the plan still read as two products; and ''gases'' (CO2, ethylene) have no
    record source at all. Authority: Only § 205.601 National List rows are seeded (crop-production substances),
    annotated ''equipment, seed, and asexual plant material disinfection only'' — an annotation that excludes
    the wash-flume use the packet itself describes. § 205.605 has a defined choice slot but zero seeded rows,
    so the pilot''s sanitizer record cites the wrong section.'
  fix: Offer the plan's post-harvest rows in the post-harvest activity wizard so the event stores the row's
    FK (the same fix Header F proposes for crop inputs); add a gas option to the post-harvest event. Seed §
    205.605(a)/(b) rows (chlorine materials, hydrogen peroxide, ozone, peracetic acid, alcohols, citric acid,
    phosphoric acid, sodium carbonate); bias `verify_input` toward § 205.605 when the caller is a post-harvest
    or equipment event.
- ref: D (authority)
  kind: interpretation
  asks: (The CFR authority for post-harvest sanitizers is § 205.605(b), handling — distinct from § 205.601,
    crop production.)
  trazo:
    prints: history/audit-export dossier (cites § 205.601(a)(6) where § 205.605 applies)
  reason: 'Not on the form: the CFR section that governs §D''s materials. Its gap is carried by D.'
- ref: D (listing evidence)
  kind: interpretation
  asks: (Implicit in submitting a complete §D table, and in marking N/A when there is no post-harvest handling.)
  trazo:
    questions:
    - materials_application.post_harvest_contact_listed
    - materials_application.post_harvest_contact_none_used
    models:
    - certifications.services.osp_prefill._materials_category_evidence
    - certifications.services.plan_materials.none_used_contradictions
    prints: modules/materials_application.pdf §B (post_harvest_contact_listed; the none-used statement with
      its [REVIEW] line when post-harvest records name a sanitizer)
  reason: 'Not on the form: what makes §D''s answer complete. The §D answer itself is judged on D.'
  note: 'Closed 2026-09-12: the prefill reads ProductionEvent PH `sanitizer_name` (it filtered ChemicalEvent
    for a type that model never carries), and the none-used statement is set against the same records.'
- ref: E
  asks: Table, by material type — Detergent/soap/cleaner (must rinse), Chlorine (calcium hypochlorite
    / chlorine dioxide / sodium hypochlorite / hypochlorous acid only), Peracetic/peroxyacetic acid, Phosphoric
    acid, Alcohol (ethanol/isopropanol; air dry or rinse), Citric acid, Hydrogen peroxide, Ozone, Quaternary
    ammonium sanitizer (must rinse and test for zero residue), Other or unknown — each with Used?, Rinsed?
    (Yes/No), and Where Used. Or 'Not applicable.'
  status: partial
  severity: P2
  trazo:
    questions:
    - g6_4_handling.water_source_sanitizer
    - g6_4_handling.uses_equipment_sanitizer_or_cleaner
    - g6_4_handling.equipment_sanitizer_types
    - g6_4_handling.equipment_sanitizer_types_rinsed
    - g6_4_handling.equipment_sanitizer_where_used
    - g6_4_handling.sanitizer_residual_free_assurance
    - g6_4_handling.sanitizer_residual_free_assurance_other
    - g6_4_handling.sanitizer_residual_testing_protocol
    prints: modules/G6_4.pdf §C (equipment_sanitizer_types — CCOF's ten types; equipment_sanitizer_types_rinsed;
      equipment_sanitizer_where_used; sanitizer_residual_free_assurance; sanitizer_residual_testing_protocol);
      narrative § 205.201(a)(5)
  gap: Since 2026-09-12 the ten CCOF types are a checkbox group on G6.4 with a parallel 'which are rinsed' group
    and a per-product where-used text, so Used / Rinsed / Where Used all print — as two lists and a text rather
    than one three-column table per type, and 'where used' is free prose the operator writes per product, not
    a cell per type. Nothing prefills the types from the equipment-maintenance records' `cleaning_materials_used`
    text, and § 205.605 rows are still not seeded in the National List catalogue, so a sanitizer attached from
    the catalogue cites § 205.601.
  fix: Render the two groups plus the text as one table in the module PDF; suggest types from `cleaning_materials_used`
    (suggest→confirm); seed the § 205.605 rows.
- ref: F
  asks: Table, by National List material type — Ammonium carbonate, Boric acid, Botanical pesticides,
    Carbon dioxide, Diatomaceous earth, Nitrogen gas, Nonsynthetic bait/lure/repellent, Pheromones, Pyrethrum/pyrethrins,
    Sticky traps, Vitamin D3 — each with Used?, Where Used, and Applied by fumigation/fogging? (Yes/No).
    Or 'Not applicable.'
  status: not_covered
  severity: P1
  trazo:
    questions:
    - g9_0_facility_pest.material_tier
    - g9_0_facility_pest.preventive_measures_documentation
    prints: —
  gap: G9.0 collapses all of this to a single `material_tier` radio (none / non-production-only / National
    List / synthetic-approved); there is no per-type row, no where-used field, and no fumigation/fogging
    flag anywhere for facility pest control. Only 5 of the 11 National List types are seeded as substances
    at all (ammonium carbonate, boric acid, sticky traps, pheromones, vitamin D3); the pilot answers `material_tier
    = none` with snap traps recorded only as a mechanical control.
  fix: Replace or augment `material_tier` with a checkbox_group of the 11 National List types, each with
    `where_used` and `applied_by_fumigation`; seed the six missing substances; compile a table from the
    answers.
- ref: G
  asks: 'List any pest control material used in a post-harvest handling or crop-storage facility that
    does not fit a §F National List type (e.g., ''MAX Fog Roach Killer / Storage room / Yes''): Non-National
    List Material, Where Used, Applied by fumigation/fogging? Or ''Not applicable.'' / ''Other list attached.'''
  status: not_covered
  severity: P1
  trazo:
    questions:
    - g9_0_facility_pest.material_tier
    prints: —
  gap: G9.0's `synthetic_approved` option promises materials 'approved by our certifier in advance and
    entered on our OSP inputs list' — but the registry cannot hold a non-National-List synthetic at all
    (no free-text row; `verify_input` would return a § 205.105 prohibited hit or nothing). G6.2's free-text
    description is the only place such a material can be named today.
  fix: Add category G to the operator-authored row (name, where used, fumigation flag, certifier-approval
    reference); have G9.0's `synthetic_approved` path link to it instead of asserting an approval Trazo
    cannot record.
