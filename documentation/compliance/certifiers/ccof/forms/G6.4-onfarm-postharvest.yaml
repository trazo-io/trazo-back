form:
  code: G6.4
  title: Simple On-Farm Post Harvest Handling
  document_id: NOPB36
  revision: V1, R7, 9/21/2021
  url: https://www.ccof.org/resource/g6-4-simple-on-farm-post-harvest-handling/
  retrieved: 2026-08-27
  nop_cites:
  - § 205.201
  - § 205.272
  guide_trigger: Item 7 — simple post-harvest handling of only my own organic crops at my own facility
  trazo_module: g6_4_handling
  register_status: complete
items:
- ref: Applicability
  asks: Complete this form ONLY if you are an all-organic operation performing simple post-harvest handling
    activities on-farm for only your own organic product (washing, drying, dehydrating, hulling, shelling,
    pressing, sun drying, freezing, cutting, sorting, sizing, or packing). This form does not apply if
    you are handling both organic and nonorganic products, making multi-ingredient products, operating
    a multi-farm CSA, or performing complex handling such as baking, brewing, extracting, etc. — instead
    complete the Handler OSP forms indicated in the Guide to Handler OSP Forms.
  status: partial
  trazo:
    questions:
    - g6_4_handling.handling_activities
    - g6_4_handling.handling_activities_other
    - g6_4_handling.own_products_only
    - g6_4_handling.custom_handling_separation
    prints: modules/G6_4.pdf §A (handling_activities); §B (own_products_only, custom_handling_separation)
  severity: P2
  gap: 'The gate''s job is to route an operation AWAY from this form, and its four disqualifiers are handling
    nonorganic product alongside organic, multi-ingredient products, a multi-farm CSA, and complex handling
    (baking, brewing, extracting). Trazo captures the positive activity list and own-vs-other-growers
    only: nothing captures multi-ingredient production, and complex handling can land only in `handling_activities:
    other`. A packet cannot show a certifier that this form legitimately applies — or legitimately does
    not. (downgraded from `covered` 2026-08-28 by an adversarial re-read of every covered row.)'
  fix: Add a `simple_handling_disqualifiers` checkbox_group carrying CCOF's four disqualifiers, so the
    answer prints as the routing decision it is.
- ref: A1
  asks: Site Name & Location (full address).
  status: not_covered
  severity: P1
  trazo:
    questions:
    - g6_4_handling.handling_site
    prints: modules/G6_4.pdf §B (handling_site) — describes buildings/equipment only, no formal name/address
      field exists
  gap: No field anywhere on G6.4 captures a formal site name and address. handling_site only describes
    buildings, pads, or equipment used for handling.
  fix: Add handling_site_name_address [text] visible when handling_activities is truthy and not no_onfarm_handling.
- ref: A2
  asks: List, or attach a list of, all organic products handled here.
  status: partial
  severity: P3
  trazo:
    questions:
    - g6_4_handling.products_handled
    prints: modules/G6_4.pdf §B (products_handled)
  gap: One flat text field ("which crops and product forms are handled here") with no "or attach a list"
    alternative for a high-SKU operation; functionally answered by the pilot ("fresh blueberries in 12×1pt
    clamshell...") but would not scale to many SKUs.
  fix: Add an optional list-upload alternative alongside the text field.
- ref: A3
  asks: Attach a complete written description or a schematic flow chart of where and how the product is
    received, processed, packaged, and stored. Identify ALL equipment, processes, pest control practices
    (including preventative practices and mechanical/physical controls), and storage areas. "Complete
    description attached" checkbox.
  status: partial
  severity: P2
  trazo:
    questions:
    - g6_4_handling.process_flow
    - g6_4_handling.facility_docs
    prints: modules/G6_4.pdf §C (process_flow); §D (facility_docs)
  gap: process_flow (page C, written-description half) is covered; facility_docs (page D, flow-chart half)
    is an optional upload on a later, disconnected page — no explicit either/or framing, no prompt to
    name pest-control practices at the handling site specifically (that's G9.0 territory, unreferenced
    here too), and no "complete description attached" confirmation checkbox.
  fix: Relabel to make the either/or explicit; add coaching listing CCOF's required elements; cross-reference
    G9.0 for facility pest practices.
- ref: A4
  asks: List any materials used for facility pest control at this post harvest handling location on your
    Grower Materials Application. None used.
  status: out_of_scope
  trazo:
    questions:
    - g9_0_facility_pest.material_tier
    prints: modules/G9_0.pdf §C (material_tier) — not on G6.4
  reason: Facility pest-control materials are asked once, on the Facility Pest Management module (g9_0_facility_pest),
    not duplicated on G6.4 — see G6.2's B3-B9 rows for that module's coverage and its own discoverability
    gap.
- ref: B1
  asks: 'Do you use any equipment sanitizers, or any no-rinse equipment cleaners/detergents, on organic
    food contact surfaces? Neither one is used, skip to B2. Yes — complete this section: (a) describe
    how the equipment is cleaned and/or sanitized; (b) how do you ensure that organic food contact surfaces
    are free of residuals (e.g. quaternary ammonia)? Chlorine materials and/or sanitizers allowed to evaporate
    completely; thorough rinses, including a double rinse procedure; residue testing (pH, quaternary ammonia,
    other); other (describe).'
  status: not_covered
  severity: P1
  trazo:
    questions:
    - g6_4_handling.uses_water
    - g6_4_handling.water_source_sanitizer
    prints: modules/G6_4.pdf §C (uses_water, water_source_sanitizer)
  gap: 'No gate exists independent of water contact: uses_water is visible ONLY when handling_activities
    includes washing/cooling, so an operation that sanitizes a dry surface (sorting table, clamshell filler)
    with a wipe-down quat sanitizer — without washing or cooling product with water — has no field to
    record it in at all. Where uses_water does fire, the cleaning/sanitizing description (a) and the residual-free
    assurance checkboxes (b) are all folded into one free-text water_source_sanitizer field with no structured
    options.'
  fix: Ungate a uses_equipment_sanitizer_or_norinse_cleaner [boolean] independent of handling_activities/water;
    add sanitizer_residual_free_assurance [checkbox_group] {evaporated_completely, double_rinse, residue_testing_ph,
    residue_testing_quat, residue_testing_other} cite §205.605, visible when that boolean is truthy.
- ref: B2
  asks: 'Is water used in direct contact with organic products (e.g. wash water)? No, skip to C. Yes —
    complete this section: (a) do you add any substances to water that contacts organic products (e.g.
    peracetic acid, hydrogen peroxide, chlorine)? No, skip to C. Yes, list on your Grower Materials Application.
    (b) if you add chlorine to water that directly contacts organic products, indicate how you meet the
    restriction that residual chlorine at the last point of contact must not exceed the Safe Drinking
    Water Act''s maximum residual disinfectant limit: not applicable, no chlorine added; final rinse with
    water only; final rinse with chlorine at or below SDWA limit.'
  status: partial
  severity: P1
  trazo:
    questions:
    - g6_4_handling.uses_water
    - g6_4_handling.water_source_sanitizer
    prints: modules/G6_4.pdf §C (uses_water, water_source_sanitizer)
  gap: The water-contact gate itself is covered (uses_water). Whether substances are added to that water
    is not a distinct boolean — folded into water_source_sanitizer free text (the pilot's Tsunami 100
    peracetic acid, 80 ppm, no-chlorine practice is fully described in prose but not structured). The
    chlorine final-rinse restriction — N/A no chlorine / final rinse water only / final rinse chlorine
    at or below the SDWA limit — does not exist anywhere in Trazo; identical gap to G6.1 B3, same fix,
    two forms.
  fix: wash_water_chlorine_final_rinse [radio] {not_applicable_no_chlorine, water_only_rinse, chlorine_at_or_below_sdwa}
    cite §205.605(b) — the same field pair proposed for G6.1 B3 closes both.
- ref: C
  asks: Are all packaging materials, including reused packaging, free of prohibited materials (e.g. fungicides,
    preservatives, fumigants)? Contact packaging manufacturer if you are unsure. Yes. Not applicable,
    no packaging.
  status: partial
  severity: P3
  trazo:
    questions:
    - g6_1_harvest_transport.packaging_free_of_prohibited
    - g6_1_harvest_transport.packaging_prohibited_detail
    prints: modules/G6_1.pdf §B (packaging_free_of_prohibited) — not printed on G6.4
  gap: Answered on G6.1 §B (packaging_free_of_prohibited), not re-asked on G6.4 itself — consistent with
    Trazo's "ask once" design — but G6.4 carries no cross-reference pointing a reviewer of this self-contained
    CCOF form to where the answer lives.
  fix: 'Coaching note on G6.4 §C: "See G6.1 — Packaging free of prohibited substances." Same discoverability
    class as the G9.0 finding on G6.2.'
