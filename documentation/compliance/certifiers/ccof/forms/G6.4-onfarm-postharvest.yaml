form:
  code: G6.4
  title: Simple On-Farm Post Harvest Handling
  document_id: ORGB36
  revision: V1, R7, 9/21/2021
  url: https://www.ccof.org/resource/g6-4-simple-on-farm-post-harvest-handling/
  retrieved: 2026-10-24
  nop_cites:
  - § 205.201
  - § 205.272
  guide_trigger: Item 7 — simple post-harvest handling of only my own organic crops at my own facility
  trazo_module: g6_4_handling
  register_status: complete
  source_sha256: 983bd21fc2596506cda60b58676007ff0ebaa37dafb7c503916dbc299508ad10
items:
- ref: Preamble (applicability)
  asks: Complete this form ONLY if you are an all-organic operation performing simple post-harvest handling
    activities on-farm for only your own organic product (washing, drying, dehydrating, hulling, shelling,
    pressing, sun drying, freezing, cutting, sorting, sizing, or packing). This form does not apply if you
    are handling both organic and nonorganic products, making multi-ingredient products, operating a multi-farm
    CSA, or performing complex handling such as baking, brewing, extracting, etc. — instead complete the Handler
    OSP forms indicated in the Guide to Handler OSP Forms.
  status: covered
  trazo:
    questions:
    - g6_4_handling.handling_activities
    - g6_4_handling.handling_activities_other
    - g6_4_handling.own_products_only
    - g6_4_handling.custom_handling_separation
    - g6_4_handling.simple_handling_disqualifiers
    prints: "modules/G6_4.pdf §A (handling_activities; simple_handling_disqualifiers carries CCOF's four disqualifiers, each printing a [REVIEW] when ticked, and \"none of these\" when the form applies); §B (own_products_only, custom_handling_separation)"
  note: "Closed 2026-11-10 (content 2026.11.29)."
- ref: A1
  asks: Site Name & Location (full address).
  status: covered
  trazo:
    questions:
    - g6_4_handling.on_farm_facility_table
    - g6_4_handling.handling_site
    models:
    - certifications.PostHarvestFacility.operated_by
    - certifications.PostHarvestFacility.name
    - certifications.PostHarvestFacility.address
    prints: modules/G6_4.pdf §B (each own facility with its full address)
  # Closed 2026-11-07, with OTCO C7 7.1.
- ref: A2
  asks: List, or attach a list of, all organic products handled here.
  status: partial
  severity: P3
  trazo:
    questions:
    - g6_4_handling.products_handled
    prints: modules/G6_4.pdf §B (products_handled)
  gap: One flat text field ("which crops and product forms are handled here") with no "or attach a list"
    alternative for a high-SKU operation; functionally answered by the pilot ("fresh blueberries in 12×1pt
    clamshell...") but would not scale to many SKUs.
  fix: Add an optional list-upload alternative alongside the text field.
- ref: A3
  asks: Attach a complete written description or a schematic flow chart of where and how the product is
    received, processed, packaged, and stored. Identify ALL equipment, processes, pest control practices
    (including preventative practices and mechanical/physical controls), and storage areas. "Complete
    description attached" checkbox.
  status: partial
  severity: P2
  trazo:
    questions:
    - g6_4_handling.process_flow
    - g6_4_handling.facility_docs
    prints: modules/G6_4.pdf §C (process_flow); §D (facility_docs)
  gap: process_flow (page C, written-description half) is covered; facility_docs (page D, flow-chart half)
    is an optional upload on a later, disconnected page — no explicit either/or framing, no prompt to
    name pest-control practices at the handling site specifically (that's G9.0 territory, unreferenced
    here too), and no "complete description attached" confirmation checkbox.
  fix: Relabel to make the either/or explicit; add coaching listing CCOF's required elements; cross-reference
    G9.0 for facility pest practices.
- ref: A4
  asks: List any materials used for facility pest control at this post harvest handling location on your Grower
    Materials Application. None used.
  status: partial
  severity: P2
  trazo:
    questions:
    - g9_0_facility_pest.material_tier
    prints: modules/G9_0.pdf §C (material_tier) — not on G6.4
  gap: Answered once, on the Facility Pest Management module (`material_tier`), which prints in modules/G9_0.pdf.
    Nothing on G6.4's own pages points there, the same discoverability gap as G6.2 B3-B9.
  fix: Add a cross-reference on G6.4 to Facility Pest Management, or a packet heading on G9.0 naming the G6.4
    question it answers.
- ref: B1
  asks: Do you use any equipment sanitizers, or any no-rinse equipment cleaners/detergents, on organic food
    contact surfaces? Neither one is used, skip to question B2 / Yes, list materials on your Grower Materials
    Application and complete this section.
  status: covered
  trazo:
    questions:
    - g6_4_handling.uses_equipment_sanitizer_or_cleaner
    - g6_4_handling.equipment_sanitizer_types
    - g6_4_handling.equipment_sanitizer_types_rinsed
    - g6_4_handling.equipment_sanitizer_where_used
    prints: modules/G6_4.pdf §C (uses_equipment_sanitizer_or_cleaner; equipment_sanitizer_types with the rinsed
      set and where each is used)
  note: 'Split 2026-09-30 (OSP alignment audit, T17/T26): the wash-water questions `uses_water` and `water_source_sanitizer`
    were cited here and answer B2, not equipment sanitizing.'
- ref: B1a
  asks: Describe how the equipment is cleaned and/or sanitized.
  status: covered
  trazo:
    questions:
    - g6_4_handling.food_contact_cleaning_methods
    - g6_4_handling.food_contact_cleaning_methods_other
    prints: modules/G6_4.pdf §C (food_contact_cleaning_methods)
- ref: B1b
  asks: How do you ensure that organic food contact surfaces are free of residuals (e.g. quaternary ammonia)?
    Chlorine materials and/or sanitizers allowed to evaporate completely / thorough rinses, including a double
    rinse procedure / residue testing (pH, quaternary ammonia, other) / other (describe).
  status: covered
  trazo:
    questions:
    - g6_4_handling.sanitizer_residual_free_assurance
    - g6_4_handling.sanitizer_residual_free_assurance_other
    - g6_4_handling.sanitizer_residual_testing_protocol
    prints: modules/G6_4.pdf §C (sanitizer_residual_free_assurance; sanitizer_residual_testing_protocol)
- ref: B2
  asks: Is water used in direct contact with organic products (e.g. wash water)? No, skip to section C / Yes,
    complete this section.
  status: covered
  trazo:
    questions:
    - g6_4_handling.uses_water
    - g6_4_handling.water_source_sanitizer
    prints: modules/G6_4.pdf §C (uses_water; water_source_sanitizer)
- ref: B2a
  asks: Do you add any substances to water that contacts organic products (e.g. peracetic acid, hydrogen peroxide,
    chlorine)? No, skip to section C / Yes, list on your Grower Materials Application and complete this section.
  status: covered
  trazo:
    questions:
    - g6_4_handling.wash_water_additives_added
    - materials_application.post_harvest_contact_listed
    - materials_application.post_harvest_contact_none_used
    prints: modules/G6_4.pdf §C (wash_water_additives_added); modules/materials_application.pdf §A post-harvest
      contact block and §B
  note: Rewritten 2026-09-12. (a) is a distinct boolean whose coaching sends each additive to the Materials
    Application, where the operator's row carries the post_harvest category and prints under §D's own heading;
    (b) is the chlorine boolean plus the final-rinse radio (water only / chlorine at or below the SDWA limit
    / other).
- ref: B2b
  asks: 'If you add chlorine to water that directly contacts organic products, indicate (NOP only) how you meet the restriction
    that residual chlorine at the last point of contact must not exceed the Safe Drinking Water Act limit:
    not applicable, no chlorine added / final rinse with water only / final rinse with chlorine at or below
    SDWA limit.'
  status: covered
  trazo:
    questions:
    - g6_4_handling.wash_water_chlorine_added
    - g6_4_handling.wash_water_chlorine_final_rinse
    - g6_4_handling.wash_water_chlorine_final_rinse_other
    prints: modules/G6_4.pdf §C (wash_water_chlorine_added; wash_water_chlorine_final_rinse)
- ref: C1
  asks: Are all packaging materials, including reused packaging, free of prohibited materials (e.g. fungicides,
    preservatives, fumigants)? Contact packaging manufacturer if you are unsure. Yes. Not applicable, no packaging.
  status: partial
  severity: P3
  trazo:
    questions:
    - g6_1_harvest_transport.packaging_free_of_prohibited
    - g6_1_harvest_transport.packaging_prohibited_detail
    prints: modules/G6_1.pdf §B (packaging_free_of_prohibited) — not printed on G6.4
  gap: Answered on G6.1 §B (packaging_free_of_prohibited), not re-asked on G6.4 itself — consistent with Trazo's
    "ask once" design — but G6.4 carries no cross-reference pointing a reviewer of this self-contained CCOF
    form to where the answer lives.
  fix: 'Coaching note on G6.4 §C: "See G6.1 — Packaging free of prohibited substances." Same discoverability
    class as the G9.0 finding on G6.2.'
