# CCOF — Annual Renewal Contract. A web form, not a document: the Gravity Form on
# https://www.ccof.org/payments/ ("Renew Certification"). It prints no form number and no revision.
#
# Registered 2026-10-01 (OSP alignment audit, Phase 3, T20). Until then CCOF had no renewal form in
# the register at all, so a CCOF packet routed a renewing operation to nothing. The source is a
# CAPTURE of that one form taken the same day (`capture_gravity_form`): the page's per-request
# nonces, honeypot and CAPTCHA are dropped so two captures of an unchanged form hash the same, and
# the capture date is its edition. See ../../../audits/OSP-ALIGNMENT-2026-10/sources/ccof/MANIFEST.md.
#
# Like OTCO's OSP Update Form, this is the agent's own renewal and is filed with CCOF on its site.
# Nothing in Trazo submits, signs or accepts it. The packet supports it: the renewal supplement
# (02s) names it and says, row by row, where in the packet the answer to copy is.
form:
  code: ''
  title: Annual Renewal Contract
  document_id: Annual Renewal Contract
  revision: Web form, captured 2026-10-24
  url: https://www.ccof.org/payments/
  retrieved: 2026-10-24
  nop_cites:
  - § 205.406
  - § 205.400
  # 2026-10-31: the page now reads "CCOF NOP or COR" here (it read "CCOF CS (CCOF)" at capture);
  # the form's fields are unchanged. The ROC and OCal renewals are their own forms (scope.yaml).
  guide_trigger: >-
    "To remain in the CCOF NOP or COR certification program, complete and submit this contract
    AND pay your invoice by January 1." Filed every year by every certified operation.
  required_of_every_grower: true
  filed_with_agent: true
  accepted_format: agent_web_form
  format_source: >-
    ccof.org/payments, "Renew Certification": the contract is the web form itself, completed and
    submitted on CCOF's site, with "I accept the above terms" as its acceptance.
  renewal_role: annual_renewal
  register_status: complete
  source_sha256: adc07790deb5e978868ca7dd6094f585004deab8430fae155c78a7c907b932ad
  packet_documents:
  - 02-annual-update.pdf
  - 02s-renewal-status-and-routing.pdf
items:
- ref: 'Step 1: Request Renewal'
  asks: 'Step 1: Request Renewal (required) — I wish to continue certification with CCOF (paying the invoice or
    having arranged fees or a payment plan) / I no longer require certification from CCOF (withdraw and surrender).'
  status: out_of_scope
  scope_basis: not_an_operation_obligation
  reason: An election made to CCOF on CCOF's form, as on OTCO's OSP Update Form Step 2. A renewal packet exists
    only for an operation that is continuing, and a surrender is a decision about the certificate, not a fact
    of the organic system plan.
- ref: 'Step 2: OSP Update Information'
  asks: 'Step 2: OSP Update Information (required) — my OSP does not need to be updated at this time and is accurate
    to the best of my ability to anticipate changes for the coming year / my OSP needs to be updated and I will
    submit the updates to inbox@ccof.org or MyCCOF.'
  status: partial
  severity: P3
  trazo:
    where: '02-annual-update.pdf: (a)(1) changes, (a)(2) additions and deletions, and the sections attested unchanged'
    models:
    - certifications.OSPAnnualUpdate.changes_summary
    - certifications.OSPAnnualUpdate.additions
    - certifications.OSPAnnualUpdate.deletions
    - certifications.OSPAnnualUpdate.sections_unchanged_attestation
    prints: 02-annual-update.pdf — (a)(1) changes, (a)(2) additions and deletions, sections attested unchanged
  gap: The filing records the changes themselves, not CCOF's two-way election. An operation with no changes and
    one with changes both read their answer off 02, but which box to tick is the operator's call on CCOF's form.
  fix: Print on 02s which of CCOF's two Step 2 options the filed update corresponds to, from whether (a)(1) or
    (a)(2) lists anything.
- ref: Operation Name
  asks: Operation Name (required).
  status: covered
  trazo:
    where: '00-cover.pdf: Legal name, Operation'
    models:
    - company.Company.name
    - company.Establishment.name
    prints: '00-cover.pdf ("Legal name", "Operation")'
- ref: Client Code
  asks: Client Code (optional).
  optional: true
  status: covered
  trazo:
    where: '00-cover.pdf: Client ID'
    models:
    - company.Establishment.certifier_client_id
    - company.Establishment.certifier_client_id_agent
    prints: '00-cover.pdf ("Client ID", printed only when recorded against CCOF)'
  note: >-
    The identifier CCOF issues the operation, kept with the agent that issued it (trazo-back PR 218), so an
    operation that moves agent never shows another agent's code here. Not the certificate number, which the
    cover prints on its own line.
- ref: Name
  asks: Name (required) — first and last name of the person submitting the contract.
  status: covered
  trazo:
    where: '02-annual-update.pdf: the signature line, which names the signer once the filing is signed'
    models:
    - certifications.OSPAnnualUpdate.signer_name
    prints: 02-annual-update.pdf — "Signed in Trazo by <name>" on a signed filing
- ref: Email
  asks: Email (required).
  status: partial
  severity: P3
  trazo:
    where: '00-cover.pdf: Email'
    models:
    - company.Establishment.contact_email
    - company.Establishment.email
    prints: '00-cover.pdf ("Email")'
  gap: The cover prints the operation's contact email. The form asks for the email of the person submitting the
    contract, which is the same address when the responsible person submits it and the submitter's own otherwise.
  fix: None while the submitter is whoever fills CCOF's web form; the cover's address is the default to copy.
- ref: Please enter any comments or questions
  asks: Please enter any comments or questions (optional free text to CCOF).
  optional: true
  status: out_of_scope
  scope_basis: agent_administration
  reason: Correspondence with CCOF, not a fact about the operation.
- ref: Date I No Longer Need Certification (Surrender Request Date)
  asks: Date I No Longer Need Certification (Surrender Request Date) — shown with the surrender choice in Step 1.
  optional: true
  status: out_of_scope
  scope_basis: not_an_operation_obligation
  reason: Part of the surrender election in Step 1, which a renewal packet does not make.
- ref: Reason for surrender
  asks: Reason for surrender — shown with the surrender choice in Step 1.
  optional: true
  status: out_of_scope
  scope_basis: not_an_operation_obligation
  reason: Part of the surrender election in Step 1, which a renewal packet does not make.
- ref: '1'
  kind: instruction
  asks: 1. You affirm that you monitor all sections of your Organic System Plan for accuracy annually to verify that
    your System Plan continues to be effectively implemented.
- ref: '2'
  kind: instruction
  asks: 2. You have read the above information and attest that it is true to the best of your knowledge.
- ref: '3'
  kind: instruction
  asks: 3. You affirm that you have read, fully understand and agree to be bound by the standards, procedures, fees,
    policies, assessments, obligations and requirements in the current CCOF Manuals and by the named paragraphs of
    the CCOF Certification Services Program Manual.
- ref: '4'
  kind: instruction
  asks: 4. You agree to be legally bound by the "Standards of Behavior" in the CCOF Certification Services Program
    Manual.
- ref: '5'
  kind: instruction
  asks: 5. You agree to pay all fees as described in the CCOF Certification Services Program Manual.
- ref: '6'
  kind: instruction
  asks: 6. You will continue to operate in accordance with applicable standards and CCOF policies.
- ref: '7'
  kind: instruction
  asks: 7. You affirm you are an authorized representative of this operation.
- ref: '8'
  kind: instruction
  asks: 8. You agree to CCOF's Terms of Use and Privacy Policy.
- ref: CCOF's Terms of Use and Privacy Policy
  asks: CCOF's Terms of Use and Privacy Policy (required) — "I accept the above terms", which executes terms 1 to 8.
  status: out_of_scope
  scope_basis: agent_agreement
  reason: The operation accepts CCOF's terms on CCOF's form; this row executes terms 1 to 8, which are instruction
    rows. The signature Trazo records covers Trazo's own filing record and its 7 CFR 205.401(d) attestation; it is
    not acceptance of CCOF's terms, and nothing in the packet reads as if it were. (not_covered, P2, until
    2026-11-04, when a row no packet can ever answer was reclassified as the agreement it is.)
- ref: Note (new certificates)
  kind: instruction
  asks: New National Organic Program (NOP) certificates will be issued and sent to all certified operations by the
    end of January. Renewal also requires payment of your annual fee invoice.
