form:
  code: "G3.2"
  title: "Mushroom Production"
  document_id: "ORGB87"
  revision: "V1, R3, 05/22/2023"
  url: "https://www.ccof.org/resource/g3-2-mushroom-production/"
  retrieved: 2026-10-24
  nop_cites: ["§ 205.201", "§ 205.203", "§ 205.204", "§ 205.272"]
  guide_trigger: "Item 4 — grow mushrooms"
  not_served:
    basis: >-
      Mushroom growing is an operation Trazo does not serve: it is built for orchards and field crops
      grown in the ground, and has no mushroom substrate, spawn or growing-room records.
    decided: 2026-10-25
  register_status: complete
  source_sha256: 7354b0c54cbbc194669dda36b03de28393056a4aa0cadb72205648037df7e2c2

items:
  - ref: A1
    asks: 'Mark all types of mushroom production performed: within building, greenhouse, or structure / outside
      (no temperature or humidity control) / containers (bags, trays, etc.).'
    status: not_covered
    severity: P3
    applies_when:
    - question: certification_contract.contract_scopes
      op: includes
      value: fungi
    gap: >-
      Trazo does not cover mushroom production (§ 205.210). The row applies only when the operation's
      scopes include fungi, so for every other operation it does not apply.
    fix: >-
      The mushroom questions stay unbuilt until a mushroom grower is a customer (not served, decided
      2026-10-25).
