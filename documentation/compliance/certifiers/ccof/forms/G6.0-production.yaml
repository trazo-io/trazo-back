form:
  code: G6.0
  title: Production
  document_id: ORGB40
  revision: V2, 12/31/2023
  url: https://www.ccof.org/resource/g6-0-farm-production/
  retrieved: 2026-10-24
  nop_cites:
  - § 205.105
  - § 205.201
  - § 205.202
  - § 205.206
  guide_trigger: Item 1 — apply for CCOF organic certification for crop production
  required_of_every_grower: true
  trazo_module: g6_0_production
  register_status: complete
  source_sha256: e679a23fbde73870149d3765f618f14643a90a6335b093d6a36d1cdfb4fa5a27
items:
- ref: A1
  asks: If crops are grown in buffer areas, how are they separated during harvest, storage, and sales?
    (Not applicable, no buffer crop grown / harvest containers are not marked 'organic' / crop is destroyed,
    given away, or not harvested / stored apart / harvested at different times / crops are not marked
    'organic' on crop records / mark or flag buffer areas / sold to a different buyer than the organic
    / keep separate records to track harvest and sales / other.) Maintain documentation of separation.
  status: partial
  severity: P3
  trazo:
    questions:
    - g6_0_production.buffer_strategies
    - g6_0_production.buffer_strategy_other
    prints: modules/G6_0.pdf §B; narrative § 205.202(c)
  gap: 'No option for ''not applicable, no buffer crop grown'' — the closest, `no_adjoining_conventional`,
    means no conventional neighbor, not no crop grown in the buffer. ''Crops not marked organic on crop
    records'' is only approximated by the broader `buffer_separate_records`. ''Crop destroyed, given away,
    or not harvested'' collapses into the single `do_not_harvest_buffer` option even though buffer-harvest
    event records (`buffer_disposition`) already distinguish not-harvested from disposed from given-away.
    The Parcel Application half of this row is CLOSED (2026-08-27): the parcel PDF used to derive a §
    205.202(c) disposition — "never sold as organic" — from the free-text `crop_grown_in_buffer` field
    the operator uses only to name the crop. It now prints the crop and nothing more, with disposition
    carried by the operator-entered `ProductionEvent.buffer_disposition`.'
  fix: Add `no_buffer_crop` and `buffer_records_not_marked_organic` options to `buffer_strategies`; consider
    splitting `do_not_harvest_buffer` into its three distinct dispositions to match the record-level detail
    already captured.
- ref: A2
  asks: What safeguards do you use to prevent contamination from drift? (None, no surrounding use of prohibited
    materials / written notification to neighbors / written agreement with neighbor (attach) / register
    with a drift monitoring program such as DriftWatch — list program / written agreement with agency
    managing weed control along roadways (attach) / post signs / 3rd party residue testing for monitoring
    / ongoing monitoring of neighboring land management practices / my operation manages the adjacent
    non-organic land and takes precautions (describe) / other.)
  status: partial
  severity: P1
  trazo:
    questions:
    - g6_0_production.drift_safeguards
    - g6_0_production.drift_safeguards_other
    - g6_0_production.drift_response_procedure
    prints: modules/G6_0.pdf §C; narrative § 205.202(c)
  gap: No exclusive 'none, no surrounding use of prohibited materials' option. Two of CCOF's options require
    an attachment ('written agreement with neighbor', 'written agreement with the roadside agency'), but
    G6.0 declares no upload question at all, and even where module uploads exist elsewhere in the OSP
    a file reaches the packet only when it is uploaded for a named upload question (since 2026-10-01),
    and G6.0 has none. DriftWatch/registry name is not captured
    (`sensitive_crop_registry` has no name field). `roadside_utility_registration` is worded as a registration/request,
    not CCOF's written agreement. `self_managed_adjacent` is labeled 'no third-party spray risk' — a conclusion,
    not a fact, and one the compiled narrative prints verbatim — with no field to describe the actual
    precautions taken. 'Residue testing' (`residue_testing`) is worded as incident-driven, not CCOF's
    routine monitoring testing. `drift_response_procedure` is a Trazo-only superset question (§ 205.400(f)(1),
    answering the form's opening instruction to notify CCOF immediately of drift) rather than one of the
    ten checkboxes.
  fix: Add an exclusive `none_no_surrounding_prohibited_use` option; add `drift_agreements_upload` [upload,
    opt] and wire `generate_osp_packet` to pull module uploads (tagged by `linked_section`) into `attachments/<module>/`,
    not just `receipts/`; add `drift_registry_name` [text]; split `roadside_utility_registration` into
    a registration option and a `roadside_agency_agreement` option (+ upload); relabel `self_managed_adjacent`
    and add a `self_managed_precautions` textarea; add `residue_testing_routine`.
- ref: B1
  asks: Is there existing lumber on any parcel you are applying to certify, and/or do you plan to install
    lumber within organic parcel boundaries in the future? (No, neither of the above — skip to section
    C / Yes, complete this section.)
  status: partial
  severity: P2
  trazo:
    models:
    - product.Parcel.treated_lumber_present
    - product.Parcel.treated_lumber_description
    - product.Parcel.treated_lumber_install_date
    prints: parcels/parcel-application-<name>.pdf (existing lumber only; no G6.0 question)
  gap: Existing lumber is captured per parcel (`treated_lumber_present`, description, install date) on
    the Parcel Application form, not on G6.0. Planned future installation is never asked anywhere.
  fix: Add a new G6.0 page (see B2) with a `treated_lumber_any` gate covering both existing lumber on
    any parcel and planned installation, so the fact lives where CCOF's own form puts it.
- ref: B2
  asks: How do you ensure that lumber treated with prohibited materials will not be used for new installations
    or for replacing existing lumber (e.g. endposts, trellis, stakes, etc.)? (Use metal stakes / use untreated
    wood / other.)
  status: not_covered
  severity: P1
  trazo:
    prints: —
  gap: No policy question exists anywhere in the product. Only the per-parcel existing-lumber fields exist
    (see B1), and they record current state, not a going-forward replacement policy.
  fix: 'Add a new G6.0 page `b_treated_lumber`: `treated_lumber_any` [boolean] (cite § 205.206(f)) and,
    visible when truthy, `treated_lumber_replacement_policy` [checkbox_group] {metal_stakes, untreated_wood,
    other} + `treated_lumber_policy_other` [text]; compile into the commingling-barriers narrative.'
- ref: C1
  asks: Do you use input material application equipment and/or seeding/planting equipment for organic
    production? (No, none of the above used — skip to section D / Yes, complete the following table.)
  status: not_covered
  severity: P1
  trazo:
    models:
    - history.EquipmentEvent (declared, but has no form anywhere)
    prints: —
  gap: No gate question exists, and there is no equipment inventory entity at all — `EquipmentEvent` has
    no form anywhere in the OSP or elsewhere.
  fix: Add `uses_application_or_seeding_equipment` [boolean] gate on a new G6.0 page `c_production_equipment`;
    cite § 205.272(a) / § 205.201(a)(5).
- ref: C2
  asks: 'List all input material application equipment and/or seeding/planting equipment used in your
    organic production. Columns: equipment type / dedicated to organic only? (Yes/No) / own, rent, borrow,
    or custom work? / how is it cleaned or purged before organic use, including type(s) of materials used?
    / rinsed? (Yes/No, and any other details on how prohibited substances are removed).'
  status: not_covered
  severity: P1
  trazo:
    models:
    - history.ProductionEvent.cleaning_method
    - history.ProductionEvent.cleaning_materials_used
    - history.ProductionEvent.purge_material/purge_quantity/purge_end_use
    - history.ProductionEvent.cleaning_asset_class
    - history.ProductionEvent.cleaned_by
    - history.ProductionEvent.shared_with_conventional
    - history.ProductionEvent.operator_is_custom
    prints: audit dossier §§ Equipment Cleaning Logs / Shared Equipment & Custom Operators (per-event
      evidence only; no inventory table)
  gap: No inventory or table exists at the OSP level. Evidence is scattered across per-event Equipment-Maintenance
    fields — cleaning method, materials used, purge details, whether a custom operator cleaned it — but
    there is no 'dedicated to organic only?' field and no 'rinsed?' field anywhere, and own/rent/borrow
    exists only as a per-event custom-operator flag, not an equipment attribute.
  fix: Add an `equipment_inventory` JSON embed on `Establishment` (same pattern as `buffer_zones`), rows
    {equipment_type, description, stage, dedicated_organic, ownership, cleaning_method, cleaning_materials,
    rinsed, rinse_detail}; render as a table in the module PDF; prefill as a suggestion from Equipment-Maintenance
    events. The same embed with stage=harvest also answers CCOF G6.1 B1's identical table.
- ref: C3
  asks: How are equipment cleaning/purging activities documented? (Cleaning and/or purge logs / a Standard
    Operating Procedure is followed (attach SOP) / other.)
  status: partial
  severity: P2
  trazo:
    models:
    - history.EquipmentEvent (the logged events themselves serve as cleaning/purge logs)
    - history.ProductionEvent.cleaning_protocol_reference (free-text SOP reference per event)
    prints: audit dossier § Equipment Cleaning Logs (implicit; no module question, no SOP upload)
  gap: No module question asks how cleaning is documented. Equipment-Maintenance events implicitly answer
    'logs', but there is no SOP-upload option for production equipment (the existing G6.4 `facility_docs`
    upload is handling-only) and no explicit 'other' option.
  fix: Add `equipment_cleaning_documentation` [checkbox_group] {cleaning_purge_logs, sop_followed, other}
    + `equipment_sop_upload` [upload, opt] visible when `sop_followed`, alongside the C2 inventory page.
- ref: D1
  asks: Do you irrigate? (No — skip to section E / Yes, complete this section.)
  status: partial
  severity: P3
  trazo:
    questions:
    - g4_2_natural_resources.irrigation_water_sources
    prints: modules/G4_2.pdf §C (not G6.0)
  gap: No explicit yes/no gate exists anywhere in the OSP registry. The closest fact is `g4_2_natural_resources.irrigation_water_sources`,
    a required free-text field that forces a dry-farmed operation to type something like 'none' just to
    get past it — and that question lives on the G4.2 Natural Resources module, not G6.0, so a certifier
    reviewing G6.0 for irrigation will not find it there at all.
  fix: Add an `irrigates` [boolean] gate ahead of the sources question. Whether that gate belongs on G6.0
    (matching CCOF's own form) or stays on G4.2 is a design decision Trazo needs to make deliberately
    rather than by default; either way the two modules should agree on where irrigation lives.
- ref: D2
  asks: What is the source of your irrigation water? (Well / reservoir / water district — name / river,
    stream, or lake — name.)
  status: partial
  severity: P1
  trazo:
    questions:
    - g4_2_natural_resources.irrigation_water_sources
    models:
    - company.Establishment.water_sources (JSON, written only by farm-creation UI, never read by the OSP)
    - history — irrigation/frost-protection event water_source enum (well_groundwater/municipal/rainwater/irrigation_canal/river_stream/pond_reservoir/recycled/other;
      no name field)
    prints: modules/G4_2.pdf §C (not G6.0)
  gap: 'Three unbound homes for one fact, with no cross-check between them: G4.2''s free-text field (unstructured,
    can name a source but is not typed to CCOF''s four categories); the per-event `water_source` enum
    on irrigation/frost-protection records (typed, but no name field); and `Establishment.water_sources`,
    read only by the consumer-facing page, never by the OSP. The pilot packet demonstrates the resulting
    contradiction: G4.2 states no surface water is drawn from the river, while the same operation''s irrigation
    and frost-protection event records list the water source as river/stream.'
  fix: Replace the free-text field with `irrigation_sources` [checkbox_group] {well, reservoir_pond, water_district,
    river_stream_lake, municipal, none}; add `water_district_name` and `surface_water_name` [text], visible
    on the matching option; cite § 205.202(c) / § 205.200; add a prefill resolver from the irrigation/frost-protection
    `water_source` records; bind or retire `Establishment.water_sources` so it is not a fourth unbound
    home.
- ref: D3
  asks: Are you aware of any prohibited materials that are added to your irrigation water (e.g. algicides)?
    (Yes / No.)
  status: partial
  severity: P2
  trazo:
    questions:
    - g4_2_natural_resources.water_from_irrigation_district
    - g4_2_natural_resources.irrigation_district_additives
    prints: modules/G4_2.pdf §C (not G6.0)
  gap: Gated on `water_from_irrigation_district`, so a well, reservoir, river, or canal-company water
    source is never asked this question at all — only water delivered through an irrigation district reaches
    it.
  fix: Ungate into an `irrigation_water_prohibited_additives` question asked for any water source; keep
    the district-specific coaching (e.g. canal-company algaecides) when a district is selected.
- ref: D4
  asks: Does your organic cropland share irrigation lines or irrigation water (including tail water) with other
    cropland where prohibited materials are applied into the water? Yes / No.
  status: not_covered
  severity: P1
  trazo:
    prints: —
  gap: Nothing asks this. `water_from_irrigation_district` asks about shared delivery from a district, not
    shared lines or tail water with conventional cropland, and `soil_water_practices.tailwater_management`
    is a conservation-practice checkbox option, not this compliance question. A split operation with shared
    pumps or laterals — common in California irrigation districts — has no way to state this fact or who is
    responsible for the applications.
  fix: Add `shared_irrigation_with_prohibited` [boolean] and, visible when true, `shared_irrigation_responsible`
    [boolean]; cite § 205.202(c) / § 205.272(a); compile into the commingling-barriers narrative.
- ref: D4a
  asks: If yes, is your operation responsible for applications of prohibited materials? Yes / No.
  status: not_covered
  severity: P1
  trazo:
    prints: —
  gap: Nothing asks this. `water_from_irrigation_district` asks about shared delivery from a district, not
    shared lines or tail water with conventional cropland, and `soil_water_practices.tailwater_management`
    is a conservation-practice checkbox option, not this compliance question. A split operation with shared
    pumps or laterals — common in California irrigation districts — has no way to state this fact or who is
    responsible for the applications.
  fix: Add `shared_irrigation_with_prohibited` [boolean] and, visible when true, `shared_irrigation_responsible`
    [boolean]; cite § 205.202(c) / § 205.272(a); compile into the commingling-barriers narrative.
- ref: D5
  asks: If yes to question 3 or 4 above, what measures have you taken to prevent contact of organic crops
    or land with prohibited materials? Attach a map showing a piping diagram if valves or backflow prevention
    devices have been installed.
  status: partial
  severity: P1
  trazo:
    questions:
    - g4_2_natural_resources.irrigation_district_additives
    - g4_2_natural_resources.irrigation_district_mitigation
    - g4_2_natural_resources.irrigation_district_documentation
    prints: modules/G4_2.pdf §C (not G6.0); uploads do not reach the generated packet
  gap: The mitigation textarea is gated only on the district-additives answer being 'yes', so once the
    D4 (shared-lines) fact exists it has nowhere to lead. `irrigation_district_documentation` is an upload
    for the district's own statement or treatment schedule, not the piping diagram CCOF asks for here.
    And no module upload of any kind currently reaches the generated packet — `generate_osp_packet` only
    pulls the `receipts/` folder.
  fix: Widen the mitigation textarea's visibility to (district additives = yes OR D4 shared = true); add
    `irrigation_piping_map_upload` [upload, opt] on the same condition; fix packet generation to include
    module uploads generally (see G6.0 A2).
- ref: D6
  asks: Do you apply materials to organic crops or land via irrigation water (e.g. fertigation, irrigation
    line cleaners, pH adjusters, etc.)? (No / Yes — list all materials on your Grower Materials Application.)
  status: partial
  severity: P2
  trazo:
    models:
    - history.ChemicalEvent.is_fertigation
    - history.ChemicalEvent.application_method_structured (drip / chemigation)
    prints: audit dossier (fertigation column; per-event evidence only, no OSP question or attestation)
  gap: No OSP-level question or Materials Application attestation exists for materials applied via irrigation.
    Fertigation is recorded per chemical-application event, but irrigation line cleaners, pH adjusters,
    and descalers have no event home at all, and the Materials Application attestations have no 'via irrigation'
    category.
  fix: Add `materials_via_irrigation` [boolean] + an `irrigation_materials_listed` attestation, prefilled
    from fertigation/chemigation events; add an irrigation-system-materials category (line cleaners, pH
    adjusters, descalers) to the Materials Application attestations.
- ref: E1
  asks: Do you store any prohibited materials (or materials not included on your approved OSP Materials
    List) on farm? (No — stop, this form is complete / Yes, complete this section.)
  status: partial
  severity: P3
  trazo:
    questions:
    - g6_0_production.prohibited_materials_on_site
    prints: modules/G6_0.pdf §D; narrative § 205.272(a)
  gap: The label covers materials prohibited in organic production; an allowed-but-unlisted product does
    not trip this question.
  fix: Extend the label to '...or any material not on your approved OSP Materials List'.
- ref: E2
  asks: In storage areas, how do you identify and separate these materials from materials that are included
    on your approved OSP Materials List?
  status: covered
  trazo:
    questions:
    - g6_0_production.prohibited_materials_storage
    - g6_0_production.prohibited_materials_storage_other
    prints: modules/G6_0.pdf §D; narrative § 205.201(a)(5)
