    trazo:
      questions:
      - g3_1_container_greenhouse.alternating_timing
      - g3_1_container_greenhouse.alternating_schedule
      prints: "modules/G3_1.pdf §D"
  - ref: "D2"
    asks: "Describe or attach your Standard Operating Procedure (SOP) for cleaning all equipment and surfaces to remove residue of"
