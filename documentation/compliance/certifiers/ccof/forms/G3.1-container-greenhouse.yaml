form:
  code: "G3.1"
  title: "Container & Greenhouse/Shadehouse Production"
  document_id: "ORGB46"
  revision: "V1, R8, 9/21/2021"
  url: "https://www.ccof.org/resource/g3-1-container-greenhouse-shadehouse-production/"
  retrieved: 2026-10-24
  nop_cites: ["§ 205.200", "§ 205.201", "§ 205.202", "§ 205.272"]
  guide_trigger: "Item 3 — production not in the ground, and/or in greenhouses, shadehouses or buildings"
  trazo_module: g3_1_container_greenhouse
  register_status: complete
  source_sha256: 1753ac5bc41e83031c803b44f27c58f50e719502d380deee3210843bec427253

items:
  - ref: "Preamble (applicability)"
    asks: "Complete this form if your organic system includes any crop or plant production that does not take place in the ground (annual seedlings/transplants; planting stock or nursery production in pots; edible sprouts; wheatgrass/microgreens; mushrooms; or crops grown to harvest/maturity in containers), and/or any crop production in greenhouses, shadehouses, and/or buildings."
    status: covered
    trazo:
      questions:
      - g3_1_container_greenhouse.structure_production_types
      prints: "modules/G3_1.pdf (the not-applicable attestation, CCOF A1's \"None of these\", with a [REVIEW] line for each fact elsewhere in the plan or the records that says otherwise; or §A when it applies)"
  - ref: "A1"
    asks: "Which of the following do you produce organically? Check all that apply. None of these (stop) / Annual seedlings — for on-farm use / for sale / Planting stock (other than annual seedlings) or other nursery production in pots — for on-farm use / for sale / Edible sprouts (including fodder for livestock) / Wheatgrass, microgreens, pea/sunflower shoots, or similar / Mushrooms (also complete G3.2) / Crops grown to harvest/maturity in containers (substrate/growing media, and/or hydroponic, aeroponic, or aquaponic systems) / Crops grown in the ground (not in containers) within greenhouses, shadehouses and/or buildings."
    status: covered
    trazo:
      questions:
      - g3_1_container_greenhouse.structure_production_types
      - g3_1_container_greenhouse.annual_seedlings_use
      - g3_1_container_greenhouse.potted_stock_use
      prints: "modules/G3_1.pdf §A"
  - ref: "A2"
    asks: "For the production types indicated in A1, are all growing locations within the boundaries of a certified organic parcel? Yes / No (submit Parcel Application(s))."
    status: covered
    trazo:
      questions:
      - g3_1_container_greenhouse.locations_within_certified_parcel
      prints: "modules/G3_1.pdf §A (a No prints a [REVIEW] line asking for the Parcel Applications)"
  - ref: "B1"
    asks: "Do you use growing media (including substrate, planting mix, potting soils, etc.)?"
    status: covered
    trazo:
      questions:
      - g3_1_container_greenhouse.uses_growing_media
      prints: "modules/G3_1.pdf §B"
  - ref: "B1a"
    asks: "Are all components of your growing media (e.g. peat moss, coconut fiber, vermiculite, perlite, sand, compost, microbial"
    status: covered
    trazo:
      questions:
      - g3_1_container_greenhouse.growing_media_components_listed
      prints: "modules/G3_1.pdf §B"
  - ref: "B1b"
    asks: "Is new growing media used for each production cycle? Spent growing media from nonorganic production may not be reused"
    status: covered
    trazo:
      questions:
      - g3_1_container_greenhouse.growing_media_new_each_cycle
      - g3_1_container_greenhouse.growing_media_reuse_source
      prints: "modules/G3_1.pdf §B"
  - ref: "B1c"
    asks: "How is growing media disposed of at the end of the production cycle? Spent growing media must be managed in a way that"
    status: covered
    trazo:
      questions:
      - g3_1_container_greenhouse.growing_media_disposal
      - g3_1_container_greenhouse.growing_media_disposal_other
      prints: "modules/G3_1.pdf §B"
  - ref: "B2"
    asks: "How do you manage irrigation water effluent and/or runoff to avoid contamination of the surrounding environment (waterways, soil, etc.)? Recaptured/reused / other (explain)."
    status: covered
    trazo:
      questions:
      - g3_1_container_greenhouse.irrigation_effluent_management
      - g3_1_container_greenhouse.irrigation_effluent_other
      prints: "modules/G3_1.pdf §B"
  - ref: "B3"
    asks: "Do you produce organic edible sprouts?"
    status: covered
    trazo:
      questions:
      - g3_1_container_greenhouse.structure_production_types
      prints: "modules/G3_1.pdf §A (the edible sprouts option) and §B (the sprout questions, shown only when it is ticked)"
  - ref: "B3a"
    asks: "Do you always use organic seed to produce edible sprouts? Yes"
    status: covered
    trazo:
      questions:
      - g3_1_container_greenhouse.sprout_seed_always_organic
      prints: "modules/G3_1.pdf §B"
  - ref: "B3b"
    asks: "Are all sanitizers used on the seed listed on your Grower Materials Application (OSP Materials List)?"
    status: covered
    trazo:
      questions:
      - g3_1_container_greenhouse.sprout_seed_sanitizers
      - g3_1_container_greenhouse.sprout_seed_sanitizing_procedure
      prints: "modules/G3_1.pdf §B"
  - ref: "B4"
    asks: "Do you produce organic crops grown to harvest/maturity in containers?"
    status: covered
    trazo:
      questions:
      - g3_1_container_greenhouse.structure_production_types
      - g3_1_container_greenhouse.container_system_photos
      prints: "modules/G3_1.pdf §B4 (shown only when crops grown to harvest in containers is ticked in §A); the photographs under attachments/g3_1_container_greenhouse/ in the packet"
  - ref: "B4a"
    asks: "Photographs of the system."
    status: covered
    trazo:
      questions:
      - g3_1_container_greenhouse.container_system_photos
      prints: "modules/G3_1.pdf §B4; the photographs under attachments/g3_1_container_greenhouse/ in the packet"
  - ref: "B4b"
    asks: "Type of system (e.g. substrate production in pots/bags/troughs or other containers, hydroponic, aeroponic, aquaponic, etc)."
    status: covered
    trazo:
      questions:
      - g3_1_container_greenhouse.container_system_types
      - g3_1_container_greenhouse.container_system_types_other
      prints: "modules/G3_1.pdf §B4"
  - ref: "B4c"
    asks: "The stages and length of the production cycle for each crop grown."
    status: covered
    trazo:
      questions:
      - g3_1_container_greenhouse.container_production_cycle
      prints: "modules/G3_1.pdf §B4"
  - ref: "B4d"
    asks: "If substrate/growing media is not used, explain how plants/roots are supported (e.g. net pots, trays, polystyrene sheets, etc)."
    status: covered
    trazo:
      questions:
      - g3_1_container_greenhouse.container_root_support
      prints: "modules/G3_1.pdf §B4"
  - ref: "B4e"
    asks: "If substrate/growing media is used, explain if it contains biological activity and/or organic matter, and whether it provides"
    status: covered
    trazo:
      questions:
      - g3_1_container_greenhouse.container_media_biology
      prints: "modules/G3_1.pdf §B4"
  - ref: "B4f"
    asks: "If liquid nutrition is used, explain how it is delivered to the plant roots (e.g. indirectly via application to substrate/growing media,"
    status: covered
    trazo:
      questions:
      - g3_1_container_greenhouse.container_liquid_nutrition
      prints: "modules/G3_1.pdf §B4"
  - ref: "B4g"
    asks: "Whether fish are integrated into the system (aquaponics)."
    status: covered
    trazo:
      questions:
      - g3_1_container_greenhouse.container_fish_integrated
      prints: "modules/G3_1.pdf §B4"
  - ref: "C1"
    asks: "Does your organic production indicated in section A take place in greenhouses, shadehouses, or buildings?"
    status: covered
    trazo:
      questions:
      - g3_1_container_greenhouse.organic_in_structures
      prints: "modules/G3_1.pdf §C; narrative § 205.201(a)(5)"
  - ref: "C2"
    asks: "Does your operation also have nonorganic production in greenhouses, shadehouses, or buildings?"
    status: covered
    trazo:
      questions:
      - g3_1_container_greenhouse.nonorganic_in_structures
      prints: "modules/G3_1.pdf §C; narrative § 205.201(a)(5)"
  - ref: "C3"
    asks: "Mark all that apply to describe your nonorganic production in greenhouses, shadehouses, or buildings:"
    status: covered
    trazo:
      questions:
      - g3_1_container_greenhouse.nonorganic_structure_arrangement
      prints: "modules/G3_1.pdf §C; narrative § 205.201(a)(5)"
  - ref: "C3a"
    asks: "How do you identify organic and nonorganic growing areas?"
    status: covered
    trazo:
      questions:
      - g3_1_container_greenhouse.organic_area_identification
      - g3_1_container_greenhouse.organic_area_identification_other
      prints: "modules/G3_1.pdf §C"
  - ref: "C3b"
    asks: "How do you label or distinguish between organic and nonorganic plants from production through shipment/sale?"
    status: covered
    trazo:
      questions:
      - g3_1_container_greenhouse.organic_plant_distinction
      - g3_1_container_greenhouse.organic_plant_distinction_other
      prints: "modules/G3_1.pdf §C"
  - ref: "C3c"
    asks: "How do you prevent mixing or commingling of growing media and fertility materials for organic and nonorganic production,"
    status: covered
    trazo:
      questions:
      - g3_1_container_greenhouse.media_fertility_commingling_prevention
      - g3_1_container_greenhouse.commingling_sop_upload
      - g3_1_container_greenhouse.media_fertility_commingling_other
      prints: "modules/G3_1.pdf §C (an SOP answer with no file prints a [REVIEW] line); the SOP under attachments/g3_1_container_greenhouse/ in the packet"
  - ref: "C3d"
    asks: "How do you prevent drift of prohibited materials through shared ventilation systems?"
    status: covered
    trazo:
      questions:
      - g3_1_container_greenhouse.shared_ventilation_drift
      - g3_1_container_greenhouse.shared_ventilation_other
      prints: "modules/G3_1.pdf §C"
  - ref: "C3e"
    asks: "How do you prevent contact with prohibited materials applied through shared irrigation systems?"
    status: covered
    trazo:
      questions:
      - g3_1_container_greenhouse.shared_irrigation_contact
      - g3_1_container_greenhouse.shared_irrigation_other
      prints: "modules/G3_1.pdf §C"
  - ref: "D (not applicable)"
    asks: "Alternating Production: not applicable, not seeking approval to use organic growing areas for nonorganic production. Stop, this form is complete."
    status: covered
    trazo:
      questions:
      - g3_1_container_greenhouse.nonorganic_structure_arrangement
      prints: "modules/G3_1.pdf §C (section D is shown only when alternating production is ticked there)"
  - ref: "D1"
    asks: "Which of the following apply to the organic growing location(s) you wish to use for alternating production?"
    status: covered
    trazo:
      questions:
