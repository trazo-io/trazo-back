form:
  code: "G3.1"
  title: "Container & Greenhouse/Shadehouse Production"
  document_id: "NOPB46"
  revision: "V1, R8, 9/21/2021"
  url: "https://www.ccof.org/resource/g3-1-container-greenhouse-shadehouse-production/"
  retrieved: 2026-08-27
  nop_cites: ["§ 205.200", "§ 205.201", "§ 205.202", "§ 205.272"]
  guide_trigger: "Item 3 — production not in the ground, and/or in greenhouses, shadehouses or buildings"
  register_status: complete
  source_sha256: cafaab71ad35cba9d0fa7f9e4f137a1a159f37b46b99f4acce0338b9e9900afb

items:
  - ref: Preamble (applicability)
    asks: Complete this form if your organic system includes any crop or plant production that does not take
      place in the ground (annual seedlings/transplants; planting stock or nursery production in pots; edible
      sprouts; wheatgrass/microgreens; mushrooms; or crops grown to harvest/maturity in containers), and/or any
      crop production in greenhouses, shadehouses, and/or buildings.
    status: not_covered
    severity: P1
    trazo:
      triggered_by:
      - g3_0_seeds.seedlings_used
      - g3_2_planting_stock.stock_sold_as_organic
      - g4_0_rotation_soil.system_type
      models:
      - product.Parcel.container_production
      - history.History.is_outdoor
      prints: —
    gap: 'Trazo has no G3.1 module, so it can neither attest N/A nor capture the content this form covers — a
      reviewer sees silence, which reads as ''not answered'', not ''not applicable''. Five live Trazo facts already
      point at this form with nowhere to land: G3.0''s `seedlings_used = own_organic`, G3.0b''s `stock_sold_as_organic
      = sold_organic_stock` (CCOF explicitly says ''describe in G3.1''), G4.0''s `system_type` including container,
      the Parcel Application''s `container_production` flag, and the production-level indoor/greenhouse flag
      (`History.is_outdoor=False`). A 2026-08-08 parity plan promised this form would ship as an N/A-able stub;
      only W2.0 shipped.'
    fix: Ship G3.1 as an N/A-able stub (the `stubs._describe_and_attach` pattern already used for W2.0) with
      real code G3.1; prompt it — never auto-answer it — whenever one of the five triggers fires.

  - ref: "A1"
    asks: "Which of the following do you produce organically? Check all that apply. None of these (stop) / Annual seedlings — for on-farm use / for sale / Planting stock (other than annual seedlings) or other nursery production in pots — for on-farm use / for sale / Edible sprouts (including fodder for livestock) / Wheatgrass, microgreens, pea/sunflower shoots, or similar / Mushrooms (also complete G3.2) / Crops grown to harvest/maturity in containers (substrate/growing media, and/or hydroponic, aeroponic, or aquaponic systems) / Crops grown in the ground (not in containers) within greenhouses, shadehouses and/or buildings."
    status: not_covered
    severity: P1
    gap: "Nothing captures any of these eight production types. Two are real for the ICP — on-farm annual seedling production and planting-stock/nursery production in pots — and have no home; mushrooms, edible sprouts and hydroponic/aeroponic/aquaponic-to-maturity are the part of this battery a wholesale orchard would not use."
    fix: "Add checkbox_group `structure_production_types` (8 options, two carrying on-farm-use/for-sale sub-flags) as the first question of the G3.1 stub — the one battery that decides whether the rest of the form (B3, B4, C) applies."

  - ref: "A2"
    asks: "For the production types indicated in A1, are all growing locations within the boundaries of a certified organic parcel? Yes / No (submit Parcel Application(s))."
    status: not_covered
    severity: P2
    gap: "No question ties a structure to a certified parcel. CCOF's own Parcel Application map checklist separately asks growers to mark annual-seedling-production areas on the parcel map; Trazo's parcel map embed has no such item either."
    fix: "Add boolean `locations_within_certified_parcel`, with coaching to add the structure to the parcel map."
  - ref: B1
    asks: Do you use growing media (including substrate, planting mix, potting soils, etc.)?
    status: not_covered
    severity: P2
    gap: Growing-media use, its Materials List status, reuse policy and disposal method are captured nowhere.
      The Grower Materials Application (NOPB41 §C) lists growing media as its own category; Trazo's Materials
      Application module has none.
    fix: Add the three sub-questions to the G3.1 stub; add a growing-media category to the Materials Application
      panel.
