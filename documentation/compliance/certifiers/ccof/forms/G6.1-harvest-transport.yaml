form:
  code: G6.1
  title: Harvest & Transport
  document_id: ORGB39
  revision: V2, R1, 10/23/2024
  url: https://www.ccof.org/resource/g6-1-harvest-and-transport/
  retrieved: 2026-10-24
  nop_cites:
  - § 205.101
  - § 205.102
  - § 205.103
  - § 205.201
  guide_trigger: Item 1 — apply for CCOF organic certification for crop production
  required_of_every_grower: true
  trazo_module: g6_1_harvest_transport
  register_status: complete
  source_sha256: 9677b4d666db754f8997daa5c270e46cb14de0025bf1f1463487044d74d915e5
items:
- ref: A1
  asks: 'My operation is responsible for harvest in the following ways (mark all that apply): my operation
    performs the harvest; my operation (or my contracting organic handler) hires an uncertified company
    (contract harvester) to harvest my crop — complete A3 and describe all activities performed by the
    harvester in section B; other responsibility (describe); or not applicable, no responsibility for
    harvest (e.g. crop is sold "in the field") — describe.'
  status: covered
  trazo:
    questions:
    - g6_1_harvest_transport.who_harvests
    - g6_1_harvest_transport.who_harvests_other
    - g6_1_harvest_transport.sold_standing_details
    - g6_1_harvest_transport.custom_harvester_cleanout_verified
    - g6_1_harvest_transport.custom_harvester_instructions
    prints: modules/G6_1.pdf §A
- ref: A2
  asks: 'My operation is responsible for post-harvest transportation in the following ways (mark all that
    apply): my operation transports the crop; my operation (or my contracting organic handler) hires an
    uncertified company to transport my crop — complete A3 and describe all activities performed by the
    transporter in section B (certification of the transporter is required if the transporter handles
    the crops during transport, e.g. pack, repack, treat, sort, open, enclose, label — see the Exempt
    Handler Affidavit (EHA) for more detail on activities that may require certification); other responsibility
    (describe); or not applicable, no responsibility for transport (e.g. crop is sold "in the field")
    — describe.'
  status: covered
  trazo:
    questions:
    - g6_1_harvest_transport.who_transports
    - g6_1_harvest_transport.who_transports_other
    - g6_1_harvest_transport.carrier_handles_beyond_transport
    prints: modules/G6_1.pdf §C
- ref: A3
  asks: 'If you or your contracting organic handler (e.g. shipper, marketer, buyer) hires any uncertified
    companies to harvest and/or transport organic crops, how do you ensure that you maintain the applicable
    records (harvest records showing date/quantity/crop/certified parcel; cleaning records for harvest
    equipment; transportation records tracing crops back to the certified grower and linking to lot number/shipping
    ID; transportation records demonstrating commingling and contamination are prevented)? Not applicable,
    skip to section B. Mark all that apply: my operation generates the records; the uncertified company
    generates the records and provides them to me; my contracting organic handler obtains the records
    from the uncertified company and provides them to me; other (describe).'
  status: covered
  trazo:
    questions:
    - g6_1_harvest_transport.harvest_transport_records_source
    - g6_1_harvest_transport.custom_harvester_records
    - g6_1_harvest_transport.non_own_transport_records
    prints: modules/G6_1.pdf §A and §C
- ref: B1
  asks: 'Do organic crops directly contact any equipment used during harvest, in-field washing and/or packing, or
    transport? No, skip to B3. Yes — complete a table listing only equipment that contacts organic crop, with columns:
    Equipment type / Dedicated to organic only? (Yes/No) / Own, rent, borrow, or custom work? / How is it cleaned
    before organic use, including type(s) of materials used? / Rinsed? (Yes/No, and any other details on how prohibited
    substance residues are removed).'
  status: covered
  trazo:
    questions:
    - g6_1_harvest_transport.container_types
    - g6_1_harvest_transport.container_types_other
    - g6_1_harvest_transport.container_safeguards
    - g6_1_harvest_transport.containers_cleaning_method
    - g6_0_production.uses_production_equipment
    - g6_0_production.equipment_inventory_panel
    prints: modules/G6_1.pdf §B (containers); modules/G6_0.pdf §F (harvest, washing or packing and transport equipment
      in the equipment table)
  # Closed 2026-11-11 by the equipment register slice.
- ref: B2
  asks: How are equipment cleaning/purging activities documented? Cleaning and/or purge logs; a Standard Operating
    Procedure (SOP) is followed (attach SOP); other (describe).
  status: covered
  trazo:
    prints: modules/G6_0.pdf §F (documentation types; the procedure rides under attachments/g6_0_production/)
    models:
    - 'nearest existing field: g6_1_harvest_transport.containers_cleaning_method (free prose only)'
    questions:
    - g6_0_production.equipment_cleaning_documentation
    - g6_0_production.equipment_cleaning_documentation_other
    - g6_0_production.equipment_cleaning_sop_upload
  # Closed 2026-11-11 by the equipment register slice.
- ref: B3
  asks: Do you wash crops in the field? No, skip to question B4 / Yes, complete this section.
  status: covered
  trazo:
    questions:
    - g6_4_handling.post_harvest_water_uses
    - g6_4_handling.crop_wash_location
    prints: "modules/G6_4.pdf §C (where crops are washed, shown when crop washing is a water use)"
  note: "Closed 2026-11-09 (content 2026.11.28)."
- ref: B3a
  asks: If you treat wash water on-site (e.g. RO, UV, carbon filtration, water softeners, pH adjustment), does
    treated water meet Safe Drinking Water Act standards? Not applicable / Yes.
  status: covered
  trazo:
    questions:
    - g6_4_handling.water_treated_onsite
    - g6_4_handling.treated_water_meets_sdwa
    prints: "modules/G6_4.pdf §C (not confirmed or No prints a [REVIEW] line)"
  note: "Closed 2026-11-09 (content 2026.11.28)."
- ref: B3b
  asks: Do you add any substances to the wash water, e.g. peracetic acid, hydrogen peroxide, chlorine? No /
    Yes, list materials on your Grower Materials Application.
  status: covered
  trazo:
    questions:
    - g6_4_handling.wash_water_additives_added
    prints: modules/G6_4.pdf §C (the on-farm handling module; no G6.1 field exists)
- ref: B3c
  asks: Do you add chlorine to the wash water? No, skip to question B4 / Yes, continue below.
  status: covered
  trazo:
    questions:
    - g6_4_handling.wash_water_chlorine_added
    prints: modules/G6_4.pdf §C (the on-farm handling module; no G6.1 field exists)
- ref: B3c(i)
  asks: If yes, do products undergo a final fresh water rinse? (NOP only) Not applicable / Yes / No, chlorine never added
    to water above SDWA limits.
  status: covered
  trazo:
    questions:
    - g6_4_handling.wash_water_chlorine_final_rinse
    - g6_4_handling.wash_water_chlorine_final_rinse_other
    prints: modules/G6_4.pdf §C (the on-farm handling module; no G6.1 field exists)
- ref: B4
  asks: Are both organic and nonorganic crops grown? No, skip to section C. Yes, complete question 5.
  status: covered
  trazo:
    questions:
    - g6_0_production.split_operation
    prints: modules/G6_0.pdf §A (split_operation) — not printed on G6.1; captured operation-wide rather
      than per-crop
- ref: B5
  asks: 'Describe the management practices and/or physical barriers used to ensure that organic and nonorganic
    crops are not commingled during harvest and/or transport from the field. Mark all that apply: closed
    containers; harvested at different times; visually distinct organic & nonorganic crops; shipped on
    separate vehicles; shipped to separate destinations; other (describe).'
  status: covered
  trazo:
    questions:
    - g6_0_production.harvest_transport_separation
    - g6_0_production.split_operation_separation
    - g6_0_production.parallel_production_distinction
    prints: modules/G6_0.pdf
- ref: C1
  asks: Are your crops handled/processed by another certified organic operation after harvest? No, stop,
    this form is complete. Yes, but ownership of crops is transferred before or upon delivery to the facility
    — stop, this form is complete. Yes — complete this section.
  status: covered
  trazo:
    questions:
    - g6_1_harvest_transport.handled_by_another_operation
    prints: modules/G6_1.pdf §D; narrative § 205.201(a)(5)
- ref: C2
  asks: 'List all finished organic products and their corresponding organic handler or processor below, or attach
    another list. Include private label products; for each multi-ingredient product, submit an ingredient statement
    from the manufacturer to compare to your label (not required if co-packer is CCOF certified). Table columns:
    Product Category / Product Detail (if any) / Packaging Form (retail, nonretail, unpackaged) / Certified Operation
    where Product is Handled or Processed.'
  status: covered
  trazo:
    questions:
    - g6_1_harvest_transport.off_farm_handler_table
    - g6_1_harvest_transport.uncertified_handler_records
    models:
    - certifications.FacilityProduct.category
    - certifications.FacilityProduct.detail
    - certifications.FacilityProduct.packaging_form
    - certifications.FacilityProduct.multi_ingredient
    - certifications.FacilityProduct.ingredient_statement_document
    prints: modules/G6_1.pdf §D (under each handler, a product table with category and detail, packaging form and
      single or multi-ingredient; under a multi-ingredient product, its ingredient statement's path in the packet
      or a [REVIEW] that none is on file); handlers/ in the packet ZIP; narrative § 205.201(a)(5)
  # Closed 2026-11-08 by the product-rows slice: each facility carries structured product rows in CCOF's columns,
  # the certified operation is the facility line above the table, and a multi-ingredient product's manufacturer
  # ingredient statement ships under handlers/.
- ref: C3
  asks: Attach organic certificates for all handlers/processors listed above. Certificates must be current
    (issued within the last 15 months) and complete, listing the specific finished products above and
    including the brand (if any).
  status: covered
  trazo:
    questions: [g6_1_harvest_transport.off_farm_handler_table]
    prints: "modules/G6_1.pdf §D (certificate number, certifier and currency line; the facility line names the certificate copy's path under handlers/ in the packet, or says why it is not there); handlers/ in the packet ZIP"
  # Closed 2026-11-02 by the third-party certificates slice.
- ref: C4
  asks: Attach all labels in G7.0 Labeling.
  status: covered
  trazo:
    questions:
    - g7_0_labeling.label_files_upload
    prints: modules/G7_0.pdf §A; labels/ (the files uploaded for label_files_upload; since 2026-10-01)
  # Closed 2026-11-07. The gap asked that this form be named among the places the label files answer; that
  # naming is derived from the rows that cite the upload, and this row does.
