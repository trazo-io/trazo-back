form:
  code: G6.1
  title: Harvest & Transport
  document_id: ORGB39
  revision: V2, R1, 10/23/2024
  url: https://www.ccof.org/resource/g6-1-harvest-and-transport/
  retrieved: 2026-10-24
  nop_cites:
  - § 205.101
  - § 205.102
  - § 205.103
  - § 205.201
  guide_trigger: Item 1 — apply for CCOF organic certification for crop production
  required_of_every_grower: true
  trazo_module: g6_1_harvest_transport
  register_status: complete
  source_sha256: 9677b4d666db754f8997daa5c270e46cb14de0025bf1f1463487044d74d915e5
items:
- ref: A1
  asks: 'My operation is responsible for harvest in the following ways (mark all that apply): my operation
    performs the harvest; my operation (or my contracting organic handler) hires an uncertified company
    (contract harvester) to harvest my crop — complete A3 and describe all activities performed by the
    harvester in section B; other responsibility (describe); or not applicable, no responsibility for
    harvest (e.g. crop is sold "in the field") — describe.'
  status: partial
  severity: P2
  trazo:
    questions:
    - g6_1_harvest_transport.who_harvests
    - g6_1_harvest_transport.custom_harvester_cleanout_verified
    - g6_1_harvest_transport.custom_harvester_instructions
    prints: modules/G6_1.pdf §A
  gap: who_harvests is a single-select radio ({own_crew, custom_harvester, buyer_harvests}), but CCOF's
    A1 is mark-all-that-apply — an operation using its own crew plus a custom pass cannot represent both.
    There is no "other (describe)" option and no "not applicable, no responsibility for harvest (crop
    sold in the field)" option.
  fix: Convert who_harvests to a checkbox_group with CCOF's four options plus other free text; gate the
    module's N/A on the "no responsibility" option rather than the whole-module allows_not_applicable=False.
- ref: A2
  asks: 'My operation is responsible for post-harvest transportation in the following ways (mark all that
    apply): my operation transports the crop; my operation (or my contracting organic handler) hires an
    uncertified company to transport my crop — complete A3 and describe all activities performed by the
    transporter in section B (certification of the transporter is required if the transporter handles
    the crops during transport, e.g. pack, repack, treat, sort, open, enclose, label — see the Exempt
    Handler Affidavit (EHA) for more detail on activities that may require certification); other responsibility
    (describe); or not applicable, no responsibility for transport (e.g. crop is sold "in the field")
    — describe.'
  status: partial
  severity: P1
  trazo:
    questions:
    - g6_1_harvest_transport.who_transports
    prints: modules/G6_1.pdf §C
  gap: 'who_transports is a single-select radio ({own_vehicles, commercial_carrier, buyer_pickup}); CCOF''s
    A2 is mark-all-that-apply. Confirmed against the pilot''s own output: the G6.1 §C narrative names
    two carriers/handlers on separate BOLs (Cascade Organic Distributors, Marion Bend Fruit) while who_transports
    holds only one value ("Commercial carrier"). Separately, nothing asks whether a hired uncertified
    carrier''s role goes beyond bare transport (pack/repack/treat/sort/open/enclose/label) — CCOF''s own
    literal trigger for needing certification or an Exempt Handler Affidavit (NOPB107) — so that determination
    is never made or recorded.'
  fix: Convert who_transports to a checkbox_group with CCOF's options plus other; add carrier_handles_beyond_transport
    [boolean] "Does this carrier do anything beyond moving the load — pack, repack, treat, sort, open,
    enclose, or label it?" cite §205.2/§205.101(f), gated on hiring an uncertified/commercial carrier;
    if yes, route to Exempt Handler Affidavit tracking (see G6.2's ref A and G6.5's ref A1 for the same
    missing tracking).
- ref: A3
  asks: 'If you or your contracting organic handler (e.g. shipper, marketer, buyer) hires any uncertified
    companies to harvest and/or transport organic crops, how do you ensure that you maintain the applicable
    records (harvest records showing date/quantity/crop/certified parcel; cleaning records for harvest
    equipment; transportation records tracing crops back to the certified grower and linking to lot number/shipping
    ID; transportation records demonstrating commingling and contamination are prevented)? Not applicable,
    skip to section B. Mark all that apply: my operation generates the records; the uncertified company
    generates the records and provides them to me; my contracting organic handler obtains the records
    from the uncertified company and provides them to me; other (describe).'
  status: partial
  severity: P1
  trazo:
    questions:
    - g6_1_harvest_transport.custom_harvester_records
    - g6_1_harvest_transport.non_own_transport_records
    prints: modules/G6_1.pdf §A (custom_harvester_records); §C (non_own_transport_records)
  gap: 'custom_harvester_records asks WHAT records exist (harvest_date/quantity/crop_variety/parcel_field/weigh_tickets/none_yet),
    never WHO generates or provides them — CCOF''s actual A3 ask — and it is gated only off the harvest
    side (who_harvests=custom_harvester). A farm using its own crew to harvest but an uncertified or commercial
    transporter to move the crop gets no A3-equivalent at all: non_own_transport_records on page C is
    a free textarea asking what records the carrier provides, and it also does not ask who generates them.'
  fix: Add harvest_transport_records_source [checkbox_group] {we_generate, uncertified_provides, handler_obtains,
    other} cite §205.103(b), visible when who_harvests=custom_harvester OR who_transports includes_any
    (commercial_carrier, buyer_pickup); keep custom_harvester_records as the separate "what records" list.
- ref: B1
  asks: 'Do organic crops directly contact any equipment used during harvest, in-field washing and/or
    packing, or transport? No, skip to B3. Yes — complete a table listing only equipment that contacts
    organic crop, with columns: Equipment type / Dedicated to organic only? (Yes/No) / Own, rent, borrow,
    or custom work? / How is it cleaned before organic use, including type(s) of materials used? / Rinsed?
    (Yes/No, and any other details on how prohibited substance residues are removed).'
  status: partial
  severity: P1
  trazo:
    questions:
    - g6_1_harvest_transport.container_types
    - g6_1_harvest_transport.container_types_other
    - g6_1_harvest_transport.container_safeguards
    - g6_1_harvest_transport.containers_cleaning_method
    prints: modules/G6_1.pdf §B; narrative § 205.201(a)(5)
  gap: 'CCOF asks a PER-ITEM table — equipment type × dedicated × ownership × cleaning method/materials
    × rinsed — for every piece of crop-contact equipment across harvest, in-field washing/packing and
    transport. Trazo still answers per OPERATION rather than per item, and still covers containers only,
    not pickers, conveyors or wash tanks. Re-graded P1: the plan no longer asserts more than the operator
    stated, which is what made it a blocker. The OVERCLAIM is closed (2026-08-28): the single boolean
    asserting "new, dedicated, OR cleaned before each use" across every container type is gone, replaced
    by `container_safeguards`, a checkbox_group carrying WSDA J5''s four safeguards (cleaned prior / lined
    prior / only new / dedicated to organic). Migration 0036 CLEARS the stored booleans rather than mapping
    them — a stored True never said which safeguard applied, and inventing one would state a claim the
    operator never made — so those plans correctly read as in progress until answered. Guard: `certifications/tests/test_container_safeguards_not_flattened.py`.'
  fix: Add per-row columns (ownership, rinsed) to the container answer and extend it to harvest/wash/pack
    equipment, sharing the G6.0 `equipment_inventory` proposal.
- ref: B2
  asks: How are equipment cleaning/purging activities documented? Cleaning and/or purge logs; a Standard
    Operating Procedure (SOP) is followed (attach SOP); other (describe).
  status: not_covered
  severity: P2
  trazo:
    prints: modules/G6_1.pdf §B (containers_cleaning_method, prose only)
    models:
    - 'nearest existing field: g6_1_harvest_transport.containers_cleaning_method (free prose only)'
  gap: 'No field asks how cleaning/purging activities are documented (logs vs. a written SOP to attach
    vs. other) as its own question. The pilot''s "logged as equipment cleanout records" survives only
    as free prose inside containers_cleaning_method; G6.4''s facility_docs upload is a different, gated
    module. (Citation corrected 2026-08-28: this row used to name `containers_cleaning_method` under `trazo.questions`,
    which is where an ANSWER lives. That question describes the cleaning METHOD; this asks what is DOCUMENTED,
    a different fact with no home. Naming the nearest field as though it answered the question is the
    same "covered for the wrong reason" trap in reverse, and it made one question read as covered for
    one certifier and not covered for another.)'
  fix: Add equipment_cleaning_documentation_method [checkbox_group] {cleaning_purge_logs, sop_followed,
    other} + optional SOP upload, visible when container_safeguards is truthy; cite §205.272(a).
- ref: B3
  asks: Do you wash crops in the field? No, skip to question B4 / Yes, complete this section.
  status: not_covered
  severity: P2
  trazo:
    prints: —
  gap: No G6.1 question says whether crops are washed in the field. `uses_water` (G6.4) says whether water
    touches the product at any step, not where, so an operation that washes only in the field answers on the
    wrong module heading for a CCOF reviewer reading G6.1.
  fix: A `washes_in_field` [boolean] on G6.1 page B that reuses the G6.4 water block.
- ref: B3a
  asks: If you treat wash water on-site (e.g. RO, UV, carbon filtration, water softeners, pH adjustment), does
    treated water meet Safe Drinking Water Act standards? Not applicable / Yes.
  status: not_covered
  severity: P2
  trazo:
    prints: —
  gap: No field records whether on-site treated wash water meets the Safe Drinking Water Act standard.
  fix: '`wash_water_sdwa_compliant` [radio] {not_applicable, confirmed}, cite § 205.272(a).'
- ref: B3b
  asks: Do you add any substances to the wash water, e.g. peracetic acid, hydrogen peroxide, chlorine? No /
    Yes, list materials on your Grower Materials Application.
  status: covered
  trazo:
    questions:
    - g6_4_handling.wash_water_additives_added
    prints: modules/G6_4.pdf §C (the on-farm handling module; no G6.1 field exists)
- ref: B3c
  asks: Do you add chlorine to the wash water? No, skip to question B4 / Yes, continue below.
  status: covered
  trazo:
    questions:
    - g6_4_handling.wash_water_chlorine_added
    prints: modules/G6_4.pdf §C (the on-farm handling module; no G6.1 field exists)
- ref: B3c(i)
  asks: If yes, do products undergo a final fresh water rinse? (NOP only) Not applicable / Yes / No, chlorine never added
    to water above SDWA limits.
  status: covered
  trazo:
    questions:
    - g6_4_handling.wash_water_chlorine_final_rinse
    - g6_4_handling.wash_water_chlorine_final_rinse_other
    prints: modules/G6_4.pdf §C (the on-farm handling module; no G6.1 field exists)
- ref: B4
  asks: Are both organic and nonorganic crops grown? No, skip to section C. Yes, complete question 5.
  status: covered
  trazo:
    questions:
    - g6_0_production.split_operation
    prints: modules/G6_0.pdf §A (split_operation) — not printed on G6.1; captured operation-wide rather
      than per-crop
- ref: B5
  asks: 'Describe the management practices and/or physical barriers used to ensure that organic and nonorganic
    crops are not commingled during harvest and/or transport from the field. Mark all that apply: closed
    containers; harvested at different times; visually distinct organic & nonorganic crops; shipped on
    separate vehicles; shipped to separate destinations; other (describe).'
  status: partial
  trazo:
    questions:
    - g6_0_production.split_operation_separation
    - g6_0_production.parallel_production_distinction
    prints: modules/G6_0.pdf §B (buffer_strategies) — not printed on G6.1; captured operation-wide rather
      than per-crop harvest/transport
  severity: P2
  gap: CCOF asks how organic and nonorganic crops are kept apart DURING HARVEST AND TRANSPORT, offering
    separate vehicles and separate destinations among its options. The row previously cited `buffer_strategies`,
    which is a buffer-zone question whose every near-matching option is about the buffer crop — the citation
    is corrected here to the two questions that do carry this fact. Neither offers separate vehicles or
    separate destinations. (downgraded from `covered` 2026-08-28 by an adversarial re-read of every covered
    row.)
  fix: Add `separate_vehicles` and `separate_destinations` options to `split_operation_separation`, which
    already prints into the (a)(5) commingling narrative.
- ref: C1
  asks: Are your crops handled/processed by another certified organic operation after harvest? No, stop,
    this form is complete. Yes, but ownership of crops is transferred before or upon delivery to the facility
    — stop, this form is complete. Yes — complete this section.
  status: covered
  trazo:
    questions:
    - g6_1_harvest_transport.handled_by_another_operation
    prints: modules/G6_1.pdf §D; narrative § 205.201(a)(5)
- ref: C2
  asks: 'List all finished organic products and their corresponding organic handler or processor below,
    or attach another list. Include private label products; for each multi-ingredient product, submit
    an ingredient statement from the manufacturer to compare to your label (not required if co-packer
    is CCOF certified). Table columns: Product Category / Product Detail (if any) / Packaging Form (retail,
    nonretail, unpackaged) / Certified Operation where Product is Handled or Processed.'
  status: partial
  severity: P1
  trazo:
    questions:
    - g6_1_harvest_transport.off_farm_handler_table
    - g6_1_harvest_transport.uncertified_handler_records
    models:
    - certifications.PostHarvestFacility.name
    - certifications.PostHarvestFacility.role
    - certifications.PostHarvestFacility.certification_number
    - certifications.PostHarvestFacility.cert_is_current
    prints: modules/G6_1.pdf §D; narrative § 205.201(a)(5)
  gap: 'Name, address, role and certificate now print in the plan and the narrative, with the certificate
    stated as the record supports it (current / expired / date not stated / none on file). What remains
    is CCOF''s ATTACHMENT: `cert_document` is uploadable but is not written into the packet ZIP, and the
    PDF says so rather than implying otherwise. Closed 2026-08-28: G6.1 page D asks the routing gate (`handled_by_another_operation`:
    no / certified / uncertified), the `post_harvest_facilities` embed prints the facility table with
    its certificate status in the module PDF, and `_append_post_harvest_facilities` states the same records
    in the § 205.201(a)(5) narrative. `PostHarvestFacility.role` distinguishes handling from storage so
    one record answers both G6.1 §C and G6.2 §A. Guard: `certifications/tests/test_post_harvest_facility_reaches_plan.py`.'
  fix: Ship `cert_document` into the packet ZIP under `handlers/` alongside `receipts/`, and name the
    file in the §D block. Same loop as the receipts fix.
- ref: C3
  asks: Attach organic certificates for all handlers/processors listed above. Certificates must be current
    (issued within the last 15 months) and complete, listing the specific finished products above and
    including the brand (if any).
  status: partial
  severity: P1
  root_cause: post-harvest-facility-record-never-reaches-plan-layer
  trazo:
    models:
    - certifications.models.PostHarvestFacility.cert_document
    - certifications.models.PostHarvestFacility.cert_is_current
    questions:
    - g6_1_harvest_transport.off_farm_handler_table
    prints: "modules/G6_1.pdf §D (post_harvest_facilities embed: name, type, role, address, certificate number, certifier and currency verdict); narrative § 205.201(a)(5); audit export per-lot dossier"
  gap: >-
    The facility record with its certificate number, certifier and 15-month currency verdict prints on the G6.1 module page (`_post_harvest_facility_flowables`) and in the § 205.201(a)(5) narrative — closed 2026-08-28; an earlier `prints` line on this row still said 'audit export only'. What CCOF asks to ATTACH — the handler's certificate document itself — is stored as `cert_document` and not embedded in the packet, so the row stays partial. Guard: `certifications/tests/test_post_harvest_facility_reaches_plan.py`.
  fix: >-
    Carry `PostHarvestFacility.cert_document` into the ZIP (a `facilities/certificates/` folder) the way parcel maps travel.
- ref: C4
  asks: Attach all labels in G7.0 Labeling.
  status: partial
  severity: P1
  trazo:
    questions:
    - g7_0_labeling.label_files_upload
    prints: modules/G7_0.pdf §A; labels/ (the files uploaded for label_files_upload; since 2026-10-01)
  gap: The form asks for the label files here. Trazo collects them once, in `label_files_upload` on the labeling
    module; since 2026-10-01 they ride in the packet under labels/ (OSP alignment audit 2026-10, T19). This form
    is not yet named among the places they answer.
  fix: Name this form among the places the uploaded label files answer.
