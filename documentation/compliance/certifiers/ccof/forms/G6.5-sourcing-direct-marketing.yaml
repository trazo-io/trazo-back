form:
  code: "G6.5"
  title: "Sourcing Products and Direct Marketing"
  document_id: "ORGB35"
  revision: "V2, 12/31/2023"
  url: "https://www.ccof.org/resource/g6-5-sourcing-products-and-direct-marketing/"
  retrieved: 2026-10-24
  nop_cites: ["§ 205.102", "§ 205.103", "§ 205.201", "§ 205.272"]
  guide_trigger: "Item 8 — source organic products from other operations and/or sell organic products directly to consumers"
  trazo_module: g6_5_sales_soe
  register_status: complete
  source_sha256: b22d5fd19a8a3cc0e582ba1ac1d2a0b152f8d7ab6ba428c84bb6444047d4804c

items:
  - ref: Preamble (applicability)
    asks: Complete this form if you source products from other operations and/or sell products directly to consumers
      (e.g. Community Supported Agriculture program, farm stand, Farmers' Market, u-pick, website, etc.). Per
      CCOF's Guide to Grower OSP Forms (Item 8), file only if you source organic products from other operations
      AND/OR sell organic products directly to consumers — a pure grow-and-wholesale operation need not file
      this form at all, and the form itself supports terminal "No"/"N/A, stop, this form is complete" answers
      at A1 and B1.
    status: covered
    trazo:
      questions: [g6_5_sales_soe.sales_soe_channels, g6_5_sales_soe.sales_soe_supplier_verification, g6_5_sales_soe.direct_sales, g6_5_sales_soe.sales_soe_lot_linkage, g6_5_sales_soe.sales_soe_upload]
      prints: "modules/G6_5.pdf §A (sourcing) and §B (direct sales)"
    # Closed 2026-11-17 by the direct marketing slice: the two facts CCOF files G6.5 on are each asked: whether the
    # operation buys or resells another's organic product (sales_soe_supplier_verification, which gates the supplier
    # verification questions) and, new, whether it sells directly to consumers (direct_sales). Sales channels and
    # sale-to-lot linkage stay asked of everyone as baseline traceability (section 205.103(b)(2)), as the register's
    # own fix said.

  - ref: "A1"
    asks: 'Do you source organic crops/products from other operations? No, skip to B. Yes — complete a table or attach a list: Crop/Product Category / Crop/Product Detail (if any) / Supplier. If any suppliers are uncertified (e.g. brokers/distributors), list both the uncertified supplier and the certified operation they source from in the Supplier column, and attach an Exempt Handler Affidavit (EHA) completed by the uncertified supplier.'
    status: covered
    trazo:
      questions:
      - g6_5_sales_soe.sales_soe_verification_method
      - g6_5_sales_soe.sales_soe_supplier_verification
      - g6_5_sales_soe.sourced_products_panel
      prints: "modules/G6_5.pdf (each supplier: products bought, status, the certified operation an uncertified broker sources from, its Exempt Handler Affidavit); suppliers/ in the ZIP"
    # Closed 2026-11-08 by the sourced-products slice: the yes/no gate opens the sourcing panel, read from the supplier register: product per supplier, and for an uncertified broker the certified operation it sources from and the EHA, shipped under suppliers/.

  - ref: "A2"
    asks: Attach organic certificates for all suppliers listed above. Certificates must be current (issued within the last 15 months) and complete, listing the crop or product you source.
    status: covered
    trazo:
      questions:
      - g6_5_sales_soe.sourced_products_panel
      prints: "modules/G6_5.pdf (newest certificate per supplier, flagged past 15 months); suppliers/ in the ZIP"
    # Closed 2026-11-08 by the sourced-products slice: each certified supplier's newest copy prints with its issue date and ships under suppliers/; past 15 months prints [REVIEW]. The coverage page holds the row open until every supplier has a current copy.

  - ref: "A3"
    asks: How do you verify that incoming products do not contact prohibited substances during transport from the supplier to your operation? Cleaning and/or purge logs; certified supplier provides documentation; other (describe).
    status: covered
    trazo:
      questions:
      - g6_5_sales_soe.sales_soe_verification_method
      - g6_5_sales_soe.sourcing_transport_verification
      - g6_5_sales_soe.sourcing_transport_verification_other
      prints: "modules/G6_5.pdf"
    # Closed 2026-11-08 by the sourced-products slice: CCOF's options, asked as printed.

  - ref: "A4"
    asks: 'How do you ensure that organic products are not commingled with nonorganic during transport from the supplier to your operation? Mark all that apply: not applicable, only source certified organic products; distinctly labeled or marked containers; closed containers; transported at different times; visually distinct; shipped on separate vehicles; shipped from separate destinations; other (describe).'
    status: covered
    trazo:
      questions:
      - g6_5_sales_soe.sourcing_transport_commingling
      - g6_5_sales_soe.sourcing_transport_commingling_other
      prints: "modules/G6_5.pdf"
    # Closed 2026-11-08 by the sourced-products slice: CCOF's options, asked as printed.
  - ref: B1
    asks: 'Describe all direct marketing venues below or attach a list. Include CSAs, farm stands, Farmers''
      Markets, U-Pick, and online sales. Not applicable, no sales directly to consumers: stop, this form is complete.'
    status: covered
    trazo:
      questions: [g6_5_sales_soe.direct_sales, g6_5_sales_soe.direct_sales_venues, g6_5_sales_soe.direct_sales_venue_list_upload]
      prints: "modules/G6_5.pdf §B; a No is CCOF's 'not applicable, no sales directly to consumers'"
    # Closed 2026-11-17 by the direct marketing slice: direct_sales is CCOF's yes or not applicable, and
    # direct_sales_venues lists the venues in the form's kinds (farmers' markets, CSA, farm stand, u-pick, online,
    # other); the list can be attached instead.
  - ref: B1a
    asks: 'Farmers'' Markets — not applicable, no sales at farmers'' markets. Table: Name of market and/or Farmers''
      Market organization / Market Address / Day(s) / Do you sell non-organic products at this market?'
    status: covered
    trazo:
      questions: [g6_5_sales_soe.direct_sales_venues, g6_5_sales_soe.farmers_markets_detail]
      prints: "modules/G6_5.pdf §B"
    # Closed 2026-11-17 by the direct marketing slice: shown when farmers' markets are among the venues, one market
    # per line in the form's columns: the market or its organization, its address, the days, and whether non-organic
    # products are sold there. Not ticking farmers' markets is the form's 'not applicable, no sales at farmers'
    # markets'.
  - ref: B1b
    asks: 'Other direct marketing venues (CSA, farm stand, u-pick, online/website sales, etc.) — not applicable,
      none of these. Table: Type / Address or Website (for online sales) / Do you sell non-organic products at
      this venue?'
    status: covered
    trazo:
      questions: [g6_5_sales_soe.direct_sales_venues, g6_5_sales_soe.other_venues_detail]
      prints: "modules/G6_5.pdf §B"
    # Closed 2026-11-17 by the direct marketing slice: shown for CSA, farm stand, u-pick, online or other venues, one
    # per line in the form's columns: type, address or website, and whether non-organic products are sold there.
  - ref: C1
    asks: How do you differentiate organic and non-organic products to consumers? Not applicable, I only sell
      certified organic products. Twist ties/stickers/rubber bands; newsletter/delivery list (attach sample);
      description on website (attach sample); clear "organic" and "nonorganic" signage (attach photo); separate
      sales areas for organic and nonorganic (describe).
    status: covered
    trazo:
      questions: [g6_5_sales_soe.direct_sales_nonorganic, g6_5_sales_soe.direct_sales_differentiation, g6_5_sales_soe.direct_sales_separate_areas_detail, g6_5_sales_soe.direct_sales_differentiation_other, g6_5_sales_soe.direct_sales_samples_upload]
      prints: "modules/G6_5.pdf §C, with a [REVIEW] line for a sample or photo option chosen with nothing attached"
    # Closed 2026-11-17 by the direct marketing slice: 'only certified organic products' is the form's not applicable;
    # otherwise the form's five ways, plus other, with the separate sales areas described. The newsletter, website and
    # signage options name the samples upload (Option.requires_upload), so one chosen with no file prints a [REVIEW]
    # line.
