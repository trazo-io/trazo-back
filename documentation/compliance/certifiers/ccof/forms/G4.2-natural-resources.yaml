form:
  code: G4.2
  title: Natural Resources
  document_id: ORGB43
  revision: V1, R8, 9/21/2021
  url: https://www.ccof.org/resource/g4-2-natural-resources/
  retrieved: 2026-10-24
  nop_cites:
  - § 205.200
  guide_trigger: Item 1 — apply for CCOF organic certification for crop production
  required_of_every_grower: true
  trazo_module: g4_2_natural_resources
  register_status: complete
  source_sha256: 6ff7528580ec1c4aa81e5639ac9641d971c5ce521ee5668a589f3748fe896509
items:
- ref: A1
  asks: Describe the natural resources and biodiversity of your operation and surrounding ecosystems,
    including soil type and condition, bodies of water, nearby wetlands and woodlands, wildlife, windbreaks,
    hedgerows, native habitat and beneficial plantings. Include any problem areas such as erosion and
    invasive species.
  status: covered
  trazo:
    questions:
    - g4_2_natural_resources.natural_resources_description
    prints: modules/G4_2.pdf §A
  note: 'Closed 2026-11-08. `natural_resources_description`, the first question of G4.2 page A, asks the description
    with CCOF''s elements in its coaching (soil type and condition, water, wetlands and woodlands, wildlife, windbreaks,
    hedgerows, native habitat, beneficial plantings, problem areas). Optional, like every question added to a module
    plans have already finished. No draft is suggested from parcel or habitat records yet.'
- ref: A2
  asks: Do you have a current conservation plan or contract with the USDA Natural Resources Conservation
    Service (NRCS) or other conservation agency? No / Yes.
  status: covered
  trazo:
    questions:
    - g4_2_natural_resources.conservation_plan_agency
    - g4_2_natural_resources.conservation_plan_agency_other
    prints: modules/G4_2.pdf §B; narrative § 205.200
- ref: A2a
  asks: If yes, list the conservation practices that are being implemented and be prepared to show your plan at
    inspection.
  status: covered
  trazo:
    questions:
    - g4_2_natural_resources.conservation_plan_detail
    prints: modules/G4_2.pdf §B
  note: Closed 2026-11-15. `conservation_plan_detail` is a textarea for the list of practices. CCOF asks the plan
    shown at inspection, not attached, so no upload is asked.
- ref: A3
  asks: How do you maintain or improve your water resources (quantity and quality)? Efficient irrigation use (quantity,
    timing, technology) / allocate water to non-crop areas for wildlife and habitat / target and meter fertilizer
    use to prevent nutrient runoff / manage excess water towards on-site retention and infiltration / vegetative
    cover filters for sediments and other pollutants / use fish screens / other (describe).
  status: covered
  trazo:
    questions:
    - g4_2_natural_resources.soil_water_practices
    - g4_2_natural_resources.soil_water_practices_other
    - g4_2_natural_resources.waterway_practices
    - g4_2_natural_resources.waterway_practices_other
    prints: modules/G4_2.pdf §A
  note: Closed 2026-11-15. `fertilizer_metering` and `water_for_wildlife` join `soil_water_practices`; fish screens
    are on `waterway_practices`, asked where streams or channels run by the land; on-site retention and infiltration
    is `infiltration`.
- ref: A4
  asks: How do you improve and/or maintain natural resources in non-crop areas, such as borders, fallow ag land,
    and non-ag habitats? Preserve/restore wetlands and riparian areas / increase and protect native plants/wildlife
    / minimize erosion / preserve/restore wildlife corridors / leave areas as undisturbed habitat refuge / wildlife
    friendly fences / establish legal conservation areas / restore degraded areas / native habitats not converted
    to farmland since certification / other (describe).
  status: covered
  trazo:
    questions:
    - g4_2_natural_resources.habitat_biodiversity_practices
    - g4_2_natural_resources.habitat_biodiversity_practices_other
    - g4_2_natural_resources.soil_water_practices
    - g4_2_natural_resources.soil_water_practices_other
    - g4_2_natural_resources.waterway_practices
    - g4_2_natural_resources.waterway_practices_other
    - g4_2_natural_resources.wildlife_habitat_pressure
    prints: modules/G4_2.pdf §A, §B
  note: Closed 2026-11-15. Undisturbed refuge, wildlife-friendly fences, legal conservation areas, restored degraded
    areas and native habitat not converted are options of `habitat_biodiversity_practices`, no longer behind the
    wildlife-pressure gate.
- ref: A5
  asks: How are you managing habitat for pollinators, natural enemy insects and other wildlife throughout the production
    season? Hedgerows / windbreaks / raptor perches or trees at field edge / bird or bat boxes / ensure a clean
    water source / plant flowers interspersed with crops / implement measures to support a variety of bee species
    / allow non-invasive plants in non-cropped, fallow, and border areas / provide extended food supply / other
    (describe).
  status: covered
  trazo:
    questions:
    - g4_2_natural_resources.habitat_biodiversity_practices
    - g4_2_natural_resources.habitat_biodiversity_practices_other
    prints: modules/G4_2.pdf §A
  note: Closed 2026-11-15. A clean water source, bee diversity, non-invasive plants in border areas, an extended
    food supply and bird boxes are options of `habitat_biodiversity_practices`; `bat_boxes` keeps its meaning.
- ref: A6
  asks: What actions do you take to prevent or control invasive plant/animal species, especially those
    threatening natural areas? Learn to identify invasive species / monitor for new introductions and
    suppress or remove immediately / plant competing beneficial native plants / use weed and pest-free
    seed/planting stock/soil amendments/mulches / state or federal agency controls invasive species /
    other (describe).
  status: covered
  trazo:
    questions: [g4_2_natural_resources.invasive_species_practices, g4_2_natural_resources.invasive_species_practices_other]
    prints: "modules/G4_2.pdf §A; narrative § 205.200"
  # Closed 2026-11-02 by the monitoring slice.
- ref: A7
  asks: If you restrict wildlife from your production areas due to food safety or other crop production
    concerns, or if you have converted wildlife habitat to crop production, how do you mitigate the resulting
    loss of wildlife habitat? Develop or enhance habitat in other areas of your farm / plant buffers between
    crop and habitat areas / leave room for habitat when using fencing (riparian or corridor) / other
    (describe) / not applicable (explain why not).
  status: covered
  trazo:
    questions:
    - g4_2_natural_resources.wildlife_habitat_pressure
    - g4_2_natural_resources.wildlife_habitat_mitigation
    - g4_2_natural_resources.wildlife_habitat_mitigation_other
    prints: modules/G4_2.pdf §B; narrative § 205.200
- ref: A8
  asks: 'Operations producing crops within enclosed structures/buildings (greenhouses, sprout or mushroom production,
    etc.): describe additional conservation measures implemented. Not applicable / water conservation / energy conservation
    / recycling / composting / diverse outdoor plantings / surrounding habitat restoration / sustainable packaging
    / crop rotation within greenhouses / other (describe).'
  status: covered
  trazo:
    questions:
    - g3_1_container_greenhouse.enclosed_structure_conservation
    - g3_1_container_greenhouse.enclosed_structure_conservation_other
    prints: modules/G3_1.pdf §A
  note: Closed 2026-11-15. Asked on G3.1, where the structures are, with CCOF's eight measures, other, and none;
    an operation with no structures answers G3.1 not applicable.
- ref: A9
  asks: Describe any additional measures taken to conserve natural resources. Not applicable.
  status: covered
  trazo:
    questions:
    - g4_2_natural_resources.other_conservation_measures
    - g4_2_natural_resources.other_conservation_measures_detail
    prints: modules/G4_2.pdf §A
  note: Closed 2026-11-15. `other_conservation_measures`, a No for CCOF's "Not applicable", and its detail.
- ref: B1
  asks: How do you verify the effectiveness of your conservation measures and document whether they improve
    or maintain the natural resources of your operation? Photograph logs / document fertility and pest
    control cost trends / document water use trends / plant, animal, insect surveys / observations in
    farm logs and journals / maintain conservation map / water testing / soil testing / periodic expert
    evaluation and report (such as NRCS) / other (describe).
  status: covered
  trazo:
    questions:
    - g4_2_natural_resources.monitoring_method
    - g4_2_natural_resources.monitoring_method_other
    prints: "modules/G4_2.pdf §C; narrative § 205.201(a)(3)"
  note: 'Closed 2026-11-08. `monitoring_method` gains cost trends, water use trends and water testing, the three of
    CCOF''s ten options that reached the plan only as other.'
- ref: C (not applicable)
  asks: Conservation Involving Livestock — not applicable, no livestock involved.
  status: not_covered
  severity: P3
  applies_when:
  - question: certification_contract.contract_scopes
    op: includes
    value: livestock
  gap: Applies only to an operation with livestock. Trazo asks nothing about livestock conservation; whether
    it applies is read from the certification scopes the operation answered.
  fix: No livestock module exists; the condition closes it for an operation whose answered scopes exclude livestock.
- ref: C1
  asks: How do you protect natural wetlands, riparian areas and sensitive habitats from impacts due to livestock?
    Limit livestock access to riparian areas/sensitive habitats and use designated stream crossings / locate
    feed stations, water troughs and mineral blocks away from streams and water sources / conserve native vegetation
    along waterways / manage excess manure to prevent nutrient and pathogen pollution / allow the natural process
    of plant regeneration along stream banks / other (describe).
  status: not_covered
  severity: P3
  applies_when:
  - question: certification_contract.contract_scopes
    op: includes
    value: livestock
  gap: Applies only to an operation with livestock. Trazo asks nothing about livestock conservation; whether
    it applies is read from the certification scopes the operation answered.
  fix: No livestock module exists; the condition closes it for an operation whose answered scopes exclude livestock.
- ref: C2
  asks: How do you improve or protect your pasture or rangeland? Manage the frequency, density and timing of
    grazing to allow plant regeneration / reseed trampled or eroded areas / plant a diversity of native species
    / provide adequate shaded areas to minimize soil compaction / prevent excess deposits of manure / encourage
    plant growth that filters manure runoff / minimize grazing wetlands and other soggy areas / other (describe).
  status: not_covered
  severity: P3
  applies_when:
  - question: certification_contract.contract_scopes
    op: includes
    value: livestock
  gap: Applies only to an operation with livestock. Trazo asks nothing about livestock conservation; whether
    it applies is read from the certification scopes the operation answered.
  fix: No livestock module exists; the condition closes it for an operation whose answered scopes exclude livestock.
- ref: C3
  asks: What management practices do you use to ensure a healthy relationship between livestock and wildlife?
    Use guard animals / graze when predation is low / house livestock overnight in a protected area / use electric
    fencing / provide water troughs with escape ramps for wildlife / graze small animals with large / use predator
    lights / design fencing to minimize entrapment and provide for wildlife corridors / allow non-predatory
    wildlife to co-exist with livestock / other (describe).
  status: not_covered
  severity: P3
  applies_when:
  - question: certification_contract.contract_scopes
    op: includes
    value: livestock
  gap: Applies only to an operation with livestock. Trazo asks nothing about livestock conservation; whether
    it applies is read from the certification scopes the operation answered.
  fix: No livestock module exists; the condition closes it for an operation whose answered scopes exclude livestock.
- ref: C4
  asks: How do you manage yards, feeding pads, feedlots, laneways and housing to prevent runoff to surface
    water and to prevent dust from moving offsite? A confinement-area plan is in place before severe erosion
    occurs / livestock is rotated to multiple areas / concentrated runoff is diverted into a temporary storage
    lagoon / manure is periodically removed and composted / confined sites are sized for the type and number
    of animals present / air filtration is used in housing / dust in confined areas is watered down / windbreaks
    are used outside housing / confined sites are concrete or well-draining rock bases / other (describe).
  status: not_covered
  severity: P3
  applies_when:
  - question: certification_contract.contract_scopes
    op: includes
    value: livestock
  gap: Applies only to an operation with livestock. Trazo asks nothing about livestock conservation; whether
    it applies is read from the certification scopes the operation answered.
  fix: No livestock module exists; the condition closes it for an operation whose answered scopes exclude livestock.
