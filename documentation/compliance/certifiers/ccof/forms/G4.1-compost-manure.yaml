form:
  code: "G4.1"
  title: "Compost and Manure"
  document_id: "ORGB44"
  revision: "V1, R9, 9/21/2021"
  url: "https://www.ccof.org/resource/g4-1-compost-and-manure/"
  retrieved: 2026-10-24
  nop_cites: ["§ 205.105", "§ 205.203"]
  guide_trigger: "Item 5 — use compost, manure, or similar"
  trazo_module: g4_1_compost_manure
  register_status: complete
  source_sha256: 2da08ef4a43efbe1185568ebafb80d1173fa108518a97b93dfe181a71e82957c

items:
  - ref: "A1"
    asks: "Are all of the following materials you use in organic production listed on your Grower Materials Application (OSP Materials List): compost, compost tea, vermicompost, processed (heat-treated) manure, raw (uncomposted) manure? Yes / Not applicable, none of these are used (stop, form complete)."
    status: partial
    severity: P2
    trazo:
      questions: [g4_0_rotation_soil.fertility_inputs_listed, materials_application.fertilizers_listed]
      prints: "modules/G4_0.pdf §B; Materials Application §B; narrative § 205.201(a)(2)"
    gap: "No G4.1 question names this obligation for compost/manure specifically; the nearest attestations are G4.0's `fertility_inputs_listed` and the Materials Application's `fertilizers_listed`, whose prefill basis reads only `ChemicalEvent` FE rows and never the `SoilManagementEvent` OM/CO amendments that are exactly what this question is about. G4.1 also carries two independent N/A paths (the module-level not-applicable and the `materials_applied.none` exclusive option) for the same fact."
    fix: "Extend `materials_category_evidence` to include `bundle.soils(\"OM\",\"CO\")` amendment product names; drop one of the two N/A paths."

  - ref: "A2"
    asks: "Indicate which of the following you PRODUCE at your organic operation (mark all that apply): Compost / Compost tea / Vermicompost / Not applicable, do not produce any of these (skip to section B)."
    status: covered
    trazo:
      questions: [g4_1_compost_manure.materials_applied, g4_1_compost_manure.compost_tea_made_on_farm, g4_1_compost_manure.vermicompost_made_on_farm]
      prints: "modules/G4_1.pdf §A, §C"
    # Re-read 2026-11-02 by the compost and manure slice.

  - ref: "A2a"
    asks: "List all feedstocks/ingredients in the compost, vermicompost and/or compost tea you produce. If you produce more than one, provide separate ingredient lists for each."
    status: covered
    trazo:
      questions: [g4_1_compost_manure.compost_feedstocks, g4_1_compost_manure.compost_feedstocks_detail]
      prints: "modules/G4_1.pdf §C; narrative § 205.203(c)(2)"
    # Re-read 2026-11-02 by the compost and manure slice.

  - ref: "A2b"
    asks: "If you produce compost containing manure (and/or compost tea made from it), which production method do you use? Not applicable / windrow — reaches 131-170°F for at least 15 days, turned at least 5 times / in-vessel or static aerated pile — reaches 131-170°F for at least 3 days (maintain compost production records) / my compost does not meet either requirement, so it is considered 'raw manure' (complete section B)."
    status: covered
    trazo:
      questions: [g4_1_compost_manure.compost_method, g4_1_compost_manure.compost_contains_manure, g4_1_compost_manure.compost_initial_cn_ratio, g4_1_compost_manure.compost_temp_and_days, g4_1_compost_manure.compost_turnings, g4_1_compost_manure.compost_temp_logs_kept]
      prints: "modules/G4_1.pdf §C; narrative § 205.203(c)(2)"
    # Re-read 2026-11-02 by the compost and manure slice.

  - ref: "A2c"
    asks: "If you produce vermicompost containing manure, are the following conditions met: aerobic conditions and 70-90% moisture maintained during production; composting duration sufficient to produce a finished product that does not contribute to contamination by plant nutrients, pathogens, heavy metals or prohibited-substance residues? Not applicable / Yes, maintain vermicompost production records and any test results / my vermicompost does not meet these requirements, so it is considered 'raw manure' (complete section B)."
    status: covered
    trazo:
      questions: [g4_1_compost_manure.vermicompost_conditions_met, g4_1_compost_manure.vermicompost_moisture]
      prints: "modules/G4_1.pdf §C; narrative § 205.203(c)(2)"
    # Re-read 2026-11-02 by the compost and manure slice.

  - ref: "B1"
    asks: "Do you apply raw animal manure (including any compost, compost tea, or vermicompost containing manure that does not meet the section A production requirements), and/or do you have planned grazing of animals in your organic crop production areas? No (stop, form complete) / Yes, raw animal manure is applied / Yes, my operation uses planned grazing of animals in organic crop production areas."
    status: covered
    trazo:
      questions: [g4_1_compost_manure.materials_applied]
      prints: "modules/G4_1.pdf §B; narrative § 205.203(c)(1)"
    # Re-read 2026-11-02 by the compost and manure slice.

  - ref: "B2"
    asks: "How do you meet the following restriction on the use of raw manure, either applied or from planned grazing? Mark all that apply. Used for crops that are not for human consumption / incorporated at least 120 days before harvest of crops whose edible portions contact soil or soil particles / incorporated at least 90 days before harvest of crops whose edible portions do not contact soil or soil particles."
    status: partial
    severity: P2
    trazo:
      questions: [g4_1_compost_manure.raw_manure_interval_rule, g4_1_compost_manure.raw_manure_timing_detail]
      prints: "modules/G4_1.pdf §B; narrative § 205.203(c)(1)"
    gap: "Several rules can now be stated at once (a checkbox group since 2026.11.02). Still open: the packet's crop classifier reads `CropType.has_soil_contact`, which is True for blueberries, caneberries, kiwi and hops, so the record validation allows only a 120-day interval for them and the packet cites § 205.203(c)(1)(ii) where (iii) applies."
    fix: "Set `has_soil_contact=False` for the elevated berry, cane, kiwi and hop crop types (seeder plus data migration), so write validation, the export classifier and the interval checks agree."
    # Re-read 2026-11-02 after review of back #254: the crop classifier fix was withdrawn.

  - ref: "B3"
    asks: "How do you ensure that manure does not contaminate wells, rivers or streams, lakes or ponds?"
    status: covered
    trazo:
      questions: [g4_1_compost_manure.raw_manure_water_risk]
      prints: "modules/G4_1.pdf §B; narrative § 205.203(c)"
    # Re-read 2026-11-02 by the compost and manure slice.
