form:
  code: ''
  title: CCOF Certification Contract
  document_id: ORGB06
  revision: V2, R6, 09/29/2026
  url: https://www.ccof.org/resource/ccof-certification-contract/
  retrieved: 2026-10-24
  register_status: complete
  source_sha256: 659c922abe49402c8ba757c44f40e5c0d379928ae65ff53122fed837cd7ccfbc
  nop_cites:
  - § 205.401
  guide_trigger: Item 1 — apply for CCOF organic certification for crop production
  required_of_every_grower: true
  filed_with_agent: true
  requires_signature: true
  accepted_format: agent_form
  format_source: >-
    ORGB06 section G, "The signed agreement": the operation signs CCOF's own contract (register row G).
  trazo_module: certification_contract
items:
- ref: Intro (fee payment)
  asks: '$350 nonrefundable application fee due with the application: credit card on page 6 / another form
    of payment / a discount code.'
  status: out_of_scope
  scope_basis: payment_data
  reason: Payment for CCOF's own application fee.

- ref: Intro (how did you hear)
  asks: How did you hear about CCOF?
  status: out_of_scope
  scope_basis: agent_administration
  reason: CCOF's own marketing question; nothing about the organic system.

- ref: A1
  asks: Registered Legal Business Name; Legal 'Doing Business As' (DBA), if applicable; Phone; Website
    (optional); Public-Facing Email (optional) — displayed on the Organic Integrity Database and NOP certificate
    only, and does not receive CCOF communication.
  status: covered
  trazo:
    questions:
    - certification_contract.legally_registered
    - certification_contract.uses_dba
    - certification_contract.dba_names
    - certification_contract.public_contact_shared
    - certification_contract.public_phone
    - certification_contract.public_email
    - certification_contract.public_website
    models:
    - company.Company.name
    - company.Company.tradename
    - company.Establishment.phone
    prints: >-
      00-cover.pdf (legal name, "Trade name (DBA)", phone); modules/operation_profile.pdf §D (DBAs, and
      the phone, email and website the operation lets the agent publish)
  note: >-
    Closed 2026-11-13. The public-facing email CCOF lists on the OID and the certificate is asked as a
    choice of what may be published, then the value, so a blank reads as private, not missing.
- ref: A2
  asks: 'Registered Legal Business Address: address, city, state/province, zip/postal code, country.'
  status: covered
  trazo:
    questions:
    - certification_contract.legal_address_is
    - certification_contract.legal_address_street
    - certification_contract.legal_address_city
    - certification_contract.legal_address_state
    - certification_contract.legal_address_zip
    - certification_contract.legal_address_country
    models:
    - company.Establishment.address
    prints: >-
      modules/operation_profile.pdf §D ("The farm's physical address", or the address as five fields);
      00-cover.pdf prints the physical address
  note: >-
    Closed 2026-11-13. Asked as "same as the physical address" first, then street, city, state, ZIP and
    country in the form's own boxes.
- ref: A3
  asks: Explain whether the DBA listed above appears in your audit trail records and under what circumstances
    (e.g., only for certain products or markets, or for all); describe whether the DBA is registered at
    the state or local level.
  status: covered
  trazo:
    questions:
    - certification_contract.uses_dba
    - certification_contract.dba_names
    - certification_contract.dba_registration
    - certification_contract.dba_use
    - certification_contract.dba_use_detail
    prints: >-
      modules/operation_profile.pdf §D
  note: >-
    Closed 2026-11-13. Where each DBA is registered (state, county or city, not registered) and whether
    it appears in the records for all products and markets, some (which), or none.
- ref: A4
  asks: Federal Tax ID#; legal structure — Sole Proprietorship (owner's name) / Partnership (owners' names)
    / Corporation or LLC (state of incorporation); name of owners or officers and their titles.
  status: partial
  severity: P3
  trazo:
    questions:
    - certification_contract.legal_structure
    - certification_contract.legal_structure_other
    - certification_contract.state_of_incorporation
    - certification_contract.operation_contacts
    models:
    - company.Company.fiscal_id
    - certifications.models.OperationContact
    prints: >-
      modules/operation_profile.pdf §D (structure, state of incorporation); §A (owners and officers)
  gap: >-
    Only the Federal Tax ID remains. `Company.fiscal_id` exists and, as before, never prints: it is PII with no
    inspection use, kept out of a packet that also leaves the certifier's hands.
  fix: >-
    Leave the Tax ID to the agent's own signed form; reopen only if CCOF reviewers ask for it in the
    packet.
- ref: A5
  asks: Physical Location of Your Operation (required if different from your registered legal business
    address) — where organic production occurs or records are kept; checkbox for 'identical to registered
    legal business address above'; address, city, state/province, zip/postal code, country.
  status: covered
  trazo:
    where: '00-cover.pdf: Address'
    models:
    - company.Establishment.address
    - company.Establishment.city
    - company.Establishment.state
    - company.Establishment.zip_code
    prints: 00-cover.pdf (Physical location)
- ref: A6
  asks: 'Mailing Address (required if different from your registered legal business address or physical
    address): address, city, state/province, zip/postal code, country.'
  status: covered
  trazo:
    questions:
    - certification_contract.mailing_address_is
    - certification_contract.mailing_address_street
    - certification_contract.mailing_address_city
    - certification_contract.mailing_address_state
    - certification_contract.mailing_address_zip
    - certification_contract.mailing_address_country
    prints: >-
      modules/operation_profile.pdf §D
  note: >-
    Closed 2026-11-13. Same as the legal address, same as the physical address, or its own five fields:
    CCOF's two "identical to" boxes plus the address.
- ref: A7
  asks: 'Billing Address (optional): address, city, state/province, zip/postal code, country.'
  optional: true
  status: covered
  trazo:
    questions:
    - certification_contract.billing_address_is
    - certification_contract.billing_address_street
    - certification_contract.billing_address_city
    - certification_contract.billing_address_state
    - certification_contract.billing_address_zip
    - certification_contract.billing_address_country
    prints: >-
      modules/operation_profile.pdf §D
  note: >-
    Closed 2026-11-13. Same as the mailing address, or its own five fields.
- ref: A8
  asks: 'Preferred language: English or Español.'
  status: out_of_scope
  scope_basis: agent_administration
  reason: >-
    Sets the language CCOF itself writes in, like A9 (how it writes) and OTCO O1 A-4: a CCOF account setting, not a
    fact about the operation's organic system that a packet or a certifier review needs.
- ref: A9
  asks: 'Preferred method of written communication: Email or Postal Mail.'
  status: out_of_scope
  scope_basis: agent_administration
  reason: Sets how CCOF itself contacts the operation — a CCOF account setting, not a fact about the operation's
    organic system that a packet or certifier review needs.
- ref: B1
  asks: Help us understand your organic operation. Describe or attach a summary description of your organic
    business or plans.
  status: partial
  trazo:
    questions:
    - certification_contract.contract_notes
    prints: 00-cover.pdf; 01-organic-system-plan.pdf (§ 205.201(a)(1)-(6) narrative)
  severity: P2
  gap: 'CCOF asks for a summary description of the organic business or its plans. `certification_contract.contract_notes`
    asks something else — legal name, business structure and name differences between the certificate
    and sales documents — and compiles as "Legal identity and naming: …" into § 205.201(a)(6). No question
    in any of the 19 modules asks for a business summary. (downgraded from `covered` 2026-08-28 by an
    adversarial re-read of every covered row.)'
  fix: Add an `organic_business_summary` textarea to the certification-contract module, compiling into
    (a)(6) beside the naming answer.
- ref: B2
  asks: How frequently do you review your entire Organic System Plan to verify it is effectively implemented
    and accurately reflects your practices? Annually / Quarterly / Monthly / Other (describe).
  status: partial
  severity: P3
  trazo:
    questions:
    - g2_0_fraud_prevention.osp_review_frequency
    - g2_0_fraud_prevention.osp_review_frequency_other
    prints: modules/G2_0.pdf §C
  gap: Trazo's options are {annually, on_change, before_inspection, other} — two of CCOF's four choices,
    quarterly and monthly, are absent.
  fix: Add `quarterly` and `monthly` options to `osp_review_frequency`.
- ref: C1
  asks: 'Primary Contact: name, title, phone, email — the person listed in CCOF''s online directory and
    the NOP Organic Integrity Database, knowledgeable about the operation and the OSP, and authorized
    to act on its behalf. All CCOF communication is sent to this contact.'
  status: covered
  trazo:
    questions:
    - certification_contract.operation_contacts
    models:
    - certifications.models.OperationContact.is_primary_contact
    - company.models.Establishment.contact_person
    prints: >-
      modules/operation_profile.pdf §A (the people table)
  note: >-
    Since 2026-11-12 the Operation module's page A lists the people the operation names to its agent
    (`OperationContact`), each with name, title, phone and email and the roles they hold; the table
    prints in §A, a blank cell as 'Not stated'. The primary contact is the row so marked, with title,
    phone and email. The cover's responsible person line is unchanged.
- ref: C2
  asks: 'Additional Contacts: list everyone at your operation authorized to conduct inspections, meet
    with inspectors, modify the OSP, or otherwise act on behalf of the operation — name/title, phone,
    email — with a CC checkbox for those who should receive all communication along with the primary contact.'
  status: covered
  trazo:
    questions:
    - certification_contract.operation_contacts
    models:
    - certifications.models.OperationContact.is_authorized_representative
    prints: >-
      modules/operation_profile.pdf §A (the people table)
  note: >-
    Since 2026-11-12 the Operation module's page A lists the people the operation names to its agent
    (`OperationContact`), each with name, title, phone and email and the roles they hold; the table
    prints in §A, a blank cell as 'Not stated'. Everyone authorized to conduct inspections, meet
    inspectors, modify the OSP or act for the operation is listed with that role.
- ref: D1
  asks: What types of products does this operation grow, produce, process, handle, or sell? Both organic
    and nonorganic product(s) / Organic product(s) only / Organic and transitional product(s).
  status: covered
  trazo:
    questions:
    - g6_0_production.split_operation
    - g6_0_production.nonorganic_product_source
    - g6_0_production.nonorganic_product_source_other
    prints: '00-cover.pdf: "Organic and non-organic product", Both / Organic only, with where the non-organic
      product comes from (buffer-zone crop, parcels not certified, land in transition, bought in, other)'
  # Closed 2026-11-06. § 205.2 makes any operation producing non-organic product a split operation, buffer crop
  # sold as non-organic included, so the earlier note that a buffer-only farm was "pushed into" a false Yes was
  # wrong; the cover now prints the declaration with its source, and "land in transition" is how CCOF's third
  # option is read.
- ref: D2
  asks: 'Please indicate any markets you export or plan to export to, directly or indirectly (as an ingredient
    or through brokers/traders, etc.): Canada, Europe/UK, Japan, Korea, Taiwan, Switzerland, Mexico, Other.'
  status: covered
  trazo:
    questions:
    - g8_0_record_keeping.import_export_activity
    - g8_0_record_keeping.export_destinations
    - g8_0_record_keeping.export_certificate_types
    prints: modules/G8_0.pdf §C
  note: Reopened and closed 2026-09-30 (OSP alignment audit, T17). CCOF asks for markets exported to directly
    or indirectly, now or in plans. `import_export_activity` now offers indirect export and asks about plans;
    the old 'Neither' option is retired, and a plan holding only it reads as unconfirmed until the operator
    answers again.
- ref: D3
  asks: By what date do you anticipate the need for certification?
  status: out_of_scope
  scope_basis: agent_administration
  reason: A one-time initial-application timing question; Trazo's ICP is already-certified operations
    doing an annual renewal, not first-time applicants.
- ref: D4
  asks: Is this operation currently certified organic? No / Yes — attach certificate and completed Certification
    Transfer Form.
  status: covered
  trazo:
    where: >-
      modules/operation_profile.pdf: B. Certification history, certified today by another agency;
      00-cover.pdf: Certificate
    questions:
    - certification_contract.history_ever_certified
    - certification_contract.history_certified_elsewhere_now
    - certification_contract.history_current_certificate_upload
    models:
    - certifications.Certification
    prints: >-
      modules/operation_profile.pdf §B;
      attachments/certification_contract/history_current_certificate_upload/; 00-cover.pdf (the
      certificate of record)
  note: >-
    Closed 2026-11-13. An operation switching to CCOF answers yes and attaches the other agency's
    certificate with CCOF's Certification Transfer Form (CCOF's own form, filled on CCOF's copy); one
    CCOF already certifies answers no, and its certificate of record prints on the cover.
- ref: D5
  asks: Has this operation or any responsibly connected person with this operation ever applied for, or been
    granted, organic certification? No, skip to section E / Yes, complete this section and provide the name
    of the certifier.
  status: covered
  trazo:
    where: 'modules/operation_profile.pdf: B. Certification history'
    questions:
    - certification_contract.history_ever_certified
    - certification_contract.history_prior_agents
    - certification_contract.history_denied
    - certification_contract.history_withdrew_outstanding
    prints: modules/operation_profile.pdf §B
  note: Closed 2026-11-09 by the Operation profile's certification history page (B) and its follow-up page (C, shown on any yes). One answer covers the operation and everyone responsibly connected to it, as the form asks it.
    "Applied for" is answered by the denied and withdrawn questions, which show whether or not the operation
    was ever certified.
- ref: D5a
  asks: Was the operation's or any responsibly connected person with this operation's certification or the
    certification of fields or products ever suspended or revoked? Yes / No
  status: covered
  trazo:
    where: 'modules/operation_profile.pdf: B. Certification history, suspended and revoked'
    questions:
    - certification_contract.history_suspended
    - certification_contract.history_revoked
    prints: modules/operation_profile.pdf §B
  note: Closed 2026-11-09 by the Operation profile's certification history page (B) and its follow-up page (C, shown on any yes). Suspension and revocation are asked separately because OTCO asks them separately (D-2, D-3).
- ref: D5b
  asks: Did the operation surrender certification with outstanding non-compliances or conditions? Yes / No
  status: covered
  trazo:
    where: 'modules/operation_profile.pdf: B. Certification history, surrendered with findings or conditions unresolved'
    questions:
    - certification_contract.history_surrendered_outstanding
    prints: modules/operation_profile.pdf §B
  note: Closed 2026-11-09 by the Operation profile's certification history page (B) and its follow-up page (C, shown on any yes).
- ref: D5c
  asks: Was the operation's application for organic certification ever issued a denial? Yes / No
  status: covered
  trazo:
    where: 'modules/operation_profile.pdf: B. Certification history, application denied'
    questions:
    - certification_contract.history_denied
    prints: modules/operation_profile.pdf §B
  note: Closed 2026-11-09 by the Operation profile's certification history page (B) and its follow-up page (C, shown on any yes).
- ref: D5d
  asks: Did the operation withdraw its application for certification with outstanding non-compliances? Yes
    / No
  status: covered
  trazo:
    where: 'modules/operation_profile.pdf: B. Certification history, application withdrawn with findings unresolved'
    questions:
    - certification_contract.history_withdrew_outstanding
    prints: modules/operation_profile.pdf §B
  note: Closed 2026-11-09 by the Operation profile's certification history page (B) and its follow-up page (C, shown on any yes).
- ref: D6
  asks: 'If you answered yes to a, b, c, or d above: list the years and organic certification agencies,
    attach a copy of all relevant letters, and describe all corrective actions taken.'
  status: covered
  trazo:
    where: "modules/operation_profile.pdf: C. What happened (years, agencies, corrective actions; the letters attached under attachments/certification_contract/); notices from the current agent also print on 02s-renewal-status-and-routing.pdf with their letters under inspections/"
    questions:
    - certification_contract.history_prior_agents
    - certification_contract.history_adverse_explanation
    - certification_contract.history_letters_upload
    models:
    - certifications.models.CertifierNotice.notice_document
    - certifications.models.CertifierNotice.response_text
    - certifications.models.CertifierNoticeResponseDocument.document
    prints: modules/operation_profile.pdf §C; letters under attachments/certification_contract/; 02s-renewal-status-and-routing.pdf, certifier inspections and notices
  note: Closed 2026-11-09 by the Operation profile's certification history page (B) and its follow-up page (C, shown on any yes). Page C opens on any yes to D5a to D5d, so the letters D6 asks for are tied to the events
    that make it apply. The operation's own record of its current agent's notices (2026-11-08) still prints on
    02s with those letters.
- ref: E1
  asks: 'CDFA California Organic Program Registration number (grower, post-harvest handling, produce broker),
    e.g. 12-123456 — required for operations producing organic product in California prior to first sale.
    Checkboxes: not applicable, not based in California / not applicable, retail or restaurant.'
  status: covered
  trazo:
    where: '00-cover.pdf: California organic registration (CDFA)'
    models:
    - certifications.StateOrganicRegistration.registration_number
    - certifications.StateOrganicRegistration.status
    - certifications.StateOrganicRegistration.renewal_date
    prints: '00-cover.pdf: "California organic registration (CDFA)", the number with its status, county and
      renewal date; none on file, a missing number or a lapsed registration prints a [REVIEW] line'
  # Closed 2026-11-06. Food & Agr. Code § 46013.1(a): register "before the first sale"; an exempt operation is
  # "only exempt from certification ... and [is] still required to be registered". Not-applicable boxes: the
  # line is printed only for a California operation or one with a registration on file.
- ref: E2
  asks: CDPH Department of Health Services Organic Registration number (processing), e.g. 12345.
  status: not_covered
  severity: P3
  trazo:
    prints: —
  gap: '`StateOrganicRegistration`''s own docstring explicitly scopes out CDPH; no CDPH field exists anywhere.
    CDPH applies to on-farm processing, outside the ICP''s wholesale-orchard profile.'
  fix: Add a CDPH registration field only if a pilot farm does on-farm processing; low priority.
- ref: F1
  asks: What is your current or expected total value of certified organic production/sales/services (gross,
    next 12 months)?
  status: out_of_scope
  scope_basis: agent_administration
  reason: Sets CCOF's own annual fee schedule, not a fact about the operation's organic system. `StateOrganicRegistration.prior_year_organic_gross_sales`
    and `SalesRecord.sale_amount` could estimate line 1 as a convenience, but computing CCOF's fee basis is
    not Trazo's job.
- ref: F1a
  asks: 'If you are a Farm or Livestock operation: current or expected cost of certified organic product purchased
    (seed, feed, transplants) and service fees charged by certified organic co-processors or custom grazing
    (next 12 months), subtracted from line 1 to determine the annual certification fee.'
  status: out_of_scope
  scope_basis: agent_administration
  reason: An input to CCOF's own fee calculation, the same as F1.
- ref: F1b
  asks: 'If you are a Handler, Processor, Private Label Brand Owner, Broker, Importer or other non-farm business:
    current or expected cost of certified organic ingredients/products purchased and co-processor service fees
    (next 12 months).'
  status: out_of_scope
  scope_basis: agent_administration
  reason: An input to CCOF's own fee calculation, the same as F1.
- ref: F1c
  asks: 'If you are a Retail or Restaurant operation: current or expected number of stores (next 12 months).'
  status: out_of_scope
  scope_basis: agent_administration
  reason: An input to CCOF's own fee calculation, the same as F1.
- ref: G1
  kind: instruction
  asks: 'For operations and any responsibly connected person seeking NOP certification: comply with all State
    and applicable organic production and handling regulations (7 CFR Part 205 and the NOP Handbook).'
- ref: G2
  kind: instruction
  asks: 'For operations seeking COR certification: comply with all Province and applicable organic regulations
    issued by the Canada Food Inspection Agency.'
- ref: G3
  kind: instruction
  asks: 'For operations seeking CCOF GMA: comply with the requirements set forth in the CCOF GMA Manual.'
- ref: G4
  kind: instruction
  asks: 'For all operations: comply with and strictly adhere to all CCOF standards, procedures and policies
    set forth in the CCOF Manuals, including the following.'
- ref: G4a
  kind: instruction
  asks: Establishing, implementing, and updating annually an Organic System Plan that will be submitted to
    CCOF.
  note: 'Kept as a record: the operation''s annual updates are `OSPAnnualUpdate` rows and print as 02-annual-update.pdf.'
- ref: G4b
  kind: instruction
  asks: Permitting on-site inspections at least once per calendar year with complete access to the production
    or handling aspects of the operation, announced or unannounced.
- ref: G4c
  kind: instruction
  asks: Maintaining all records applicable to the organic operation for not less than five (5) years beyond
    their creation.
- ref: G4d
  kind: instruction
  asks: Allowing authorized representatives of CCOF, an accreditation authority or a government entity with
    jurisdiction access to these records under normal business hours for review and copying.
- ref: G4e
  kind: instruction
  asks: Understanding CCOF may use subcontractors for inspecting, testing and other technical services.
- ref: G4f
  kind: instruction
  asks: Submitting to CCOF any applicable fees as described on the most current fee schedule. Failure to pay
    fees as described in the Certification Services Program Manual may result in termination of this contract
    and surrender of certification.
- ref: G4g
  kind: instruction
  asks: Immediately notifying CCOF concerning any application, including drift, of a prohibited substance to
    any field, production unit, site, facility, livestock, or product that is part of an operation.
  note: 'Kept as a record: notifications are `OSPChangeNotification` rows and print as 03-change-notifications.pdf.'
- ref: G4h
  kind: instruction
  asks: Immediately notifying CCOF of any change in the certified operation or portion of it that may affect
    its compliance.
  note: 'Kept as a record: notifications are `OSPChangeNotification` rows and print as 03-change-notifications.pdf.'
- ref: G4i
  kind: instruction
  asks: Using the CCOF name and seal(s) only in accordance with CCOF standards and ceasing all use upon notice
    by CCOF.
- ref: G4j
  kind: instruction
  asks: Destroying or returning to CCOF all packaging and certificate(s) upon notice from CCOF.
- ref: G4k
  kind: instruction
  asks: Understanding that the use of the CCOF name and seal must be in accordance with the CCOF standards.
- ref: G4l
  kind: instruction
  asks: Authorizing CCOF to list certified parcel crops, products, services, and acreage on the certificate
    and in the CCOF Directory.
- ref: G4m
  kind: instruction
  asks: Immediately ceasing all claims of CCOF certification, and destroying or returning certificates, labeling
    and marketing material referring to CCOF, if the operation withdraws or its certification is suspended
    or revoked.
- ref: G4n
  kind: instruction
  asks: Agreeing to be legally bound by the paragraphs "Consent to Electronic Transmission", "Governing Law",
    "Consent to Jurisdiction", "Indemnification" and "Limit of Liability" in the CCOF Certification Services
    Program Manual.
- ref: G4o
  kind: instruction
  asks: Agreeing to be legally bound by the "Standards of Behavior" in the CCOF Certification Services Program
    Manual.
- ref: G (signature)
  asks: Signature of the owner or legally authorized corporate representative (name/title, signature, date),
    acknowledging the general requirements above, authorizing the listed persons to act for the company, and
    attesting that all information in the application is true and accurate.
  status: covered
  trazo:
    where: >-
      attachments/certification_contract/contract_upload/ (the signed contract);
      modules/operation_profile.pdf: A. Contract on file, who signed it and when
    questions:
    - certification_contract.contract_upload
    - certification_contract.contract_signed_by
    - certification_contract.contract_signed_on
    models:
    - certifications.OSPAnnualUpdate
    - certifications.OSPChangeNotification
    prints: >-
      attachments/certification_contract/contract_upload/; modules/operation_profile.pdf §A (name and
      title, date); 02-annual-update.pdf; 03-change-notifications.pdf
  note: >-
    Closed 2026-11-13. Trazo signs nothing: the signature is on CCOF's own contract, attached, and the
    profile prints the signer's name, title and date. The annual update and the change notices the
    clauses require (G4a, G4g, G4h) print as documents 02 and 03.
- ref: H
  asks: 'Credit or Debit Card Payment Information: card type, amount, billing address, name on card, card number,
    security number, expiration date, signature. CCOF applies a 3% surcharge to credit card transactions;
    no surcharge on debit cards.'
  status: out_of_scope
  scope_basis: payment_data
  reason: Payment-card data collection for CCOF's own invoicing. Trazo has no reason to store cardholder
    data, and it has nothing to do with the operation's organic system.
- ref: I1
  asks: 'Public Profile Information (optional): online presence (Facebook, LinkedIn, Instagram, Pinterest,
    X, YouTube).'
  status: out_of_scope
  scope_basis: optional_marketing
  optional: true
  reason: Optional directory and marketing information for CCOF's own member listing; nothing about the organic
    system.
- ref: I2
  asks: 'Public Profile Information (optional): sales methods (CSA, copacking services, export, farmers'' market,
    ingredients, internet, produce stand, retail, tasting room/winery, U-pick, wholesale).'
  status: out_of_scope
  scope_basis: optional_marketing
  optional: true
  reason: Optional directory and marketing information for CCOF's own member listing; nothing about the organic
    system.
- ref: I3
  asks: 'Public Profile Information (optional): apprenticeship options offered, and their terms (board, internships,
    wage, other).'
  status: out_of_scope
