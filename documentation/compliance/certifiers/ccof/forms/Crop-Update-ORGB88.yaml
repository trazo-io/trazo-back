# CCOF — Crop Update (ORGB88; NOPB88 until October 2026). Source: https://www.ccof.org/resource/crop-update/,
# footer "ORGB88, V2, R1, 12/03/2024", retrieved 2026-10-24 (first registered 2026-10-01 as NOPB88).
#
# Registered 2026-10-01 (OSP alignment audit, Phase 3, T20). It was a `gap` in ../scope.yaml:
# "Trazo does not generate this form". It still does not: the operation files it with CCOF. What
# changed is that a renewing CCOF operation is now routed to it from the renewal supplement (02s),
# with the packet locations holding the parcels, crops and acreage it asks for.
#
# The form numbers nothing. Its items are two header fields, three instruction lines and one table,
# all added to the inventory by hand with a reason (see ../inventory/Crop-Update-ORGB88.yaml).
form:
  code: ''
  title: Crop Update
  document_id: ORGB88
  revision: ORGB88, V2, R1, 12/03/2024
  url: https://www.ccof.org/resource/crop-update/
  retrieved: 2026-10-24
  nop_cites:
  - § 205.201
  - § 205.400(f)(2)
  guide_trigger: >-
    Parcel Application header: updating the crops on a parcel already on the Client Profile. Filed
    when the crops or acreage on a certified parcel change for the coming 12 months.
  required_of_every_grower: false
  filed_with_agent: true
  accepted_format: agent_form
  format_source: >-
    ORGB88 header: "Send completed forms to inbox@ccof.org"; "An Excel Version of this document is
    available online or by contacting CCOF." No signature line is printed, so none is claimed.
  renewal_role: crop_update
  register_status: complete
  source_sha256: 4ab32d8fd927b4e1ddcb91d93d586a0eba915c68978d822eb5c9ebc49a4654ca
  trazo_module: [parcel_application]
items:
- ref: Operation Name
  asks: Operation Name.
  status: covered
  trazo:
    models:
    - company.Company.name
    prints: '00-cover.pdf ("Legal name", "Operation")'
- ref: Date
  asks: Date (the date the update is filed with CCOF).
  status: not_covered
  severity: P3
  trazo:
    prints: —
  gap: The date of a filing Trazo does not make. The parcel data it summarises is dated in the packet, the form
    itself is not.
  fix: None in Trazo while the form is filed with CCOF; dated by the operation when it files.
- ref: Instructions (each certified parcel)
  kind: instruction
  asks: For each certified parcel, list crops and corresponding acreage. If your crops change frequently, you may
    include all crop rotations planned for the next 12 months.
- ref: Instructions (Client Profile Addendum)
  kind: instruction
  asks: By submitting this form, you are confirming that you authorize CCOF to update your Client Profile Addendum,
    which may include removal of organic products you are no longer producing or handling.
- ref: Instructions (only listed crops)
  kind: instruction
  asks: Only crops listed on your Client Profile Addendum, and harvested from parcels listed on your Client Profile
    Addendum, may be sold or represented as organic.
- ref: Instructions (Excel version)
  kind: instruction
  asks: An Excel Version of this document is available online or by contacting CCOF.
- ref: 'Table (CCOF Parcel #, crops, acres)'
  asks: 'Table: CCOF Parcel # / Crop(s) (current or planned within the next 12 months) / Acres.'
  status: partial
  severity: P2
  trazo:
    questions:
    - parcel_application.parcel_name
    - parcel_application.prior_certificate_site_number
    - parcel_application.crop_history
    models:
    - product.Parcel.area
    - product.ParcelCropHistory
    prints: '02s-renewal-status-and-routing.pdf ("Crop Update (ORGB88): parcels, crops and acres")'
  gap: 02s prints one row per parcel the parcel application routes here (`ccof_crop_update`), with the CCOF parcel
    number the operator stated, the parcel's acreage and its land history for this calendar year and the next
    (`renewal_land_table`, reading `land_history_rows`), so the table can be copied across. Still open, and said on
    the page - the crops PLANNED for the next 12 months are not a separate answer, so next year's crops are only
    those already recorded for it; acres are the parcel's total, as no acreage is recorded per crop; and the name
    is the parcel's name in Trazo, not checked against CCOF's Client Profile.
  fix: A planned-crops answer per parcel, distinct from the land history, then print it in this table.
