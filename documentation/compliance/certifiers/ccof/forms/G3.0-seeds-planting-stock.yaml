form:
  code: "G3.0"
  title: "Seeds & Planting Stock"
  document_id: "ORGB47"
  revision: "V1, R8, 12/14/2021"
  url: "https://www.ccof.org/resource/g3-0-seeds-planting-stock/"
  retrieved: 2026-10-24
  nop_cites: ["§ 205.2", "§ 205.204", "§ 205.105"]
  guide_trigger: "Item 2 — use seed, annual seedlings (transplants), or planting stock"
  trazo_module: [g3_0_seeds, g3_1_seedlings, g3_2_planting_stock]
  register_status: complete
  source_sha256: c376b64195df7c27a20ac76c7ead8ef5ac9061819a7ca7ddf5bd66e2d6156fb2

items:
  - ref: A (not applicable)
    asks: Not applicable. No seed, annual seedlings, or planting stock used or planned for use at my organic
      operation. Stop, do not complete this form.
    status: covered
    trazo:
      where: 'modules/G3_0.pdf: the Not applicable line in the header, with who attested it and when'
      prints: modules/G3_0.pdf header — 'Not applicable (attested by … on …)'

  - ref: "A1"
    asks: "Seeds — mark all that apply: None used / Organic (untreated) / Organic (with treatment) / Non-organic (untreated) / Non-organic (with treatment). 'With treatment' means fungicide/insecticide treated or carrying other materials at planting (inoculants, pelleting, coating/priming/encrusting)."
    status: covered
    trazo:
      questions: [g3_0_seeds.seeds_used]
      prints: "modules/G3_0.pdf §A; narrative § 205.204"
    # Closed 2026-11-17 by the seeds and planting stock slice: a transplant is not seed, so the Seeds suggestion reads
    # seed planting records only, and a record of a tree, vine or berry plant, or one naming a rootstock, now suggests
    # Planting stock instead (osp_prefill.is_planting_stock_record).

  - ref: "A2"
    asks: "Annual seedlings (transplants) — None used / Purchase certified organic seedlings (attach organic certificate for each supplier) / Produce own organic seedlings (describe in G3.1 Container & Greenhouse/Shadehouse Production)."
    status: covered
    trazo:
      questions: [g3_0_seeds.seedlings_used, g3_1_seedlings.seedlings_description, g3_1_seedlings.seedling_suppliers_panel]
      prints: "modules/G3_0.pdf §A; modules/G3_0a.pdf §A supplier panel (each supplier on a transplant purchase, its certificate state); suppliers/ in the ZIP"
    # Closed 2026-11-05 by the supplier register slice: each supplier named on a transplant purchase
    # prints with whether a copy covers its latest purchase, and that copy rides under suppliers/.
    # The coverage page holds the row open until every such supplier has a covering copy.

  - ref: "A3"
    asks: "Planting stock — None used (skip to section B) / Organic (skip to section B) / Non-organic (complete this section)."
    status: covered
    trazo:
      questions: [g3_0_seeds.planting_stock_used, g3_2_planting_stock.stock_organic_status]
      prints: "modules/G3_0.pdf §A; modules/G3_0b.pdf §A; a [REVIEW] line on both when the answers disagree"
    # Closed 2026-11-17 by the seeds and planting stock slice: the two answers are read against each other
    # (seed_stock_review). Where G3.0b names a status G3.0 leaves out, or describes stock established this period
    # beside G3.0's None used or Established perennials only, both module PDFs print a [REVIEW] line and the plan
    # review lists it.

  - ref: "A3a"
    asks: "Do you use non-organic planting stock to produce an organic crop (for example, plant non-organic stock in an organic system to grow fruit or nuts for harvest and sale as organic)? No (skip to 3b) / Yes (complete this section)."
    status: covered
    trazo:
      questions: [g3_2_planting_stock.nonorganic_stock_for_organic_crop]
      prints: "modules/G3_0b.pdf §B"
    # Closed 2026-10-31 by the seed and planting stock slice.

  - ref: "A3a(i)"
    asks: "For non-organic planting stock used to produce an organic crop, explain how new vegetative, flowering and fruiting growth occurs under organic management before the first organic harvest: no crop harvested for organic sale during the first season / pruning-removal of non-organic plant material / harvest and sell as non-organic (attach a description) / other (describe)."
    status: covered
    trazo:
      questions: [g3_2_planting_stock.first_organic_harvest_handling, g3_2_planting_stock.first_organic_harvest_handling_other]
      prints: "modules/G3_0b.pdf §B"
    # Closed 2026-10-31 by the seed and planting stock slice.
  - ref: A3b
    asks: Do you use or grow out non-organic planting stock to produce planting stock to be sold as organic (whole
      plants or plant propagation material)? No (skip to section B) / Yes (complete this section).
    status: covered
    trazo:
      questions:
      - g3_2_planting_stock.stock_sold_as_organic
      - g3_2_planting_stock.resold_stock_bought_nonorganic
      prints: modules/G3_0b.pdf §C
    # 2026-11-17: resold_stock_bought_nonorganic is the question's own fact (non-organic stock grown out and sold as
    # organic), asked of an operation that sells planting stock as organic.
  - ref: A3b(i)
    asks: Is the non-organic planting stock maintained under a system of organic management for at least one
      year, prior to sale of the planting stock as organic? Yes, describe in G3.1 Container & Greenhouse/Shadehouse
      Production.
    status: covered
    trazo:
      questions: [g3_2_planting_stock.organic_management_start_date, g3_2_planting_stock.twelve_month_attestation, g3_1_container_greenhouse.structure_production_types]
      prints: "modules/G3_0b.pdf §C; modules/G3_1.pdf §A; a [REVIEW] line under a G3.1 not-applicable attestation when G3.0b says planting stock is sold as organic"
    # Closed 2026-11-17 by the seeds and planting stock slice: G3.1 Container and Greenhouse Production now exists
    # (2026-11-09) and receives the description CCOF sends there (planting stock or nursery production in pots, for
    # sale or on-farm use); structure_production prints the [REVIEW] line when G3.1 is marked not applicable beside
    # stock sold as organic.

  - ref: "B1"
    asks: "Before using non-organic seed and/or planting stock, do you evaluate whether an equivalent organic variety is available in the form, quality, or quantity needed? Not applicable, my operation uses all organic seed and/or planting stock at this time (skip to section D) / Yes (complete this section)."
    status: covered
    trazo:
      questions: [g3_0_seeds.ca_search_before_use]
      prints: "modules/G3_0.pdf §B; narrative § 205.204(a)(1)"
    note: "Closed 2026-11-08. G3.0 page B opens on non-organic seed OR non-organic planting stock (`ModulePage.visible_when_any`, content 2026.11.25), so an orchard planting non-organic nursery stock with organic or no seed is asked it. Its seed-only questions (characteristics, search method, search records) keep the seed gate. `all_organic` is retired (it contradicted the answer that opened the page; a stored one reads as given and counts unanswered), and `no_documented_search` says plainly that no search is documented, with a [REVIEW] citing § 205.204(a)(1). CCOF's Not applicable box is the page not opening: a plan with only organic seed and stock reads
      this row as not applicable, with those answers as the evidence."

  - ref: "B1a"
    asks: "For all seed and/or planting stock used, what general characteristics (form, quality, quantity) do you require to evaluate commercial availability? Available as untreated seed / available with allowed treatment (pelleting, inoculant) / available as bare-root nursery stock / germination rate / drought tolerance / pest or disease resistance / regional adaptation / greater crop yield / bulk quantities available / small quantities available / other (describe)."
    status: covered
    trazo:
      questions: [g3_0_seeds.seed_required_characteristics, g3_0_seeds.seed_required_characteristics_other, g3_2_planting_stock.nonorganic_stock_justification, g3_2_planting_stock.nonorganic_stock_justification_other]
      prints: "modules/G3_0.pdf §B (seed); modules/G3_0b.pdf §B (planting stock)"
    # Closed 2026-10-31 by the seed and planting stock slice.

  - ref: "B2"
    asks: "How do you determine whether an equivalent organic variety is available in the form, quality, and quantity needed? Check with at least three suppliers known to offer organic seed and/or planting stock / another entity searches on my behalf (e.g. crops grown on contract, seed broker/distributor) and checks with at least three suppliers / other (describe)."
    status: covered
    trazo:
      questions: [g3_0_seeds.ca_search_method, g3_0_seeds.ca_search_method_other, g3_2_planting_stock.stock_search_method]
      prints: "modules/G3_0.pdf §B (seed); modules/G3_0b.pdf §B (planting stock)"
    # Closed 2026-10-31 by the seed and planting stock slice.

  - ref: "B3"
    asks: "What type of commercial availability records do you keep? Records must document the crop, supplier names, site-specific requirements, and the outcome. I maintain records of my searches / I maintain documentation from the entity that searches on my behalf / other (describe)."
    status: covered
    trazo:
      questions: [g3_0_seeds.seed_search_records, g3_2_planting_stock.stock_search_records]
      prints: "modules/G3_0.pdf §B (seed); modules/G3_0b.pdf §D (planting stock)"
    # Closed 2026-10-31 by the seed and planting stock slice.

  - ref: "C1"
    asks: "Genetic Modification (GMO) — not applicable, all seed and/or planting stock is organic (skip to section D). How do you document that non-organic seed and/or planting stock is not genetically modified? Non-GMO statement from the supplier / catalog statement / other (describe)."
    status: covered
    trazo:
      questions: [g3_0_seeds.gmo_documentation, g3_2_planting_stock.stock_gmo_documentation]
      prints: "modules/G3_0.pdf §C (seed); modules/G3_0b.pdf §B (planting stock)"
    # Closed 2026-10-31 by the seed and planting stock slice.

  - ref: "D1"
    asks: "For all seed treatments (pelletized, coated, primed, fungicide, insecticide, inoculated), how do you verify that the treatment uses only allowed materials and is non-GMO? CCOF offers two bases: an OMRI or WSDA listing, or approval by CCOF."
    status: covered
    trazo:
      questions: [g3_0_seeds.treatment_verification]
      prints: "modules/G3_0.pdf §D; narrative § 205.201(a)(1)"
    # CLOSED 2026-08-27. A third option, `trazo_verification` ("Checked against the National List /
    # OMRI / WSDA in Trazo at logging time"), compiled into the certifier-facing plan as Trazo
    # having verified the treatment — a check no code performs (drift_detector declines to verify a
    # seed treatment) and a basis CCOF does not accept. Option deleted, CONTENT_VERSION bumped to
    # 2026.08.27, the compiled sentence changed from "verified via" to "Basis on which seed
    # treatment materials are allowed", frontend fixture regenerated, and migration
    # certifications/0032 retracted it from the one stored answer that held it (where it was the
    # only basis given, the answer is now unanswered — the honest state).
    # Guards: certifications/tests/test_attestation_over_empty_list.py (source sweep + a structural
    # check that no OSP option anywhere names Trazo as verifier or approver).

  - ref: "D2"
    asks: "Are all seed treatment materials included on your Grower Materials Application (OSP Materials List)? Yes."
    status: covered
    trazo:
      questions: [g3_0_seeds.treatments_on_inputs_list]
      prints: "modules/G3_0.pdf §D, with a [REVIEW] line for a No or for unlisted treatments the records name; workbooks/Materials List.xlsx"
    # Closed 2026-11-17 by the seeds and planting stock slice: a Yes is refused at the write while a seed planting
    # record names a treatment the materials list does not hold, and a stored one prints those names; a No prints a
    # [REVIEW] line and is listed on the plan review. Seed treatments are on the Materials List as production aids
    # (CCOF Materials Application section C).

  - ref: "E1"
    asks: "Does your operation graft planting stock? No (stop, form complete) / Yes (list all materials on your Grower Materials Application / OSP Materials List)."
    status: covered
    trazo:
      questions: [g3_0_seeds.grafts_stock]
      prints: "modules/G3_0.pdf §E; Yes, and not every grafting material is on the OSP inputs list yet prints a [REVIEW] line and is listed on the plan review"
    # Closed 2026-11-17 by the seeds and planting stock slice: grafting is answerable without the listing attestation
    # (yes_not_listed, beside the stored yes, which keeps its meaning). Page E opens on Organic, Non-organic or
    # Established perennials only; by § 205.2 scion wood and rootstock are planting stock, so an operation that grafts
    # reaches it.

  - ref: "E1a"
    asks: "Describe grafting practices."
    status: covered
    trazo:
      questions: [g3_0_seeds.grafting_practices]
      prints: "modules/G3_0.pdf §E"
    # Closed 2026-10-31 by the seed and planting stock slice.
