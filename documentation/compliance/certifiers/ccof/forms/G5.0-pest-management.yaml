form:
  code: "G5.0"
  title: "Pest Management"
  document_id: "ORGB42"
  revision: "V1, R7, 9/21/2021"
  url: "https://www.ccof.org/resource/g5-0-pest-management/"
  retrieved: 2026-10-24
  nop_cites: ["§ 205.206", "§ 205.203(e)(3)"]
  guide_trigger: "Item 1 — apply for CCOF organic certification for crop production"
  required_of_every_grower: true
  trazo_module: g5_0_pest
  register_status: complete
  source_sha256: 5d1c640de6c1f7ede9e5946af81fa3f0a2c31b21bebf5b2196304bf954d0591a

items:
  - ref: A
    asks: 'Preventative Pest Management Strategies — for each of 23 listed practices (crop rotation; cover cropping;
      strip cropping, interplanting or planting mixed species; trap crops; crop nutrient management; sanitation,
      cleaning up debris, nesting areas, removal of disease vectors, weed seed sources, etc.; growing location;
      timing of planting; resistant varieties or rootstock; remove pest by hand; mechanical cultivation; mowing
      or grazing; irrigation method or management; mulching with biodegradable materials; non-PVC plastic or
      synthetic mulches, or solarization; plant beneficial habitat areas; construct predator habitat; release
      beneficial organisms; construct barriers; traps; flaming; other physical or mechanical means; burning crop
      residue), check which of four pest types it targets: Weeds / Insects & invertebrates / Diseases & nematodes
      / Vertebrate pests.'
    status: covered
    trazo:
      questions:
      - g5_0_pest.practices_weeds
      - g5_0_pest.practices_weeds_other
      - g5_0_pest.practices_insects
      - g5_0_pest.practices_insects_other
      - g5_0_pest.practices_diseases
      - g5_0_pest.practices_diseases_other
      - g5_0_pest.practices_vertebrates
      - g5_0_pest.practices_vertebrates_other
      - g5_0_pest.prevention_practices
      - g5_0_pest.prevention_practices_other
      - g5_0_pest.weed_management_practices
      - g5_0_pest.weed_management_other
      - g5_0_pest.plastic_mulch_used
      - g5_0_pest.plastic_mulch_removal
      - g5_0_pest.burns_crop_residue
      prints: "modules/G5_0.pdf §A, §B; narrative § 205.206"
    # Closed 2026-11-07 (content 2026.11.22). CCOF's four columns are four lists, each offering the practices CCOF
    # lists for that pest type. The untyped lists are retired: shown only to a plan that answered them.

  - ref: "B1"
    asks: "Do you use materials for controlling weeds, insects, or diseases? (No, materials used — skip to section C / Yes, list all materials on your Grower Materials Application.) An allowed synthetic material may be used only if it is on the National List and the conditions for using the material are documented in the Organic System Plan."
    status: covered
    trazo:
      questions: [g5_0_pest.applies_pest_weed_disease_inputs, g5_0_pest.input_use_conditions]
      prints: "modules/G5_0.pdf §C; narrative § 205.206(e)"

  - ref: "B2"
    asks: "Describe the conditions that must exist before you will resort to using materials for weed, insect or disease control: when preventative measures/controls described above fail / when economic thresholds for pest damage are exceeded / other (describe)."
    status: covered
    trazo:
      questions: [g5_0_pest.input_use_conditions, g5_0_pest.input_use_triggers]
      prints: "modules/G5_0.pdf §C; narrative § 205.206(e)"
    # Closed 2026-11-02 by the monitoring slice.

  - ref: "C1"
    asks: "Do you burn crop residues? (No — stop, this form is complete / Yes, complete this section.)"
    status: covered
    trazo:
      questions: [g5_0_pest.burns_crop_residue]
      prints: "modules/G5_0.pdf §A; narrative § 205.203(e)(3)"

  - ref: "C2"
    asks: "What crop residues do you burn, and how often do you burn them?"
    status: covered
    trazo:
      questions: [g5_0_pest.burn_crops, g5_0_pest.burn_frequency]
      prints: "modules/G5_0.pdf §A; narrative § 205.203(e)(3)"
    # Closed 2026-11-02 by the monitoring slice.

  - ref: "C3"
    asks: "What diseases are to be suppressed, or which specific seeds are to be germinated?"
    status: covered
    trazo:
      questions: [g5_0_pest.burn_reason, g5_0_pest.burn_reason_other, g5_0_pest.burn_target_detail]
      prints: "modules/G5_0.pdf §A"
    # Closed 2026-11-18 by the pest, weed and soil slice: burn_target_detail names the disease suppressed or the seed
    # germinated, asked when the reason is either of the two section 205.203(e)(3) allows. Optional, so finished plans
    # stay finished.
