form:
  code: "G8.0"
  title: "Record Keeping"
  document_id: "ORGB33"
  revision: "V3, R2, 10/23/2024"
  url: "https://www.ccof.org/resource/g8-0-record-keeping/"
  retrieved: 2026-10-24
  register_status: complete
  source_sha256: 96171743e46738d7943b4700dd4d7dfaf68cecb3427c434783d46907ae1ae205
  nop_cites: ["§ 205.2", "§ 205.101", "§ 205.103", "§ 205.201", "§ 205.307"]
  guide_trigger: "Item 1 — apply for CCOF organic certification for crop production"
  required_of_every_grower: true
  trazo_module: [g8_0_record_keeping, g2_0_fraud_prevention]

items:
  - ref: "A1"
    asks: "Based on the activities described in your OSP, does your operation maintain all records needed to verify compliance, keep them at least 5 years, and make them available during inspections? The form then lists, by activity, the record types an organic crop operation is expected to keep."
    status: partial
    severity: P2
    trazo:
      questions: [g8_0_record_keeping.s11_records, g8_0_record_keeping.records_retention_attestation]
      models: ["certifications.services.common_osp_records (Common OSP § 11 registry, 38 record types)"]
      prints: "modules/G8_0.pdf §A — the confirmed record types with their evidence, then the attestation"
    gap: "Since 2026-10-01 (OSP alignment audit T17-F1) the statement reads 'all the records your plan's activities require', and its gate refuses Yes while any record type the plan's own answers require is not confirmed: input-material application (materials used), pest management (pest inputs applied), harvest records (who harvests), compost production (compost made), clean-out records (storage shared with non-organic), supplier verification and seed commercial-availability search. A record the operator states is not kept is named as missing, never accepted; an undecided requirement blocks too; a Yes given before this prints with a [REVIEW] naming what is missing and counts as unanswered. What remains: those seven triggers are not every activity CCOF's list covers (storage, sales and transport records have no trigger yet), so the statement can still be Yes with one of those unconfirmed."
    fix: "Add triggers for the remaining activities CCOF lists (storage, sales, transport), each reading one answer in the plan."
    # CLOSED 2026-08-27. The attestation completed over an EMPTY § 11 list: the registry is an
    # `info` embed and `info` is skipped by completion validation, so a module a certifier opens
    # first was a signature over nothing. Now declarative — the question carries
    # `attests_embed="s11_record_types"` and certifications/services/attestation_gates.py refuses
    # an affirmative answer while the list is empty, at the WRITE path (the untrue value never
    # reaches storage, and the compiler reads storage), at completion, in the reported module
    # status, and with a [REVIEW] qualifier in the PDF for plans attested before the gate existed.
    # Guards: certifications/tests/test_attestation_over_empty_list.py

  - ref: "B1"
    asks: "Attach a sample audit trail showing how you plan to meet the audit trail requirements: highlight the linking elements showing how documents connect in sequence; show how you identify the organic status of the crop/product on each type of document; for nonretail containers moving through the supply chain, indicate where the lot number, shipping identification, or other unique identification appears. If you are new to organic production, provide an example of the audit trail records you plan to maintain."
    status: partial
    severity: P3
    trazo:
      questions: [g8_0_record_keeping.audit_trail_exhibit, g7_0_labeling.invoices_identify_lot]
      prints: "05-audit-trail-exhibit.pdf — Part B: one finished, sold lot walked lot ID → harvest (date, quantity, block, storage) → storage location → sales (invoice, BOL, buyer, organic status on invoice, label claim), the lot ID set apart on its own line; the modules/G8_0.pdf §B lot-numbering answer sits beside it"
    gap: >-
      Closed 2026-09-09: the generator the G8.0 coaching promised now exists and its output ships in every packet as document 05, chosen mechanically (the most recently finished season with a live sale) and compiled only from dated records — a missing lot ID or storage location is stated as missing. What remains: the exhibit is a text trace, not the marked-up copies of the operation's own paper (invoice, BOL, bin ticket) CCOF's word 'sample' evokes, and an operation with no finished sold season yet ships a stated absence instead of a trail.
    fix: >-
      Ask for the operator's marked-up sample as the `audit_trail_exhibit` upload; since 2026-10-01 a file uploaded for it rides in the packet under attachments/g8_0_record_keeping/audit_trail_exhibit/.

  - ref: "B2"
    asks: "Describe the lot numbering used to link to your audit trail and track organic crops/products once they leave your operation: not applicable, no lot numbering used; or my operation assigns lot numbers — describe the system as a Code / Signifies table (example: Lot Number 23123O10 — Code 23 / 123 / O / 10, Signifies Year 2023 / Julian harvest date / Organic / Parcel ID)."
    status: covered
    trazo:
      questions: [g8_0_record_keeping.lot_numbering, g8_0_record_keeping.lot_numbering_description, g8_0_record_keeping.lot_code_key]
      prints: "modules/G8_0.pdf §B: the description, and the key as CCOF's Code / Signifies table beside up to three lot numbers from the operation's production records"
    # Closed 2026-11-07. The operator writes the key one part per line ("26 = harvest year") and the PDF prints it as the
    # table; a key that does not split cleanly prints as written. The register's earlier fix proposed Trazo splitting
    # the farm's lot IDs into segments for the operator to confirm; that would be Trazo deciding what a part of someone's
    # lot number means, so it was not built. Where the code is printed is asked by `lot_numbering_description`.

  - ref: "C1"
    asks: "A split operation is one that produces or handles both organic and nonorganic products. Mark all that apply: grow both organic and nonorganic crops; grow identical crops organically and nonorganically; sell organic and nonorganic crops/products, including any sourced from other operations; sell identical organic and nonorganic crops/products, including any sourced from other operations; none of the above — skip to section D."
    status: partial
    severity: P3
    trazo:
      questions: [g6_0_production.split_operation, g6_0_production.nonorganic_product_source, g6_0_production.nonorganic_product_source_other, g6_0_production.parallel_production, g6_5_sales_soe.sales_soe_supplier_verification]
      prints: "modules/G6_0.pdf §A"
    gap: "Since 2026-11-06 three of CCOF's four boxes read straight off the plan: grow both (`split_operation` with its source: buffer-zone crop, parcels not certified, land in transition), grow identical (`parallel_production`), and sell both including sourced (`nonorganic_product_source` = bought in and resold). The fourth, sell IDENTICAL organic and non-organic including sourced, is asked only for what the operation grows; whether a bought-in non-organic product is identical to an organic one it sells is not asked. The earlier note that a buffer-row-only farm was pushed into a false Yes was wrong: § 205.2 defines a split operation as one that 'produces or handles both organic and nonorganic agricultural products', which a farm selling buffer crop as non-organic does."
    fix: "Add a follow-up to the bought-in option: is any bought-in non-organic product the same crop as an organic one the operation sells."

  - ref: "C2"
    asks: "How do your input records distinguish between materials used on organic and nonorganic crops?"
    status: partial
    severity: P2
    trazo:
      questions: [g6_0_production.split_operation_separation]
      prints: "modules/G6_0.pdf §A"
    gap: "Trazo asks only a general separation textarea (`split_operation_separation`); it never asks specifically how INPUT records (receipts, application records) distinguish organic from nonorganic material use."
    fix: "Add `split_input_records_distinction` textarea to G6.0, visible when `split_operation` is true; pre-suggest 'block_id flags buffer rows; identical organic inputs used throughout' for the buffer-only case."

  - ref: "C3"
    asks: "How do your harvest, shipping, and sales records distinguish between organic and nonorganic crops/products?"
    status: partial
    severity: P2
    trazo:
      questions: [g6_0_production.parallel_production_distinction, g6_0_production.buffer_strategies]
      prints: "modules/G6_0.pdf §B"
    gap: "Covered for the buffer case (`buffer_strategies` plus the harvest event's buffer-disposition field and the § 11 buffer-separation record). For a true split operation the equivalent question, `parallel_production_distinction`, is hidden unless `parallel_production` is true, so a split-but-not-parallel operation is never asked."
    fix: "Show a harvest/shipping/sales distinction textarea whenever `split_operation` is true, not only when `parallel_production` is true."

  - ref: "D1"
    asks: "Mark all that apply: my operation purchases certified organic seed, annual seedlings/transplants, or planting stock (describe in G3.0 Seeds & Planting Stock, or G3.2 Mushroom Production); my operation sources certified organic crops or products for resale or distribution (describe in G6.5 Sourcing & Direct Marketing); my operation sends certified organic crops to another operation for storage, handling, or processing (describe in G6.1 Harvest & Transport and/or G6.2 Storage); my operation packs into brands/labels owned by other certified operations (describe in G7.0 Labeling); none of the above — form complete."
    status: partial
    severity: P2
    trazo:
      questions: [g2_0_fraud_prevention.fraud_risk_areas, g3_0_seeds.seeds_used, g6_5_sales_soe.sales_soe_supplier_verification, g7_0_labeling.product_leaves_as]
      models: [history.Production.post_harvest_facilities]
      prints: "modules/G2_0.pdf §A (risk areas only — no scenario checklist)"
    gap: "Each scenario is answerable only implicitly, from the presence or absence of data across four different modules (G3.0 seed purchases, G6.5 supplier verification, `PostHarvestFacility` relations, G7.0's brand-owner gate) plus G2.0's own general `fraud_risk_areas` checklist. There is no single yes/no scenario map matching CCOF's D1. Each scenario's verification follow-up is asked where its records live (G2.0 §B, G6.1 §D, G7.0 §C)."
    fix: "Derive a D1-style checklist from the four source modules and print it in G8.0 §D / G2.0, rather than requiring the certifier to infer it from four unrelated pages."

  - ref: "D2"
    asks: "For each scenario indicated in D1, how do you verify current organic status? Current organic certificate reviewed with each shipment or transaction; certificate reviewed periodically (monthly / quarterly / annually); other (describe). Certificates must be current — issued within the last 15 months — and complete (listing the product sourced or produced/handled, with brand if any); records must link back to the last certified organic operation."
    status: covered
    trazo:
      questions: [g2_0_fraud_prevention.fraud_mitigation_practices, g2_0_fraud_prevention.supplier_certificate_review_frequency, g2_0_fraud_prevention.supplier_certificate_review_frequency_other, g6_1_harvest_transport.handler_cert_verification_method, g6_1_harvest_transport.handler_cert_verification_method_other, g6_1_harvest_transport.handler_cert_verification_frequency, g6_1_harvest_transport.handler_cert_verification_frequency_other, g7_0_labeling.brand_owner_certificate_check, g7_0_labeling.brand_owner_certificate_check_other, g7_0_labeling.brand_owner_certificate_frequency, g7_0_labeling.brand_owner_certificate_frequency_other]
      prints: "modules/G2_0.pdf §B; modules/G6_1.pdf §D; modules/G7_0.pdf §C"
    # Closed 2026-11-08: the brand-owner scenario's check and cadence have been asked on G7.0 §C since the
    # brand-owner slice (2026-11-07); the gap text here still said no brand-owner record existed.

  - ref: "D3"
    asks: "How do you monitor the effectiveness of your certificate verification practices and procedures? Standard procedure requires sign-off from more than one employee for each transaction; periodic review of records for quality control; other (describe)."
    status: covered
    trazo:
      questions: [g2_0_fraud_prevention.osp_implementation_monitoring, g2_0_fraud_prevention.fraud_review_process]
      prints: "modules/G2_0.pdf §C"
    # Closed 2026-11-02 by the monitoring slice.
