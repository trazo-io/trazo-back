form:
  code: ''
  title: Parcel Application
  document_id: ORGB49
  revision: V1, R11, 3/14/2022
  url: https://www.ccof.org/resource/parcel-application/
  pdf: https://www.ccof.org/wp-content/uploads/2026/10/Parcel-Application-ORGB49.pdf
  retrieved: 2026-10-24
  nop_cites:
  - § 205.202
  guide_trigger: Item 1 — apply for CCOF organic certification for crop production (one per parcel)
  required_of_every_grower: true
  trazo_module: parcel_application
  register_status: complete
  source_sha256: d5e11d0a224739e34df16844d284d38b4fbb515ac475114bf6b78d240b824eab
items:
- ref: A (separate copy per parcel)
  kind: instruction
  asks: Complete a separate copy of this form for each physically separate area, each area with a different
    organic eligibility date, or (CCOF Mexico) a different crop production system. Certified operations adding
    a new parcel must have this form reviewed by CCOF before inspection; a separate Crop Update form (not this
    one) is used to change crops on parcels already on file.
  note: Trazo writes one Parcel Application PDF per parcel (parcels/parcel-application-<name>.pdf) and the
    Field and Crop Information workbook; crop changes on parcels already on file go through change notifications.
- ref: A1
  asks: Parcel name or code.
  status: covered
  trazo:
    questions:
    - parcel_application.parcel_name
    models:
    - product.Parcel.name
    prints: parcels/parcel-application-<name>.pdf §A
- ref: A2
  asks: Block/lot numbers or greenhouse/shadehouse numbering, if applicable.
  optional: true
  status: covered
  trazo:
    questions:
    - parcel_application.block_identifiers
    models:
    - product.Parcel.application_answers
    prints: >-
      parcels/parcel-application-<name>.pdf §A
  note: >-
    Asked on page A since 2026-11-10. Whether the map shows permanent identifiers is judged on the map
    row.
- ref: A3
  asks: Street address; City; County; State/Province; Country.
  status: covered
  trazo:
    questions:
    - parcel_application.address
    - parcel_application.location_same_as_operation
    - parcel_application.location_city
    - parcel_application.location_state
    - parcel_application.location_country
    - parcel_application.county
    models:
    - product.Parcel.address
    - product.Parcel.application_answers
    - company.models.Establishment.city
    - company.models.Establishment.state
    - company.models.Establishment.country
    prints: >-
      parcels/parcel-application-<name>.pdf §A
  note: >-
    Asked per parcel since 2026-11-10. When the operator answers that the parcel shares the operation's
    city, state, ZIP code and country, the page prints the operation's address on file beside that
    answer, with a [REVIEW] line naming any part of it that is blank. The operation's address is never
    copied in without that answer.
- ref: A4
  asks: County Assessor's parcel number (APN), Section/Township/Range, or other legal description.
  status: covered
  trazo:
    questions:
    - parcel_application.apn
    - parcel_application.section_township_range
    models:
    - product.Parcel.apn
    - product.Parcel.section_township_range
    prints: parcels/parcel-application-<name>.pdf §A
- ref: A5
  asks: Geographical coordinates or latitude/longitude (decimal form), and/or additional location information
    such as a cross street or road.
  status: covered
  trazo:
    questions:
    - parcel_application.location_coordinates
    - parcel_application.location_notes
    models:
    - product.Parcel.polygon
    - product.Parcel.address
    - product.Parcel.application_answers
    prints: >-
      parcels/parcel-application-<name>.pdf §A
  note: >-
    Since 2026-11-10 §A prints the drawn boundary's centre (the same computation as the §E map caption)
    or states that no boundary is drawn. A parcel with no street address is asked for coordinates, a
    cross street or road, or directions in their own field; with a street address that field does not
    apply. The address itself is cited on the street-address row.
- ref: A6
  asks: At this parcel, when do you expect to begin harvesting crops you wish to market as organic (MM/DD/YY)?
    Crops harvested prior to inspection cannot be certified.
  status: covered
  trazo:
    questions:
    - parcel_application.expected_first_organic_harvest
    models:
    - product.Parcel.application_answers
    prints: >-
      parcels/parcel-application-<name>.pdf §B
  note: >-
    Asked in the form's terms since 2026-11-10, without the old '(if in transition)'. Hidden for a
    parcel stated currently certified, which already harvests organic crops. Not one of the completion
    checks: those read live records, and every parcel question is optional by design.
- ref: A7
  asks: Parcel acreage — total acres to be certified organic at this location, excluding non-production
    areas (homes, parking, post-harvest handling/storage).
  status: partial
  severity: P3
  trazo:
    where: 'each parcel''s application under parcels/: Section E'
    models:
    - product.Parcel.area
    prints: parcels/parcel-application-<name>.pdf §E (should also be §A)
  gap: '`Parcel.area` (stored in hectares, displayed in both units) is exactly the production-only figure
    CCOF wants, but it prints under §E (''Mapped area'') rather than §A.'
  fix: Duplicate the acreage line into §A as 'Parcel acreage (to be certified).'
- ref: A8
  asks: 'Table: crop, and # of acres, for each crop currently grown or planned on this parcel.'
  status: not_covered
  severity: P2
  trazo:
    models:
    - product.Parcel.product
    - history.models.History
    prints: —
  gap: 'Crop names appear in the §F land-history rows and the Field and Crop Information workbook, but
    no per-crop acreage field exists anywhere — `History` carries no area, and `Parcel.product` is a single
    FK. A single-crop parcel can imply the whole parcel''s acreage, but a multi-crop parcel cannot be
    split (the pilot''s Bottom Ground A: spinach then carrots in the same year).'
  fix: Add a `crops_planned` rows answer (crop, acres) on page A, prefilled with crop names from open
    seasons and acres left for the operator to confirm; validate the sum against parcel acreage; print
    as a table in §A and feed the workbook's crop cell.
- ref: A9
  asks: Is production at this parcel in containers (not in the ground)? Yes → complete or update G3.1
    Container & Greenhouse/Shadehouse Production.
  status: covered
  trazo:
    questions:
    - parcel_application.container_production
    models:
    - product.Parcel.container_production
    prints: >-
      parcels/parcel-application-<name>.pdf §A
  note: >-
    When Yes, §A names G3.1 Container & Greenhouse/Shadehouse Production (a Trazo module since back PR
    366) and states how far it is answered on the plan: not applicable, not answered yet, or with
    required questions open. The production-system split (containers on land or on sealed flooring) is
    F3.
- ref: A10
  asks: Are there existing installations of lumber treated with arsenate or other prohibited materials
    within the boundaries of this parcel? No → skip to §B. Yes → identify all treated lumber on the parcel
    map and complete or update G6.0 Production.
  status: covered
  trazo:
    questions:
    - parcel_application.treated_lumber_present
    - parcel_application.treated_lumber_noncontact_present
    - parcel_application.map_elements_shown
    - g6_0_production.treated_lumber_any
    models:
    - product.Parcel.treated_lumber_present
    prints: parcels/parcel-application-<name>.pdf §A, §E; modules/G6_0.pdf §E
  note: 'Closed 2026-11-08. `treated_lumber_present` keeps the § 205.206(f) contact test it always asked (and
    WSDA AGR 2264 ref 12 asks), so its stored answers keep their meaning. When it is No,
    `treated_lumber_noncontact_present` asks CCOF''s wider question: any other existing installation within the
    boundaries, touching neither crops nor soil. "Identify all treated lumber on the parcel map" is the
    `treated_lumber` element of `map_elements_shown`, named as unmarked in §E when either answer is Yes. The G6.0
    cross-link: a G6.0 `treated_lumber_any` No beside a parcel saying Yes to either prints a [REVIEW].'
- ref: A10a
  asks: Describe existing treated lumber (e.g., end post, trellis, stakes).
  status: covered
  trazo:
    questions:
    - parcel_application.treated_lumber_description
    - parcel_application.treated_lumber_noncontact_description
    models:
    - product.Parcel.treated_lumber_description
    prints: parcels/parcel-application-<name>.pdf §A
- ref: A10b
  asks: Date of installation.
  status: covered
  trazo:
    questions:
    - parcel_application.treated_lumber_install_date
    - parcel_application.treated_lumber_noncontact_description
    models:
    - product.Parcel.treated_lumber_install_date
    prints: parcels/parcel-application-<name>.pdf §A
- ref: B
  kind: instruction
  asks: 'Transitional Status: following inspection and review, ''CCOF Certified Transitional status'' is granted
    to parcels that have undergone one year of documented organic management and comply with all aspects of
    the NOP standards except completion of the 3-year transition.'
  note: 'Information only: CCOF grants the status after inspection; the form asks nothing here. Until 2026-09-30
    this row claimed `covered` by Trazo''s computed transition card, which states a record, not CCOF''s determination
    (OSP alignment audit 2026-10, T17). The land-history questions are asked in section F.'
- ref: C (not used for livestock)
  asks: 'Checkbox: ''Not used for organic livestock.'' Complete the rest of this section if you plan to use
    this parcel for organic livestock production, pasture, etc.'
  status: covered
  trazo:
    questions:
    - parcel_application.livestock_present
    - parcel_application.livestock_pastured
    models:
    - product.Parcel.application_answers (livestock_present)
    prints: parcels/parcel-application-<name>.pdf §C
  note: 'Closed 2026-11-08. `livestock_present` asks whether livestock are kept, pastured or grazed; its "none"
    answer reads "No: not used for livestock (none kept, pastured or grazed)". The parcel application counts livestock
    as one of its completion checks, so an unanswered parcel is not complete. The earlier "No" (kept only) is retired:
    it still prints, with a [REVIEW] saying it does not cover grazing, and does not complete the check.'
- ref: C1
  asks: 'Planned livestock grazing/outdoor access use: Poultry / Ruminants: Meat / Ruminants: Dairy / Non-ruminants.'
  status: not_covered
  severity: P3
  applies_when:
  - question: certification_contract.contract_scopes
    op: includes
    value: livestock
  trazo:
    prints: —
  gap: Applies only to a parcel used for organic livestock. Trazo has no livestock module; the scopes the operation
    answered say whether any livestock use is possible.
  fix: No livestock module exists; the condition closes it for an operation whose answered scopes exclude livestock.
- ref: C2
  asks: When do you plan to utilize this parcel for livestock grazing/access (M/D/Y)?
  status: not_covered
  severity: P3
  applies_when:
  - question: certification_contract.contract_scopes
    op: includes
    value: livestock
  trazo:
    prints: —
  gap: Applies only to a parcel used for organic livestock. Trazo has no livestock module; the scopes the operation
    answered say whether any livestock use is possible.
  fix: No livestock module exists; the condition closes it for an operation whose answered scopes exclude livestock.
- ref: C3
  asks: When do you plan to remove animals from this parcel (M/D/Y)?
  status: not_covered
  severity: P3
  applies_when:
  - question: certification_contract.contract_scopes
    op: includes
    value: livestock
  trazo:
    prints: —
  gap: Applies only to a parcel used for organic livestock. Trazo has no livestock module; the scopes the operation
    answered say whether any livestock use is possible.
  fix: No livestock module exists; the condition closes it for an operation whose answered scopes exclude livestock.
- ref: C4
  asks: Additional information about your livestock plans.
  status: covered
  trazo:
    questions:
    - parcel_application.livestock_detail
    models:
    - product.Parcel.application_answers (livestock_detail)
    prints: parcels/parcel-application-<name>.pdf §C (when livestock_present = yes)
- ref: D1
  asks: 'Describe all adjacent land uses and buffer zones surrounding this parcel: for each border (N/S/E/W)
    — the adjacent land use, whether it is organic (Y/N), the buffer zone type, the buffer width (ft), and
    whether a crop is grown in the buffer zone (Y/N).'
  status: covered
  trazo:
    questions:
    - parcel_application.buffer_editor
    - parcel_application.no_adjoining_prohibited
    - parcel_application.parcel_change_notifications
    - parcel_application.contamination_incidents
    - parcel_application.adjoining_affidavit_card
    models:
    - product.Parcel.buffer_zones
    - product.services.buffer_zones
    prints: parcels/parcel-application-<name>.pdf §D
  note: Closed 2026-11-06. Each border row states organic Yes or No (a No prints "adjoining land is not certified
    organic") and whether a crop is grown in the buffer (`buffer_crop_grown`, printed "no crop grown in the
    buffer" for a No). The wizard shows the change notifications and contamination incidents §D prints, read-only;
    a guard checks every embed the module declares has a renderer.
- ref: E
  asks: 'Attach an 8.5x11 map of the parcel (satellite imagery preferred). Must include: a directional
    arrow; parcel boundaries; total acreage notation; permanent identifiers (blocks/lots/greenhouses);
    nearest public roads/landmarks; other operation areas (seedling production, storage, post-harvest
    handling); adjacent land uses labeled; location and width of buffer zones with crop-in-buffer noted;
    natural resources (waterways, woodlands, windbreaks, etc.); livestock needs; and existing treated-lumber
    installations.'
  status: covered
  trazo:
    questions:
    - parcel_application.map_status
    - parcel_application.map_upload
    - parcel_application.map_elements_shown
    models:
    - product.Parcel.polygon
    - product.Parcel.buffer_zones
    prints: parcels/parcel-application-<name>.pdf §E; packet ZIP parcels/maps/
  note: 'Closed 2026-11-08. The operator''s own map ships under `parcels/maps/` and §E names the file
    (2026-08-28). `map_elements_shown` asks which elements that map shows, one list for the three agents
    (`certifications/services/parcel_map_elements.py`); every one of CCOF''s eleven is on it. The answer
    prints as the operator''s statement, and §E adds a [REVIEW] naming each element CCOF lists that is not
    ticked (livestock and treated lumber only when the parcel application says they apply). Trazo does not
    read the map, and nothing printed says the map meets the list. Guard: `certifications/tests/test_parcel_map_elements.py`.'
- ref: F1
  asks: When did you begin managing this parcel (the date you bought, began leasing, or otherwise became
    responsible for management)?
  status: covered
  trazo:
    questions:
    - parcel_application.date_began_managing
    models:
    - product.Parcel.date_began_managing
    prints: parcels/parcel-application-<name>.pdf §B
- ref: F2
  asks: >-
    Is this parcel currently certified organic? Yes → skip to §G. No → complete this section.
  status: covered
  trazo:
    questions:
    - parcel_application.currently_certified
    - parcel_application.prior_certifier_name
    - parcel_application.certificate_card
    - parcel_application.no_lapse_attested
    models:
    - certifications.models.Certification
    - product.services.parcel_application_status (certification_status)
    prints: >-
      parcels/parcel-application-<name>.pdf §F — the answer, the certificate-of-record line and the
      no-lapse statement when 'Yes'; the 36-month table when 'No'
  note: >-
    Closed 2026-09-09 (fix/parcel-page-land-history): `currently_certified` is asked as the
    certifiers ask it (no 'by another certifier'), is part of completion (`certification_status`),
    and gates a certificate-of-record line on the parcel's own page — number, issuing agent,
    effective and expiry dates from ONE record (`certificate_line`, built on
    `operation_certificate`), never assembled field by field. Printing the record replaced the
    suggest→confirm prefill this row asked for: a record printed beside the operator's own answer is
    stronger evidence than the same value typed back, and § 205.201(a) authorship is untouched
    because the operator still answers the question. CCOF's 'No → complete this section' routing is
    honoured: `dlpm_none_within_tenure` and the affidavit prompts are the not-certified path,
    `no_lapse_attested` and the certificate line are the certified one.
- ref: F3
  asks: Is all production at this parcel in containers AND on permanent, solid, impermeable flooring?
    Yes → skip to §G. No, in-ground → complete this section. No, containers on land or a permeable surface
    → complete this section.
  status: partial
  severity: P2
  trazo:
    questions:
    - parcel_application.container_production
    models:
    - product.Parcel.container_production
    - product.services.parcel_application_status.py
    prints: parcels/parcel-application-<name>.pdf §A (as container_production)
  gap: Only the single `container_production` boolean exists, and the status service skips the land-history
    check for ANY container parcel — including one built on bare land, which CCOF still requires land
    history for, treating it the same as one on sealed concrete.
  fix: Replace with a `production_system` radio {in_ground, containers_on_land_or_permeable, containers_on_impermeable_flooring};
    only the last value skips land history. Keep `container_production` derived for existing readers.
- ref: F4
  asks: >-
    Date of the Last Prohibited Material application (DLPM) — the most recent application of any
    prohibited material, including fertilizers, pesticides, treated seed, adjuvants, etc.
  status: covered
  trazo:
    questions:
    - parcel_application.dlpm_none_within_tenure
    - parcel_application.affidavit_card
    - parcel_application.transition_card
    models:
    - product.ParcelCropHistory.date_last_prohibited
    - history.models.ChemicalEvent
    - certifications.models.LandownerAffidavit.last_prohibited_date
    prints: >-
      parcels/parcel-application-<name>.pdf §B — the derived last-prohibited date from all three
      sources (transition card); §F — the current manager's row on the 36-month table carries the
      same date beside the operator's declaration
  note: >-
    Closed 2026-09-09: a genuinely clean tenure is now a STATEMENT (`dlpm_none_within_tenure`,
    printed as 'None applied since tenure began (declared)') rather than a blank, and the
    declaration is shown with a '[REVIEW]' line when a dated prohibited application inside the
    tenure contradicts it — both sides visible, neither hidden.
- ref: F5
  asks: Material(s) applied on the DLPM.
  status: covered
  trazo:
    where: 'each parcel''s application under parcels/: Section F, each row'
    models:
    - product.ParcelCropHistory.last_prohibited_substance
    - product.ParcelCropHistory (substance_applications rows)
    prints: parcels/parcel-application-<name>.pdf §F (per row; §B card prints the date only)
- ref: F6
  asks: >-
    Table of prior controllers, required if you have not managed the parcel for the full past three
    years (or since the DLPM): owner or manager (checkbox), name, start date (MM/YY), end date
    (MM/YY); or check 'N/A, my operation has had control for the past three years'; or 'additional
    pages attached.'
  status: covered
  trazo:
    questions:
    - parcel_application.affidavit_card
    - parcel_application.date_began_managing
    models:
    - certifications.models.LandownerAffidavit (previous_manager_name, management_period_start/end, landowner_name, last_prohibited_date)
    - product.Parcel.date_began_managing
    prints: >-
      parcels/parcel-application-<name>.pdf §F — the manager table (manager · role · from MM/YY · to
      MM/YY · last prohibited · materials declared · signed · attachment), the landowner named on a
      detail line, and the 36-month accounting: 'full three years' derived from
      `date_began_managing`, otherwise every uncovered date range named
  note: >-
    Closed 2026-09-09: `certifications/services/parcel_land_history.py` renders the table the audit
    dossier already printed, on the Parcel Application where CCOF asks it, with the current manager
    as the first row and `coverage()` stating the window arithmetic. It names gaps in dates and
    never says 'eligible'.
- ref: F7
  asks: What crop production or other activities have occurred on this parcel during the past three years (or
    since the DLPM)? Fallow / Cover cropping / Pasture / Production of crops / Other, each with a from-to month/year
    range.
  status: partial
  severity: P2
  trazo:
    questions:
    - parcel_application.crop_history
    models:
    - product.ParcelCropHistory
    prints: parcels/parcel-application-<name>.pdf §F
  gap: '`ParcelCropHistory` rows (year, crop grown, cover crop, production method, notes) carry this, with
    years derived from season records and marked with that provenance — but there is no ''pasture'' option,
    no month-level date range (year granularity only), and no ''other.'''
  fix: Add `pasture` to the production-method choices (or a separate land-use enum) and an optional `period_from`/`period_to`
    (MM/YYYY) on the row; print 'Fallow 03/2024-07/2025' when given.
- ref: F7a
  asks: Additional information regarding the activities listed above.
  status: covered
  trazo:
    questions:
    - parcel_application.crop_history
    prints: parcels/parcel-application-<name>.pdf §F (each year's notes)
- ref: F8
  asks: Since the DLPM, have prohibited materials of any kind been applied to any parcel borders or portions
    of the parcel not submitted for certification (e.g. the same APN, or the same CA pesticide-use-reporting
    site ID)? No, skip to section G / Yes, complete this section.
  status: covered
  trazo:
    questions:
    - parcel_application.prohibited_on_excluded_ground
    prints: parcels/parcel-application-<name>.pdf §F
  note: Asked when the parcel is not currently certified (CCOF F2 skips section F otherwise). The operator's own
    ground beside the parcel, never a buffer row's `prohibited_use_last_date`, which is the neighbour's.
- ref: F8a
  asks: Describe, including names of materials used and application dates, and attach a map showing where they
    were applied.
  status: covered
  trazo:
    questions:
    - parcel_application.prohibited_on_excluded_ground_detail
    prints: parcels/parcel-application-<name>.pdf §F
  note: The map is the §E upload, and the coaching asks for the places to be marked on it; Trazo cannot check
    that the map shows them, which is the E row's own limit.
- ref: G (currently certified)
  asks: 'If currently certified organic: provide (1) a copy of the current organic certificate listing this
    parcel, AND (2) verification of no lapse in organic management (written confirmation from the current certifier,
    a completed Affidavit of Land History covering the period, etc.).'
  status: covered
  trazo:
    questions:
    - parcel_application.certificate_card
    - parcel_application.no_lapse_attested
    - parcel_application.currently_certified
    - parcel_application.certified_branch
    - parcel_application.certificate_reference
    - parcel_application.continuity_reference
    models:
    - certifications.models.Certification
    - documents.models.GeneratedDocument (linked_section parcel_application_certificate / parcel_application_continuity)
    - certifications.models.LandownerAffidavit.signed_document
    prints: parcels/parcel-application-<name>.pdf §F — the F2 route to G, then (1) the certificate copy and
      (2) the verification of no lapse, each attached (packet ZIP parcels/certificates/ or parcels/continuity/,
      or a signed affidavit under parcels/affidavits/), referenced separately in the operator's words, or
      missing; the operator's no-lapse checkbox printed as their statement, not as (2)
  note: 'Closed 2026-10-01 (OSP alignment audit T21-F1, `certified_parcel_branch`). Both items are
    per-parcel uploads that ship in the packet, or a stated reference; neither is filled by the operation''s
    certificate of record or by the no-lapse checkbox. The page reports availability only: whether the copy
    lists this parcel and whether the verification satisfies CCOF is CCOF''s determination. F4 to F8 are
    printed as not asked on this route, and the 36-month accounting is not printed as a demand.'
- ref: G (affidavit)
  asks: >-
    If not currently certified organic: provide one or more copies of the Affidavit of Land History,
    signed and dated by each person named in F6, OR alternative documents containing all the same
    information.
  status: partial
  severity: P2
  trazo:
    questions:
    - parcel_application.affidavit_card
    models:
    - certifications.models.LandownerAffidavit.signed_document
    prints: >-
      parcels/parcel-application-<name>.pdf §F — each affidavit's row on the manager table; the
      signed document rides in the packet ZIP under parcels/affidavits/<pk>-<signer>.<ext>, named on
      the page
  gap: >-
    Closed 2026-09-09 for every affidavit a PRIOR manager signed: table on the page, signed file in
    the ZIP. Remaining: the self-affidavit path — when F6 is 'N/A' the OPERATOR is the attesting
    person, and the operator's `dlpm_none_within_tenure` declaration prints on the table but is not
    a signed Affidavit of Land History.
  fix: >-
    Allow a `signer_role = operator` affidavit whose materials table prefills from
    `substance_applications`, signed and shipped the same way.
- ref: G (container)
  asks: 'For container systems: check ''Not applicable, all crops are grown in ground,'' OR provide a
    signed statement covering the planting date and full names of all materials used (including growing
    media); container systems on impermeable flooring must additionally describe the removal of contamination
    sources before transition.'
  status: partial
  severity: P2
  trazo:
    questions:
    - parcel_application.container_production
    models:
    - product.Parcel.container_production
    prints: >-
      parcels/parcel-application-<name>.pdf §A (the container answer)
  gap: >-
    The 'all crops are grown in ground' half is the operator's own `container_production` = No, which
    prints in §A as the answer to 'Is this parcel container or greenhouse production?', not in §G's
    checkbox wording. For a parcel that IS container production, none of the planting-date, materials or
    contamination-removal statements are captured. Re-judged 2026-11-10: A9 cites the same question as
    covered, and the No does print.
  fix: >-
