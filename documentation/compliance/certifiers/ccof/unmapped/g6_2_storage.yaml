questions:
  g6_2_storage.lot_identity_maintained: "§205.272 / §205.103(b)(2) traceability fact. CCOF's G6.2 form does not ask a distinct
    \"does every stored lot keep its lot identity\" checkbox anywhere in Sections A or B. Trazo asks it as its own boolean,
    tying lot identity through storage as FSMA 204 KDE preparation (see also g6_1_harvest_transport.lot_identification_on_every_load)."
  g6_2_storage.stored_in_sealed_packaging: >-
    CCOF G6.2 asks whether storage is shared and how it is separated, marked and cleaned (B2-B2c), not whether stored product is in sealed packages. Asked for WSDA AGR 2121 §K3.
  g6_2_storage.unsealed_storage_controls: >-
    CCOF G6.2 asks whether storage is shared and how it is separated, marked and cleaned (B2-B2c), not whether stored product is in sealed packages. Asked for WSDA AGR 2121 §K3a, shown only when stored product is not all sealed.
  g6_2_storage.unsealed_storage_controls_other: >-
    Free text for the `other` option of `unsealed_storage_controls`, a WSDA §K3a question this agent does not ask.
