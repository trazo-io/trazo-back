questions:
  g6_4_handling.applies_post_harvest_inputs: >-
    Whether any input is applied directly to crops after harvest (WSDA AGR 2121 L 8). CCOF asks the post-harvest materials themselves on the Materials Application (section D), which post_harvest_contact_listed answers, not whether inputs are applied as a separate question.
  g6_4_handling.post_harvest_input_types: >-
    The types of those inputs (WSDA L 9); same reason.
  g6_4_handling.post_harvest_input_types_other: >-
    The operator's own words for Other on the question above; same reason.
  g6_4_handling.post_harvest_input_recording: >-
    How each application is recorded (WSDA L 11); same reason.
  g6_4_handling.commingling_controls: "§205.272(a) commingling-prevention fact. CCOF's G6.4 form is scoped to all-organic,
    single-operation handling where commingling with nonorganic product is defined out of scope by the form's own applicability
    gate (\"this form does not apply if you are handling both organic and nonorganic products\"). Trazo still asks it to cover
    the custom_handling_separation branch (handling another grower's product), where a commingling risk exists even within an
    all-organic-status framing."
  g6_4_handling.commingling_controls_other: "Companion detail field to commingling_controls — same reasoning."
  g6_4_handling.handling_records: "§205.103(b) recordkeeping fact. CCOF's G6.4 form does not itemize a records checklist —
    general recordkeeping obligations are covered by the separate G8.0 Record Keeping form. Trazo asks a handling-specific
    records checklist here as a superset."
  g6_4_handling.post_harvest_water_source: "Municipal / on-site well / other — WSDA §L 13 and OTCO C7 7.5-2. CCOF's G6.4 asks
    about what is ADDED to the water (B2), never where it comes from; the in-field form G6.1 B3 asks whether on-site treated
    water meets the Safe Drinking Water Act standard, which is a different fact and is registered there."
  g6_4_handling.noncertified_only_inputs_used: >-
    Post-harvest inputs used only on non-certified crops. WSDA AGR 2121 L 10 asks it; CCOF's G6.4 does not.
  g6_4_handling.noncertified_inputs_monitoring: >-
    How certified product is kept from those inputs; same reason (WSDA L 10a).
  g6_4_handling.post_harvest_water_potability: "How water that is not municipal is shown potable, and positive water tests, are OTCO C7 7.5-1b/c asks. CCOF's G6.1 B3a asks only whether water treated on site meets the Safe Drinking Water Act (water_treated_onsite, treated_water_meets_sdwa)."
  g6_4_handling.post_harvest_water_potability_other: "How water that is not municipal is shown potable, and positive water tests, are OTCO C7 7.5-1b/c asks. CCOF's G6.1 B3a asks only whether water treated on site meets the Safe Drinking Water Act (water_treated_onsite, treated_water_meets_sdwa)."
  g6_4_handling.post_harvest_water_treatment_materials: "How water that is not municipal is shown potable, and positive water tests, are OTCO C7 7.5-1b/c asks. CCOF's G6.1 B3a asks only whether water treated on site meets the Safe Drinking Water Act (water_treated_onsite, treated_water_meets_sdwa)."
  g6_4_handling.post_harvest_water_positive_test: "How water that is not municipal is shown potable, and positive water tests, are OTCO C7 7.5-1b/c asks. CCOF's G6.1 B3a asks only whether water treated on site meets the Safe Drinking Water Act (water_treated_onsite, treated_water_meets_sdwa)."
  g6_4_handling.post_harvest_water_positive_explanation: "How water that is not municipal is shown potable, and positive water tests, are OTCO C7 7.5-1b/c asks. CCOF's G6.1 B3a asks only whether water treated on site meets the Safe Drinking Water Act (water_treated_onsite, treated_water_meets_sdwa)."
  g6_4_handling.post_harvest_water_test_results: "How water that is not municipal is shown potable, and positive water tests, are OTCO C7 7.5-1b/c asks. CCOF's G6.1 B3a asks only whether water treated on site meets the Safe Drinking Water Act (water_treated_onsite, treated_water_meets_sdwa)."
  g6_4_handling.water_system_management: "WSDA L 14b's description of how a treated water system is managed and monitored. CCOF G6.1 B3a asks only whether the treated water meets the Safe Drinking Water Act."
  g6_4_handling.shares_handling_area_or_equipment: "OTCO C7 7.4-1 and WSDA L 6 ask whether handling areas or equipment are shared by organic and non-organic crops. CCOF G6.4 applies only to an all-organic operation handling its own product, so it never asks; non-organic handling is one of the disqualifiers on its applicability gate (simple_handling_disqualifiers)."
  g6_4_handling.chlorine_rinse_monitoring: >-
    How the chlorine rinse is checked (WSDA AGR 2121 L 15a). CCOF's on-farm handling and harvest forms asks
    wash water additives and the final rinse, not how the rinse is monitored.
  g6_4_handling.cleaning_differs_by_status: >-
    Whether cleaning differs before non-certified crops on shared equipment (WSDA AGR 2121 L 6a). CCOF's
    on-farm handling and harvest forms asks commingling controls, not the cleaning chemistry by status.
  g6_4_handling.cleaning_differences_detail: >-
    The differences of `cleaning_differs_by_status`, unmapped with its parent.
  g6_4_handling.handling_records_linkage: >-
    How cleaning and purge records link to production records (WSDA AGR 2121 L 7). CCOF's on-farm handling
    and harvest forms asks the records kept, not their link to production records.
  g6_4_handling.purge_procedure_upload: >-
    Equipment purge procedures and purge amounts (WSDA AGR 2121 L 4). CCOF's on-farm handling and harvest
    forms does not ask for them.
  g6_4_handling.handling_additional_notes: >-
    WSDA AGR 2121 L 18's optional space for the post-harvest section.
