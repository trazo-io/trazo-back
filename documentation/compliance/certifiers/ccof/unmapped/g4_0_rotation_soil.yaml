# Trazo questions in g4_0_rotation_soil that CCOF's G4.0 (Rotation & Soil Management) does not ask.
questions:
  g4_0_rotation_soil.applies_deficiency_materials: >-
    CCOF's G4.0 (ORGB39) does not ask about the National List materials allowed only under a condition. CCOF reads them off the Grower Materials Application (ORGB41), one row per product, where the operator states how each product's restriction is met (`PlanMaterialRestrictionStatement`). Asked by WSDA AGR 2121 D4-D6a and OTCO C4 4.5-1; superset for a CCOF plan, added 2026-11-05 (restricted-materials slice).
