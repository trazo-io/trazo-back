questions:
  g2_0_fraud_prevention.fraud_risk_areas: >-
    Where in the supply chain fraud risk exists (Common OSP section 2). CCOF folds fraud prevention into G8.0 D
    and asks no risk-area inventory: D1's scenarios are stated on G8.0 page D from the sections that answer them,
    and D2 and D3 are cited to G2.0 pages B and C. Until 2026-11-19 this question was cited on D1 as a partial
    stand-in for that checklist.
  g2_0_fraud_prevention.fraud_risk_other: "Free-text elaboration for the `other` option inside
    `fraud_risk_areas`; not a separate CCOF question — G8.0 D1 is a fixed checklist of scenarios
    with no open-ended 'other'."
  g2_0_fraud_prevention.product_testing_detail: "Free-text elaboration (what is tested, and how
    often) for the `product_testing` option inside `fraud_mitigation_practices`; not asked as its
    own CCOF question."
  g2_0_fraud_prevention.fraud_mitigation_other: "Free-text elaboration for the `other` option
    inside `fraud_mitigation_practices`; not a separate CCOF question."
  g2_0_fraud_prevention.fraud_plan_upload: "Optional upload for a written fraud-prevention plan.
    CCOF's G8.0 D references an external 'Fraud Prevention Plan worksheet' as guidance and
    reserves the right to request one for complex operations, but the grower form itself does not
    ask for an attachment."
  g2_0_fraud_prevention.osp_accuracy_process: "Who keeps the OSP accurate, and how. The
    Certification Contract B2 asks only review FREQUENCY (annually/quarterly/monthly/other); it
    does not ask who performs the review or how, which this question captures beyond what either
    form requests."
  g2_0_fraud_prevention.osp_implementation_monitoring_other: "Free-text elaboration for the
    `other` option inside `osp_implementation_monitoring`; not a separate CCOF question."
  g2_0_fraud_prevention.supplier_approval_controls: >-
    How suppliers are approved and followed. Asked by OTCO's fraud prevention plan (2-2) and WSDA AGR 2121 P5; CCOF G8.0 D2 asks only how current organic status is verified, which supplier_certificate_review_frequency answers.
  g2_0_fraud_prevention.supplier_approval_controls_other: >-
    Describes an "other" answer to `supplier_approval_controls` above; same reason.
  g2_0_fraud_prevention.supplier_approval_procedure_upload: >-
    A written supplier approval procedure. Asked by WSDA AGR 2121 P5 ("procedures are attached"); no CCOF form asks for one.
  g2_0_fraud_prevention.residue_screening_method: >-
    The screening or analysis behind the operation's own product testing (laboratory, residue panel).
    Asked by WSDA AGR 2121 P 4a; CCOF's G8.0 fraud-prevention section lists product testing as a practice and never asks the method or the response.
  g2_0_fraud_prevention.residue_detection_response: >-
    How the operation responds when its own testing detects a pesticide residue. Asked by WSDA AGR 2121
    P 4b; CCOF's G8.0 fraud-prevention section lists product testing as a practice and never asks the method or the response.
  # 2026-11-14: questions added for OTCO's fraud prevention plan and WSDA AGR 2121 section P.
  g2_0_fraud_prevention.fraud_reporting_channels: >-
    Where suspected fraud is reported. CCOF's G8.0 section D asks the sourcing scenarios and how
    certificates are verified, not the reporting route; OTCO asks it at OFPP 1-2.
  g2_0_fraud_prevention.fraud_reporting_channels_other: >-
    The other route of `fraud_reporting_channels`; same reason.
  g2_0_fraud_prevention.fraud_reporting_triggers: >-
    What the operation would report as suspected fraud. Asked by WSDA AGR 2121 P 6; CCOF's G8.0 section D
    does not ask it.
  g2_0_fraud_prevention.fraud_reporting_triggers_other: >-
    The other trigger of `fraud_reporting_triggers`; same reason.
  g2_0_fraud_prevention.fraud_plan_kept_separately: >-
    Whether a separate written fraud prevention plan is kept. CCOF asks for no plan document of its own;
    OTCO asks it at OFPP 1-4.
  g2_0_fraud_prevention.ofpp_team: >-
    The fraud prevention team. CCOF names the operation's contacts on the Certification Contract (A4, C1,
    C2), not a team for this plan; OTCO asks it at OFPP 1-1.
  g2_0_fraud_prevention.record_review_frequency: >-
    How often records are reviewed. CCOF G8.0 D3 lists periodic review of records as a way to monitor,
    read through `osp_implementation_monitoring`, without asking how often; WSDA P 2 and OTCO C12 12.3-1
    ask it.
  g2_0_fraud_prevention.employee_evaluation_frequency: >-
    How often staff are observed or evaluated. Asked by WSDA P 2; CCOF does not ask it.
  g2_0_fraud_prevention.ofpp_training_cadence: >-
    When staff are trained on the plan. Asked by OTCO OFPP 4-1 and WSDA P 2; CCOF's forms ask no training
    cadence.
  g2_0_fraud_prevention.ofpp_training_cadence_other: >-
    The other training of `ofpp_training_cadence`; same reason.
  g2_0_fraud_prevention.internal_audits_conducted: >-
    Whether internal audits are conducted. Asked by WSDA P 3; CCOF does not ask it.
  g2_0_fraud_prevention.internal_audit_scope: >-
    The scope and frequency of internal audits. Asked by WSDA P 3a; CCOF does not ask it.
  g2_0_fraud_prevention.written_sops_kept: >-
    Whether written SOPs for organic production or handling are kept. Asked by WSDA P 1; CCOF does not ask
    for SOPs.
  g2_0_fraud_prevention.sop_upload: >-
    The SOPs themselves, on `written_sops_kept`; same reason.
  g2_0_fraud_prevention.fraud_additional_notes: >-
    Optional notes on the section. WSDA P 7's space; CCOF's G8.0 section D has none.
  g2_0_fraud_prevention.supply_chain_shown_as: >-
    The supply chain as a map, flow chart or description. Asked by OTCO OFPP 2-1; CCOF does not ask it.
  g2_0_fraud_prevention.supply_chain_map_upload: >-
    The supply chain as a map, flow chart or description. Asked by OTCO OFPP 2-1; CCOF does not ask it.
  g2_0_fraud_prevention.supply_chain_description: >-
    The supply chain as a map, flow chart or description. Asked by OTCO OFPP 2-1; CCOF does not ask it.
  g2_0_fraud_prevention.critical_control_points: >-
    OTCO OFPP 3-1's vulnerability table: each critical control point with its prevention strategies and
    its monitoring. CCOF's G8.0 D1 asks a checklist of sourcing scenarios instead, stated on
    G8.0 page D from the modules each scenario points to.
