questions:
  g5_0_pest.monitoring_scope: "§ 205.201(a)(3) monitoring plan. CCOF's G5.0 (ORGB42) has no
    monitoring section — this is superset tracking of what is monitored (pest populations,
    disease pressure, weed pressure, beneficial activity), paired with monitoring_frequency and
    monitoring_records below."
  g5_0_pest.monitoring_frequency: "§ 205.201(a)(3) monitoring plan. CCOF's G5.0 (ORGB42) has no
    monitoring section — this is superset tracking of how often pest/disease/weed monitoring is
    performed, with suggestions derived from the median gap between logged scouting records."
  g5_0_pest.monitoring_records: "§ 205.201(a)(3) monitoring plan. CCOF's G5.0 (ORGB42) has no
    monitoring section — this is superset tracking of how monitoring results are recorded."
  g5_0_pest.monitoring_methods: >-
    Which method does the monitoring (scouting, traps, modeling, yield comparison). Asked by WSDA AGR 2121 F1, G1, H1 and OTCO C5 5.3-1; CCOF G5.0 asks the conditions for using materials, not the monitoring method.
  g5_0_pest.monitoring_methods_other: >-
    The other-method text of the question above; same reason.
  g5_0_pest.weed_monitoring_frequency: >-
    How often weeds are monitored. Asked by WSDA AGR 2121 F2; CCOF G5.0 asks no monitoring frequency.
  g5_0_pest.pest_monitoring_frequency: >-
    How often pests are monitored. Asked by WSDA AGR 2121 G2; same reason.
  g5_0_pest.disease_monitoring_frequency: >-
    How often diseases are monitored. Asked by WSDA AGR 2121 H2; same reason.
  g5_0_pest.applies_copper_materials: >-
    CCOF's G5.0 (ORGB42) does not ask about copper. CCOF reads copper products off the Grower Materials Application (ORGB41), where the operator states how each product's restriction is met. Asked by WSDA AGR 2121 H5/H5a; superset for a CCOF plan, added 2026-11-05 (restricted-materials slice).
  g5_0_pest.copper_accumulation_practices: >-
    CCOF's G5.0 (ORGB42) does not ask about copper. CCOF reads copper products off the Grower Materials Application (ORGB41), where the operator states how each product's restriction is met. Asked by WSDA AGR 2121 H5/H5a; superset for a CCOF plan, added 2026-11-05 (restricted-materials slice).
  g5_0_pest.copper_accumulation_other: >-
    CCOF's G5.0 (ORGB42) does not ask about copper. CCOF reads copper products off the Grower Materials Application (ORGB41), where the operator states how each product's restriction is met. Asked by WSDA AGR 2121 H5/H5a; superset for a CCOF plan, added 2026-11-05 (restricted-materials slice).
  g5_0_pest.pests_diseases_of_concern: >-
    The pests and diseases the operation faces, named (OTCO C5 5.1-1). CCOF's G5.0 (ORGB42) asks practices
    by pest type, not a named list; superset for a CCOF plan.
  g5_0_pest.pest_taxa_managed: >-
    The kinds of crop pest managed (WSDA AGR 2121 G 3). CCOF's G5.0 groups practices under Insects &
    invertebrates and Vertebrate pests columns and asks no kinds; superset.
  g5_0_pest.pest_taxa_other: >-
    The other kinds of `pest_taxa_managed`, unmapped with their parent.
  g5_0_pest.pest_prevention_records: >-
    Records kept of preventive pest management (WSDA AGR 2121 G 5). CCOF's G5.0 asks the practices, and its
    G8.0 asks records generally; it asks no description of these.
  g5_0_pest.weed_prevention_records: >-
    Records kept of preventive weed management (WSDA AGR 2121 F 6); same reason as
    `pest_prevention_records`.
  g5_0_pest.weed_management_additional_notes: >-
    WSDA AGR 2121 F 7's optional space for the weed section. CCOF's G5.0 has no section of its own for
    weeds.
  g5_0_pest.plastic_mulch_material: >-
    What the plastic mulch is made of, against section 205.601(b)(2) (WSDA AGR 2121 F 4). CCOF's G5.0 §A
    asks plastic mulch as a practice, not its material; superset.
  g5_0_pest.plastic_mulch_perennial_condition: >-
    Plastic mulch in a perennial planting (WSDA AGR 2121 F 5a). CCOF's G5.0 does not ask it.
