questions:
  g4_2_natural_resources.water_quality_tested: >-
    Trazo's own addition — feeds the `natural_resources_condition` record type — with no
    counterpart on either ORGB43 or ORGB40's section D.
  g4_2_natural_resources.water_quality_test_frequency: >-
    Companion frequency field to `water_quality_tested` above; same reason.
  g4_2_natural_resources.irrigation_efficiency_monitoring: >-
    How irrigation efficiency is checked (sensors, observation, scheduling software). Asked by WSDA AGR 2121 E10; CCOF G4.2 asks which water practices are used, not how their efficiency is monitored.
  g4_2_natural_resources.irrigation_efficiency_monitoring_other: >-
    Describes an "other" answer to `irrigation_efficiency_monitoring` above; same reason.
  g4_2_natural_resources.streams_or_channels_adjacent: >-
    WSDA AGR 2121 section E ref 16 asks whether streams, shorelines, gullies or irrigation channels are
    on or adjacent to the certified sites. CCOF G4.2 asks how riparian areas and wetlands are protected,
    never whether streams or channels are present.
  g4_2_natural_resources.permanent_ground_cover_90pct: >-
    Permanent ground cover on at least 90% of the ground. Asked by WSDA AGR 2121 E 4, which uses it with E
    5 to skip its soil stability list; CCOF asks no such threshold.
  g4_2_natural_resources.slope_under_10pct: >-
    Land slope under 10% at all certified sites. Asked by WSDA AGR 2121 E 5, with E 4; CCOF asks no slope.
  g4_2_natural_resources.water_verification_method: >-
    How irrigation water is verified free of contaminants. Asked by OTCO C9 9.2-1a; CCOF G6.0 section D
    asks the source and its additives, not how it is verified.
  g4_2_natural_resources.water_verification_method_other: >-
    The other way of `water_verification_method`; same reason.
  g4_2_natural_resources.water_contaminants_tested: >-
    What a laboratory test of the irrigation water covers, under OTCO C9 9.2-1a; same reason as
    `water_verification_method`.
  g4_2_natural_resources.water_contaminants_tested_other: >-
    The other contaminant of `water_contaminants_tested`; same reason.
  g4_2_natural_resources.district_additive_types: >-
    OTCO C9 9.2-1b's plan element: the materials the district adds. CCOF G6.0 D5 asks the measures taken,
    answered by `irrigation_district_mitigation`.
  g4_2_natural_resources.district_additive_timing: >-
    OTCO C9 9.2-1b's plan element: their frequency and timing. CCOF G6.0 D5 asks the measures taken,
    answered by `irrigation_district_mitigation`.
  g4_2_natural_resources.district_notifies_before_treatment: >-
    OTCO C9 9.2-1b's plan element: that the district gives notice before it applies. CCOF does not ask it.
  g4_2_natural_resources.irrigation_materials_all_approved: >-
    Whether every material put through the irrigation system is approved for organic production. Asked by
    WSDA AGR 2121 E 8b; CCOF G6.0 D6 asks each material listed on the Materials Application, where each is
    reviewed.
  g4_2_natural_resources.irrigation_contamination_prevention: >-
    How certified crops are kept from unapproved materials in the irrigation system, on WSDA AGR 2121 E
    8b's No; same reason as `irrigation_materials_all_approved`.
