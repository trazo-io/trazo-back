questions:
  g8_0_record_keeping.trace_mechanisms: >-
    What besides lot numbers traces a sale back to the field (OTCO C12 12.2-3, WSDA AGR 2121 §O 8). CCOF G8.0 B2 asks the lot numbering only.
  g8_0_record_keeping.trace_mechanisms_other: >-
    The operator's own words for "Other" on the question above; same reason.
  g8_0_record_keeping.export_certificate_process: "Superset — how export certificates are requested,
    verified, and kept. CCOF's G8.0 A1 table only lists 'NOP Import Certificates' for operations
    exporting FROM Mexico; it does not ask a process question for a US operation exporting TO other
    countries."
  g8_0_record_keeping.export_certificate_types_other: "Free-text elaboration for the `other` option
    inside `export_certificate_types`; not a separate CCOF question."
  g8_0_record_keeping.export_destination_requirements: "Superset — destination-country labeling and
    production requirements. Not asked by G8.0; CCOF's only export-adjacent line item is the Mexico-import
    row in A1."
  g8_0_record_keeping.import_documentation: "Superset — CCOF's G8.0 A1 table addresses only 'Export
    from Mexico to the US' (the operation as Exporter of Record); it has no general import-documentation
    question for an operation importing FROM other countries."
  g8_0_record_keeping.import_documentation_other: "Free-text elaboration for the `other` option inside
    `import_documentation`; not a separate CCOF question."
  g8_0_record_keeping.import_export_records: "Superset — which import/export records are kept (certificates,
    contracts, phytosanitary, entry summary, labeling). G8.0's A1 table names only 'NOP Import Certificates'
    for the Mexico-export case; this question asks a broader record inventory CCOF does not request on
    this form."
  g8_0_record_keeping.import_integrity_verification: "Superset — verifying an imported shipment had no
    contact with prohibited substances or ionizing radiation since export. G8.0's only import-adjacent
    text is the Mexico-export row's 'not treated or exposed to a prohibited substance' requirement,
    addressed from the exporter's side, not a general importer's."
  g8_0_record_keeping.port_integrity_measures: "Superset — port-of-export/entry integrity measures. Not
    asked by G8.0; Trazo's G8.0 page C is broader than the single Mexico-export row on the grower form."
  g8_0_record_keeping.records_location: "WSDA AGR 2121-O question 5 asks whether all organic records are
    kept at the primary business location, and routes a No to their AGR 2519. CCOF's G8.0 asks nothing
    about WHERE records live — its Section A is the record-type table and the five-year retention
    attestation. Asked of every operation rather than only WSDA's, because § 205.103(c) availability is a
    fact about the operation, not about the certifier."
  g8_0_record_keeping.additional_records_locations: "Follow-up to `records_location`; see that entry.
    CCOF has no counterpart question."
  g8_0_record_keeping.primary_contact_records_access: "WSDA AGR 2121-O question 6. CCOF's G8.0 does not
    ask whether the primary contact can reach every record, nor for a backup record-holder."
  g8_0_record_keeping.records_access_delegate: "Follow-up to `primary_contact_records_access`; see that
    entry. CCOF has no counterpart question."
  g8_0_record_keeping.records_maintained_as: "WSDA AGR 2121-O question 7 (electronic / hardcopy). CCOF's
    G8.0 does not ask what medium the records are kept in."
  g8_0_record_keeping.records_maintained_as_other: >-
    The other way of `records_maintained_as`, unmapped with its parent.
  g8_0_record_keeping.sources_organic_products: >-
    Whether the operation sources organic agricultural products, as a yes or no. Asked by OTCO C12 12.2-4;
    CCOF G8.0 D1 asks the sourcing scenarios as a checklist instead.
  g8_0_record_keeping.sells_as_organic: >-
    Whether the operation sells crops or crop products as organic. Asked by OTCO C12 12.2-5; CCOF reads it
    from the label categories (G7.0).
  g8_0_record_keeping.records_identify_organic_status: >-
    Whether records identify organic status from harvest through sale. Asked by OTCO C12 12.2-5a; CCOF
    G8.0 asks how records distinguish organic from nonorganic only for a split operation (C2, C3).
  g8_0_record_keeping.records_organic_status_explanation: >-
    Whether records identify organic status from harvest through sale, on a No. Asked by OTCO C12 12.2-5a;
    same reason as `records_identify_organic_status`.
  g8_0_record_keeping.export_package_types: >-
    Packages and labels used for export markets (WSDA AGR 2121 §Q 8). CCOF asks import and export on its
    Global Market Access Application (GMA04), which ccof/scope.yaml excludes as export-programme enrolment;
    its contract D2 asks only the markets.
  g8_0_record_keeping.export_shipment_documents: >-
    Documents that travel with each export shipment (WSDA AGR 2121 §Q 9, OTCO C8 8.4-3). CCOF asks import and
    export on its Global Market Access Application (GMA04), which ccof/scope.yaml excludes as export-programme
    enrolment; its contract D2 asks only the markets.
  g8_0_record_keeping.export_shipment_documents_other: >-
    The other document of `export_shipment_documents`, unmapped with its parent.
  g8_0_record_keeping.equivalency_compliance_method: >-
    How exported products meet the destination's equivalency arrangement (OTCO C8 8.4-4). CCOF asks import and
    export on its Global Market Access Application (GMA04), which ccof/scope.yaml excludes as export-programme
    enrolment; its contract D2 asks only the markets.
  g8_0_record_keeping.equivalency_compliance_method_other: >-
    The other way of `equivalency_compliance_method`, unmapped with its parent.
  g8_0_record_keeping.canada_export_possible: >-
    Whether crops may reach Canada, directly or through a buyer (WSDA AGR 2121 §Q Critical Variances: Canada
    1). CCOF asks import and export on its Global Market Access Application (GMA04), which ccof/scope.yaml
    excludes as export-programme enrolment; its contract D2 asks only the markets.
  g8_0_record_keeping.sodium_nitrate_used: >-
    Whether sodium nitrate is used, asked where crops may reach Canada (WSDA AGR 2121 §Q Critical Variances:
    Canada 2). CCOF asks import and export on its Global Market Access Application (GMA04), which
    ccof/scope.yaml excludes as export-programme enrolment; its contract D2 asks only the markets.
  g8_0_record_keeping.sodium_nitrate_canada_separation: >-
    How crops grown with sodium nitrate are kept from those eligible for Canada (WSDA AGR 2121 §Q Critical
    Variances: Canada 2a). CCOF asks import and export on its Global Market Access Application (GMA04), which
    ccof/scope.yaml excludes as export-programme enrolment; its contract D2 asks only the markets.
  g8_0_record_keeping.import_seed_countries: >-
    Countries organic seed or planting stock is imported from (WSDA AGR 2121 §Q 2). CCOF asks import and
    export on its Global Market Access Application (GMA04), which ccof/scope.yaml excludes as export-programme
    enrolment; its contract D2 asks only the markets.
  g8_0_record_keeping.import_seed_countries_other: >-
    The other countries of `import_seed_countries`, unmapped with their parent.
  g8_0_record_keeping.import_seed_standards: >-
    Organic standards imported seed or planting stock is certified to (WSDA AGR 2121 §Q 3). CCOF asks import
    and export on its Global Market Access Application (GMA04), which ccof/scope.yaml excludes as
    export-programme enrolment; its contract D2 asks only the markets.
  g8_0_record_keeping.import_seed_standards_other: >-
    The other standard of `import_seed_standards`, unmapped with its parent.
  g8_0_record_keeping.records_additional_notes: >-
    WSDA AGR 2121 O 9's optional space for the record keeping section. CCOF's G8.0 has no free space of its
    own.
