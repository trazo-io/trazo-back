questions:
  g9_0_facility_pest.preventive_measures_documentation: >-
    How the operation documents that prevention and mechanical controls were not enough before a material is
    applied (the § 205.271(a)-(d) sequence; WSDA AGR 2121 M asks it). CCOF's Materials Application §F and §G list
    the materials themselves, which the materials list answers.
  g9_0_facility_pest.uses_pest_control_company: "§205.271 requires notifying any contracted pest control operator that the site
    is certified organic. CCOF's G6.2 form (the only grower form whose B3-B9 substantively maps to G9.0) does not ask whether a
    contracted pest control company is used as its own distinct checkbox. Trazo asks it directly as a named-company gate."
  g9_0_facility_pest.pest_control_company_name: "Companion detail field to uses_pest_control_company — same reasoning."
  g9_0_facility_pest.pest_control_company_notified: "Companion detail field to uses_pest_control_company — same reasoning
    (§205.271 notification requirement)."
  g9_0_facility_pest.preventive_measures_documentation_other: "Companion detail field to preventive_measures_documentation,
    which the Materials Application register (ref F) already cites for the National List material-type table it maps to —
    this free-text \"other\" elaboration has no separate CCOF counterpart of its own."
  g9_0_facility_pest.pest_monitoring_practices: >-
    How facility pest pressure is monitored. Asked by WSDA AGR 2121 M3; CCOF asks facility pest controls in G6.2 B3 and B4, not the monitoring practice.
  g9_0_facility_pest.pest_monitoring_frequency: >-
    How often facility pests are monitored. Asked by WSDA AGR 2121 M3; same reason.
  g9_0_facility_pest.facility_pest_records_upload: >-
    Files for the facility pest records the plan says are kept (`pest_control_records`). CCOF's G6.2
    B9 asks how pest control material use is recorded, not for the records themselves; these are the
    § 205.103 records an inspector reviews on site. The upload lets the packet carry them beside
    modules/G9_0.pdf.
  g9_0_facility_pest.facility_pest_problems: "OTCO C7 7.8-1 and WSDA M 2 ask which pests the plan covers. CCOF's G6.2 B3 to B9 ask prevention, controls, materials and records, not the pests themselves."
  g9_0_facility_pest.facility_pest_problems_other: "Free-text rider on facility_pest_problems."
  g9_0_facility_pest.bait_station_use: "WSDA M 5's bait station placement and bait. CCOF G6.2 asks how materials are kept from contaminating crops (B8), answered by contamination_prevention, not bait station placement."
  g9_0_facility_pest.bait_station_use_other: "Free-text rider on bait_station_use."
