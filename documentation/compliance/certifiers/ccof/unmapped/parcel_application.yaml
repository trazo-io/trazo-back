# Trazo questions in parcel_application that CCOF's Parcel Application does not ask. Until
# 2026-09-09 every parcel question was cited by a CCOF row, so this file did not exist; the OTCO
# register delta added one question CCOF has no counterpart for.
questions:
  parcel_application.treated_lumber_contact_prevention: >-
    Asked by OTCO C9 §9.3 (how contact between existing treated lumber and organic crops or livestock is prevented). CCOF asks whether treated lumber is present and for its description and install date (Parcel Application A10 / A10a) and, on G6.0 B2, the going-forward replacement policy — never the measure that keeps installed lumber off organic crop and soil.
  parcel_application.certified_operation_name: >-
    Asked by OTCO C2 2.1-7 ('provide the certified operation's name and certification agency') and
    WSDA AGR 2264 ref 6 ('operation name'). CCOF F2 asks only whether the parcel is currently
    certified and §G asks for the certificate itself; the operation named on that certificate is
    read off the copy, never asked as a field.
  parcel_application.prior_certificate_site_number: >-
    Asked by WSDA AGR 2264 ref 6 and AGR 2262 ref 5 ('WSDA site number' / 'the site number as listed
    on your certificate') — WSDA's own numbering for a certified site. CCOF identifies a parcel by
    APN and name and prints no per-parcel number on its certificate, so its Parcel Application has
    nothing to ask.
  parcel_application.no_inputs_within_tenure: >-
    Asked by WSDA AGR 2264 ref 13 ('N/A — No input materials have been applied while under my
    management'). CCOF's Parcel Application asks about PROHIBITED material only (F4, the date of the
    last prohibited application, answered by dlpm_none_within_tenure and the land history); it never
    asks whether any input at all was applied.
