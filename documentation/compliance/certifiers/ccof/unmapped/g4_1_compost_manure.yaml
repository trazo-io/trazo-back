questions:
  g4_1_compost_manure.purchased_compost_documentation: >-
    CCOF's G4.1 requires only that purchased compost/manure appear on the Grower Materials
    Application (OSP Materials List, section A1); it does not ask the operator to keep the
    supplier's process description or analysis on file. Trazo superset.
  g4_1_compost_manure.purchased_compost_upload: >-
    The attachment mechanism for `purchased_compost_documentation` above; same reason.
  g4_1_compost_manure.raw_manure_source: >-
    Asked by OTCO C4 §4.3 (is the manure purchased or produced off-farm). This certifier's G4.1 asks whether raw manure is applied and how the interval and water-protection rules are met, never where the manure comes from.
  g4_1_compost_manure.raw_manure_supplier_statement: >-
    Asked by OTCO C4 §4.3 (label or supplier statement that purchased manure is untreated). This certifier's forms ask for no manure-provenance document; the material's listing is judged on the Materials Application instead.
