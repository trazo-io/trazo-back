# Trazo questions in g6_0_production that CCOF's G6.0 (Organic Production & Split Operations) does
# not ask. Until 2026-09-09 every g6_0 question was cited by a CCOF row, so this file did not exist;
# the OTCO register delta added three questions CCOF has no counterpart for.
questions:
  g6_0_production.nonorganic_system_materials: >-
    Asked by OTCO C9 §9.4 (a list of materials used in the non-organic production system). This certifier's split-operation questions ask how organic and non-organic product are kept apart and how prohibited materials are stored, never for the conventional side's own materials list.
  g6_0_production.runoff_risk_present: >-
    Asked by OTCO C9 §9.3 (risk of runoff carrying prohibited materials onto organic land). This certifier asks about drift and about buffers per border; water-borne contamination from neighbouring land is not a separate question.
  g6_0_production.runoff_mitigation_plan: >-
    Asked by OTCO C9 §9.3 (the runoff mitigation plan). Follows the runoff-risk question above, which this certifier does not ask.
  g6_0_production.nonorganic_crops_products: >-
    The non-organic crops a split operation produces. OTCO C9 9.4-1 asks for them; CCOF's G6.0 asks how production is kept separate, not what the non-organic side grows.
  g6_0_production.treated_lumber_planned_installations: >-
    Planned treated-lumber installations and how contact is prevented. OTCO C9 9.3-4 asks it; CCOF G6.0 B2 asks only the replacement policy, which `treated_lumber_policy` answers.
  g6_0_production.equipment_shared_with_nonorganic: >-
    Whether listed equipment also works non-organic crops or land (WSDA I 2, OTCO C9 9.1-1). CCOF's C2 table carries it per item as "dedicated to organic only?", which the equipment register answers.
  g6_0_production.dedicated_equipment_contamination_prevention: >-
    How dedicated equipment is kept from prohibited materials and marked (WSDA I 1a). CCOF G6.0 does not ask it.
  g6_0_production.equipment_cleaning_materials_listed: >-
    Whether cleaning materials are on the materials list (OTCO C9 9.1-1a). CCOF G6.0 C2 asks the materials per item, which the equipment register holds.
  g6_0_production.equipment_notes: >-
    Free space for anything else about equipment (WSDA I 4). CCOF G6.0 has no such line.
  g6_0_production.drift_risk_present: >-
    OTCO C9 9.3-1 asks for a Yes/No on the risk of drift from neighboring non-organic producers. CCOF
    G6.0 A2 asks the safeguards directly, with 'None, no surrounding use of prohibited materials' as its
    negative.
