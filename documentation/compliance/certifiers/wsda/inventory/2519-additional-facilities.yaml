  reason: 'The form has no numbered items: a header, headed sections and three responsibility statements.'
- op: add
  ref: Activity Information
  after: Location Information
  text: 'Identify the general types of activities occurring at this facility or location: General activities / Production
    activities / Handling activities that are potentially exempt / Handling activities that require certification'
  kind: question
  reason: 'The form has no numbered items: a header, headed sections and three responsibility statements.'
- op: add
  ref: Description
  after: Activity Information
  text: Provide a description of the organic activities occurring at this location. Include details about the specific
    organic crop types, livestock, or products involved.
  kind: question
  reason: 'The form has no numbered items: a header, headed sections and three responsibility statements.'
- op: add
  ref: Responsibility
  after: Description
  text: Identify the responsible party and attach the requested information.
  kind: question
  reason: 'The form has no numbered items: a header, headed sections and three responsibility statements.'
- op: add
  ref: Responsibility (exemption explanation)
  after: Responsibility
  text: 'Briefly explain how the third-party is exempt from certification:'
  kind: question
  reason: 'The form has no numbered items: a header, headed sections and three responsibility statements.'
- op: add
  ref: Additional Comments
  after: Responsibility (exemption explanation)
  text: 'Additional Comments:'
  kind: question
  reason: 'The form has no numbered items: a header, headed sections and three responsibility statements.'
- op: add
  ref: Note (who must be certified)
  after: Additional Comments
  text: In general, any business involved in the organic supply chain must be certified. There are only narrow exemptions
    for retail establishments and some handlers of tamper-evident packaged products. WSDA must be able to verify
    any uncertified operation in your supply chain qualifies for an exemption under section 205.101 of the USDA
    organic regulations.
  kind: instruction
  reason: 'The form has no numbered items: a header, headed sections and three responsibility statements.'
