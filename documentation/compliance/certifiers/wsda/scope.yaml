forms:
- form: Handler Organic System Plan
  document_id: AGR 2180
  disposition: decision
  reason: Trazo covers simple on-farm post-harvest handling of a farm's own crop (WSDA Crop Producer OSP
    §K Storage, §L Post-Harvest). Complex handling, multi-ingredient products and third-party processing
    are a different certification scope and a different product — WSDA certifies handling under a
    separate Handler OSP (product flow, equipment cleaning and sanitation). A farm needing the Handler OSP
    files it with WSDA Organic Program directly.
  note: >-
    INTERNAL. Same product-scope decision as the CCOF H-series (ORGB32) exclusion — it does not depend
    on the certifier. The title said "sections A-P" and the reason "17-lettered-section" — two counts, neither checked
    against the live form, both printed to a WSDA reviewer. Both removed 2026-09-10 (WSDA desk read);
    re-read the live form before quoting a count.
- form: Processed Product Application
  document_id: AGR 2523
  disposition: decision
  reason: Application to add a processed (multi-ingredient) product to a handler's certified scope. Same
    handler/processor certification scope excluded above — Trazo does not carry a farm into a handler-scope
    application.
- form: Handled Product Application
  document_id: AGR 2524
  disposition: decision
  reason: Application to add a handled (single-ingredient, minimally processed) product to a handler's
    certified scope. Same handler/processor certification scope exclusion as AGR 2523.
- form: Multi- and Single-Ingredient Processed Product Formulation
  document_id: AGR 2178 / AGR 2179
  disposition: decision
  reason: Ingredient-percentage formulation worksheets for a handler's processed-product recipe. Handler-side;
    a grower shipping raw or lightly-handled crop has no 'formulation' to declare. Same handler/processor
    scope exclusion.
- form: Natural Flavor Questionnaire
  document_id: AGR 2700
  disposition: decision
  reason: Characterizes a purchased natural-flavor ingredient's own processing, for a handler's product
    formulation. Handler-side ingredient sourcing; same scope exclusion.
- form: Non-Organic Ingredient Affidavit
  document_id: AGR 2252
  disposition: decision
  reason: Attests to a nonorganic ingredient used in a handler's multi-ingredient product. Handler-side
    product formulation, not something a crop grower selling raw or lightly-handled produce needs.
  note: >-
    INTERNAL. The reason used to say "below the 5% threshold, in a 'Made with Organic' product",
    which is wrong on the rules: 5% is the "organic" category's nonorganic allowance and "made
    with" allows up to 30% (§ 205.301). Removed 2026-09-11 rather than restated, because the
    affidavit's exact scope has not been read off the live form. WSDA also certifies handlers;
    it does not "license" them. Not to be confused with CCOF's Exempt Handler Affidavit gap (an uncertified
    transporter/storage/supplier exemption) — that one IS a real grower-side trigger and is still
    unrepresented. Different form, different problem.
- form: Ingredient Commercial Availability
  document_id: AGR 2251
  disposition: decision
  reason: WSDA's handler-side commercial-availability worksheet for a nonorganic ingredient in a processed
    product. Handler scope; same exclusion. It is not the grower-side seed and planting-stock
    commercial-availability search, which this plan does answer.
  note: >-
    INTERNAL. The grower-side equivalent is `g3_0_seeds.ca_search_before_use`.
- form: New Application for Organic Certification
  document_id: AGR 2500
  disposition: decision
  reason: >-
    The one-time application an operation files to enter the organic program — contacts, sites,
    products and the signed agreement. Trazo serves already-certified operations preparing an
    annual renewal, so the plan starts from an existing certification rather than establishing
    one. A first-time applicant files this directly.
  note: >-
    INTERNAL. ⚠️ ASYMMETRY: the CCOF-side equivalent (its certification contract) IS registered,
    24 rows, because the signed agreement's clauses — annual update, five-year records, drift
    notification — are ongoing obligations rather than application detail. The same clauses are
    in this form. Registering it is the honest way to close that difference.

- form: Annual Renewal Application
  document_id: Renewal application
  disposition: decision
  renewal_role: annual_renewal
  reason: >-
    The renewal application a certified operation files with WSDA by March 1 each year ("your
    business must renew your application by March 1 each year"). WSDA does not publish it among
    its blank forms, so it is not reproduced here. The year's changes it asks for are on the
    annual update pages of this packet, and the site update (AGR 2516) and renewal fee (AGR 2521)
    forms are listed with it.
  note: >-
    INTERNAL. Source: https://agr.wa.gov/departments/organic/new-applicant-info and
    /forms-and-applications ("The renewal application may prompt you to complete additional update
    forms"), read 2026-10-01. Audit 2026-10 §5 calls it individualized; no copy was retrieved.

- form: Organic Contact Information
  document_id: AGR 2515
  disposition: decision
  reason: >-
    Names and contact details for the people the agent corresponds with. The plan records the
    operation's responsible person and prints it on the packet cover; keeping the agent's own
    contact roster current is done with the agent directly.

- form: Organic Label Approval Verification
  document_id: AGR 2724
  disposition: gap
  triggered_from: "AGR 2121 §N (labeling) — any label bearing an organic claim or the agent's mark"
  reason: >-
    Trazo does not generate this form, and label artwork is not attached to this plan. The
    labeling section records how product is identified and what claims are used; the artwork
    itself goes to the agent directly for approval.
  note: >-
    INTERNAL. Since 2026-10-01 label files uploaded for g7_0_labeling.label_files_upload ride in the
    packet under labels/ (T19); approval status per label is still not recorded.

- form: New Applicant Fee
  document_id: AGR 2499
  disposition: decision
  reason: >-
    A fee paid by the operation to the agent. It sets what certification costs, not how the
    operation farms.
