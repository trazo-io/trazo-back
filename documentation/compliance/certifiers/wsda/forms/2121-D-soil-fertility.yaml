form:
  code: "D"
  title: "Soil Fertility and Crop Nutrient Management"
  document_id: "AGR 2121"
  revision: "R 02/25"
  url: "https://agr.wa.gov/departments/organic/forms-and-applications"
  retrieved: 2026-08-28
  nop_cites: ["§ 205.203", "§ 205.205"]
  guide_trigger: "Crop Producer Organic System Plan (AGR 2121) — filed once by every crop producer applicant; WSDA runs a LIVING plan, so a renewing operation updates the sections that changed rather than re-filing the whole OSP (the March 1 deadline is the renewal application and fee)"
  required_of_every_grower: true
  trazo_module: [g4_0_rotation_soil, g4_1_compost_manure]
  register_status: complete
  source_sha256: b88f4d97b1f6999ea96863e5c082cfffdf52bdbac5058dd08e14c5553d3b1a18

items:
  - ref: '1'
    asks: How do you monitor soil health and soil organic matter? Crop quality / Crop yields / Microbiological
      testing / Observation of plant health / Observation of soil / Plant tissue testing / Soil testing / Other.
    status: partial
    severity: P1
    trazo:
      questions:
      - g4_0_rotation_soil.fertility_monitoring
      prints: modules/G4_0.pdf §C; narrative § 205.201(a)(3)
    gap: 'WSDA asks this as one merged question, which is actually the shape Trazo''s own `fertility_monitoring`
      list already has (CCOF''s G4.0 splits the same content into a monitoring-methods B1 and a lab-testing-types
      B2, which Trazo''s single list was registered against as `partial`/P1 for merging what CCOF keeps separate
      — that specific critique does not apply to WSDA''s own, already-merged D1). What still does not line up
      is the option vocabulary: WSDA''s 8 options include microbiological testing, crop-yield comparison and
      observation of soil, none of which exist in Trazo''s 5-option list (`soil_tests, tissue_tests, organic_matter,
      crop_observation, no_testing`), and the exclusive `no_testing` option still blocks the common honest answer
      ''we observe but do not lab-test.'''
    fix: Add `microbiological_testing`, `crop_yield_comparison` and `soil_observation` to `fertility_monitoring`;
      drop the `no_testing` exclusive flag; add `daily`/`weekly` to `monitoring_frequency` (WSDA's 1a is open
      text, so any fixed radio will always be an approximation).
  - ref: 1a
    asks: How often do you take these tests or make these observations?
    status: partial
    severity: P2
    trazo:
      questions:
      - g4_0_rotation_soil.monitoring_frequency
      prints: modules/G4_0.pdf §C
    gap: WSDA's 1a is open text; `monitoring_frequency` is a fixed radio without daily or weekly.
    fix: Add `daily` and `weekly` to `monitoring_frequency`.

  - ref: "2"
    asks: "How do you manage soil health? (Animal manure / Annual crop rotation / Compost / Compost tea / Conservation cover - Perennial / Cover crop - Annual / Fallow rotations / Foliar fertilizers / Green manure / Incorporate crop or pruning residues / Mulching / Rock minerals / Soil inoculants / Other.)"
    status: covered
    trazo:
      questions: [g4_0_rotation_soil.fertility_components, g4_0_rotation_soil.fertility_components_other]
      prints: "modules/G4_0.pdf §B; narrative § 205.201(a)(1)"
    # Re-read 2026-11-02 by the compost and manure slice.

  - ref: "3"
    asks: "Which tillage practices are used? (Contour farming / Moisture monitoring prior to tillage / No till / Reduced till / Ridge till / Seasonal till / Other.)"
    status: covered
    trazo:
      questions: [g4_0_rotation_soil.tillage_practices]
      prints: "modules/G4_0.pdf §B; narrative § 205.203(a)"
  - ref: '4'
    asks: Do you apply synthetic micronutrients or magnesium sulfate to manage plant or soil deficiencies? Yes
      / No.
    status: not_covered
    severity: P2
    gap: No field asks whether the operation applies synthetic micronutrients or magnesium sulfate, or how a
      deficiency is verified before use — the § 205.601 condition attached to these materials. `fertility_components`
      has a generic `blended_fertilizers` option but no synthetic-micronutrient-specific gate or verification-method
      capture.
    fix: Add `applies_synthetic_micronutrients` [boolean] and, visible when yes, `micronutrient_deficiency_verification`
      [checkbox_group] {crop_advisor, documented_regional_deficiency, soil_tissue_analysis, visual_observation,
      other}; cite § 205.601.
  - ref: 4a
    asks: If yes, how do you verify specific deficiencies relevant to each crop or field prior to application?
      Recommendations from a crop advisor / Documented regional deficiency / Soil or tissue analysis / Visual
      observation / Other.
    status: not_covered
    severity: P2
    trazo:
      prints: —
    gap: No field captures how a deficiency is verified before a synthetic micronutrient is applied (the § 205.601
      condition).
    fix: 'Part of the 4 fix: `micronutrient_deficiency_verification` [checkbox_group], visible when yes.'
  - ref: '5'
    asks: Do you apply calcium chloride? Yes / No.
    status: not_covered
    severity: P2
    gap: No field captures calcium chloride use, foliar-application method, or the physiological disorder it
      treats — the § 205.601 condition limiting this material to control of a physiological disorder associated
      with calcium uptake is unrepresented.
    fix: Add `applies_calcium_chloride` [boolean], and visible when yes, `calcium_chloride_foliar` [boolean]
      and `calcium_chloride_disorder_treated` [text]; cite § 205.601.
  - ref: 5a (foliar spray)
    asks: If yes, is it applied as a foliar spray? Yes / No. (WSDA prints two items numbered 5a; this is the
      first.)
    status: not_covered
    severity: P2
    trazo:
      prints: —
    gap: No field captures whether calcium chloride is applied as a foliar spray.
    fix: 'Part of the 5 fix: `calcium_chloride_foliar` [boolean].'
  - ref: 5a (disorder treated)
    asks: If yes, identify what physiological disorder is it used to treat? (The second item WSDA numbers 5a.)
    status: not_covered
    severity: P2
    trazo:
      prints: —
    gap: No field captures the physiological disorder calcium chloride treats, the § 205.601 condition on its
      use.
    fix: 'Part of the 5 fix: `calcium_chloride_disorder_treated` [text].'
  - ref: '6'
    asks: Do you apply potassium chloride? Yes / No.
    status: not_covered
    severity: P2
    gap: 'No field captures potassium chloride use or the chloride-accumulation-minimization condition attached
      to it. Same class of gap as this form''s own H5 (copper sulfate / fixed coppers): a specific § 205.601
      material with a soil-accumulation condition and no dedicated field.'
    fix: Add `applies_potassium_chloride` [boolean] and, visible when yes, `chloride_accumulation_mitigation`
      [textarea]; cite § 205.601.
  - ref: 6a
    asks: If yes, how do you ensure it is applied in a way that minimizes chloride accumulation in the soil?
    status: not_covered
    severity: P2
    trazo:
      prints: —
    gap: No field captures how chloride accumulation is minimized.
    fix: 'Part of the 6 fix: `chloride_accumulation_mitigation` [textarea].'

  - ref: "7"
    asks: "Do you use compost or compost tea that you make on-farm? (Yes / No, skip to question 10.)"
    status: covered
    trazo:
      questions: [g4_1_compost_manure.materials_applied, g4_1_compost_manure.compost_tea_made_on_farm]
      prints: "modules/G4_1.pdf §A, §C"
    # Re-read 2026-11-02 by the compost and manure slice.

  - ref: "8"
    asks: "What types of feedstocks are used in your compost or compost tea process? (Manure or other animal materials / Plant materials / Newspapers or other recycled papers (without glossy or colored ink) / Other.)"
    status: covered
    trazo:
      questions: [g4_1_compost_manure.compost_feedstocks, g4_1_compost_manure.compost_feedstocks_detail]
      prints: "modules/G4_1.pdf §C; narrative § 205.203(c)(2)"
    # Re-read 2026-11-02 by the compost and manure slice.
  - ref: '9'
    asks: Do you apply compost that is made on-farm and that contains manure or other animal materials to crops
      intended for human consumption and is applied less than 90 or 120 days prior to harvest? Yes / No.
    status: covered
    trazo:
      questions: [g4_1_compost_manure.compost_applied_inside_interval, g4_1_compost_manure.compost_contains_manure]
      prints: "modules/G4_1.pdf §C; narrative § 205.203(c)(2)"
    # Re-read 2026-11-02 by the compost and manure slice.
  - ref: 9a
    asks: If yes, how do you ensure the compost pile is mixed and managed to allow all feedstocks to heat to
      the minimum of 131°F (55°C) for a minimum of three days? Include a description of the records maintained
      to demonstrate compliance.
    status: covered
    trazo:
      questions: [g4_1_compost_manure.compost_method, g4_1_compost_manure.compost_temp_and_days, g4_1_compost_manure.compost_turnings, g4_1_compost_manure.compost_temp_logs_kept, g4_1_compost_manure.compost_logs_kept, g4_1_compost_manure.compost_logs_location]
      prints: "modules/G4_1.pdf §C; narrative § 205.203(c)(2)"
    # Re-read 2026-11-02 by the compost and manure slice.

  - ref: "10"
    asks: "Do you use vermicompost that you make on-farm? (Yes / No, skip to question 13.)"
    status: covered
    trazo:
      questions: [g4_1_compost_manure.materials_applied, g4_1_compost_manure.vermicompost_made_on_farm]
      prints: "modules/G4_1.pdf §A, §C"
    # Re-read 2026-11-02 by the compost and manure slice.

  - ref: "11"
    asks: "Which types of feedstocks are used in the vermicomposting process? (Manure or other animal materials / Plant materials / Newspapers or other recycled papers (without glossy or colored ink) / Other.)"
    status: covered
    trazo:
      questions: [g4_1_compost_manure.compost_feedstocks, g4_1_compost_manure.compost_feedstocks_detail]
      prints: "modules/G4_1.pdf §C; narrative § 205.203(c)(2)"
    # Re-read 2026-11-02 by the compost and manure slice.
  - ref: '12'
    asks: Do you apply vermicompost that is made on-farm and that contains manure or other animal materials to
      crops intended for human consumption and is applied less than 90 or 120 days prior to harvest? Yes / No.
    status: covered
    trazo:
      questions: [g4_1_compost_manure.vermicompost_applied_inside_interval]
      prints: "modules/G4_1.pdf §C; narrative § 205.203(c)(2)"
    # Re-read 2026-11-02 by the compost and manure slice.
  - ref: 12a
    asks: If yes, how do you ensure the duration of vermicomposting is sufficient to produce a finished product
      that does not contribute to contamination of crops, soil, or water? Include a description of the records
      you maintain.
    status: covered
    trazo:
      questions: [g4_1_compost_manure.vermicompost_conditions_met, g4_1_compost_manure.vermicompost_moisture, g4_1_compost_manure.compost_logs_kept]
      prints: "modules/G4_1.pdf §C; narrative § 205.203(c)(2)"
    # Re-read 2026-11-02 by the compost and manure slice.
  - ref: '13'
    asks: Do you use raw, aged, liquid, or digested animal manure on crops intended for human consumption? Yes
      / No.
    status: covered
    trazo:
      questions:
      - g4_1_compost_manure.materials_applied
      prints: modules/G4_1.pdf §B
  - ref: 13a
    asks: If yes, when is the product applied? More than 90 days prior to harvest of crops where the harvestable
      portion does not contact the soil / More than 120 days prior to harvest where it does.
    status: covered
    trazo:
      questions: [g4_1_compost_manure.raw_manure_interval_rule, g4_1_compost_manure.raw_manure_timing_detail]
      prints: "modules/G4_1.pdf §B; narrative § 205.203(c)(1)"
    # Re-read 2026-11-02 by the compost and manure slice.
  - ref: '14'
    asks: Optional space for additional information.
    optional: true
    status: covered
    trazo:
      questions: [g4_1_compost_manure.soil_fertility_additional_notes]
      prints: "modules/G4_1.pdf §D"
    # Re-read 2026-11-02 by the compost and manure slice.
