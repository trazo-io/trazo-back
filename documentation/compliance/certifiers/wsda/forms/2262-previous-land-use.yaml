form:
  code: ''
  title: Previous Land Use Declaration
  document_id: AGR 2262
  revision: R 12/19
  url: https://agr.wa.gov/departments/organic/forms-and-applications
  retrieved: 2026-08-28
  nop_cites:
  - § 205.202
  guide_trigger: Completed by whoever managed a site during the transition period the applicant is seeking
    certification for, or by the site's previous WSDA-certified manager, and attached to a Site Application
    (AGR 2264) when the current applicant has not managed the site for the full transition period.
  required_of_every_grower: false
  trazo_module: parcel_application
  register_status: complete
  source_sha256: 38d8a50e7cb234bd2420f4c5296d89f05e3042787b07e74c3fc85584740292a4
items:
- ref: Header (who completes this form)
  asks: This form is completed by either the individual who managed the site during the transition period the
    applicant is seeking certification for, or the individual who has previously certified this site with the
    WSDA Organic Program — attached to the applicant's Site Application (AGR 2264).
  status: covered
  trazo:
    where: 'each parcel''s application under parcels/: Section F, a count (the full table is in the operation''s audit export, a separate document)'
    triggered_by:
    - parcel_application.currently_certified
    models:
    - certifications.models.LandownerAffidavit
    prints: parcels/parcel-application-<name>.pdf §F (count only; full table in the per-production audit dossier)
- ref: '1'
  asks: 'Site name (example: North Field, Circle C-1, Fuji Blocks 28-35) — should match how you reference
    this site in your own input material application records; does not need to match how the applicant
    will reference it.'
  status: covered
  trazo:
    questions:
    - parcel_application.affidavit_card
    models:
    - certifications.models.LandownerAffidavit.field_name
    prints: >-
      parcels/parcel-application-<name>.pdf §F
  note: >-
    The site name as the signer references it prints under 'Stated by <name>' since 2026-11-11.
- ref: '2'
  asks: 'Site location: street address, GPS coordinates, and/or Township, Range, Section.'
  status: covered
  trazo:
    questions:
    - parcel_application.affidavit_card
    models:
    - certifications.models.LandownerAffidavit.parcel_legal_description
    - product.Parcel
    prints: >-
      parcels/parcel-application-<name>.pdf §F; §A
  note: >-
    The signer's own description of the land (street, GPS or Township/Range/Section, free text) prints
    in the manager table; the parcel the declaration belongs to is located in §A of the same page
    (address, S/T/R, boundary centre).
- ref: '3'
  asks: Acreage of the site.
  status: covered
  trazo:
    where: not in this packet; the operation's audit export, a separate document, carries it
    models:
    - certifications.models.LandownerAffidavit.field_acres
    prints: history/audit-export dossier
- ref: '4'
  asks: 'Identify the time period when you were responsible for the management of this site: start date
    and end date (Month/Day/Year).'
  status: covered
  trazo:
    where: not in this packet; the operation's audit export, a separate document, carries it
    models:
    - certifications.models.LandownerAffidavit.management_period_start
    - certifications.models.LandownerAffidavit.management_period_end
    prints: history/audit-export dossier
- ref: '5'
  asks: Is this site currently, or has this site previously been, certified organic or transitional? Yes /
    No.
  status: covered
  trazo:
    questions:
    - parcel_application.currently_certified
    prints: parcels/parcel-application-<name>.pdf §F
- ref: 5a
  asks: 'If yes, identify the following: i. date of your last organic inspection; ii. the name of the certifier;
    iii. your organic certification number; iv. site number as listed on your certificate.'
  status: covered
  trazo:
    questions:
    - parcel_application.prior_certifier_name
    - parcel_application.prior_certificate_site_number
    - parcel_application.certificate_card
    - parcel_application.affidavit_card
    models:
    - certifications.models.LandownerAffidavit.last_inspection_date
    - certifications.models.CertifierInspection.inspected_on
    prints: >-
      parcels/parcel-application-<name>.pdf §F; 02s-renewal-status-and-routing.pdf
  note: >-
    Certifier, certificate number and site number are the parcel's own answers (closed 2026-09-09 with
    AGR 2264 ref 6). The signer's last organic inspection date is the affidavit's own field since
    2026-11-11 and prints under 'Stated by <name>'; the operation's own last inspection prints on 02s.
- ref: 5b
  asks: If yes, will any acreage associated with this site remain under your management? Yes, a portion of
    the site remains on my certificate (acres remaining) / No, site completely removed from my certificate.
  status: covered
  trazo:
    questions:
    - parcel_application.affidavit_card
    models:
    - certifications.models.LandownerAffidavit.portion_remains
    - certifications.models.LandownerAffidavit.acres_remaining
    prints: >-
      parcels/parcel-application-<name>.pdf §F
  note: >-
    Since 2026-11-11: whether a portion stays on the signer's certificate and how many acres, printed
    under 'Stated by <name>'. A blank is not stated.
- ref: '6'
  asks: Have any treated seeds been planted on the site while under your management? Yes / No.
  status: covered
  trazo:
    questions:
    - parcel_application.affidavit_card
    models:
    - certifications.models.LandownerAffidavit.treated_seed_planted
    prints: >-
      parcels/parcel-application-<name>.pdf §F
  note: >-
    The signer's own answer for their management period since 2026-11-11, apart from the applicant's
    (AGR 2264 ref 11). A Yes prints a [REVIEW] line; a No prints as stated.
- ref: 6a
  asks: If yes, provide the brand name of the treatment and the date the seed was planted.
  status: covered
  trazo:
    questions:
    - parcel_application.affidavit_card
    models:
    - certifications.models.LandownerAffidavit.treated_seed_detail
    prints: >-
      parcels/parcel-application-<name>.pdf §F
  note: >-
    Brand and planting date under a Yes; a Yes with none given says so in its [REVIEW] line.
- ref: '7'
  asks: 'Table, by crop category (Apple, Berries, Grains, Grapes, Hay/Silage, Herbs, Nuts, Pasture, Pears,
    Stone fruit, Vegetable, Other): dates produced and acreage, for production and activities that occurred
    while under your management, for the transition period the applicant is seeking certification for.'
  status: covered
  trazo:
    questions:
    - parcel_application.affidavit_card
    models:
    - certifications.models.LandownerAffidavit.yearly_history
    prints: >-
      parcels/parcel-application-<name>.pdf §F
  note: >-
    Each row of the signer's table carries the use, the months (`period_from`, `period_to`) and acres
    since 2026-11-11, printed in the signer's table on the parcel page. The crop is named as the signer
    names it rather than by WSDA's category list; WSDA takes alternative records 'provided they include
    all applicable information'.
- ref: '8'
  asks: 'List any input materials (fertilizers, soil amendments, pesticides, etc.) applied while under
    your management, for the transition period the applicant seeks certification for: material name and
    date of application. Or check ''N/A — No input materials have been applied while under my management.'''
  status: covered
  trazo:
    questions:
    - parcel_application.affidavit_card
    models:
    - certifications.models.LandownerAffidavit.yearly_history
    - certifications.models.LandownerAffidavit.no_materials_applied
    prints: >-
      parcels/parcel-application-<name>.pdf §F
  note: >-
    The signer's materials (name and date of application) print in their table on the parcel page since
    2026-11-11; the N/A is the tri-state no-materials answer, printed in the manager table's Materials
    column, never inferred from an empty table.
- ref: Attestation (signature)
  asks: By printing your name and providing this form, you attest all information in it is correct and complete.
    Print name, date, email, phone number.
  status: covered
  trazo:
    questions:
    - parcel_application.affidavit_card
    models:
    - certifications.models.LandownerAffidavit.attestation_text
    - certifications.models.LandownerAffidavit.signed_document
    - certifications.models.LandownerAffidavit.previous_manager_signed_date
    - certifications.models.LandownerAffidavit.previous_manager_phone
    - certifications.models.LandownerAffidavit.signer_email
    prints: >-
      parcels/parcel-application-<name>.pdf §F
  note: >-
    Name, signed date, phone and, since 2026-11-11, email. The signed copy carries AGR 2262's own
    attestation; Trazo's stored attestation text is its standard wording, and WSDA takes alternative
    records with the same information.