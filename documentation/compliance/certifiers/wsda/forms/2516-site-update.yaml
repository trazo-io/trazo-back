form:
  code: ''
  title: Site Update Information
  document_id: AGR 2516
  revision: R 01/20
  url: https://agr.wa.gov/departments/organic/forms-and-applications
  retrieved: 2026-08-28
  nop_cites:
  - § 205.400(f)
  - § 205.406
  guide_trigger: File when the Crop Production Information on your Certified Operation Profile no longer
    matches your plan for the coming year — crop, variety or acreage changes, or reduced total site acreage.
  required_of_every_grower: false
  filed_with_agent: true
  accepted_format: alternative_records_with_required_fields
  renewal_role: site_update
  format_source: >-
    AGR 2516 allows alternative records to be submitted instead of this form (register rows Hdr and
    Table). No signature line is registered for this form, so none is claimed.
  # COMPLETE, ANSWERED BY PACKET DOCUMENTS (2026-09-10; deliberately draft since 2026-09-08).
  #
  # The substance of a site update reaches a certifier through `OSPChangeNotification` and
  # `OSPAnnualUpdate` (02 and 03). Since 2026-10-24, 02s also prints the land itself, one row per
  # parcel routed `wsda_existing_site`, with the site number the operator stated
  # (`prior_certificate_site_number`), acreage and crops for this year and next: the "production
  # or planting records" the form accepts instead of itself (`renewal_land_table`).
  register_status: complete
  source_sha256: 3a1c0366f6409758ce641f1500b167c5d517169f94d4a767075ecfb57407e3e4
  packet_documents:
  - 02-annual-update.pdf
  - 03-change-notifications.pdf
items:
- ref: Instructions (changes per site)
  asks: Indicate what changes need to be made for each site where the Crop Production Information on the Certified
    Operation Profile does not match your current plan for the coming year — crops/varieties, acreages, and
    whether total site acreage will be reduced. Alternatively, production or planting records may be submitted
    instead, provided they clearly indicate the site number and site name as identified on your certificate.
  status: partial
  severity: P2
  trazo:
    questions:
    - parcel_application.parcel_name
    - parcel_application.prior_certificate_site_number
    - parcel_application.crop_history
    models:
    - certifications.models.OSPChangeNotification
    - certifications.models.OSPAnnualUpdate
    - product.ParcelCropHistory
    prints: 02-annual-update.pdf; 02s-renewal-status-and-routing.pdf ("Site Update Information (AGR 2516)"); 03-change-notifications.pdf
  gap: 02s prints, per parcel routed `wsda_existing_site`, the site number the operator stated, the site name, its
    acreage and its crops for this year and the next, which is the alternative record the form accepts when the
    site number is present; a row without one says it is not recorded. Trazo does not hold WSDA's Certified
    Operation Profile, so it cannot say WHICH sites differ from it, and the page says that comparison is the
    operation's.
  fix: None in Trazo while the profile is WSDA's; the operation compares the rows with its profile.
- ref: Table (site, name, changes)
  asks: 'Table: WSDA site no., WSDA site name, and a plain-language description of the change (e.g., ''total
    site acreage remains the same'', ''5 acres moved to conventional, organic acreage is now 15 acres'').'
  status: partial
  severity: P2
  trazo:
    questions:
    - parcel_application.prior_certificate_site_number
    - parcel_application.parcel_name
    models:
    - certifications.models.OSPChangeNotification.description
    - product.ParcelCropHistory.production_method
    prints: 02s-renewal-status-and-routing.pdf (site no. / site name / acres / crops); 03-change-notifications.pdf
      (free-text description)
  gap: The two leftmost columns print in 02s; the change column cannot, because a change is measured against
    WSDA's profile, which Trazo does not hold. A crop history row marked conventional for this year or next is
    flagged on its site's row as acreage that may be leaving organic production.
  fix: None in Trazo while the profile is WSDA's; the operation writes the change column.
- ref: Instructions (acreage removed)
  asks: If acreage is removed from organic production, include a map identifying the new boundaries and include
    details on why the acreage was removed (e.g., transferred to another grower, converted to conventional).
  status: not_covered
  severity: P1
  trazo:
    prints: —
  gap: 'AGR 2516 asks for a boundary map AND the reason acreage was removed — and only when acreage is removed,
    with the form itself accepting "production records, planting records, etc." in place of the map. Re-registered
    on 2026-08-28: the map half is conditional and substitutable, so it is not the map defect. The other half
    is an unconditional Trazo defect of its own — `OSPChangeNotification.supporting_document` is a real writable
    FileField with NO UI writer (the panel says so itself), it is never written into the packet ZIP, and `_change_notifications_pdf`
    never names it. There is no `removal_reason` field either: `description` carries an ADDITION example in
    both help text and placeholder. So landing the shared map service would close the map half and still leave
    a WSDA reviewer reading "5 acres moved to conventional" with no reason and nothing attached.'
  fix: 'Two moves, both independent of the map service: (1) give `OSPChangeNotification` an upload control
    and write `supporting_document` into the packet ZIP alongside `receipts/`, naming it in `_change_notifications_pdf`;
    (2) add a `removal_reason` prompt shown when the change reduces certified acreage, and stop illustrating
    `description` with an addition.'
  root_cause: change-notification-attachment-dead
