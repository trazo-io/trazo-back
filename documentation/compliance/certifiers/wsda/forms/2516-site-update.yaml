form:
  code: ''
  title: Site Update Information
  document_id: AGR 2516
  revision: R 01/20
  url: https://agr.wa.gov/departments/organic/forms-and-applications
  retrieved: 2026-08-28
  nop_cites:
  - § 205.400(f)
  - § 205.406
  guide_trigger: File when the Crop Production Information on your Certified Operation Profile no longer
    matches your plan for the coming year — crop, variety or acreage changes, or reduced total site acreage.
  required_of_every_grower: false
  register_status: draft
items:
- ref: Hdr
  asks: Indicate what changes need to be made for each site where the Crop Production Information on the
    Certified Operation Profile does not match your current plan for the coming year — crops/varieties,
    acreages, and whether total site acreage will be reduced. Alternatively, production or planting records
    may be submitted instead, provided they clearly indicate the site number and site name as identified
    on your certificate.
  status: partial
  severity: P1
  trazo:
    models:
    - certifications.models.OSPChangeNotification
    - certifications.models.OSPAnnualUpdate
    prints: 02-annual-update.pdf; 03-change-notifications.pdf
  gap: The packet already carries a superset mechanism — `OSPChangeNotification` (categories include `acreage_field_addition`
    and `field_removal`, both citing § 205.400(f)(2)) and `OSPAnnualUpdate`'s `additions`/`deletions`
    JSON — so the SUBSTANCE of a site update is capturable. But neither is structured by a WSDA-assigned
    SITE NUMBER, which is the specific cross-reference WSDA's own Certified Operation Profile needs to
    locate the record; `OSPChangeNotification.parcel` links to Trazo's own `Parcel` row, and the parcel
    module has no `wsda_site_number` field at all (same gap as AGR 2264 ref '6').
  fix: Add the `wsda_site_number` field proposed for AGR 2264 ref '6' to the parcel module, and print
    it beside the parcel name on any WSDA-bound change notification or annual-update page.
- ref: Table
  asks: 'Table: WSDA site no., WSDA site name, and a plain-language description of the change (e.g., ''total
    site acreage remains the same'', ''5 acres moved to conventional, organic acreage is now 15 acres'').'
  status: not_covered
  severity: P2
  trazo:
    models:
    - certifications.models.OSPChangeNotification.description
    prints: 03-change-notifications.pdf (free-text description; no WSDA site number column)
  gap: '`OSPChangeNotification.description` is free text and can hold the same plain-language change statement
    WSDA''s own table wants, but without the `wsda_site_number` field (see ''Hdr''), the printed change-notification
    page cannot reproduce WSDA''s own two leftmost columns — a reviewer matching this page against the
    Certified Operation Profile has to do it by parcel name alone.'
  fix: 'Same as ''Hdr'': add `wsda_site_number`, and format the printed row as ''WSDA site no. / site
    name / description'' when it is set. Once captured, Trazo''s own production and crop-history records
    could also double as the ''alternative records'' AGR 2516 says may be submitted instead of this form
    — they cannot today, for the same reason.'
- ref: Acreage removed
  asks: If acreage is removed from organic production, include a map identifying the new boundaries and
    include details on why the acreage was removed (e.g., transferred to another grower, converted to
    conventional).
  status: not_covered
  severity: P1
  root_cause: change-notification-attachment-dead
  trazo:
    prints: —
  gap: 'AGR 2516 asks for a boundary map AND the reason acreage was removed — and only when acreage is
    removed, with the form itself accepting "production records, planting records, etc." in place of the
    map. Re-registered on 2026-08-28: the map half is conditional and substitutable, so it is not the
    map defect. The other half is an unconditional Trazo defect of its own — `OSPChangeNotification.supporting_document`
    is a real writable FileField with NO UI writer (the panel says so itself), it is never written into
    the packet ZIP, and `_change_notifications_pdf` never names it. There is no `removal_reason` field
    either: `description` carries an ADDITION example in both help text and placeholder. So landing the
    shared map service would close the map half and still leave a WSDA reviewer reading "5 acres moved
    to conventional" with no reason and nothing attached.'
  fix: 'Two moves, both independent of the map service: (1) give `OSPChangeNotification` an upload control
    and write `supporting_document` into the packet ZIP alongside `receipts/`, naming it in `_change_notifications_pdf`;
    (2) add a `removal_reason` prompt shown when the change reduces certified acreage, and stop illustrating
    `description` with an addition.'
