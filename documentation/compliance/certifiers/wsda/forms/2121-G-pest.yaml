form:
  code: "G"
  title: "Pest Management"
  document_id: "AGR 2121"
  revision: "R 02/25"
  url: "https://agr.wa.gov/departments/organic/forms-and-applications"
  retrieved: 2026-08-28
  nop_cites: ["§ 205.206"]
  guide_trigger: "Crop Producer Organic System Plan (AGR 2121) — filed once by every crop producer applicant; WSDA runs a LIVING plan, so a renewing operation updates the sections that changed rather than re-filing the whole OSP (the March 1 deadline is the renewal application and fee)"
  required_of_every_grower: true
  # F, G and H all map onto the single Trazo module g5_0_pest — see 2121-F-weed.yaml's header.
  trazo_module: g5_0_pest
  register_status: complete

items:
  - ref: "1"
    asks: "Which monitoring practices do you implement to determine the effectiveness of your pest management plan? (Observation of crop health / Comparison of crop yields / Trap monitoring / Pest modeling / Scouting program / Other.)"
    status: partial
    severity: P1
    trazo:
      questions: [g5_0_pest.monitoring_scope]
      prints: "modules/G5_0.pdf §D; narrative § 205.206(a)"
    gap: "Same shape as F1, and see that row for the correction history. `monitoring_scope` records that pest populations and beneficial-insect activity are watched, and it prints; WSDA asks which METHOD does the watching. WSDA additionally names 'trap monitoring' and 'pest modeling' as distinct techniques with no Trazo equivalent at all, so the method gap is wider here than under F."
    fix: "The F1 fix, with `trap_monitoring` and `modeling` among the options."

  - ref: "2"
    asks: "How often do you make these comparisons or observations?"
    status: partial
    severity: P2
    trazo:
      questions: [g5_0_pest.monitoring_frequency]
      prints: "modules/G5_0.pdf §D"
    gap: "Same as F2: `monitoring_frequency` asks exactly this and prints, but it is one operation-wide answer against three separately-asked WSDA questions (F2 weed, G2 pest, H2 disease)."
    fix: "Same fix as F2 — make `monitoring_frequency` per pest class."

  - ref: "3"
    asks: "Which crop pests do you manage? (Insects / Rodents / Birds / Nematodes / Mites / Slugs / Other.)"
    status: not_covered
    severity: P2
    gap: "No field asks which pest taxa the operation actually manages. CCOF's G5.0 matrix does not ask this either — it only offers generic 'Insects & invertebrates' and 'Vertebrate pests' columns, never enumerating species or taxa — so this is a genuinely fresh WSDA-specific ask with no CCOF row to reuse. Without it, `prevention_practices`'s vertebrate-specific options (`vertebrate_exclusion`, `raptor_habitat`, `vertebrate_trapping`) print with no stated target: rodents, birds, or both."
    fix: "Add `pest_taxa_managed` [checkbox_group] {insects, rodents, birds, nematodes, mites, slugs, other}."

  - ref: "4"
    asks: "Which preventative pest control strategies do you implement on your operation? (Crop rotation / Insect or rodent traps / Structures for wildlife / Beneficial habitat / Resistant varieties / Mating disruption / Timing of planting / Release of beneficials / Trap crops / Companion planting / Physical barriers / Physical removal / Other.)"
    status: partial
    severity: P1
    trazo:
      questions: [g5_0_pest.prevention_practices, g5_0_pest.prevention_practices_other]
      prints: "modules/G5_0.pdf §A; narrative § 205.206(a)"
    gap: "Same three-way split named in full at F3: WSDA asks this as its own section rather than as extra columns on one matrix, so Trazo's pest-type-blind `prevention_practices` list prints the same generic text here as it does under F (weed) and H (disease) — a WSDA reviewer sees the identical paragraph three times with nothing that says which parts of it are actually about insects, rodents, birds, mites or slugs (the taxa ref 3 asks the grower to name). `Trap crops` and `companion planting` have no matching option in Trazo at all (CCOF's own G5.0 register already names `trap_crops` as `not_covered`); `mating disruption` and 'insect or rodent traps' are absent too — only `beneficial_habitat`, `beneficial_release`, `resistant_varieties`, and `vertebrate_trapping`/`vertebrate_exclusion` (a rough match for 'physical barriers' against vertebrates specifically, not insects or rodents generally) line up. As at F3, this is a request-for-information severity, not a bounce: the content that does exist is substantively responsive."
    fix: "Same structural fix as F3 — a pest-type dimension on `prevention_practices`. Additionally add `trap_crops` (per CCOF's own register), `companion_planting`, `mating_disruption` and `insect_rodent_traps` as options."

  - ref: "5"
    asks: "Describe the records you maintain regarding your preventative pest management efforts."
    status: not_covered
    severity: P2
    gap: "Same gap as F6: no field captures what records document the preventative practices themselves, as distinct from monitoring-result records. `monitoring_records` is not cited here on that axis — see F6."
    fix: "Add `pest_prevention_records` [textarea]."
