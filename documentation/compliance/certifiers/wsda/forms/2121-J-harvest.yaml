form:
  code: J
  title: Harvest
  document_id: AGR 2121
  revision: R 02/25
  url: https://agr.wa.gov/departments/organic/forms-and-applications
  retrieved: 2026-08-28
  nop_cites:
  - § 205.270
  - § 205.272
  guide_trigger: Every Crop Producer OSP — Section J (Harvest and Transportation) is completed by all
    applicants.
  required_of_every_grower: true
  trazo_module: g6_1_harvest_transport
  register_status: complete
  source_sha256: 2ea37aac21ea7642df71161c4289b6bbc21ecb1e6a488e826e269c26a1eab296
items:
- ref: '1'
  asks: 'Who is responsible for harvest? Check all that apply: Your business (Internal) / Contract buyer
    or customer / Processor / Other.'
  status: covered
  trazo:
    questions:
    - g6_1_harvest_transport.who_harvests
    - g6_1_harvest_transport.who_harvests_other
    - g6_1_harvest_transport.sold_standing_details
    prints: modules/G6_1.pdf §A
- ref: '2'
  asks: Identify and describe the type of records maintained regarding harvest.
  status: covered
  trazo:
    questions:
    - g6_1_harvest_transport.harvest_records_kept
    - g6_1_harvest_transport.custom_harvester_records
    prints: modules/G6_1.pdf §A
- ref: '3'
  asks: 'How are crops harvested? Check all that apply: By hand / Mechanical / Other.'
  status: covered
  trazo:
    questions:
    - g6_1_harvest_transport.harvest_method
    prints: modules/G6_1.pdf §A
- ref: '4'
  asks: 'What types of containers are used for harvest? Check all that apply: Bulk trucks or trailer /
    Cardboard or waxed boxes / Picking bags / Plastic bins / Wooden bins / Other.'
  status: covered
  trazo:
    questions:
    - g6_1_harvest_transport.container_types
    - g6_1_harvest_transport.container_types_other
    prints: modules/G6_1.pdf §B
- ref: '5'
  asks: 'How do you ensure harvest containers do not contaminate crops? Check all that apply: Cleaned
    prior to use / Lined prior to use / Only new containers are used / Used for organic crops only / Other.'
  status: covered
  trazo:
    questions:
    - g6_1_harvest_transport.container_safeguards
    - g6_1_harvest_transport.containers_cleaning_method
    prints: modules/G6_1.pdf §B; narrative § 205.201(a)(5)
- ref: 5a
  asks: If you marked cleaned prior to use, describe the type of records maintained to demonstrate harvest
    containers do not contaminate crops.
  status: covered
  trazo:
    questions:
    - g6_1_harvest_transport.container_cleaning_records
    - g6_1_harvest_transport.container_cleaning_sop_upload
    prints: modules/G6_1.pdf §B; the procedure file rides in the packet
- ref: '6'
  asks: 'What type of material are harvest containers made of? Check all that apply: Plastic / Metal /
    Cloth / Wood / Cardboard / Other.'
  status: covered
  trazo:
    questions:
    - g6_1_harvest_transport.harvest_container_material
    prints: modules/G6_1.pdf §B
- ref: '7'
  asks: Are all harvest containers permanently and clearly stamped with an organic designation?
  status: covered
  trazo:
    questions:
    - g6_1_harvest_transport.harvest_containers_stamped_organic
    prints: modules/G6_1.pdf §B
- ref: 7a
  asks: If no, how do you ensure harvest containers do not contaminate organic crops? Containers made
    of plastic, metal, or cloth are cleaned after use with nonorganic crops / containers made of cardboard
    have not been exposed to prohibited materials / containers made of wood are completely lined with
    plastic / other — describe.
  status: covered
  trazo:
    questions:
    - g6_1_harvest_transport.unstamped_container_safeguards
    - g6_1_harvest_transport.containers_reused_from_prohibited
    - g6_1_harvest_transport.containers_reused_barrier
    prints: modules/G6_1.pdf §B
- ref: 7b
  asks: If no, describe the documentation maintained to verify harvest containers do not pose a risk of
    contamination.
  status: partial
  severity: P2
  trazo:
    questions:
    - g6_1_harvest_transport.unstamped_container_safeguards
    - g6_1_harvest_transport.container_cleaning_records
    prints: modules/G6_1.pdf §B
  gap: >-
    The safeguards for containers that are not stamped organic are asked, and the records that show containers are cleaned are asked when cleaning is a safeguard. A container kept safe another way (lined, new only) has no documentation question of its own.
  fix: >-
    Ask for the documentation behind each unstamped-container safeguard, not only behind cleaning.
- ref: '8'
  asks: Are you a tree fruit producer who receives nondedicated wood bins from a handler or processor?
  status: covered
  trazo:
    questions:
    - g6_1_harvest_transport.receives_nondedicated_wood_bins
    prints: modules/G6_1.pdf §B
- ref: 8a
  asks: 'If yes, how do you and the handler or processor ensure the nondedicated wood bins do not contaminate
    organic tree fruit during harvest or post-harvest handling? Both boxes must be checked: wood bins
    will not go into a dump tank at handler or processor; wood bins are fully lined to prevent fruit from
    contacting the bin.'
  status: covered
  trazo:
    questions:
    - g6_1_harvest_transport.handler_bin_practice
    prints: modules/G6_1.pdf §B; anything but confirmed in writing prints a [REVIEW] line
- ref: 8b
  asks: If yes, explain what documentation is provided by the handler or processor confirming how contamination
    is prevented when using the nondedicated wood bins they provided.
  status: covered
  trazo:
    questions:
    - g6_1_harvest_transport.handler_bin_documentation_upload
    prints: modules/G6_1.pdf §B; the file rides in the packet
- ref: '9'
  asks: 'How are certified products transported? Check all that apply: Bins or totes / Bulk trailer /
    Cardboard boxes / Other.'
  status: covered
  trazo:
    questions:
    - g6_1_harvest_transport.transport_container_types
    prints: modules/G6_1.pdf §C
- ref: '10'
  asks: 'Who is responsible for the transportation of certified crops? Check all that apply: Broker /
    Buyer / Self / Warehouse or packer / Other.'
  status: covered
  trazo:
    questions:
    - g6_1_harvest_transport.who_transports
    - g6_1_harvest_transport.who_transports_other
    prints: modules/G6_1.pdf §C
- ref: '11'
  asks: How does your company ensure outgoing transport units are cleaned prior to loading loose or bulk
    certified products? Not applicable, only packaged products are shipped / Clean out records / Clean
    truck/equipment affidavits / Other.
  status: covered
  trazo:
    questions:
    - g6_1_harvest_transport.transport_unit_cleaning_documentation
    - g6_1_harvest_transport.transport_units_inspected_clean
    - g6_1_harvest_transport.non_own_transport_records
    prints: modules/G6_1.pdf §C
- ref: '12'
  asks: Are certified crops or products shipped in the same transport units as non-certified products?
  status: covered
  trazo:
    questions:
    - g6_1_harvest_transport.transport_shared_with_noncertified
    prints: modules/G6_1.pdf §C
- ref: 12a
  asks: If yes, which practices are implemented to segregate certified products? Certified product sealed
    in impermeable containers / separate area in transport unit / use of separate pallets / other.
  status: covered
  trazo:
    questions:
    - g6_1_harvest_transport.shared_transport_segregation
    prints: modules/G6_1.pdf §C
- ref: '13'
  asks: Are crops transported to a facility prior to receipt by buyers or packers (e.g. hydrocooling,
    drying, cleaning, storage, consolidation)? Yes — an Additional Facilities and Third-Parties (AGR 2519)
    form is attached. No.
  status: covered
  trazo:
    questions:
    - g6_1_harvest_transport.first_stop_before_buyer
    - g6_1_harvest_transport.handled_by_another_operation
    - g6_1_harvest_transport.off_farm_handler_table
    models:
    - certifications.PostHarvestFacility
    prints: modules/G6_1.pdf §C and §D; copy sheet (Additional Facilities and Third-Parties, AGR 2519)
  note: 'Closed 2026-11-08. Whether the crop goes to a hydrocooler, cold storage or consolidation point before the
    buyer is asked and printed (`first_stop_before_buyer`), and the facility table names the operation that runs it.
    AGR 2519 is WSDA''s own form, filed with WSDA, one per facility; it is registered
    (`wsda/forms/2519-additional-facilities.yaml`) and the copy sheet gives, per facility another operation runs that the plan''s answers say stores or handles the crop while the operation still owns it,
    its name and address, the form''s activities as the operator picked them (`PostHarvestFacility.activities`),
    the products and the crops on the records linked to it, which responsibility statement the record points to
    (a certificate number on file or not) and, without one, the exemption the operator stated
    (`exemption_basis`). A field the record leaves empty is named as not recorded. Trazo never ticks the form''s
    boxes.'
- ref: '14'
  asks: Optional space for additional information.
  status: not_covered
  severity: P3
  optional: true
  trazo:
    prints: —
  gap: Optional free space. Trazo has no general notes field on this module, so nothing extra the operator
    wants to say here has a place; the agent does not require it.
  fix: Add an optional additional-notes textarea to the harvest module.
