form:
  code: L
  title: Post-Harvest Handling
  document_id: AGR 2121
  revision: R 02/25
  url: https://agr.wa.gov/departments/organic/forms-and-applications
  retrieved: 2026-08-28
  nop_cites:
  - § 205.270
  - § 205.272
  guide_trigger: Triggered when the operation washes, packs, labels, or otherwise handles crops post-harvest
    at the farm (WSDA Section L, item 2); item 1 applies regardless when a third party custom-handles
    on the operation's behalf.
  trazo_module:
  - g6_4_handling
  - g6_1_harvest_transport
  register_status: complete
  source_sha256: e842e8354b3099c9ee0ba19b5e6f6dd7566e996f2b18fa9ba14ad8ae10c2ef71
items:
- ref: '1'
  asks: Does your business work with a third-party to process, pack, label, or otherwise custom handle
    organic crops on your behalf? Yes — an Additional Facilities and Third-Parties (AGR 2519) form is
    attached. No.
  status: covered
  trazo:
    questions:
    - g6_1_harvest_transport.handled_by_another_operation
    - g6_1_harvest_transport.off_farm_handler_table
    models:
    - certifications.PostHarvestFacility
    prints: modules/G6_1.pdf §D; narrative § 205.201(a)(5); copy sheet (Additional Facilities and Third-Parties, AGR 2519)
  note: 'Closed 2026-11-08. `handled_by_another_operation` asks the question and the handler table names who.
    AGR 2519 is WSDA''s own form, filed with WSDA, one per facility; it is registered
    (`wsda/forms/2519-additional-facilities.yaml`) and the copy sheet gives, per facility another operation runs that the plan''s answers say stores or handles the crop while the operation still owns it,
    its name and address, the form''s activities as the operator picked them (`PostHarvestFacility.activities`),
    the products and the crops on the records linked to it, which responsibility statement the record points to
    (a certificate number on file or not) and, without one, the exemption the operator stated
    (`exemption_basis`). A field the record leaves empty is named as not recorded. Trazo never ticks the form''s
    boxes.'
- ref: 1a
  asks: If yes, describe how you verify the operation is certified according to USDA organic standards
    for the service.
  status: covered
  trazo:
    questions: [g6_1_harvest_transport.handler_cert_verification_method, g6_1_harvest_transport.handler_cert_verification_method_other, g6_1_harvest_transport.off_farm_handler_table, g6_1_harvest_transport.uncertified_handler_records]
    prints: "modules/G6_1.pdf §D"
  # Closed 2026-11-02 by the third-party certificates slice.
- ref: 1b
  asks: How frequently do you verify the third-party's organic certification status? With every order
    / Monthly / Annually / Other.
  status: covered
  trazo:
    questions: [g6_1_harvest_transport.handler_cert_verification_frequency, g6_1_harvest_transport.handler_cert_verification_frequency_other]
    prints: "modules/G6_1.pdf §D"
  # Closed 2026-11-02 by the third-party certificates slice.
- ref: '2'
  asks: Do you wash, pack, label, or otherwise handle crops after harvest at your farm? Yes. No, my business
    does not wash, pack, or label crops post-harvest. Crops remain in the containers they were harvested
    into and are transported or stored in the same container. Skip to next section.
  status: covered
  trazo:
    questions:
    - g6_4_handling.handling_activities
    - g6_4_handling.handling_activities_other
    prints: modules/G6_4.pdf §A
- ref: '3'
  asks: Do you engage in post-harvest handling activities for both certified and non-certified crops?
  status: covered
  trazo:
    questions:
    - g6_4_handling.simple_handling_disqualifiers
    - g6_0_production.split_operation
    prints: "modules/G6_4.pdf §A (non-organic product handled here); modules/G6_0.pdf §A (split_operation, operation-wide)"
  note: "Closed 2026-11-10 (content 2026.11.30)."
- ref: 3a
  asks: If yes, describe your procedures for keeping certified and non-certified crops separated.
  status: covered
  trazo:
    prints: modules/G6_4.pdf §C (commingling_controls)
    questions:
    - g6_4_handling.commingling_controls
    - g6_4_handling.commingling_controls_other
- ref: '4'
  asks: 'What cleaning methods are used on food contact surfaces prior to handling certified crops? Compressed
    air / Manual washing / Purging of equipment / Sanitizing / Scraping / Soap and water / Sweeping /
    Vacuuming / Steam cleaning / Other. (Purge: submit documentation on procedures and how purge quantities
    are adequate.)'
  status: covered
  trazo:
    questions: [g6_4_handling.uses_water, g6_4_handling.water_source_sanitizer, g6_4_handling.food_contact_cleaning_methods, g6_4_handling.food_contact_cleaning_methods_other, g6_4_handling.purge_procedure_upload]
    prints: "modules/G6_4.pdf §C; the purge procedures ride in the packet"
  # Closed 2026-11-18 by the post-harvest slice: purge_procedure_upload, shown when purging is a cleaning method,
  # takes the purge procedures and how purge amounts are set for the equipment's capacity.
- ref: '5'
  asks: Do you use any residual sanitizers (e.g. quaternary ammonium) on surfaces or equipment that come in
    direct contact with organic products?
  status: covered
  trazo:
    questions:
    - g6_4_handling.uses_equipment_sanitizer_or_cleaner
    - g6_4_handling.equipment_sanitizer_types
    - g6_4_handling.equipment_sanitizer_types_rinsed
    - g6_4_handling.equipment_sanitizer_where_used
    prints: modules/G6_4.pdf §C (uses_equipment_sanitizer_or_cleaner; equipment_sanitizer_types names quaternary
      ammonium as its own type; equipment_sanitizer_where_used)
  note: 'Closed 2026-09-12 — the boolean is asked independently of water contact. 2026-09-30 (OSP alignment
    audit, T17): `uses_water` and `water_source_sanitizer` were cited here; they ask about wash water, not
    sanitizers on equipment, and are removed.'
- ref: 5a
  asks: If yes, describe how you remove residual sanitizers prior to organic handling.
  status: covered
  trazo:
    questions:
    - g6_4_handling.sanitizer_residual_free_assurance
    - g6_4_handling.sanitizer_residual_free_assurance_other
    - g6_4_handling.equipment_sanitizer_types_rinsed
    prints: modules/G6_4.pdf §C (sanitizer_residual_free_assurance; equipment_sanitizer_types_rinsed)
  note: 'Closed 2026-09-12 — structured removal methods (evaporate / thorough rinse / double rinse / residue
    testing / other) and the rinsed set. 2026-09-30 (OSP alignment audit, T17): `uses_water` and `water_source_sanitizer`
    were cited here; they ask about wash water, not sanitizers on equipment, and are removed.'
- ref: 5b
  asks: If yes, describe the testing protocol used to verify no residual sanitizers remain prior to handling
    organic products. Include the type and range of test strips used, and how the results are documented.
  status: covered
  trazo:
    questions:
    - g6_4_handling.sanitizer_residual_testing_protocol
    prints: modules/G6_4.pdf §C (sanitizer_residual_testing_protocol — test type and range, when it is run, how
      results are kept)
  note: Closed 2026-09-12.
- ref: '6'
  asks: Do you use the same food contact surfaces and/or post-harvest packing equipment for both organic
    and non-certified crops?
  status: covered
  trazo:
    questions:
    - g6_4_handling.shares_handling_area_or_equipment
    - g6_4_handling.commingling_controls
    - g6_4_handling.commingling_controls_other
    prints: "modules/G6_4.pdf §C"
  note: "Closed 2026-11-10 (content 2026.11.30)."
- ref: 6a
  asks: 'If yes, describe the differences in chemicals or procedures used to clean or purge equipment
    prior to handling non-certified crops. (N/A option: the same cleaning materials and procedures are
    used regardless of organic status.)'
  status: covered
  trazo:
    questions: [g6_4_handling.shares_handling_area_or_equipment, g6_4_handling.cleaning_differs_by_status, g6_4_handling.cleaning_differences_detail]
    prints: "modules/G6_4.pdf §C"
  # Closed 2026-11-18 by the post-harvest slice: for shared equipment, cleaning_differs_by_status offers the form's
  # 'same materials and procedures regardless of organic status' or 'they differ', with the differences described.
- ref: '7'
  asks: Identify the records used to document equipment is cleaned or purged prior to organic handling
    and how these records link or correlate to production records.
  status: covered
  trazo:
    questions: [g6_4_handling.handling_records, g6_4_handling.handling_records_linkage]
    prints: "modules/G6_4.pdf §D"
  # Closed 2026-11-18 by the post-harvest slice: handling_records_linkage asks the second half, how the cleaning and
  # purge records link to the production or lot records.
- ref: '8'
  asks: Does your business apply any inputs directly to any crops after harvest? Consider all inputs applied
    to certified or non-certified crops.
  status: covered
  trazo:
    questions:
    - g6_4_handling.applies_post_harvest_inputs
    prints: modules/G6_4.pdf §C
  # Closed 2026-11-07: asked as its own fact, certified or not; water and sanitizers stay asked above it.
- ref: '9'
  asks: 'Identify all types of input materials used in direct contact on crops (certified or non-certified)
    after harvest: Anti-foaming agents / Anti-fungal agents / Anti-microbial agents / Anti-ripening agents
    / Antioxidants / Feed antibiotics / Feed coccidiostats / Floatation agents / Packaging gases / Preservatives
    / Release agents / Ripening agents / Sanitizers – washes / Sprouting inhibitors / Waxes – coatings
    / Other.'
  status: covered
  trazo:
    questions:
    - g6_4_handling.post_harvest_input_types
    - g6_4_handling.post_harvest_input_types_other
    - materials_application.post_harvest_contact_listed
    prints: modules/G6_4.pdf §C; modules/materials_application.pdf §A (the products themselves)
  # Closed 2026-11-07. WSDA's types, without feed antibiotics and feed coccidiostats: livestock inputs, and
  # Trazo serves crop operations only (ccof/scope.yaml: "Crop scope only").
- ref: '10'
  asks: Does your operation use input materials on non-certified crops that are not used on certified crops? No,
    only organically approved inputs are used regardless of organic status.
  status: covered
  trazo:
    prints: modules/G6_4.pdf §C
    questions:
    - g6_4_handling.noncertified_only_inputs_used
  # Closed 2026-11-09 by the water, lumber and non-organic-side slice.
- ref: 10a
  asks: If yes, how do you monitor your practices are sufficient to prevent contamination of certified products
    from prohibited post-harvest inputs? Include details about the frequency of your monitoring and any testing
    of products that may occur.
  status: covered
  trazo:
    prints: modules/G6_4.pdf §C
    questions:
    - g6_4_handling.noncertified_inputs_monitoring
  # Closed 2026-11-09 by the water, lumber and non-organic-side slice.
- ref: '11'
  asks: Describe how your business records each direct application of input materials to both certified
    and non-certified products handled at your farm.
  status: covered
  trazo:
    questions:
    - g6_4_handling.post_harvest_input_recording
    - g6_4_handling.handling_records
    prints: modules/G6_4.pdf §C, §D
  # Closed 2026-11-07: how each application is recorded, certified and non-certified, in the operator's words.
- ref: '12'
  asks: How is water used during post-harvest handling? Not used, skip to Packing / Cleaning equipment
    / Washing crops / Cooling / Product transport (e.g. fruit floating) / Other.
  status: covered
  trazo:
    questions:
    - g6_4_handling.uses_water
    - g6_4_handling.post_harvest_water_uses
    prints: 'modules/G6_4.pdf §C (uses_water — ''No'' is WSDA''s ''not used''; post_harvest_water_uses: equipment
      cleaning / crop washing / cooling / product transport / other)'
  note: Closed 2026-09-12; uses_water is asked of every handler.
- ref: '13'
  asks: Which of the following water sources are used by your business? Municipal / On-site well / Other.
  status: covered
  trazo:
    questions:
    - g6_4_handling.water_source_sanitizer
    - g6_4_handling.post_harvest_water_source
    prints: 'modules/G6_4.pdf §C (post_harvest_water_source: municipal / on-site well / other; water_source_sanitizer
      for the description)'
  note: Closed 2026-09-12.
- ref: '14'
  asks: Is water treated on-site? (e.g. UV, carbon filtration, water softeners, pH adjustment)
  status: covered
  trazo:
    questions:
    - g6_4_handling.water_treated_onsite
    prints: "modules/G6_4.pdf §C"
  note: "Closed 2026-11-09 (content 2026.11.28)."
- ref: 14a
  asks: If yes, is treated water still considered potable and meet the standards outlined in the Safe
    Drinking Water Act?
  status: covered
  trazo:
    questions:
    - g6_4_handling.treated_water_meets_sdwa
    prints: "modules/G6_4.pdf §C (not confirmed or No prints a [REVIEW] line)"
  note: "Closed 2026-11-09 (content 2026.11.28)."
- ref: 14b
  asks: If yes, describe how you manage your water system for safe drinking and quality purposes. Include
    details about your water monitoring practices.
  status: covered
  trazo:
    questions:
    - g6_4_handling.water_system_management
    prints: "modules/G6_4.pdf §C"
  note: "Closed 2026-11-09 (content 2026.11.28)."
- ref: '15'
  asks: Are chlorine materials used in wash water or flume water while handling certified crops?
  status: covered
  trazo:
    questions:
    - g6_4_handling.uses_water
    - g6_4_handling.water_source_sanitizer
    - g6_4_handling.wash_water_additives_added
    - g6_4_handling.wash_water_chlorine_added
    prints: modules/G6_4.pdf §C (wash_water_chlorine_added)
  note: Closed 2026-09-12 — a distinct chlorine boolean behind the additives boolean.
- ref: 15a
  asks: 'If yes, how do you monitor the rinse step is sufficient to reduce chlorine levels on the certified
    crop below Safe Drinking Water Act (SDWA) standards of 4 ppm Cl2 or 0.8 ppm ClO2? Include what tests
    you use, where in the process you test the rinse, how often you conduct tests, and how you document
    results. (N/A option: chlorine is never used above SDWA levels.)'
  status: covered
  trazo:
    questions: [g6_4_handling.wash_water_chlorine_final_rinse, g6_4_handling.wash_water_chlorine_final_rinse_other, g6_4_handling.chlorine_rinse_monitoring]
    prints: "modules/G6_4.pdf §C"
  # Closed 2026-11-18 by the post-harvest slice: chlorine_rinse_monitoring, shown for a chlorine rinse at or below the
  # SDWA limit, asks the test, where, how often and how results are recorded.
- ref: '16'
  asks: 'What material are packages or containers made of? Check all that apply: Plastic / Metal / Cloth
    / Wood / Cardboard / Other.'
  status: covered
  trazo:
    questions:
    - g6_1_harvest_transport.packaging_materials
    - g6_1_harvest_transport.packaging_materials_other
    prints: "modules/G6_1.pdf §B"
  note: "Closed 2026-11-09 (content 2026.11.28)."
- ref: '17'
  asks: Identify how you ensure packaging, storage, or shipping containers do not contaminate organic
    crops with prohibited substances. Only new containers are used / reused containers are permanently
    and clearly stamped with organic designation / reused containers made of plastic, metal, or cloth
    are cleaned after use with nonorganic products / containers made of cardboard have not been exposed
    to prohibited materials / containers made of wood are completely lined with plastic / other — describe.
  status: covered
  trazo:
    questions:
    - g6_1_harvest_transport.packaging_free_of_prohibited
    - g6_1_harvest_transport.packaging_prohibited_detail
    - g6_1_harvest_transport.packaging_contamination_safeguards
    - g6_1_harvest_transport.packaging_contamination_safeguards_other
    prints: "modules/G6_1.pdf §B"
  note: "Closed 2026-11-09 (content 2026.11.28)."
- ref: '18'
  asks: Optional space for additional information.
  status: covered
  optional: true
  trazo:
    questions: [g6_4_handling.handling_additional_notes]
    prints: "modules/G6_4.pdf §D"
  # Closed 2026-11-18 by the post-harvest slice: an optional notes field for the section, as the form's own optional
  # space.
