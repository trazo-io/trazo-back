form:
  code: "E"
  title: "Biodiversity Conservation"
  document_id: "AGR 2121"
  revision: "R 02/25"
  url: "https://agr.wa.gov/departments/organic/forms-and-applications"
  retrieved: 2026-08-28
  nop_cites: ["§ 205.200", "§ 205.205", "§ 205.206"]
  guide_trigger: "Crop Producer Organic System Plan (AGR 2121) — filed once by every crop producer applicant; WSDA runs a LIVING plan, so a renewing operation updates the sections that changed rather than re-filing the whole OSP (the March 1 deadline is the renewal application and fee)"
  required_of_every_grower: true
  trazo_module: g4_2_natural_resources
  register_status: complete
  source_sha256: b8b5d5da1eb827af13c3ef3d4865ead59498dd9e02eab6aad7d85df71887eb14

items:
  - ref: '1'
    asks: Do you produce annual crops? Yes / No.
    status: covered
    trazo:
      questions:
      - g4_0_rotation_soil.system_type
      prints: modules/G4_0.pdf §A
  - ref: 1a
    asks: If yes, describe your crop rotation sequence.
    status: covered
    trazo:
      questions:
      - g4_0_rotation_soil.rotation_plan
      prints: modules/G4_0.pdf §A; narrative § 205.201(a)(1)
    note: WSDA files this under Biodiversity (E); CCOF asks the same under Rotation & Soil Management (G4.0 A1a).
  - ref: 1b
    asks: If yes, describe the records you maintain regarding your crop rotation strategies.
    status: covered
    trazo:
      questions:
      - g4_0_rotation_soil.rotation_records_kept
      prints: modules/G4_0.pdf §A
    note: Closed 2026-11-15. `rotation_records_kept` asks the records kept of the rotation, apart from the plan (`rotation_plan`,
      E 1a), shown when annual crops are grown (E 1).

  - ref: '2'
    asks: Which of the following practices do you use to maintain biological diversity? Consider both certified sites
      and land adjacent to certified sites you manage. In-field management (Alley cropping / Cover crop - Annual /
      Annual crop rotation / Conservation cover - Perennial / Hedgerow planting). Landscape management (Brush management
      / Early successional habitat development-management / Field border / Restoration and management of rare or declining
      habitats / Structure for wildlife / Tree-Shrub establishment / Upland wildlife habitat management / Windbreak-shelterbelt
      establishment). Adjacent waterway management (Channel bank vegetation / Riparian forest buffer / Riparian herbaceous
      cover / Shallow water development and management / Spring development / Stream habitat improvement and management
      / Streambank and shoreline protection / Wetland wildlife habitat management).
    status: covered
    trazo:
      questions:
      - g4_2_natural_resources.habitat_biodiversity_practices
      - g4_2_natural_resources.habitat_biodiversity_practices_other
      - g4_2_natural_resources.soil_water_practices
      - g4_2_natural_resources.soil_water_practices_other
      - g4_2_natural_resources.waterway_practices
      - g4_2_natural_resources.waterway_practices_other
      - g4_2_natural_resources.invasive_species_practices
      - g4_2_natural_resources.invasive_species_practices_other
      - g4_2_natural_resources.wildlife_habitat_mitigation
      - g4_0_rotation_soil.in_lieu_practices
      - g4_0_rotation_soil.in_lieu_other
      - g4_2_natural_resources.wildlife_habitat_mitigation_other
      prints: modules/G4_2.pdf §A, §B; modules/G4_0.pdf §A
    note: 'Closed 2026-11-15. Every practice the row names is an option on G4.2: soil stability and water quality
      on `soil_water_practices`, habitat on `habitat_biodiversity_practices`, waterway practices on `waterway_practices`
      (asked where streams or channels run by the land, E 16). Each practice is asked once and printed once; WSDA
      lists several under more than one purpose, and the reviewer reads them all in G4.2 §A. Annual crop rotation
      is G4.0''s rotation plan.'
  - ref: '3'
    asks: Are there any other practices you use to maintain biological diversity? Yes / No.
    status: covered
    trazo:
      questions:
      - g4_2_natural_resources.other_conservation_measures
      prints: modules/G4_2.pdf §A
    note: Closed 2026-11-15. `other_conservation_measures` is WSDA's own yes or no, independent of the lists above.
  - ref: 3a
    asks: If yes, describe the practices.
    status: covered
    trazo:
      questions:
      - g4_2_natural_resources.other_conservation_measures_detail
      prints: modules/G4_2.pdf §A
    note: Closed 2026-11-15. `other_conservation_measures_detail`, shown on E 3's yes.

  - ref: '4'
    asks: Is permanent ground cover, such as sod, established on at least 90% of the ground at all certified sites?
    status: covered
    trazo:
      questions:
      - g4_2_natural_resources.permanent_ground_cover_90pct
      prints: modules/G4_2.pdf §A
    note: Closed 2026-11-15. `permanent_ground_cover_90pct`. WSDA uses E 4 and 5 to skip its soil stability list;
      Trazo asks the list of everyone and states both facts.

  - ref: '5'
    asks: Is the slope of the land less than 10% at all certified sites?
    status: covered
    trazo:
      questions:
      - g4_2_natural_resources.slope_under_10pct
      prints: modules/G4_2.pdf §A
    note: Closed 2026-11-15. `slope_under_10pct`, paired with E 4.

  - ref: '6'
    asks: Which of the following practices do you use to maintain or improve soil stability? (Alley cropping / Annual
      crop rotation / Conservation cover - Perennial / Contour buffer strips / Contour farming / Cover crop - Annual
      / Critical area planting / Cross wind ridges / Cross wind trap strips / Field border / Herbaceous wind barriers
      / Irrigation water management / Lined waterway or outlet / Mulching / No till / Pond / Reduced till / Ridge
      till / Row arrangement / Seasonal till / Strip-cropping / Vegetative barriers / Windbreak-shelterbelt establishment
      / Other.)
    status: covered
    trazo:
      questions:
      - g4_2_natural_resources.soil_water_practices
      - g4_2_natural_resources.soil_water_practices_other
      - g4_2_natural_resources.habitat_biodiversity_practices
      - g4_2_natural_resources.habitat_biodiversity_practices_other
      - g4_0_rotation_soil.erosion_practices
      prints: modules/G4_2.pdf §A; modules/G4_0.pdf §C
    note: 'Closed 2026-11-15. Every practice the row names is an option on G4.2: soil stability and water quality
      on `soil_water_practices`, habitat on `habitat_biodiversity_practices`, waterway practices on `waterway_practices`
      (asked where streams or channels run by the land, E 16). Each practice is asked once and printed once; WSDA
      lists several under more than one purpose, and the reviewer reads them all in G4.2 §A.'

  - ref: '7'
    asks: Do you irrigate sites where crops are harvested? (Yes / No, skip to the next area of concern.)
    status: covered
    trazo:
      questions:
      - g4_2_natural_resources.irrigation_water_sources
      - g4_2_natural_resources.irrigation_source_types
      prints: modules/G4_2.pdf §C (irrigation source types, with 'we do not irrigate')
    # Closed 2026-11-09 by the water, lumber and non-organic-side slice.
  - ref: '8'
    asks: Do you apply input materials through your irrigation system to sites where conventional or certified
      crops are harvested? Consider materials applied to non-certified sites as well as certified sites. Yes
      / No.
    status: partial
    severity: P2
    trazo:
      where: not in this packet; the operation's audit export, a separate document, shows fertigation on each application record
      models:
      - history.ChemicalEvent.is_fertigation
      - history.ChemicalEvent.application_method_structured (drip / chemigation)
      prints: audit dossier (fertigation column; per-event evidence only, no OSP question or attestation)
    gap: 'Same gap CCOF''s G6.0 D6 already names: no OSP-level question or Materials Application attestation
      exists for materials applied via irrigation. Fertigation is recorded per chemical-application event, but
      WSDA''s other categories — pre-harvest crop sanitizers, irrigation system cleaners, chemigated pesticides
      — have no event home or attestation at all, and nothing answers WSDA''s 8b contamination-prevention question
      either (the closest analog, CCOF G6.0 D5''s prohibited-materials mitigation textarea, is gated on a different
      fact — a shared irrigation district connection — not on applying materials through one''s own system).'
    fix: 'Same fix as CCOF G6.0 D6: add `materials_via_irrigation` [boolean] + `irrigation_materials_listed`
      attestation, prefilled from fertigation/chemigation events; extend Materials Application with an irrigation-materials
      category; add an `irrigation_contamination_prevention` [textarea] for 8b.'
  - ref: 8a
    asks: If yes, what type of materials are applied through your irrigation system? Fertilizers / Pesticides
      / Pre-harvest crop sanitizers / Irrigation system cleaners / Other.
    status: partial
    severity: P2
    trazo:
      where: not in this packet; the operation's audit export, a separate document, shows fertigation on each application record
      models:
      - history.ChemicalEvent.is_fertigation
      - history.ChemicalEvent.application_method_structured (drip / chemigation)
      prints: audit dossier (fertigation column; per-event evidence only, no OSP question or attestation)
    gap: Fertigation is recorded per chemical-application event, but pre-harvest crop sanitizers, irrigation
      system cleaners and chemigated pesticides have no event home or attestation, and no OSP question asks the
      material types.
    fix: 'Same fix as CCOF G6.0 D6: add `materials_via_irrigation` [boolean] + `irrigation_materials_listed`
      attestation, prefilled from fertigation/chemigation events; extend Materials Application with an irrigation-materials
      category; add an `irrigation_contamination_prevention` [textarea] for 8b.'
  - ref: 8b
    asks: If yes, describe your practices to prevent contamination of certified crops. Not applicable, all materials
      applied through irrigation systems are approved for use in organic production.
    status: not_covered
    severity: P2
    trazo:
      prints: —
    gap: No question answers it. The closest analog, CCOF G6.0 D5's prohibited-materials mitigation textarea,
      is gated on a shared irrigation district connection, not on applying materials through one's own system.
    fix: Add an `irrigation_contamination_prevention` [textarea], visible when materials go through the irrigation
      system.

  - ref: "9"
    asks: "Which of the following practices do you use to improve irrigation water use efficiency? (Alley cropping / Annual crop rotation / Contour buffer strips / Contour farming / Cover crop - Annual / Cross wind trap strips / Irrigation reservoir / Irrigation water management / Micro-irrigation / Mulching / No till / Ridge till / Row arrangement / Tailwater recovery / Windbreak or shelterbelt establishment / Other.)"
    status: covered
    trazo:
      questions: [g4_2_natural_resources.soil_water_practices]
      prints: "modules/G4_2.pdf §A; narrative § 205.200"
    # Closed 2026-11-02 by the monitoring slice.

  - ref: "10"
    asks: "What monitoring activities do you implement to ensure irrigation water is used efficiently? (Soil moisture sensors / Visual observations / Irrigation scheduling software / Other.)"
    status: covered
    trazo:
      questions: [g4_2_natural_resources.irrigation_efficiency_monitoring, g4_2_natural_resources.irrigation_efficiency_monitoring_other]
      prints: "modules/G4_2.pdf §A"
    # Closed 2026-11-02 by the monitoring slice.

  - ref: '11'
    asks: Do you apply fertilizers or other nutrients to certified sites?
    status: covered
    trazo:
      questions:
      - g4_0_rotation_soil.applies_fertilizers
      - g4_0_rotation_soil.fertility_components
      prints: modules/G4_0.pdf §B
    note: Closed 2026-11-15. `applies_fertilizers` is the yes or no; `fertility_components` lists practices that apply
      nothing (rotation, fallow) and so could not say it.

  - ref: "12"
    asks: "Do you pasture livestock on certified sites?"
    status: covered
    trazo:
      questions: [parcel_application.livestock_present, parcel_application.livestock_pastured, parcel_application.livestock_detail, g4_1_compost_manure.materials_applied]
      prints: "parcels/parcel-application-<name>.pdf §C; modules/G4_1.pdf §A, §B; narrative § 205.203(c)(1)"
    note: "Closed 2026-11-08. Per site: `livestock_present` none (no livestock kept, pastured or grazed) or yes, and
      for yes `livestock_pastured` asks whether they pasture or graze there, so penned or housed animals answer No.
      The earlier kept-only No is retired and does not complete the parcel. G4.1 still takes planned grazing for
      the raw-manure rules. Not done: suggesting `planned_grazing` from grazing events."

  - ref: '13'
    asks: Which of the following practices do you implement to maintain or improve water quality in terms of nutrient
      contaminants? (Alley cropping / Conservation cover - Perennial / Contour buffer strips / Contour farming / Field
      border / Filter strip / Grassed waterway / Heavy use area protection / Irrigation water management / Lined waterway
      or outlet / Micro-irrigation / Nutrient management / Pond / Prescribed grazing / Riparian forest buffer / Riparian
      herbaceous cover / Seasonal till / Stream crossing / Strip-cropping / Tree-Shrub establishment / Other.)
    status: covered
    trazo:
      questions:
      - g4_2_natural_resources.soil_water_practices
      - g4_2_natural_resources.soil_water_practices_other
      - g4_2_natural_resources.habitat_biodiversity_practices
      - g4_2_natural_resources.habitat_biodiversity_practices_other
      - g4_2_natural_resources.waterway_practices
      - g4_2_natural_resources.waterway_practices_other
      - g4_1_compost_manure.raw_manure_water_risk
      prints: modules/G4_2.pdf §A
    note: 'Closed 2026-11-15. Every practice the row names is an option on G4.2: soil stability and water quality
      on `soil_water_practices`, habitat on `habitat_biodiversity_practices`, waterway practices on `waterway_practices`
      (asked where streams or channels run by the land, E 16). Each practice is asked once and printed once; WSDA
      lists several under more than one purpose, and the reviewer reads them all in G4.2 §A.'

  - ref: "14"
    asks: "Do you apply pest, disease, or weed control materials? (Yes / No, skip to the next area of concern.)"
    status: covered
    trazo:
      questions: [g5_0_pest.applies_pest_weed_disease_inputs, g5_0_pest.input_use_conditions]
      prints: "modules/G5_0.pdf §C; narrative § 205.206(e)"

  - ref: '15'
