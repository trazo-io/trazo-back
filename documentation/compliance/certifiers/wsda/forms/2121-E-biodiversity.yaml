      - g4_2_natural_resources.soil_water_practices_other
      - g4_2_natural_resources.habitat_biodiversity_practices
      - g4_2_natural_resources.habitat_biodiversity_practices_other
      - g4_2_natural_resources.waterway_practices
      - g4_2_natural_resources.waterway_practices_other
      prints: modules/G4_2.pdf §A
    note: 'Closed 2026-11-15. Every practice the row names is an option on G4.2: soil stability and water quality
      on `soil_water_practices`, habitat on `habitat_biodiversity_practices`, waterway practices on `waterway_practices`
      (asked where streams or channels run by the land, E 16). Each practice is asked once and printed once; WSDA
      lists several under more than one purpose, and the reviewer reads them all in G4.2 §A. Integrated pest management
      and an agrichemical handling facility are options of their own.'

  - ref: "16"
    asks: "Are streams, shorelines, gullies, or irrigation channels (e.g. canals, ditches) on or adjacent to sites where certified crops are produced?"
