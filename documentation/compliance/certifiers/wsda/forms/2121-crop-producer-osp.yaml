form:
  code: ''
  title: Crop Producer Organic System Plan
  document_id: AGR 2121
  # AGR 2121 is not revised as one document: sections A-R carry R 02/25 and §S carries
  # R 03/26, verified against every section PDF on 2026-09-07. This umbrella row is the
  # form as a whole, so it records the revision that covers the sections it stands for and
  # names the exception rather than stating one stamp for a document that has two.
  revision: R 02/25 (sections A-R; §S is R 03/26)
  url: https://agr.wa.gov/departments/organic/forms-and-applications
  retrieved: 2026-08-28
  register_status: complete
  source_sha256: 7858a95d88ab178624adb1db4592e898d012f6f710e0f332b352e8a35a1bc7ca
  nop_cites:
  - § 205.201
  guide_trigger: >-
    Required of every operation applying for WSDA crop producer organic certification. WSDA
    runs a LIVING plan — it is completed once, and a renewing operation updates the sections
    that changed rather than re-filing it. The March 1 renewal deadline is the renewal
    application and fee.
  required_of_every_grower: true
items:
- ref: Header
  asks: Business Name; Cert No — printed in the running header of every page of this OSP form, beneath
    WSDA Organic Program's return address and Fee Code 4102.
  status: partial
  trazo:
    models:
    - company.Company.name
    - certifications.Certification
    prints: 00-cover.pdf (legal name; certificate number and certifier)
  gap: The cover prints the operation's legal name, certificate number and certifier. It does NOT print
    the certificate's effective date, expiry date or certified scope, which the `prints` line used to
    claim — `certificate_effective` is computed and never rendered (corrected 2026-08-28).
  severity: P3
  fix: Render effective date, expiry date and scope beside the certificate number on the cover.
