form:
  code: C
  title: Perennial Planting Stock
  document_id: AGR 2121
  revision: R 02/25
  url: https://agr.wa.gov/departments/organic/forms-and-applications
  retrieved: 2026-08-28
  nop_cites:
  - § 205.204
  guide_trigger: 'Section C intro — applies when the operation uses planting or grafting stock; skip via
    the section''s own ''Not Applicable: My business does not use planting or grafting stock'' line.'
  trazo_module: g3_2_planting_stock
  register_status: complete
  source_sha256: 5649edc65c5f7e06a09f8fa45131631cb89734953a51de66b6df679fb9b94cd2
items:
- ref: Not applicable (section)
  asks: 'USDA organic regulations define planting stock as any plant or plant tissue other than annual seedlings
    but including rhizomes, shoots, leaf or stem cuttings, roots, or tubers, used in plant production or propagation.
    Not Applicable: My business does not use planting or grafting stock. Skip to next section.'
  status: covered
  trazo:
    questions:
    - g3_0_seeds.planting_stock_used
    - g3_0_seeds.grafts_stock
    prints: modules/G3_0b.pdf header — 'Not applicable'; modules/G3_0.pdf §A (planting_stock_used), §E (grafts_stock)
- ref: '1'
  asks: Which sources of planting stock are used by your business? Nursery / Produce my own stock / Provided
    through contract / Other.
  status: covered
  trazo:
    questions: [g3_2_planting_stock.stock_source, g3_2_planting_stock.planting_stock_description]
    prints: "modules/G3_0b.pdf §A"
  # Closed 2026-10-31 by the seed and planting stock slice.
- ref: '2'
  asks: Do you use certified organic planting stock? Yes / No.
  status: covered
  trazo:
    questions: [g3_0_seeds.planting_stock_used, g3_2_planting_stock.stock_organic_status]
    prints: "modules/G3_0.pdf §A; modules/G3_0b.pdf §A; a [REVIEW] line on both when the answers disagree"
  # Closed 2026-11-17 by the seeds and planting stock slice: the two answers are read against each other
  # (seed_stock_review). Where G3.0b names a status G3.0 leaves out, or describes stock established this period beside
  # G3.0's None used or Established perennials only, both module PDFs print a [REVIEW] line and the plan review lists
  # it.
- ref: 2a
  asks: If yes, describe how you verify the planting stock is certified organic. Include a description
    of the records you maintain to demonstrate compliance.
  status: covered
  trazo:
    questions: [g3_2_planting_stock.organic_stock_verification_method, g3_2_planting_stock.suppliers_on_supplier_list, g3_2_planting_stock.stock_records_kept, g3_2_planting_stock.planting_stock_upload]
    prints: "modules/G3_0b.pdf §A (verification, Supplier List), §D (records)"
  # Closed 2026-10-31 by the seed and planting stock slice.
- ref: 2b
  asks: Are pre-plant treatments applied to organic planting stock by your farm, supplier, or a third
    party? Yes, include all materials applied to planting stock before planting on your Input Material
    List. / No.
  status: covered
  trazo:
    questions: [g3_2_planting_stock.organic_stock_treatments]
    prints: "modules/G3_0b.pdf §A"
  # Closed 2026-10-31 by the seed and planting stock slice.
- ref: '3'
  asks: Do you use nonorganic planting stock? Yes / No.
  status: covered
  trazo:
    questions: [g3_0_seeds.planting_stock_used, g3_2_planting_stock.stock_organic_status]
    prints: "modules/G3_0.pdf §A; modules/G3_0b.pdf §A; a [REVIEW] line on both when the answers disagree"
  # Closed 2026-11-17 by the seeds and planting stock slice: the two answers are read against each other
  # (seed_stock_review). Where G3.0b names a status G3.0 leaves out, or describes stock established this period beside
  # G3.0's None used or Established perennials only, both module PDFs print a [REVIEW] line and the plan review lists
  # it.
- ref: 3a
  asks: If yes, describe your process to determine if certified organic planting or grafting stock is
    commercially available before using nonorganic planting stock. Include a description of how you attempt
    to source from at least three suppliers of certified organic planting or grafting stock and the records
    you maintain to document your search.
  status: covered
  trazo:
    questions: [g3_2_planting_stock.nonorganic_stock_justification, g3_2_planting_stock.nonorganic_stock_justification_other, g3_2_planting_stock.stock_search_method, g3_2_planting_stock.stock_search_process, g3_2_planting_stock.stock_search_records]
    prints: "modules/G3_0b.pdf §B, §D"
  # Closed 2026-10-31 by the seed and planting stock slice.
- ref: 3b
  asks: If yes, how do you verify planting or grafting stock is not genetically modified (GMO)? Varieties
    are not available in a GMO form / Letters from supplier / Other.
  status: covered
  trazo:
    questions: [g3_2_planting_stock.stock_gmo_documentation]
    prints: "modules/G3_0b.pdf §B"
  # Closed 2026-10-31 by the seed and planting stock slice.
- ref: 3c
  asks: Are pre-plant treatments applied to nonorganic planting stock by your farm, supplier, or a third
    party? Yes, include all materials applied to planting stock before planting on your Input Material
    List. / No.
  status: partial
  severity: P2
  gap: 'Trazo asks whether nonorganic stock was treated before or at delivery, and by whom only when it was.
    A treatment the farm itself applies after delivery and before planting (a root dip) is never asked
    when the nursery confirms none, so the form''s "by your farm" leg is not answered (blind re-grade
    2026-11-19).'
  fix: 'Ask whether this farm, or anyone working for it, treated the stock between delivery and planting.'
  trazo:
    questions: [g3_2_planting_stock.stock_treatments, g3_2_planting_stock.stock_treatment_applied_by]
    prints: "modules/G3_0b.pdf §B; a [REVIEW] line for treated stock whose materials are not all listed, or for unlisted treatments the records name"
  # Closed 2026-11-17 by the seeds and planting stock slice: Yes, and not every treatment material is on our OSP
  # inputs list yet is a true answer for treated stock; the listed answer is refused at the write while a record of
  # nonorganic planting stock names a treatment the materials list does not hold, and a stored one prints those names.
- ref: '4'
  asks: Do you purchase and resell nonorganic planting stock? Yes / No.
  status: covered
  trazo:
    questions: [g3_2_planting_stock.stock_sold_as_organic, g3_2_planting_stock.resold_stock_bought_nonorganic]
    prints: "modules/G3_0b.pdf §C"
  # Closed 2026-11-17 by the seeds and planting stock slice: G3.0b asks whether planting stock sold as organic was
  # bought as nonorganic stock (resold_stock_bought_nonorganic); an operation that sells no planting stock answers No
  # by stock_sold_as_organic.
- ref: 4a
  asks: If yes, how do you ensure the planting stock was managed organically for 12 months prior to the
    certified sale? Include a description of the records you maintain to verify compliance.
  status: covered
  trazo:
    questions: [g3_2_planting_stock.organic_management_start_date, g3_2_planting_stock.twelve_month_attestation, g3_2_planting_stock.twelve_month_records_description]
    prints: "modules/G3_0b.pdf §C; narrative § 205.204(a)(4)"
  # Closed 2026-10-31 by the seed and planting stock slice.
- ref: 4b
  asks: If yes, how is the planting stock labeled or represented as certified?
  status: covered
  trazo:
    questions: [g3_2_planting_stock.resold_stock_labeling_description]
    prints: "modules/G3_0b.pdf §C"
  # Closed 2026-10-31 by the seed and planting stock slice.
- ref: '5'
  asks: Optional space for additional information.
  optional: true
  status: covered
  trazo:
    questions: [g3_2_planting_stock.planting_stock_additional_notes]
    prints: "modules/G3_0b.pdf §D"
  # Closed 2026-10-31 by the seed and planting stock slice.
