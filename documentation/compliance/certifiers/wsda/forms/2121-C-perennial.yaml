form:
  code: C
  title: Perennial Planting Stock
  document_id: AGR 2121
  revision: R 02/25
  url: https://agr.wa.gov/departments/organic/forms-and-applications
  retrieved: 2026-08-28
  nop_cites:
  - § 205.204
  guide_trigger: 'Section C intro — applies when the operation uses planting or grafting stock; skip via
    the section''s own ''Not Applicable: My business does not use planting or grafting stock'' line.'
  trazo_module: g3_2_planting_stock
  register_status: complete
items:
- ref: Header
  asks: 'USDA organic regulations define planting stock as any plant or plant tissue other than annual
    seedlings but including rhizomes, shoots, leaf or stem cuttings, roots, or tubers, used in plant production
    or propagation. Not Applicable: My business does not use planting or grafting stock. Skip to next
    section.'
  status: covered
  trazo:
    questions:
    - g3_0_seeds.planting_stock_used
    - g3_0_seeds.grafts_stock
    prints: modules/G3_0b.pdf header — 'Not applicable'; modules/G3_0.pdf §A (planting_stock_used), §E
      (grafts_stock)
- ref: '1'
  asks: Which sources of planting stock are used by your business? Nursery / Produce my own stock / Provided
    through contract / Other.
  status: partial
  severity: P2
  trazo:
    questions:
    - g3_2_planting_stock.planting_stock_description
    prints: modules/G3_0b.pdf §A
  gap: '`planting_stock_description` opens with ''Where did the stock come from'', so the source IS recorded
    and does print — but as free prose fused with where and when the stock was planted, not as WSDA''s
    four categories. A reviewer reading the module PDF can find the source; nothing can count nursery
    vs own-production across an operation, and a grower who writes only about planting location answers
    the field while leaving this question unanswered. (Was `not_covered` while this form was a draft,
    on a reading of the two nearest questions that overlooked that label''s first clause.)'
  fix: Add a `stock_source` checkbox_group {nursery, produce_own, contract_provided, other} to g3_2_planting_stock
    page A, leaving `planting_stock_description` for the where-and-when half.
- ref: '2'
  asks: Do you use certified organic planting stock? Yes / No.
  status: partial
  severity: P2
  trazo:
    questions:
    - g3_2_planting_stock.stock_organic_status
    prints: modules/G3_0.pdf §A; modules/G3_0b.pdf §A
  gap: 'Reuses CCOF A3''s gap: the same fact is recorded twice — as a checkbox on the master form''s own
    Section A/C gate and again as `stock_organic_status` here — with nothing binding the two answers together,
    so they can silently disagree.'
  fix: 'Same fix as CCOF A3: a `plan_review` cross-check flagging a disagreement between the two answers.'
- ref: 2a
  asks: If yes, describe how you verify the planting stock is certified organic. Include a description
    of the records you maintain to demonstrate compliance.
  status: partial
  severity: P1
  trazo:
    questions:
    - g3_2_planting_stock.stock_records_kept
    - g3_2_planting_stock.suppliers_on_supplier_list
    - g3_2_planting_stock.planting_stock_upload
    prints: modules/G3_0b.pdf §A (suppliers_on_supplier_list), §D (stock_records_kept)
  gap: 'WSDA asks two things here and Trazo answers one. The RECORDS half is answered and prints: `stock_records_kept`
    enumerates what is on file (invoices, organic certificates, variety tags, phytosanitary certificates,
    planting map, treatment statements) and `suppliers_on_supplier_list` states whether the suppliers
    are on the Supplier List. The VERIFICATION METHOD half — how the operation satisfies itself that
    a supplier''s certificate is current and covers the stock sold — has no field. `planting_stock_upload`
    is cited as the intended attachment for these records but does NOT reach the packet: `osp_module_pdf`
    skips `kind in (''info'', ''upload'')`, and only parcel maps are written into the ZIP.'
  fix: Add an optional textarea `organic_stock_verification_method` to g3_2_planting_stock page A, visible
    when `stock_organic_status` includes an organic value. Separately, carry module uploads into the packet
    ZIP the way `parcels/maps/` already does.
- ref: 2b
  asks: Are pre-plant treatments applied to organic planting stock by your farm, supplier, or a third
    party? Yes, include all materials applied to planting stock before planting on your Input Material
    List. / No.
  status: not_covered
  severity: P2
  gap: No question distinguishes treatment disclosure for ORGANIC stock; the module's only treatment field
    is scoped to nonorganic stock and answers a narrower fact than WSDA asks here.
  fix: Add a parallel treatment-disclosure boolean for organic stock to g3_2_planting_stock page A.
- ref: '3'
  asks: Do you use nonorganic planting stock? Yes / No.
  status: partial
  severity: P2
  trazo:
    questions:
    - g3_2_planting_stock.stock_organic_status
    prints: modules/G3_0.pdf §A; modules/G3_0b.pdf §A
  gap: Same field and same gap as ref 2 — WSDA splits organic-stock and nonorganic-stock into two yes/no
    gates where Trazo (and CCOF A3) use one three-way radio.
  fix: Same fix as ref 2.
- ref: 3a
  asks: If yes, describe your process to determine if certified organic planting or grafting stock is
    commercially available before using nonorganic planting stock. Include a description of how you attempt
    to source from at least three suppliers of certified organic planting or grafting stock and the records
    you maintain to document your search.
  status: partial
  trazo:
    questions:
    - g3_2_planting_stock.nonorganic_stock_justification
    - g3_2_planting_stock.nonorganic_stock_justification_other
    - g3_2_planting_stock.stock_search_records
    prints: modules/G3_0b.pdf §B, §D; narrative § 205.204(a)(1)
  severity: P1
  gap: WSDA asks for the search PROCESS and specifically for how the operation attempts to source from
    at least three suppliers. Trazo captures why organic stock was unavailable and which record types
    exist, but no field captures the process narrative or a supplier count. The three-supplier expectation
    exists only as UI `coaching`, and `generate_module_pdf` prints label and answer — never coaching —
    so it reaches no artifact at all. (downgraded from `covered` 2026-08-28 by an adversarial re-read
    of every covered row.)
  fix: Add a `stock_search_process` textarea and a `stock_suppliers_contacted` integer to `g3_2_planting_stock`,
    both printing in the module PDF.
- ref: 3b
  asks: If yes, how do you verify planting or grafting stock is not genetically modified (GMO)? Varieties
    are not available in a GMO form / Letters from supplier / Other.
  status: partial
  severity: P1
  trazo:
    questions:
    - g3_0_seeds.gmo_documentation
    prints: modules/G3_0.pdf §C; narrative § 205.105(e)
  gap: 'Reuses CCOF C1''s gap directly: planting stock has no non-GMO question of its own anywhere — `gmo_documentation`
    is gated on `seeds_used`, so it is invisible whenever only stock (not seed) is non-organic, which
    is exactly this WSDA question''s own case.'
  fix: 'Same fix as CCOF C1: widen the visibility gate to an OR across `seeds_used`/`planting_stock_used`,
    or add a distinct `stock_gmo_documentation` question to G3.0b page B.'
- ref: 3c
  asks: Are pre-plant treatments applied to nonorganic planting stock by your farm, supplier, or a third
    party? Yes, include all materials applied to planting stock before planting on your Input Material
    List. / No.
  status: partial
  severity: P2
  trazo:
    questions:
    - g3_2_planting_stock.stock_treatments
    prints: modules/G3_0b.pdf §B
  gap: '`stock_treatments` answers the yes/no — its three options are none_confirmed / treated_listed
    / unknown, and it prints in §B. Two things WSDA asks are still missing: WHO applied the treatment
    (farm, supplier, or third party), and the materials themselves, which WSDA wants carried onto the
    Input Material List. `treated_listed` asserts the listing rather than driving it, so a grower can
    select it while the Input Material List stays empty and nothing reconciles the two. This is the one
    row where WSDA asks a question CCOF''s G3.0 never does — G3.0 §D is scoped to SEED treatment, so
    ccof/unmapped records the same field as a Trazo superset.'
  fix: 'Add a `stock_treatment_applied_by` radio {farm, supplier, third_party} and reconcile `treated_listed`
    against the Input Material List in the readiness checks, the way `prohibited_materials_on_site` is
    already reconciled.'
- ref: '4'
  asks: Do you purchase and resell nonorganic planting stock? Yes / No.
  status: partial
  severity: P2
  trazo:
    questions:
    - g3_2_planting_stock.stock_sold_as_organic
    prints: modules/G3_0b.pdf §C; narrative § 205.204(a)(4)
  gap: Reuses CCOF A3b's gate fact. Low real-world frequency for the ICP, since orchards sell fruit, not
    nursery stock (CCOF A3b's own note).
  fix: No change needed beyond ref 4a.
- ref: 4a
  asks: If yes, how do you ensure the planting stock was managed organically for 12 months prior to the
    certified sale? Include a description of the records you maintain to verify compliance.
  status: partial
  severity: P3
  trazo:
    questions:
    - g3_2_planting_stock.organic_management_start_date
    - g3_2_planting_stock.twelve_month_attestation
    prints: modules/G3_0b.pdf §C; narrative § 205.204(a)(4)
  gap: 'The 12-month clock itself is captured (start date plus attestation) and reaches print — a superset
    of CCOF''s plain ''Yes'' branch, and CCOF''s own fan-out gap (redirecting to a nonexistent G3.1 module)
    does not apply here since WSDA asks for no such redirect. What remains is narrower: WSDA also asks
    what RECORDS support the date, and no records-list question exists for this specific attestation.'
  fix: Add an optional textarea `twelve_month_records_description` to g3_2_planting_stock page C.
- ref: 4b
  asks: If yes, how is the planting stock labeled or represented as certified?
  status: not_covered
  severity: P3
  gap: No field captures how resold planting stock is labeled or represented as certified organic.
  fix: Add a textarea `resold_stock_labeling_description` to g3_2_planting_stock page C; low priority
    given the ICP's orchard-fruit focus rather than nursery-stock resale (same real-world-frequency note
    as CCOF A3b).
- ref: '5'
  asks: Optional space for additional information.
  status: not_covered
  severity: P3
  gap: No generic free-text catch-all exists on g3_2_planting_stock.
  fix: Add an optional `planting_stock_additional_notes` textarea.
