items:
  - ref: Not applicable (section)
    asks: 'Not Applicable: My business does not use seeds for crops or cover crops. Skip to next section.'
    status: covered
    trazo:
      where: 'modules/G3_0.pdf: the Not applicable line in the header, with who attested it and when'
      prints: modules/G3_0.pdf header — 'Not applicable (attested by … on …)'

  - ref: "1"
    asks: "Which seed sources are used by your business? Save my own seeds / Seed companies / Provided through contract / Other."
    status: covered
    trazo:
      questions: [g3_0_seeds.seed_source]
      prints: "modules/G3_0.pdf §A"
    # Closed 2026-10-31 by the seed and planting stock slice.

  - ref: "2"
    asks: "Do you use certified organic seed? Yes / No."
    status: partial
    severity: P2
    trazo:
      questions: [g3_0_seeds.seeds_used]
      prints: "modules/G3_0.pdf §A; narrative § 205.204"
    gap: "Reuses CCOF A1's gap: prefill (`seed_status`) reads only PL (planting) events, so a farm logging purchased organic seed as a TR (transplant) event carrying `seed_certification_status` gets no suggestion."
    fix: "Extend the `seed_status` resolver to `bundle.prod(\"PL\", \"TR\")` — same fix as CCOF A1."

  - ref: "2a"
    asks: "If yes, describe how you verify the seed is certified organic. Include a description of the records you maintain to demonstrate compliance."
    status: covered
    trazo:
      questions: [g3_0_seeds.seed_verification_method]
      prints: "modules/G3_0.pdf §A"
    # Closed 2026-10-31 by the seed and planting stock slice.

  - ref: "2b"
    asks: "Are pre-plant treatments applied to organic seed by the farm, supplier, or a third party? Yes, include all materials applied to seeds before planting on your Input Material List. / No."
    status: partial
    severity: P2
    trazo:
      questions: [g3_0_seeds.seeds_used, g3_0_seeds.seed_treatment_applied_by, g3_0_seeds.treatments_on_inputs_list]
      prints: "modules/G3_0.pdf §A, §D; narrative § 205.201(a)(2)"
    gap: "Who applies the treatment is now asked (`seed_treatment_applied_by`). Still open, as CCOF D2: nothing downstream reacts to an honest 'No' to `treatments_on_inputs_list`, and the TR-event prefill gap of CCOF A1 stands."
    fix: "Same fixes as CCOF A1 and D2: extend the seed_status prefill to TR events, and add a readiness finding for an unresolved 'No'."

  - ref: "3"
    asks: "Do you use nonorganic seed? Yes / No."
    status: partial
    severity: P2
    trazo:
      questions: [g3_0_seeds.seeds_used]
      prints: "modules/G3_0.pdf §A; narrative § 205.204"
    gap: "Same field and same gap as ref 2 — WSDA splits the organic/nonorganic question into two yes/no gates where CCOF and Trazo both use one 5-way checkbox."
    fix: "Same fix as ref 2."

  - ref: "3a"
    asks: "If yes, describe your process to determine if organic seeds are commercially available before using nonorganic seed. Include a description of how you attempt to source organic seeds from at least three organic seed suppliers and the records you maintain to document your search."
    status: covered
    trazo:
      questions: [g3_0_seeds.ca_search_before_use, g3_0_seeds.seed_required_characteristics, g3_0_seeds.seed_required_characteristics_other, g3_0_seeds.ca_search_method, g3_0_seeds.ca_search_method_other, g3_0_seeds.seed_search_records]
      prints: "modules/G3_0.pdf §B"
    # Closed 2026-10-31 by the seed and planting stock slice.

  - ref: "3b"
    asks: "If yes, how do you verify seeds are not genetically modified (GMO)? Varieties are not available in a GMO form / Letters from the seed supplier / Safe seed pledge / Other."
    status: covered
    trazo:
      questions: [g3_0_seeds.gmo_documentation]
      prints: "modules/G3_0.pdf §C"
    # Closed 2026-10-31 by the seed and planting stock slice.

  - ref: "3c"
    asks: "Are pre-plant treatments applied to nonorganic seed by your farm, supplier, or a third party? Yes, include all materials applied to seeds before planting on your Input Material List. / No."
    status: partial
    severity: P2
    trazo:
      questions: [g3_0_seeds.seeds_used, g3_0_seeds.seed_treatment_applied_by, g3_0_seeds.treatments_on_inputs_list]
      prints: "modules/G3_0.pdf §A, §D; narrative § 205.201(a)(2)"
    gap: "Same as ref 2b, for the `non_organic_treated` option: who applies the treatment is asked; the Input Material List follow-through is still an attestation nothing reconciles."
    fix: "Same fix as ref 2b."
  - ref: '4'
    asks: Optional space for additional information.
    optional: true
    status: covered
    trazo:
      questions: [g3_0_seeds.seeds_additional_notes]
      prints: "modules/G3_0.pdf §F"
    # Closed 2026-10-31 by the seed and planting stock slice.
