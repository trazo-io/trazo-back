form:
  code: "A"
  title: "Seeds"
  document_id: "AGR 2121"
  revision: "R 02/25"
  url: "https://agr.wa.gov/departments/organic/forms-and-applications"
  retrieved: 2026-08-28
  nop_cites: ["§ 205.204"]
  guide_trigger: "Section A intro — every crop producer OSP; skip only via the section's own 'Not Applicable: My business does not use seeds for crops or cover crops' line."
  required_of_every_grower: true
  trazo_module: g3_0_seeds
  register_status: complete
