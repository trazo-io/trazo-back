form:
  code: "A"
  title: "Seeds"
  document_id: "AGR 2121"
  revision: "R 02/25"
  url: "https://agr.wa.gov/departments/organic/forms-and-applications"
  retrieved: 2026-08-28
  nop_cites: ["§ 205.204"]
  guide_trigger: "Section A intro — every crop producer OSP; skip only via the section's own 'Not Applicable: My business does not use seeds for crops or cover crops' line."
  required_of_every_grower: true
  trazo_module: g3_0_seeds
  # DRAFT: this form's rows are written, but not every question of the module(s) it claims
  # is yet accounted for by a WSDA citation or a wsda/unmapped entry. Coverage is scoped
  # PER CERTIFIER — CCOF's unmapped files say nothing about what WSDA asks — so completing
  # this means deciding, per remaining question, whether WSDA asks it.
  register_status: draft

items:
  - ref: "Header"
    asks: "Not Applicable: My business does not use seeds for crops or cover crops. Skip to next section."
    status: covered
    trazo:
      prints: "modules/G3_0.pdf header — 'Not applicable (attested by … on …)'"
    # Same Trazo attestation mechanism CCOF's G3.0 Header row cites — one module, one NA gate,
    # answers both certifiers' seed-NA line identically.

  - ref: "1"
    asks: "Which seed sources are used by your business? Save my own seeds / Seed companies / Provided through contract / Other."
    status: not_covered
    severity: P2
    gap: "No CCOF grower form asks seed source either, and Trazo has no field for it — `seeds_used` records organic status (organic/non-organic, treated/untreated), not provenance (self-saved vs. purchased vs. contract-provided)."
    fix: "Add a `seed_source` checkbox_group {save_own, seed_companies, contract_provided, other} to g3_0_seeds page A."

  - ref: "2"
    asks: "Do you use certified organic seed? Yes / No."
    status: partial
    severity: P2
    trazo:
      questions: [g3_0_seeds.seeds_used]
      prints: "modules/G3_0.pdf §A; narrative § 205.204"
    gap: "Reuses CCOF A1's gap: prefill (`seed_status`) reads only PL (planting) events, so a farm logging purchased organic seed as a TR (transplant) event carrying `seed_certification_status` gets no suggestion."
    fix: "Extend the `seed_status` resolver to `bundle.prod(\"PL\", \"TR\")` — same fix as CCOF A1."

  - ref: "2a"
    asks: "If yes, describe how you verify the seed is certified organic. Include a description of the records you maintain to demonstrate compliance."
    status: not_covered
    severity: P1
    gap: "No free-text field captures the organic-seed verification method or the records kept for it; `seeds_used` records only the status checkbox. WSDA's closing paragraph ties this to inspection ('have a list of the seeds used each year and documentation demonstrating...')."
    fix: "Add an optional textarea `seed_verification_method` to g3_0_seeds page A, visible when `seeds_used` includes an organic option."

  - ref: "2b"
    asks: "Are pre-plant treatments applied to organic seed by the farm, supplier, or a third party? Yes, include all materials applied to seeds before planting on your Input Material List. / No."
    status: partial
    severity: P2
    trazo:
      questions: [g3_0_seeds.seeds_used, g3_0_seeds.treatments_on_inputs_list]
      prints: "modules/G3_0.pdf §A, §D; narrative § 205.201(a)(2)"
    gap: "The treated/untreated split lives in `seeds_used` (`organic_treated` vs `organic_untreated`, carrying CCOF A1's TR-event prefill gap); the Input Material List follow-through is `treatments_on_inputs_list`, reusing CCOF D2's gap that nothing downstream reacts to an honest 'No.'"
    fix: "Same two fixes as CCOF A1 and D2 — extend the prefill resolver, and add a readiness finding for an unresolved 'No.'"

  - ref: "3"
    asks: "Do you use nonorganic seed? Yes / No."
    status: partial
    severity: P2
    trazo:
      questions: [g3_0_seeds.seeds_used]
      prints: "modules/G3_0.pdf §A; narrative § 205.204"
    gap: "Same field and same gap as ref 2 — WSDA splits the organic/nonorganic question into two yes/no gates where CCOF and Trazo both use one 5-way checkbox."
    fix: "Same fix as ref 2."

  - ref: "3a"
    asks: "If yes, describe your process to determine if organic seeds are commercially available before using nonorganic seed. Include a description of how you attempt to source organic seeds from at least three organic seed suppliers and the records you maintain to document your search."
    status: partial
    severity: P1
    trazo:
      questions: [g3_0_seeds.ca_search_before_use]
      prints: "modules/G3_0.pdf §B; narrative § 205.204(a)(1)"
    gap: "The top-level gate is captured (`ca_search_before_use`). The descriptive detail WSDA wants in one field — characteristics considered, search method, and records kept — has no seed-side equivalent at all: CCOF's own B1a, B2 and B3 rows note this same absence ('the seed side has no OSP-level statement…', 'nothing states the search method…', 'the seed side has no record-type statement'). Trazo's structured equivalents for all three exist only on the planting-stock module (g3_2_planting_stock), not here."
    fix: "Reuse CCOF B1a/B2/B3's fixes on the seed side: add `seed_required_characteristics`, `ca_search_method`, and a `seed_search_records` question to g3_0_seeds page B."

  - ref: "3b"
    asks: "If yes, how do you verify seeds are not genetically modified (GMO)? Varieties are not available in a GMO form / Letters from the seed supplier / Safe seed pledge / Other."
    status: partial
    severity: P1
    trazo:
      questions: [g3_0_seeds.gmo_documentation]
      prints: "modules/G3_0.pdf §C; narrative § 205.105(e)"
    gap: "Reuses CCOF C1's verdict. For this seed-specific reading the page renders correctly (gated on `seeds_used`, unlike the stock case CCOF C1 flags as invisible) — but Trazo's option set (`supplier_statement`, `catalog`, `seed_tag`) offers neither of WSDA's two extra bases, 'varieties are not available in a GMO form' and 'safe seed pledge.'"
    fix: "Add `not_available_as_gmo` and `safe_seed_pledge` options to `gmo_documentation`."

  - ref: "3c"
    asks: "Are pre-plant treatments applied to nonorganic seed by your farm, supplier, or a third party? Yes, include all materials applied to seeds before planting on your Input Material List. / No."
    status: partial
    severity: P2
    trazo:
      questions: [g3_0_seeds.seeds_used, g3_0_seeds.treatments_on_inputs_list]
      prints: "modules/G3_0.pdf §A, §D; narrative § 205.201(a)(2)"
    gap: "Same pair of fields and gaps as ref 2b, for the `non_organic_treated` option instead of `organic_treated`."
    fix: "Same fix as ref 2b."

  - ref: "4"
    asks: "Optional space for additional information."
    status: not_covered
    severity: P3
    gap: "No generic free-text catch-all exists on g3_0_seeds page A."
    fix: "Add an optional `seeds_additional_notes` textarea."
