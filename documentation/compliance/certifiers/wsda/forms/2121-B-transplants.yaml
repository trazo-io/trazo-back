form:
  code: "B"
  title: "Transplants"
  document_id: "AGR 2121"
  revision: "R 02/25"
  url: "https://agr.wa.gov/departments/organic/forms-and-applications"
  retrieved: 2026-08-28
  nop_cites: ["§ 205.204"]
  guide_trigger: "Section B intro — applies when the operation uses annual seedlings (transplants); skip via the section's own 'Not Applicable: My business does not use annual seedlings' line."
  trazo_module: g3_1_seedlings
  register_status: complete
  source_sha256: 62df83ee9586d3b7ad5e3c45aef64019d8c29fd4be9b524ac450f3c96ec027d3

items:
  - ref: Not applicable (section)
    asks: 'USDA organic regulations define annual seedling as a plant grown from seed that will complete its
      life cycle or produce a harvestable yield within the same crop year or season in which it was planted.
      Not Applicable: My business does not use annual seedlings. Skip to next section.'
    status: covered
    trazo:
      where: 'modules/G3_0a.pdf: the Not applicable line in the header'
      prints: modules/G3_0a.pdf header — 'Not applicable'

  - ref: "1"
    asks: "Do you purchase annual seedlings? Yes, include all materials used with annual seedlings on your Material List / No."
    status: covered
    trazo:
      questions: [g3_0_seeds.seedlings_used, g3_1_seedlings.seedling_suppliers_panel]
      prints: "modules/G3_0.pdf §A; modules/G3_0a.pdf §A supplier panel; suppliers/ in the ZIP"
    # Closed 2026-11-05 by the supplier register slice. The purchased-organic answer used to assert a
    # certificate kept for each supplier with nothing behind it; the panel now prints each supplier's
    # copy state. Materials used on seedlings are entered in the Materials Application like any other.

  - ref: "1a"
    asks: "If yes, describe how you verify the annual seedlings are certified organic. Include a description of the records you maintain to demonstrate compliance."
    status: covered
    trazo:
      questions: [g3_1_seedlings.seedlings_description, g3_1_seedlings.seedling_suppliers_panel]
      prints: "modules/G3_0a.pdf §A (the description, then each supplier's certificate state); suppliers/ in the ZIP"
    # Closed 2026-11-05 by the supplier register slice.

  - ref: "2"
    asks: "Do you produce annual seedlings? Yes / No."
    status: partial
    severity: P1
    trazo:
      questions: [g3_0_seeds.seedlings_used]
      prints: "modules/G3_0.pdf §A; modules/G3_0a.pdf; narrative § 205.204(a)"
    gap: "Reuses CCOF A2's produce-own-organic branch: `seedlings_used`'s `own_organic` option has no prefill even though producing seedlings is logged as a TR event."
    fix: "Same fix as CCOF A2 — extend the prefill resolver to TR events."

  - ref: "2a"
    asks: "If yes, are your annual seedlings grown within the boundary of your site? Yes / No – An Additional Facilities and Third-Parties (AGR 2519) form is attached."
    status: covered
    trazo:
      questions: [g3_1_seedlings.seedlings_grown_on_site, g3_1_seedlings.seedling_growing_location]
      prints: "modules/G3_0a.pdf"
    # Closed 2026-10-31 by the seed and planting stock slice.

  - ref: "3"
    asks: "Do you sell organic annual seedlings? Yes / No."
    status: covered
    trazo:
      questions: [g3_1_seedlings.seedlings_sold_as_organic]
      prints: "modules/G3_0a.pdf"
    # Closed 2026-10-31 by the seed and planting stock slice.

  - ref: "3a"
    asks: "If yes, how are seedlings labeled or represented as organic?"
    status: covered
    trazo:
      questions: [g3_1_seedlings.seedlings_labeling_description]
      prints: "modules/G3_0a.pdf"
    # Closed 2026-10-31 by the seed and planting stock slice.
