form:
  code: P
  title: Quality Assurance and Fraud Prevention
  document_id: AGR 2121
  revision: R 02/25
  url: https://agr.wa.gov/departments/organic/forms-and-applications
  pdf: https://cms.agr.wa.gov/WSDAKentico/Documents/FSCS/Organic/Forms_organic/2121_Crop_Producer_Osp_P_Quality_Assurance.pdf
  retrieved: '2026-08-28'
  nop_cites:
  - § 205.201
  guide_trigger: Quality-assurance monitoring and organic-fraud prevention for certified crop producer
    operations — WSDA gives this its own lettered section (P), where CCOF folds the same obligation into
    G8.0 section D.
  required_of_every_grower: false
  trazo_module: g2_0_fraud_prevention
  register_status: complete
  source_sha256: 42837b988c1883424b0be4bd81d248c4fc662c10e15e84fd820a6d22652dba36
items:
- ref: '1'
  asks: Does your business have standard operating procedures (SOPs) for organic production and handling?
    Yes, a copy of my business' organic SOPs are attached / No.
  status: partial
  severity: P2
  trazo:
    questions:
    - g2_0_fraud_prevention.fraud_plan_upload
    - g6_4_handling.process_flow
    - g6_4_handling.facility_docs
    prints: modules/G6_4.pdf §C (process_flow)
  gap: 'WSDA asks for SOPs covering organic production AND HANDLING. The handling half has a real answer:
    `process_flow` is a required narrative — the handling process written out in order from harvest to
    shipment — and it prints, which is a written procedure by any reading. The production half does not:
    `fraud_plan_upload` is scoped to a fraud-prevention plan and `facility_docs` invites a site map,
    process flow chart or handling SOPs but is optional; since 2026-10-01 a file uploaded for it rides in the
    packet (attachments/g6_4_handling/facility_docs/) and is named on the G6.4 page. Still, an operation with
    real SOPs for spray decisions, cleanout or harvest crews has no production-side question to say so.'
  fix: Add a general `sop_upload` field to G2.0, distinct from the fraud-specific upload, and carry module
    uploads into the packet ZIP the way `parcels/maps/` already does.
- ref: '2'
  asks: 'How does your business ensure the practices described in your organic system plan and any attached
    SOPs are consistently implemented? Select all that apply: established employee training program (frequency);
    procedures documented within activity records so employees attest to specific steps; procedures require
    a second employee to verify completed tasks; records are reviewed to verify accuracy and completeness
    (frequency); employee observations and evaluations include organic practices (frequency); deviations
    and corrective actions are documented; other.'
  status: partial
  severity: P2
  trazo:
    questions:
    - g2_0_fraud_prevention.osp_implementation_monitoring
    - g2_0_fraud_prevention.osp_implementation_monitoring_other
    - g2_0_fraud_prevention.fraud_review_process
    prints: modules/G2_0.pdf §C
  gap: '`osp_implementation_monitoring`''s options (record_review, internal_review, staff_training, staff_checkins,
    other) cover most of WSDA''s list, but no ''second employee verifies completed tasks'' / dual-sign-off
    option exists — the same gap CCOF''s own G8.0 D3 already flags — and none of the options carries its
    own frequency sub-field the way WSDA asks per item. ''Procedures documented within activity records
    so employees attest to specific steps'' also has no matching option.'
  fix: Add a `dual_signoff` option (reusing CCOF's own fix for G8.0 D3) and a `procedures_in_activity_records`
    option; add a per-item frequency sub-field.
- ref: '3'
  asks: Does your business conduct internal audits? Yes / No.
  status: partial
  severity: P2
  trazo:
    questions:
    - g2_0_fraud_prevention.osp_implementation_monitoring
    prints: modules/G2_0.pdf §C
    triggered_by:
    - g2_0_fraud_prevention.osp_review_frequency
  gap: '`osp_implementation_monitoring` carries an `internal_review` option, one tick among five, rather than
    a discrete yes/no.'
  fix: Add an `internal_audits_conducted` boolean to G2.0 page C.
- ref: 3a
  asks: If yes, describe the scope and frequency of the internal audits.
  status: partial
  severity: P2
  trazo:
    questions:
    - g2_0_fraud_prevention.osp_accuracy_process
    prints: modules/G2_0.pdf §C
  gap: '`osp_accuracy_process` (''who keeps this plan accurate, and how'') is about the plan, not an audit
    programme: it has no scope and no frequency of its own.'
  fix: Add an `internal_audit_scope` textarea and a frequency.
- ref: '4'
  asks: Does your business take samples of organic crops, products or ingredients and analyze them for prohibited
    pesticide residues? Yes / No.
  status: covered
  trazo:
    questions:
    - g2_0_fraud_prevention.fraud_mitigation_practices
    prints: modules/G2_0.pdf §B (the product_testing option)
- ref: 4a
  asks: 'If yes, describe your business'' internal sampling system: how you determine which products to sample,
    the frequency samples are pulled, and the screening or analysis performed.'
  status: partial
  severity: P2
  trazo:
    questions:
    - g2_0_fraud_prevention.product_testing_detail
    prints: modules/G2_0.pdf §B
  gap: '`product_testing_detail` asks what is tested and how often; the screening or analysis performed (laboratory
    method, panel) has no field.'
  fix: Add `residue_screening_method`, shown when `fraud_mitigation_practices` includes `product_testing`.
- ref: 4b
  asks: 'Describe how your business responds when pesticide residues are detected: how you determine the source
    of contamination and whether the product maintains its organic status, who is notified and involved, and
    how the response is documented.'
  status: not_covered
  severity: P1
  trazo:
    prints: —
  gap: Nothing captures the detection-response protocol.
  fix: Add `residue_detection_response` [textarea], shown when `fraud_mitigation_practices` includes `product_testing`.
- ref: '5'
  asks: Detail how your business evaluates and approves organic suppliers of seeds, entities providing
    contracted services, or sources of input materials for use in organic production. Include details
    about how you monitor previously approved suppliers and service providers. Organic supplier approval
    procedures are attached.
  status: covered
  trazo:
    questions: [g2_0_fraud_prevention.fraud_mitigation_practices, g2_0_fraud_prevention.supplier_approval_controls, g2_0_fraud_prevention.supplier_approval_controls_other, g2_0_fraud_prevention.supplier_certificate_review_frequency, g2_0_fraud_prevention.supplier_certificate_review_frequency_other, g2_0_fraud_prevention.supplier_approval_procedure_upload]
    prints: "modules/G2_0.pdf §B; attachments/g2_0_fraud_prevention/ in the packet ZIP"
  # Closed 2026-11-02 by the third-party certificates slice.
- ref: '6'
  asks: 'Describe your business'' criteria for reporting suspected organic fraud and providing credible
    evidence to WSDA Organic Program or USDA National Organic Program. Select all that apply: will report
    all positive sample results linked to organic crops; will report instances of potentially fraudulent
    activity in the supply chain; will report instances where the quantity of organic product received
    from a supplier exceeds their known production capacity; will report instances where an organic product
    is offered for sale below market price without reasonable explanation; other.'
  status: partial
  severity: P2
  trazo:
    questions:
    - g2_0_fraud_prevention.fraud_mitigation_practices
    - g2_0_fraud_prevention.fraud_mitigation_other
    prints: modules/G2_0.pdf §B
  gap: '`report_suspected` is a single checkbox with no breakdown of WSDA''s four specific reporting triggers
    (positive residue results; suspected fraudulent activity; supplier quantity exceeding known production
    capacity; below-market-price product) — a certifier cannot tell which trigger an operation actually
    watches for.'
  fix: Add a `fraud_reporting_triggers` checkbox_group {positive_sample_results, suspected_fraud, quantity_exceeds_capacity,
    below_market_price, other}, shown when `report_suspected` is selected.
- ref: '7'
  asks: Optional space for additional information.
  status: not_covered
  severity: P3
  optional: true
  trazo:
    prints: —
  gap: Optional free space. Trazo has no general notes field on this module, so nothing extra the operator
    wants to say here has a place; WSDA does not require it.
  fix: Add an optional additional-notes textarea to the fraud-prevention module.
