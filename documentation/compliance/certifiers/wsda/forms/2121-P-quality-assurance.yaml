form:
  code: P
  title: Quality Assurance and Fraud Prevention
  document_id: AGR 2121
  revision: R 02/25
  url: https://agr.wa.gov/departments/organic/forms-and-applications
  pdf: https://cms.agr.wa.gov/WSDAKentico/Documents/FSCS/Organic/Forms_organic/2121_Crop_Producer_Osp_P_Quality_Assurance.pdf
  retrieved: '2026-08-28'
  nop_cites:
  - § 205.201
  guide_trigger: Quality-assurance monitoring and organic-fraud prevention for certified crop producer
    operations — WSDA gives this its own lettered section (P), where CCOF folds the same obligation into
    G8.0 section D.
  required_of_every_grower: false
  trazo_module: g2_0_fraud_prevention
  register_status: complete
  source_sha256: 42837b988c1883424b0be4bd81d248c4fc662c10e15e84fd820a6d22652dba36
items:
- ref: '1'
  asks: Does your business have standard operating procedures (SOPs) for organic production and handling? Yes, a
    copy of my business' organic SOPs are attached / No.
  status: covered
  trazo:
    questions:
    - g2_0_fraud_prevention.written_sops_kept
    - g2_0_fraud_prevention.sop_upload
    prints: modules/G2_0.pdf §C; attachments/g2_0_fraud_prevention/sop_upload/ in the packet ZIP
  note: Closed 2026-11-14. `written_sops_kept` is WSDA's Yes or No, covering production and handling; the upload
    shows on the Yes, so a Yes with no file reads as an attachment missing. Handling is also written out in `g6_4_handling.process_flow`,
    and `facility_docs` can carry handling SOPs.
- ref: '2'
  asks: 'How does your business ensure the practices described in your organic system plan and any attached SOPs
    are consistently implemented? Select all that apply: established employee training program (frequency); procedures
    documented within activity records so employees attest to specific steps; procedures require a second employee
    to verify completed tasks; records are reviewed to verify accuracy and completeness (frequency); employee observations
    and evaluations include organic practices (frequency); deviations and corrective actions are documented; other.'
  status: covered
  trazo:
    questions:
    - g2_0_fraud_prevention.osp_implementation_monitoring
    - g2_0_fraud_prevention.osp_implementation_monitoring_other
    - g2_0_fraud_prevention.record_review_frequency
    - g2_0_fraud_prevention.employee_evaluation_frequency
    - g2_0_fraud_prevention.ofpp_training_cadence
    - g2_0_fraud_prevention.ofpp_training_cadence_other
    - g2_0_fraud_prevention.fraud_review_process
    prints: modules/G2_0.pdf §C
  note: 'Closed 2026-11-14. Every way WSDA lists is an option of `osp_implementation_monitoring` (`staff_training`,
    `procedures_in_activity_records`, `dual_signoff`, `record_review`, `employee_evaluations`, `corrective_actions_documented`,
    other). The three WSDA asks a frequency of ask it: `record_review_frequency` and `employee_evaluation_frequency`
    on their option, the training programme by `ofpp_training_cadence`, asked of every operation.'
- ref: '3'
  asks: Does your business conduct internal audits? Yes / No.
  status: covered
  trazo:
    questions:
    - g2_0_fraud_prevention.internal_audits_conducted
    prints: modules/G2_0.pdf §C
  note: Closed 2026-11-14. `internal_audits_conducted`, a Yes or No of its own; the certifier's inspection is excluded
    in its coaching.
- ref: 3a
  asks: If yes, describe the scope and frequency of the internal audits.
  status: covered
  trazo:
    questions:
    - g2_0_fraud_prevention.internal_audit_scope
    prints: modules/G2_0.pdf §C
  note: Closed 2026-11-14. `internal_audit_scope` asks the scope and how often, shown on P 3's Yes.
- ref: '4'
  asks: Does your business take samples of organic crops, products or ingredients and analyze them for prohibited
    pesticide residues? Yes / No.
  status: covered
  trazo:
    questions:
    - g2_0_fraud_prevention.fraud_mitigation_practices
    prints: modules/G2_0.pdf §B (the product_testing option)
- ref: 4a
  asks: 'If yes, describe your business'' internal sampling system: how you determine which products to sample,
    the frequency samples are pulled, and the screening or analysis performed.'
  status: covered
  trazo:
    questions:
    - g2_0_fraud_prevention.product_testing_detail
    - g2_0_fraud_prevention.residue_screening_method
    prints: modules/G2_0.pdf §B
  note: 'Closed 2026-11-08. `product_testing_detail` asks what is sampled and how often; `residue_screening_method`
    the screening or analysis performed (laboratory, residue panel). Both shown when `fraud_mitigation_practices`
    includes product testing.'
- ref: 4b
  asks: 'Describe how your business responds when pesticide residues are detected: how you determine the source
    of contamination and whether the product maintains its organic status, who is notified and involved, and
    how the response is documented.'
  status: covered
  trazo:
    questions:
    - g2_0_fraud_prevention.residue_detection_response
    prints: modules/G2_0.pdf §B
  note: 'Closed 2026-11-08. `residue_detection_response` asks how the operation responds when a residue is detected,
    its coaching naming WSDA''s four parts (finding the source, deciding organic status under § 205.671, who is
    notified, how it is documented). Shown when `fraud_mitigation_practices` includes product testing; an operation
    that does not test is answered by P 4''s No.'
- ref: '5'
  asks: Detail how your business evaluates and approves organic suppliers of seeds, entities providing
    contracted services, or sources of input materials for use in organic production. Include details
    about how you monitor previously approved suppliers and service providers. Organic supplier approval
    procedures are attached.
  status: covered
  trazo:
    questions: [g2_0_fraud_prevention.fraud_mitigation_practices, g2_0_fraud_prevention.supplier_approval_controls, g2_0_fraud_prevention.supplier_approval_controls_other, g2_0_fraud_prevention.supplier_certificate_review_frequency, g2_0_fraud_prevention.supplier_certificate_review_frequency_other, g2_0_fraud_prevention.supplier_approval_procedure_upload]
    prints: "modules/G2_0.pdf §B; attachments/g2_0_fraud_prevention/ in the packet ZIP"
  # Closed 2026-11-02 by the third-party certificates slice.
- ref: '6'
  asks: 'Describe your business'' criteria for reporting suspected organic fraud and providing credible evidence
    to WSDA Organic Program or USDA National Organic Program. Select all that apply: will report all positive sample
    results linked to organic crops; will report instances of potentially fraudulent activity in the supply chain;
    will report instances where the quantity of organic product received from a supplier exceeds their known production
    capacity; will report instances where an organic product is offered for sale below market price without reasonable
    explanation; other.'
  status: covered
  trazo:
    questions:
    - g2_0_fraud_prevention.fraud_reporting_triggers
    - g2_0_fraud_prevention.fraud_reporting_triggers_other
    prints: modules/G2_0.pdf §B
  note: Closed 2026-11-14. `fraud_reporting_triggers` carries WSDA's four (positive sample results, potentially
    fraudulent activity, a supplier's quantity beyond its known capacity, a price below market without a reasonable
    explanation) and other. Where the report goes is `fraud_reporting_channels` (OTCO OFPP 1-2).
- ref: '7'
  asks: Optional space for additional information.
  status: covered
  optional: true
  trazo:
    questions:
    - g2_0_fraud_prevention.fraud_additional_notes
    prints: modules/G2_0.pdf §C
  note: Closed 2026-11-14. `fraud_additional_notes`, optional, as WSDA's space is.