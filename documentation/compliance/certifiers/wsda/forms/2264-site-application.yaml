form:
  code: ''
  title: Site Application
  document_id: AGR 2264
  revision: R 05/26
  url: https://agr.wa.gov/departments/organic/forms-and-applications
  retrieved: 2026-08-28
  nop_cites:
  - § 205.202
  guide_trigger: A site application is needed for land you would like to have certified to produce organic
    or transitional crops — initial application, new sites or increased acreage, or transfer of a certified
    site (WSDA Organic Program).
  required_of_every_grower: true
  trazo_module: parcel_application
  register_status: complete
  source_sha256: 2700cb9b99f3f8e4cb942fb0e928c8205fc9cae04525e92406d6169bc81824e6
items:
- ref: Instructions (page 1)
  kind: instruction
  asks: 'What a site is, the eligibility windows (36 months for organic, 12 for transitional), that a map must
    accompany every site application, the late-site and land-assessment fees, and when a site application is
    needed: (1) initial application, (2) new sites or increased acreage, (3) transfer of certified sites.'
  note: Trazo writes one Parcel Application PDF per parcel. The map requirement is judged on the Map row. Until
    2026-09-30 this row carried a status and the map gap that the Map row also carries.
- ref: '1'
  asks: 'Site name (example: North Field, Circle C-1, Fuji Blocks 28-35) — should match how you reference
    this production site in your own records; will be printed on your certificate.'
  status: covered
  trazo:
    questions:
    - parcel_application.parcel_name
    models:
    - product.Parcel.name
    prints: parcels/parcel-application-<name>.pdf §A
- ref: '2'
  asks: 'Site location: Street address; City; State; Zip. County; Township, Range, Section. GPS Coordinates.
    (Township/range/section or GPS coordinates can be used in lieu of a street address if applicable.)'
  status: covered
  trazo:
    questions:
    - parcel_application.address
    - parcel_application.location_same_as_operation
    - parcel_application.location_city
    - parcel_application.location_state
    - parcel_application.location_zip
    - parcel_application.county
    - parcel_application.section_township_range
    - parcel_application.location_coordinates
    - parcel_application.location_notes
    models:
    - product.Parcel.address
    - product.Parcel.section_township_range
    - product.Parcel.polygon
    - product.Parcel.application_answers
    - company.models.Establishment.city
    - company.models.Establishment.state
    - company.models.Establishment.zip_code
    prints: >-
      parcels/parcel-application-<name>.pdf §A
  note: >-
    Asked per parcel since 2026-11-10. When the operator answers that the site shares the operation's
    city, state, ZIP code and country, the page prints the operation's address on file beside that
    answer, with a [REVIEW] line naming any part of it that is blank; the operation's address is never
    copied in without that answer. §A prints the drawn boundary's centre (the same computation as the §E
    map caption) or states that no boundary is drawn. A site with no street address is asked for
    coordinates, a cross street or road, or directions in their own field, which is the form's 'in lieu
    of a street address'.
- ref: '3'
  asks: Is the site fee attached? A $40 fee is required for each site application submitted by a renewing
    operation after the March 1 renewal deadline; not needed for new applicants or applications submitted
    by March 1.
  status: out_of_scope
  scope_basis: agent_administration
  trazo:
    prints: —
  reason: WSDA's late-site fee is a payment between the operator and WSDA, not a fact about the operation's
    organic system — no NOP citation attaches to it, and Trazo's OSP module tracks compliance facts, not
    certifier billing (same reasoning as the CCOF Certification Contract's fee-schedule row).
- ref: '4'
  asks: Which certification status are you applying for? Organic (last prohibited material applied at least
    36 months before anticipated harvest) / Transitional (at least 12 months).
  status: covered
  trazo:
    questions:
    - parcel_application.certification_status_requested
    models:
    - product.Parcel.application_answers
    prints: >-
      parcels/parcel-application-<name>.pdf §B
  note: >-
    Asked since 2026-11-10, beside the computed transition card, which informs it and never overrides
    it. When the records date a prohibited application whose 36 months (organic) or 12 months
    (transitional) end after the expected first harvest, the page prints that arithmetic as a [REVIEW]
    line. Hidden for a parcel stated currently certified.
- ref: 4a
  asks: If you are applying for transitional certification, do you need a transitional certificate before harvest?
    Yes (I will market crops from this site with a Transitional claim) / No.
  status: covered
  trazo:
    questions:
    - parcel_application.transitional_certificate_before_harvest
    models:
    - product.Parcel.application_answers
    prints: >-
      parcels/parcel-application-<name>.pdf §B
  note: >-
    Asked since 2026-11-10 when the status applied for is transitional.
- ref: '5'
  asks: When did you start making the day-to-day production decisions for this site (the date you first
    started managing it, or began managing it again after a temporary lease)?
  status: covered
  trazo:
    questions:
    - parcel_application.date_began_managing
    models:
    - product.Parcel.date_began_managing
    prints: parcels/parcel-application-<name>.pdf §B
- ref: '6'
  asks: Is the site currently certified or has it been certified organic or transitional within the last 36
    months? Yes / No.
  status: covered
  trazo:
    questions:
    - parcel_application.currently_certified
    prints: parcels/parcel-application-<name>.pdf §F
- ref: 6a
  asks: If yes, provide the certification agency, certification no., operation name, site no., site name and
    certificate issue date, attach a copy of the previous grower's certificate, and have the previous manager
    complete and sign a Previous Land Use Declaration (AGR 2262).
  status: partial
  severity: P2
  trazo:
    questions:
    - parcel_application.prior_certifier_name
    - parcel_application.certified_operation_name
    - parcel_application.prior_certificate_site_number
    - parcel_application.certificate_card
    - parcel_application.certified_branch
    - parcel_application.certificate_reference
    - parcel_application.continuity_reference
    models:
    - certifications.models.Certification
    - certifications.services.parcel_land_history.certificate_line
    prints: parcels/parcel-application-<name>.pdf §F — the certificate-of-record line when the site is stated
      currently certified; certifier, certified operation name and the certificate's site number as answered
  gap: 'Closed 2026-09-09 (fix/parcel-page-land-history): `currently_certified` is asked as the certifiers
    ask it (no ''by another certifier''), is part of completion (`certification_status`), and gates a certificate-of-record
    line on the parcel''s own page — number, issuing agent, effective and expiry dates from ONE record (`certificate_line`,
    built on `operation_certificate`), never assembled field by field. Printing the record replaced the suggest→confirm
    prefill this row asked for: a record printed beside the operator''s own answer is stronger evidence than
    the same value typed back, and § 205.201(a) authorship is untouched because the operator still answers
    the question. WSDA''s site number and the certified operation''s name now have fields (`prior_certificate_site_number`,
    `certified_operation_name`). Remaining, and why this stays partial: for a site transferred from a PREVIOUS
    grower, that grower''s certificate number and issue date are not captured — the certificate of record is
    this operation''s — and the copy of the previous grower''s certificate plus the signed AGR 2262 are the
    operator''s own paper attachments.'
  note: >-
    2026-10-01 (OSP alignment audit T21-F1): the parcel page follows WSDA's own route. An existing
    certified site of this operation prints that 2264 is filed for initial applications, new sites and
    transfers and that the site renews on AGR 2516, with no land-history demand. A transfer prints item 6a:
    the previous grower's certificate copy (uploaded per parcel, shipped under parcels/certificates/, or
    referenced separately, or missing) and the AGR 2262 signed by the previous manager (a signed affidavit
    under parcels/affidavits/, or missing). Availability only; WSDA decides acceptance.
  fix: Add `prior_certificate_number` and `prior_certificate_issue_date`, visible when `certified_operation_name`
    names another operation; the certificate copy stays an attachment.
- ref: 6b
  asks: 'If currently or previously certified: are you applying for the entire area of the previously
    or currently certified site, or only a portion (the attached map must clearly illustrate the specific
    area you will be managing)?'
  status: covered
  trazo:
    questions:
    - parcel_application.full_prior_site_area
    prints: parcels/parcel-application-<name>.pdf §F
  note: Asked when the parcel is currently or previously certified. The coaching asks for the portion to be
    marked on the §E map; Trazo cannot check that the map shows it, which is the Map row's own limit.
- ref: '7'
  asks: Do you own this site? Yes / No.
  status: covered
  trazo:
    questions:
    - parcel_application.site_tenure
    - parcel_application.site_tenure_other
    prints: parcels/parcel-application-<name>.pdf §A
  note: '`site_tenure` asks OTCO C2''s four states (own, lease or rent, manage for the owner, other); any answer
    but "own" is WSDA''s No. Today''s tenure, never `LandownerAffidavit`, which names whoever attests to a
    past period of land use.'
- ref: 7a
  asks: If no, provide the land owner's name, email, phone no. and address.
  status: covered
  trazo:
    questions:
    - parcel_application.landowner_name
    - parcel_application.landowner_email
    - parcel_application.landowner_phone
    - parcel_application.landowner_address
    prints: parcels/parcel-application-<name>.pdf §A
- ref: 7b
  asks: If no, describe the details of the lease and who is responsible for day-to-day management.
  status: covered
  trazo:
    questions:
    - parcel_application.lease_management_detail
    prints: parcels/parcel-application-<name>.pdf §A
- ref: '8'
  asks: 'Table: crop (indicate varieties as applicable), estimated harvest date (MM/DD/YY), and acres,
    for each crop to be included on the certificate; plus total site acreage.'
  status: covered
  trazo:
    questions:
    - parcel_application.crop_table
    - parcel_application.acres_to_certify
    models:
    - product.ParcelPlannedCrop
    - product.Parcel.area
    - product.Parcel.application_answers
    prints: >-
      parcels/parcel-application-<name>.pdf §A
  note: >-
    A table of rows the operator types (`ParcelPlannedCrop`: crop, variety, expected harvest, acres)
    since 2026-11-11, printed in §A with 'Not stated' for a blank column and a [REVIEW] line for a crop
    with no acres. Crops of seasons still open on the parcel are offered in the app as a starting point
    and named in a [REVIEW] line when the list leaves them out; nothing is added to the table unasked.
    The variety goes in its own column, and each crop carries its own estimated harvest date; the total
    site acreage is the acres to be certified.
- ref: '9'
  asks: Is it possible crops produced on this site will be exported to Canada, considering whether any wholesale
    marketers you work with may export your crops there?
  status: covered
  trazo:
    questions:
    - parcel_application.operation_export_answer
    - g8_0_record_keeping.import_export_activity
    - g8_0_record_keeping.export_destinations
    - g8_0_record_keeping.canada_export_possible
    prints: >-
      parcels/parcel-application-<name>.pdf §B; modules/G8_0.pdf
  note: >-
    Asked once for the operation (G8.0, which includes export by a buyer, broker or trader and names the
    countries), and since 2026-11-10 printed on every site's page. An operation where only some sites
    may reach Canada answers for all of them, which can overstate for a site and never understates.
- ref: '10'
  asks: 'Table, by crop category (Apple, Berries, Grains, Grapes, Hay/Silage, Herbs, Nuts, Pasture, Pears,
    Stone fruit, Vegetable, Other): dates produced and acreage, for production under your management.'
  status: covered
  trazo:
    questions:
    - parcel_application.crop_history
    models:
    - product.ParcelCropHistory
    - product.services.land_history
    prints: >-
      parcels/parcel-application-<name>.pdf §F
  note: >-
    Each land-history row names the crop, the months it was produced (`period_start`, `period_end`) and
    its acres (`acres`, stated by the operator) since 2026-11-11, with pasture as a use. The crop is
    named as the operator names it rather than by WSDA's category list; WSDA takes alternative records
    'provided they include all applicable information'. A year built from season records prints its
    months and no acres, since a season carries none.
- ref: '11'
  asks: Have any treated seeds been planted on the site while under your management (include seeds treated
    with allowed materials)? Yes / No.
  status: covered
  trazo:
    questions:
    - parcel_application.treated_seed_planted
    models:
    - product.Parcel.application_answers
    prints: >-
      parcels/parcel-application-<name>.pdf §F
  note: >-
    Asked per parcel since 2026-11-10, apart from the farm-wide seed answers (G3.0). A Yes prints a
    [REVIEW] line: the agent checks each treatment against the National List.
- ref: 11a
  asks: If yes, provide the brand name of the treatment and the date the seed was planted.
  status: covered
  trazo:
    questions:
    - parcel_application.treated_seed_detail
    models:
    - product.Parcel.application_answers
    prints: >-
      parcels/parcel-application-<name>.pdf §F
  note: >-
    Asked when ref 11 is Yes. A Yes with no brand or date prints a [REVIEW] line saying so.
- ref: '12'
  asks: Is treated wood currently located on the site in a manner that comes into contact with soil, plants,
    or livestock?
  status: partial
  severity: P3
  trazo:
    questions:
    - parcel_application.treated_lumber_present
    models:
    - product.Parcel.treated_lumber_present
    prints: parcels/parcel-application-<name>.pdf §A
  gap: Unlike CCOF's own Parcel Application — which asks about ANY existing installation on the parcel,
    so Trazo's contact-based boolean is a P1 mismatch there — WSDA's own test is ALSO contact-based ('comes
    into contact with soil, plants, or livestock'), which is exactly what `treated_lumber_present` tests.
    The only remaining gap for a WSDA filing is that Trazo's label names only 'crops or soil,' not livestock
    contact.
  fix: Extend the label to cover livestock contact — a wording change, not a new field.
- ref: 12a
  asks: 'If treated wood is present: was it installed while under your management and within the past
    36 months? If yes, when (Month/Day/Year)?'
  status: covered
  trazo:
    questions:
    - parcel_application.treated_lumber_description
    - parcel_application.treated_lumber_install_date
    models:
    - product.Parcel.treated_lumber_description
    - product.Parcel.treated_lumber_install_date
    prints: parcels/parcel-application-<name>.pdf §A
- ref: '13'
  asks: 'List any input materials (fertilizers, soil amendments, pesticides, etc.) applied while under your
    management: material name (complete brand name when applicable) and date of application. Or check ''N/A
    — No input materials have been applied while under my management.'''
  status: partial
  severity: P2
  trazo:
    questions:
    - parcel_application.crop_history
    - parcel_application.no_inputs_within_tenure
    - materials_application.fumigant_prohibited_material_used
    - materials_application.fumigant_prohibited_material_detail
    models:
    - product.ParcelCropHistory.substance_applications (material, manufacturer, application_dates)
    - product.ParcelCropHistory.substances_applied
    - history.ChemicalEvent / history.SoilManagementEvent / history.PestManagementEvent (dated inputs)
    prints: 'parcels/parcel-application-<name>.pdf §F: each land-history year''s summary, one line per
      structured material marked (typed), and one line per dated input event (date, product, kind, organic
      status as recorded) marked (dated record); the operator''s no-inputs statement among the parcel''s
      statements, flagged when a dated input inside the tenure contradicts it'
  gap: Since 2026-10-01 the N/A has its own per-parcel statement (`no_inputs_within_tenure`), asked of every
    parcel and kept apart from the prohibited-material declaration, and the dated input events print beside
    the typed history. What remains is the typed years themselves, before the operation kept records in
    Trazo, whose application dates are still free text (`substance_applications.application_dates`). (OSP
    alignment audit 2026-10, T17-F2.)
  fix: Record typed application dates as dates (one row per application) instead of free text.
- ref: '14'
  asks: 'Table: for each border (direction), the adjoining land use, and the risk prevention strategy
    and buffer management practices — including distance from prohibited-material applications, whether
    a crop is produced within the buffer area, and any other risk-prevention strategies.'
  status: covered
  trazo:
    questions:
    - parcel_application.buffer_editor
    - parcel_application.no_adjoining_prohibited
    - parcel_application.parcel_change_notifications
    - parcel_application.contamination_incidents
    - parcel_application.adjoining_affidavit_card
    - g6_0_production.buffer_strategies
    - g6_0_production.buffer_strategy_other
    - g6_0_production.drift_safeguards
    - g6_0_production.drift_safeguards_other
    models:
    - product.Parcel.buffer_zones
    - product.services.buffer_zones
    prints: parcels/parcel-application-<name>.pdf §D; modules/G6_0.pdf §B (buffer_strategies), §C (drift_safeguards)
  note: 'Closed 2026-11-06. Each border row carries the distance from prohibited-material applications
    (`prohibited_use_distance_ft`, printed "N ft from prohibited-material applications"), whether a crop
    is grown in the buffer (`buffer_crop_grown`), its own prevention text and an explicit "not certified
    organic". The operation-wide G6.0 safeguards print as well; the per-border `prevention` text is what
    ties a safeguard to the border it protects.'
- ref: Map
  asks: 'A map (8.5x11 max, satellite imagery preferred) must accompany every site application. Required
    elements: your operation name and site name printed on the map; borders and boundaries of the site;
    borders where active buffer management occurs; locations of crops (varieties for perennials); all
    adjacent land uses including land managed by others; and, for livestock, the location/type of established
    fences and the location/source of shade and water.'
  status: covered
  trazo:
    questions:
    - parcel_application.map_status
    - parcel_application.map_upload
    - parcel_application.map_elements_shown
    models:
    - product.Parcel.polygon
    - product.Parcel.buffer_zones
    prints: parcels/parcel-application-<name>.pdf §E; packet ZIP parcels/maps/
  note: 'Closed 2026-11-08. The operator''s map ships under `parcels/maps/`, one per site, and §E names the file
    (2026-08-28). `map_elements_shown` asks which elements it shows, WSDA''s among them: the operation name and the
    site name printed on the map, the site''s borders, the borders where buffers are managed, crop locations with
    varieties for perennials, adjacent land uses including land managed by others, and fences, shade and water
    for livestock. §E prints a [REVIEW] naming each WSDA element not ticked (livestock only when the site has
    livestock). The operator''s statement about their map; Trazo does not read the map.'
