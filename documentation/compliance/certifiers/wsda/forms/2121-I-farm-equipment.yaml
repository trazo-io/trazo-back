form:
  code: I
  title: Farm Equipment
  document_id: AGR 2121
  revision: R 02/25
  url: https://agr.wa.gov/departments/organic/forms-and-applications
  retrieved: 2026-08-28
  nop_cites:
  - § 205.272
  guide_trigger: Every Crop Producer OSP — Section I is completed by all applicants.
  required_of_every_grower: true
  trazo_module:
  - g6_0_production
  - g6_1_harvest_transport
  register_status: complete
  source_sha256: 056d0274308d6a5f7c03b94eb766040db00cb87ce46a176d52a5cf5d6228fe83
items:
- ref: '1'
  asks: Do you use any farm equipment that is dedicated for certified production only? Consider all owned, rented,
    or borrowed equipment that comes into direct contact with crops, seeds, transplants, input materials, or other
    items that could pose a contamination or commingling risk.
  status: covered
  trazo:
    models:
    - history.EquipmentEvent (declared, but has no form anywhere — see CCOF G6.0 C1)
    prints: 'modules/G6_0.pdf §F (gate, then the equipment table: dedicated to organic production, per item)'
    questions:
    - g6_0_production.uses_production_equipment
    - g6_0_production.equipment_inventory_panel
  # Closed 2026-11-11 by the equipment register slice.
- ref: 1a
  asks: 'If yes, describe how you prevent dedicated equipment from being contaminated with prohibited materials.
    Include a description of the naming system, signage, or other documentation maintained to verify dedicated equipment
    is only used for organic production. (Or: not applicable, no prohibited materials used, and no non-certified
    crops produced on my farm.)'
  status: covered
  trazo:
    prints: modules/G6_0.pdf §F (how dedicated equipment is kept from prohibited materials and marked)
    questions:
    - g6_0_production.split_operation_separation
    - g6_0_production.dedicated_equipment_contamination_prevention
  # Closed 2026-11-11 by the equipment register slice.
- ref: '2'
  asks: Do you use any farm equipment that is used on both certified and non-certified crops or land? Consider all
    owned, rented, or borrowed equipment that comes into direct contact with crops, seeds, transplants, input materials,
    or other items that could pose a contamination or commingling risk.
  status: covered
  trazo:
    models:
    - history.EquipmentEvent (declared, but has no form anywhere — see CCOF G6.0 C1)
    - history.ProductionEvent.shared_with_conventional
    prints: modules/G6_0.pdf §F (the shared yes/no, and each item's dedicated column; a [REVIEW] line when they
      disagree)
    questions:
    - g6_0_production.equipment_shared_with_nonorganic
    - g6_0_production.equipment_inventory_panel
  # Closed 2026-11-11 by the equipment register slice.
- ref: 2a
  asks: If yes, what types of equipment are shared? (Harvesting / Input material application (sprayers, spreaders)
    / Planting / Transportation / Other.)
  status: covered
  trazo:
    prints: 'modules/G6_0.pdf §F (each item''s use: planting, input application, harvest, in-field washing or packing,
      transport, other)'
    questions:
    - g6_0_production.equipment_inventory_panel
  applies_when:
  - question: g6_0_production.equipment_shared_with_nonorganic
    op: eq
    value: true
  # Closed 2026-11-11 by the equipment register slice.
- ref: 2b
  asks: If yes, describe the procedures you follow to ensure equipment is cleaned after use with non-certified crops.
  status: covered
  trazo:
    models:
    - history.ProductionEvent.cleaning_method
    - history.ProductionEvent.cleaning_materials_used
    prints: modules/G6_0.pdf §F (each shared or brought-in item's cleaning, materials and rinse)
    questions:
    - g6_0_production.equipment_inventory_panel
  applies_when:
  - question: g6_0_production.equipment_shared_with_nonorganic
    op: eq
    value: true
  # Closed 2026-11-11 by the equipment register slice.
- ref: 2c
  asks: If yes, what type of equipment cleaning documentation is maintained? (Clean truck or equipment affidavits
    / Clean out documentation / Standard operating procedures (attach a copy of any procedures) / Other.)
  status: covered
  trazo:
    models:
    - history.EquipmentEvent (the logged events serve as cleaning/purge logs)
    - history.ProductionEvent.cleaning_protocol_reference
    prints: modules/G6_0.pdf §F (documentation types; the procedure rides under attachments/g6_0_production/)
    questions:
    - g6_0_production.equipment_cleaning_documentation
    - g6_0_production.equipment_cleaning_documentation_other
    - g6_0_production.equipment_cleaning_sop_upload
  applies_when:
  - question: g6_0_production.equipment_shared_with_nonorganic
    op: eq
    value: true
  # Closed 2026-11-11 by the equipment register slice.
- ref: '3'
  asks: Do you contract or hire any third parties to conduct any production activities on your behalf?
    Do not consider activities conducted by hired employees who are under your supervision.
  status: covered
  trazo:
    questions:
    - g6_1_harvest_transport.third_party_activities
    - g6_1_harvest_transport.who_harvests
    - g6_1_harvest_transport.who_transports
    prints: modules/G6_1.pdf §A
- ref: 3a
  asks: If yes, what types of activities are conducted on your behalf? (Custom harvest / Custom planting
    / Material applications / Pest control / Transportation / Other.)
  status: covered
  trazo:
    questions:
    - g6_1_harvest_transport.third_party_activities
    prints: modules/G6_1.pdf §A
- ref: 3b
  asks: If yes, what are the cleaning procedures implemented to ensure equipment used by third parties
    does not pose a risk of contamination or commingling to your certified crops? (Inspect custom equipment
    prior to use / Clean custom equipment prior to use / Review cleaning records prior to use / Review
    and maintain copies of standard operating procedures / Custom equipment is dedicated to organic production
    and never used with non-certified crops / Other.)
  status: covered
  trazo:
    questions:
    - g6_1_harvest_transport.third_party_equipment_controls
    - g6_1_harvest_transport.custom_harvester_cleanout_verified
    - g6_1_harvest_transport.custom_harvester_instructions
    prints: modules/G6_1.pdf §A
- ref: 3c
  asks: If yes, what type of equipment cleaning documentation is maintained? Consider records, or copies
    of records, you maintain and make available at inspection. (Clean truck or equipment affidavits /
    Clean out documentation / Standard Operating Procedures (attach a copy of any procedures) / Other.)
  status: covered
  trazo:
    questions:
    - g6_1_harvest_transport.third_party_cleaning_documentation
    prints: modules/G6_1.pdf §A
- ref: '4'
  asks: Optional space for additional information.
  status: covered
  optional: true
  trazo:
    prints: modules/G6_0.pdf §F
    questions:
    - g6_0_production.equipment_notes
  # Closed 2026-11-11 by the equipment register slice.
