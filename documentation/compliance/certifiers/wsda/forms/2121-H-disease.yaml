form:
  code: "H"
  title: "Disease Management"
  document_id: "AGR 2121"
  revision: "R 02/25"
  url: "https://agr.wa.gov/departments/organic/forms-and-applications"
  retrieved: 2026-08-28
  nop_cites: ["§ 205.206"]
  guide_trigger: "Crop Producer Organic System Plan (AGR 2121) — filed once by every crop producer applicant; WSDA runs a LIVING plan, so a renewing operation updates the sections that changed rather than re-filing the whole OSP (the March 1 deadline is the renewal application and fee)"
  required_of_every_grower: true
  # F, G and H all map onto the single Trazo module g5_0_pest — see 2121-F-weed.yaml's header.
  trazo_module: g5_0_pest
  register_status: complete
  source_sha256: 2848e618559a707ef8f5ebbc06d0bde6b884fbb44ee893f5f6435257922349ae

items:
  - ref: "1"
    asks: "Which monitoring practices do you implement to determine the effectiveness of your disease management plan? (Observation of crop health / Comparison of crop yields / Disease modeling / Scouting program / Other.)"
    status: covered
    trazo:
      questions: [g5_0_pest.monitoring_scope, g5_0_pest.monitoring_methods, g5_0_pest.monitoring_methods_other]
      prints: "modules/G5_0.pdf §D; narrative § 205.206(a)"
    # Closed 2026-11-02 by the monitoring slice.

  - ref: "2"
    asks: "How often do you make these comparisons or observations?"
    status: covered
    trazo:
      questions: [g5_0_pest.monitoring_frequency, g5_0_pest.disease_monitoring_frequency]
      prints: "modules/G5_0.pdf §D"
    # Closed 2026-11-02 by the monitoring slice.

  - ref: "3"
    asks: "Which preventative disease control strategies do you implement on your operation? (Crop rotation / Resistant varieties / Vector management / Plant spacing / Companion planting / Microbial products / Compost / Compost tea / Field sanitation (physical removal) / Timing of planting or cultivating / Soil solarization / Irrigation water management / Other.)"
    status: covered
    trazo:
      questions:
      - g5_0_pest.practices_diseases
      - g5_0_pest.practices_diseases_other
      - g5_0_pest.prevention_practices
      - g5_0_pest.prevention_practices_other
      prints: "modules/G5_0.pdf §A; narrative § 205.206"
    # Closed 2026-11-07 (content 2026.11.22). WSDA's disease list as its own list, with vector management, microbial
    # products, compost, compost tea, solarization and irrigation water management.

  - ref: "4"
    asks: "Describe the records you maintain regarding your preventative disease management practices."
    status: not_covered
    severity: P2
    gap: "Same gap as F6/G5: no field captures what records document the preventative practices themselves, as distinct from monitoring-result records. `monitoring_records` is not cited here on that axis — see F6."
    fix: "Add `disease_prevention_records` [textarea]."
  - ref: '5'
    asks: Do you apply copper sulfate or fixed coppers for plant disease control? Yes / No.
    status: covered
    trazo:
      questions: [g5_0_pest.applies_copper_materials]
      prints: "modules/G5_0.pdf §C, with the § 205.601 introductory proviso, the (i)(2) and (i)(3) text and the plan's copper materials"
    # Closed 2026-11-05 by the restricted-materials slice (CONTENT_VERSION 2026.11.13).
  - ref: 5a
    asks: If yes, how do you ensure these materials are applied in a way that minimizes copper accumulation in
      the soil?
    status: covered
    trazo:
      questions: [g5_0_pest.copper_accumulation_practices, g5_0_pest.copper_accumulation_other]
      prints: "modules/G5_0.pdf §C"
    # Closed 2026-11-05 by the restricted-materials slice (CONTENT_VERSION 2026.11.13).
