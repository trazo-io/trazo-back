form:
  code: Q
  title: International Trade
  document_id: AGR 2121
  revision: R 02/25
  url: https://agr.wa.gov/departments/organic/forms-and-applications
  pdf: https://cms.agr.wa.gov/WSDAKentico/Documents/FSCS/Organic/Forms_organic/2121_Crop_Producer_Osp_Q_International_Trade.pdf
  retrieved: '2026-08-28'
  nop_cites:
  - § 205.103
  - § 205.300
  - § 205.272
  guide_trigger: 'Complete if you import or export organic product. NOTE: CCOF asks this subject on its
    Global Market Access Application (GMA04), which ccof/scope.yaml EXCLUDES as export-programme enrolment
    — the absence of a CCOF row is an artifact of that scope decision, not an absence from CCOF''s forms.'
  required_of_every_grower: false
  trazo_module: g8_0_record_keeping
  register_status: complete
  source_sha256: b2f12aa411c824cf9d64a6eafc063fde5a026ce9a2e50ee1c1e2cdaa135a0fce
items:
- ref: '1'
  asks: Do you source organic seeds directly from other countries and import them for use on your farm?
    Yes / No — skip to Exports.
  status: covered
  trazo:
    questions: [g8_0_record_keeping.import_export_activity]
    prints: "modules/G8_0.pdf §C (We import organic seed or planting stock for use on our farm is the Yes)"
  # Closed 2026-11-17 by the international trade slice: G8.0 offers importing organic seed or planting stock directly
  # from other countries for the farm's own use (import_seed), which opens the import questions; an answer without it
  # is the No.
- ref: '2'
  asks: Which countries do you import organic seeds from? Canada, European Union, Great Britain, India,
    Israel, Japan, Mexico, New Zealand, South Korea, Switzerland, other.
  status: covered
  trazo:
    questions: [g8_0_record_keeping.import_export_activity, g8_0_record_keeping.import_seed_countries, g8_0_record_keeping.import_seed_countries_other]
    prints: "modules/G8_0.pdf §C"
  # Closed 2026-11-17 by the international trade slice: G8.0 asks the countries in the form's list
  # (import_seed_countries), shown when the operation imports seed or planting stock.
- ref: '3'
  asks: Which organic standard(s) is the organic seed certified to? USDA NOP 7 CFR Part 205; Canadian
    Organic Regime (COR) CAN/CGSB; Council Regulation (EC) No. 834/2007; other.
  status: covered
  trazo:
    questions: [g8_0_record_keeping.import_seed_standards, g8_0_record_keeping.import_seed_standards_other]
    prints: "modules/G8_0.pdf §C"
  # Closed 2026-11-17 by the international trade slice: G8.0 asks the standards in the form's list
  # (import_seed_standards). The EU option names (EC) No 834/2007, as the form does, and (EU) 2018/848, which replaced
  # it in 2022.
- ref: '4'
  asks: What types of documentation do you maintain for each imported shipment? Bill of Lading, Certificate
    of Analysis, Invoice, NOP Import Certificate, Phytosanitary Certificate, Transaction Certificate,
    other.
  status: covered
  trazo:
    questions: [g8_0_record_keeping.import_documentation, g8_0_record_keeping.import_documentation_other]
    prints: "modules/G8_0.pdf §C"
  # Closed 2026-11-17 by the international trade slice: import_documentation offers a bill of lading, certificate of
  # analysis, invoice, phytosanitary certificate and transaction certificate kept for each shipment, beside the NOP
  # Import Certificate, and opens for imported seed as well as product.
- ref: '5'
  asks: How do you verify imported organic seeds were not treated with prohibited substances or irradiated
    during transport or entry into the United States? Include a description of the records you will maintain
    to demonstrate compliance.
  status: covered
  trazo:
    questions: [g8_0_record_keeping.import_export_activity, g8_0_record_keeping.import_integrity_verification, g8_0_record_keeping.port_integrity_measures]
    prints: "modules/G8_0.pdf §C"
  # Closed 2026-11-17 by the international trade slice: the verification question opens for an operation that imports
  # only seed or planting stock (import_seed), and asks how each shipment is verified free of prohibited substances
  # and ionizing radiation since export, with the records kept.
- ref: '6'
  asks: 'Do you package organic crops for export yourself, or directly export organic crops or products
    to other countries? (Do not consider crops or products handled by another certified organic business.)
    Yes / No — skip to Critical Variances: Canada.'
  status: covered
  trazo:
    questions:
    - g8_0_record_keeping.import_export_activity
    prints: modules/G8_0.pdf §C
- ref: '7'
  asks: Which countries do you export organic crops or products to? Canada, European Union, Great Britain,
    Japan, Mexico, Taiwan, South Korea, other.
  status: covered
  trazo:
    questions:
    - g8_0_record_keeping.import_export_activity
    - g8_0_record_keeping.export_destinations
    - g8_0_record_keeping.export_certificate_types
    - g8_0_record_keeping.export_certificate_types_other
    prints: modules/G8_0.pdf §C
- ref: '8'
  asks: What types of packages and/or labels do you use for export markets? Retail consumer packages,
    wholesale shipping containers, bulk shipping or storage containers.
  status: covered
  trazo:
    questions: [g8_0_record_keeping.export_package_types]
    prints: "modules/G8_0.pdf §C"
  # Closed 2026-11-17 by the international trade slice: asked of a direct exporter (export_package_types), in the
  # form's three kinds of package.
- ref: '9'
  asks: What types of documentation accompany each organic export shipment? Bill of lading, Certificate
    of analysis, EU Certificate of Inspection, Invoice, NAQS Import Certificate (South Korea), Organic
    Certificate, Phytosanitary Certificate, USDA TM-11 Export Certificate, other.
  status: covered
  trazo:
    questions: [g8_0_record_keeping.export_shipment_documents, g8_0_record_keeping.export_shipment_documents_other, g8_0_record_keeping.export_certificate_types, g8_0_record_keeping.import_export_records]
    prints: "modules/G8_0.pdf §C"
  # Closed 2026-11-17 by the international trade slice: export_shipment_documents asks what travels with each export
  # shipment, in the form's list; export_certificate_types still names the certificates the destinations require.
- ref: 1 (Canada variances)
  asks: 'Critical Variances: Canada. Do you produce crops or products that may be exported to Canada? Consider
    both crops you export directly, as well as crops or products which may be exported by a distributor or
    used as ingredients in processed products that will eventually be exported to Canada. Yes / No — skip to
    next section.'
  status: covered
  trazo:
    questions: [g8_0_record_keeping.import_export_activity, g8_0_record_keeping.canada_export_possible, g8_0_record_keeping.export_certificate_types, g8_0_record_keeping.export_destination_requirements]
    prints: "modules/G8_0.pdf §C, with a [REVIEW] line for a No beside the Canada attestation; the parcel application pages §B"
  # Closed 2026-11-17 by the international trade slice: G8.0 asks it of every operation that answered the first
  # question (canada_export_possible), export by a distributor or buyer or as an ingredient included, as WSDA asks it
  # of every grower. A No beside the Canada attestation among the certificates the destinations require prints a
  # [REVIEW] line and is listed on the plan review; each parcel application page prints the answer.
- ref: 2 (Canada variances)
  asks: Do you use Sodium Nitrate to produce organic crops? Yes / No. (Sodium nitrate is approved for use in
    the USDA Organic Regulations but prohibited for use on crops exported to Canada.)
  status: covered
  trazo:
    questions: [g8_0_record_keeping.canada_export_possible, g8_0_record_keeping.sodium_nitrate_used]
    prints: "modules/G8_0.pdf §C; under a Yes, the words of § 205.602(h) and the plan's sodium nitrate materials, or a [REVIEW] line when the list holds none; under a No, [REVIEW] lines for a sodium nitrate material on the plan's list, records classified as sodium nitrate, or fertilizer records whose nitrogen source is mined or natural"
  # Closed 2026-11-17 by the international trade slice: sodium_nitrate_used is asked where crops may reach Canada, and
  # suggested from records classified as sodium nitrate (restricted_materials: the National List row or WSDA's Sodium
  # Nitrate subtype, never a partial name match). A No the plan's list or the records contradict is listed on the plan review.
- ref: 2a (Canada variances)
  asks: If yes, how do you distinguish between organic crops that are produced using sodium nitrate and the
    organic crops that are eligible for export to Canada?
  status: covered
  trazo:
    questions: [g8_0_record_keeping.sodium_nitrate_used, g8_0_record_keeping.sodium_nitrate_canada_separation]
    prints: "modules/G8_0.pdf §C, with a [REVIEW] line under the Yes that Canada does not accept crops produced with it"
  # Closed 2026-11-17 by the international trade slice: required when sodium nitrate is used
  # (sodium_nitrate_canada_separation).
