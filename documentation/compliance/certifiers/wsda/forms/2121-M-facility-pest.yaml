items:
- ref: Not applicable (section)
  asks: 'Not Applicable: My business does not store or conduct post-harvest activities of certified crops beyond
    activities conducted within the organic site or field. Skip to next section.'
  status: partial
  severity: P3
  trazo:
    where: 'modules/G9_0.pdf: the module''s Not applicable statement'
    prints: module NA flag — the whole g9_0_facility_pest module is skippable when not applicable, achieving
      the same effect without a stated, printed answer to this specific applicability note
  gap: 'Same cosmetic gap as Section K item 2: the module''s own not-applicable option implements this skip,
    but there is no discrete question whose answer prints an explicit yes/no to this specific applicability
    statement.'
  fix: Low priority — see Section K item 2's fix.
- ref: '1'
  asks: 'What type of pest management system does your farm use in storage or post-harvest activity areas?
    In-house. Contract pest control service. Business Name: ___. (Note: you must notify all outside pest
    control services that your business handles organic products; a pest control plan suitable for organic
    production must be described in your OSP; all pest management records must be readily available for
    inspection.)'
  status: covered
  trazo:
    prints: modules/G9_0.pdf §A
    questions:
    - g9_0_facility_pest.uses_pest_control_company
    - g9_0_facility_pest.pest_control_company_name
    - g9_0_facility_pest.pest_control_company_notified
- ref: '2'
  asks: 'Check all potential pest problems in storage or post-harvest activity areas: Crawling insects
    / Birds / Flying insects / Rodents / Other.'
  status: covered
  trazo:
    questions:
    - g9_0_facility_pest.facility_pest_problems
    - g9_0_facility_pest.facility_pest_problems_other
    prints: "modules/G9_0.pdf §B (rats and mice answer rodents)"
  note: "Closed 2026-11-10 (content 2026.12.01)."
- ref: '3'
  asks: Describe the practices used to monitor and manage pest pressures. Include frequency of monitoring
    and how these practices are documented.
  status: covered
  trazo:
    questions: [g9_0_facility_pest.pest_control_records, g9_0_facility_pest.pest_monitoring_practices, g9_0_facility_pest.pest_monitoring_frequency]
    prints: "modules/G9_0.pdf §A (pest_control_records)"
  # Closed 2026-11-02 by the monitoring slice.
- ref: '4'
  asks: 'Which pest management strategies are used in your storage or post-harvest activity areas? Preventative:
    Good sanitation / Incoming product inspection / Physical barriers / Removal of exterior habitat and
    food / Screened windows or vents / Sealed doors and windows / Other. Mechanical: Electrocutors / Freezing
    treatments / Heat treatments / Mechanical traps / Sticky traps / Ultrasound/light devices / Other.
    Pest Control Materials Natural or on the National List: Boric acid / Diatomaceous earth / Pheromone
    traps / Pyrethrum / Vitamin baits / Other. Pest Control Materials Not on the National List: Crack
    and crevice spray / Exterior Bait Stations / Fogging / Fumigation / Other.'
  status: covered
  trazo:
    questions:
    - g9_0_facility_pest.preventive_practices
    - g9_0_facility_pest.preventive_practices_other
    - g9_0_facility_pest.mechanical_controls
    - g9_0_facility_pest.material_tier
    prints: "modules/G9_0.pdf §B (WSDA's prevention and mechanical options), §C (material_tier; the materials themselves on the Materials List)"
  note: "Closed 2026-11-10 (content 2026.12.01)."
- ref: '5'
  asks: Describe how bait stations are used in storage or post-harvest activity areas. No bait stations
    are used. All bait stations are located on the exterior perimeter, outside areas used for organic
    handling. Stations are only baited with a nonsynthetic or organically allowed input material. Other
    — describe the type of bait used and where bait stations are located.
  status: covered
  trazo:
    questions:
    - g9_0_facility_pest.bait_station_use
    - g9_0_facility_pest.bait_station_use_other
    prints: "modules/G9_0.pdf §C"
  note: "Closed 2026-11-10 (content 2026.12.01)."
- ref: '6'
  asks: Describe how certified products and packaging are protected from contact with pest control materials.
    Not applicable, no pest control materials are used in organic handling or storage areas.
  status: covered
  trazo:
    questions:
    - g9_0_facility_pest.material_tier
    - g9_0_facility_pest.contamination_prevention
    - g6_2_storage.storage_pest_control_materials_used
    - g6_2_storage.storage_pest_control_materials_description
    prints: "modules/G9_0.pdf §C (material_tier none is the not-applicable answer; contamination_prevention when materials are used)"
  note: "Closed 2026-11-10 (content 2026.12.01)."
- ref: '7'
  asks: Prior to using a synthetic pest control material not on the National List, describe how you will
    first determine an allowed material is not effective to control the targeted pest. Not applicable,
