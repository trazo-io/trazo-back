  pdf: https://cms.agr.wa.gov/WSDAKentico/Documents/FSCS/Organic/Forms_organic/2121_Crop_Producer_Osp_S_Fungi.pdf
  retrieved: '2026-08-28'
  nop_cites:
  - § 205.210
  guide_trigger: Triggered when the operation produces mushrooms or other fungi; most crop producer operations
    attest Not Applicable. WSDA's own footer shows a later revision stamp (R 03/26) than every other Crop
    Producer OSP section (R 02/25) — recorded, not normalized away.
  required_of_every_grower: false
  register_status: complete
items:
- ref: '1'
  asks: What sources of spawn are used by your business? Spawn companies; provided through contract; other.
  status: out_of_scope
  severity: P3
  reason: The ICP is mid-size wholesale orchard and berry operations (WA-CA-OR); none grow mushrooms,
    so this question never applies. Mushroom production is outside Trazo's crop scope entirely — `documentation/reference/usda-osp-template/section-crosswalk.md`
    already records § 205.210 mushroom production as an excluded scope. If mushroom production were ever
    added, CCOF's own instruction (G3.2 A5) routes non-organic spawn to the already-built G3.0 seed/stock
    module (`g3_0_seeds`) — that seam exists; only the mushroom-specific questions would need to be built.
