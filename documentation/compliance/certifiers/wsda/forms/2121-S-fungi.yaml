form:
  code: S
  title: Fungi / Mushroom Production
  document_id: AGR 2121
  revision: R 03/26
  url: https://agr.wa.gov/departments/organic/forms-and-applications
  pdf: https://cms.agr.wa.gov/WSDAKentico/Documents/FSCS/Organic/Forms_organic/2121_Crop_Producer_Osp_S_Fungi.pdf
  retrieved: '2026-08-28'
  nop_cites:
  - § 205.210
  guide_trigger: Triggered when the operation produces mushrooms or other fungi; most crop producer operations
    attest Not Applicable. WSDA's own footer shows a later revision stamp (R 03/26) than every other Crop
    Producer OSP section (R 02/25) — recorded, not normalized away.
  required_of_every_grower: false
  register_status: complete
items:
- ref: '1'
  asks: What sources of spawn are used by your business? Spawn companies; provided through contract; other.
  status: not_covered
  severity: P3
  gap: Trazo does not cover mushroom production (§ 205.210) and asks no question that says whether the operation
    grows mushrooms, so it cannot show that this does not apply.
  fix: Add a fungi option to `certification_contract.contract_scopes` and make this form conditional on it
    (`applies_when`); the mushroom questions themselves stay unbuilt until a mushroom grower is a customer.
