form:
  code: "F"
  title: "Weed Management"
  document_id: "AGR 2121"
  revision: "R 02/25"
  url: "https://agr.wa.gov/departments/organic/forms-and-applications"
  retrieved: 2026-08-28
  nop_cites: ["§ 205.206"]
  guide_trigger: "Crop Producer Organic System Plan (AGR 2121) — filed once by every crop producer applicant; WSDA runs a LIVING plan, so a renewing operation updates the sections that changed rather than re-filing the whole OSP (the March 1 deadline is the renewal application and fee)"
  required_of_every_grower: true
  # NOTE: F, G and H all map onto the single Trazo module g5_0_pest. WSDA splits weed, pest and
  # disease into three physically separate sections, each expecting a self-contained answer;
  # CCOF asks the same obligations as one matrix (G5.0 §A, 23 practices × 4 pest-type columns).
  # That is why the same `prevention_practices` list is cited under all three headings, and why
  # the fix on each of those rows is the same one: a pest-type dimension, so each section can
  # print its own paragraph.
  #
  # 🔴 2026-09-08 — completing these three closed a defect that had survived two corrections.
  # F1/F2/G1/G2/H1/H2/F6/G5/H4 were all `not_covered`, each citing the same reason: that
  # `monitoring_scope`, `monitoring_frequency` and `monitoring_records` "cannot be cited without
  # contradicting their CCOF-unmapped status". That is the cross-certifier merge
  # `cross_certifier_conflicts` was rewritten to reject — coverage is scoped PER CERTIFIER, and
  # CCOF asking nothing about monitoring says nothing about WSDA, which asks it nine times.
  # The register was reporting three real fields as absent because a different agent had no use
  # for them. Six rows now cite them; the three records rows stay `not_covered` on an axis
  # objection that survives on its own (F6 states it).
  #
  # An earlier note here made the mirror-image error, quoting CCOF's arithmetic
  # (12 cited + 3 CCOF-unmapped = 15/15) to call G "complete". Both directions are the same
  # mistake: one register's coverage is not evidence about another's.
  trazo_module: g5_0_pest
  register_status: complete
  source_sha256: 1d6350d8b46219137b009f8c352528c6e15ee97ba0e83d5d2e59e8d27ffb3ba2

items:
  - ref: "1"
    asks: "Which monitoring practices do you implement to determine the effectiveness of your weed management plan? (Comparison of crop yields / Observation of crop health / Observation of weeds / Other.)"
    status: covered
    trazo:
      questions: [g5_0_pest.monitoring_scope, g5_0_pest.monitoring_methods, g5_0_pest.monitoring_methods_other]
      prints: "modules/G5_0.pdf §D; narrative § 205.206(a)"
    # Closed 2026-11-02 by the monitoring slice.

  - ref: "2"
    asks: "How often do you make these comparisons or observations?"
    status: covered
    trazo:
      questions: [g5_0_pest.monitoring_frequency, g5_0_pest.weed_monitoring_frequency]
      prints: "modules/G5_0.pdf §D"
    # Closed 2026-11-02 by the monitoring slice.

  - ref: "3"
    asks: "Which preventive weed control strategies do you implement on your operation? (Cover crop - Annual / Crop rotation / Crop spacing / Field preparation / Flame weeding / Hand weeding / Mechanical cultivation / Mowing / Natural mulch / Stale seed bed / Other.)"
    status: covered
    trazo:
      questions:
      - g5_0_pest.practices_weeds
      - g5_0_pest.practices_weeds_other
      - g5_0_pest.weed_management_practices
      - g5_0_pest.weed_management_other
      prints: "modules/G5_0.pdf §A; narrative § 205.206"
    # Closed 2026-11-07 (content 2026.11.22). WSDA's weed list as its own list, with crop spacing, field preparation
    # and stale seed bed. The untyped weed list is retired: shown only to a plan that answered it.
  - ref: '4'
    asks: Do you use plastic mulch or silage tarps for weed control in an annual cropping system? Yes / No.
    status: partial
    severity: P2
    trazo:
      questions:
      - g5_0_pest.plastic_mulch_used
      prints: modules/G5_0.pdf §B
    gap: Use and season-end removal are captured. Missing is the § 205.601(b)(2)(ii)-(iii) non-PVC material condition
      CCOF's own G5.0 §A register row already flags as absent from these same two fields.
    fix: 'Same fix already proposed on the CCOF side: add `plastic_mulch_non_pvc` [radio] {confirmed_non_pvc,
      biobased_film, unknown}, visible when `plastic_mulch_used`.'
  - ref: 4a
    asks: If yes, describe how you ensure it is removed from the field at the end of the growing or harvest season.
    status: covered
    trazo:
      questions:
      - g5_0_pest.plastic_mulch_removal
      prints: modules/G5_0.pdf §B; narrative § 205.206(c)(6)
  - ref: '5'
    asks: Do you use plastic mulch or silage tarps for weed control in a perennial cropping system? Yes / No.
    status: covered
    trazo:
      questions:
      - g5_0_pest.plastic_mulch_used
      prints: modules/G5_0.pdf §B
    note: '`plastic_mulch_used` does not say which cropping system; with `g4_0_rotation_soil.system_type` it
      answers this.'
  - ref: 5a
    asks: If yes, describe how you ensure the plastic remains in sufficient condition that prevents decomposition
      into the soil.
    status: not_covered
    severity: P2
    trazo:
      prints: —
    gap: '`plastic_mulch_removal` is framed around season-end removal in an annual system (''describe how the
      plastic or synthetic mulch is removed at season end''); it does not ask WSDA''s actual perennial-system
      question — how the operation ensures the plastic stays intact enough to avoid decomposing into the soil
      over a multi-year planting. A perennial-crop operator answering this field today is describing the wrong
      practice.'
    fix: Add `plastic_mulch_perennial_condition` [textarea], visible when the operation's cropping system includes
      `perennial` (per `g4_0_rotation_soil.system_type`), separate from the annual-system removal question.

  - ref: "6"
    asks: "Describe the records you maintain regarding your preventative weed management strategies."
    status: not_covered
    severity: P2
    gap: "No field captures what records are kept for preventative weed-management practices specifically. `monitoring_records` (§ 205.201(a)(3)) is the nearest existing field and is NOT cited here, on the axis: it asks how MONITORING RESULTS are recorded, not what records document the preventative practices themselves. Those records exist in Trazo as logged events rather than as a described-records answer, which is a different artifact from the narrative WSDA asks for here. (The cross-certifier half of this note — that the field is 'already registered as having no CCOF counterpart' — was removed 2026-09-08 with the same correction made at ref 1; it was never a reason.)"
    fix: "Add `weed_prevention_records` [textarea] describing what preventative-practice records are kept."
  - ref: '7'
    asks: Optional space for additional information.
    status: not_covered
    severity: P3
    optional: true
    gap: No general free-text notes field exists on the pest-management module for information outside the structured
      questions above — the same class of gap CCOF's G4.2 A9 already names for its own module.
    fix: Add an optional `weed_management_additional_notes` textarea.
