form:
  code: K
  title: Storage
  document_id: AGR 2121
  revision: R 02/25
  url: https://agr.wa.gov/departments/organic/forms-and-applications
  retrieved: 2026-08-28
  nop_cites:
  - § 205.270
  - § 205.272
  guide_trigger: Triggered when the operation physically stores certified crops or products (WSDA Section
    K, item 2); item 1 applies regardless when a third party stores on the operation's behalf.
  trazo_module: g6_2_storage
  register_status: complete
  source_sha256: 1042fe44ac334b65ea01c66b8ebde633653f9e89872c92793b0c24d26a496d5f
items:
- ref: '1'
  asks: Do you contract with any third parties to store certified crops or products on your behalf? Yes
    — an Additional Facilities and Third-Parties (AGR 2519) form is attached. No.
  status: partial
  severity: P1
  trazo:
    questions:
    - g6_2_storage.third_party_storage_contracted
    - g6_2_storage.off_farm_storage_table
    - g6_2_storage.uncertified_facility_records
    prints: modules/G6_2.pdf §A; narrative § 205.201(a)(5)
  gap: '`third_party_storage_contracted` asks WSDA''s actual question — is another operation contracted
    to store the crop — which no storage-location option could answer, and the facility table names who.
    Remaining: the AGR 2519 attachment. Closed 2026-08-28: G6.1 page D asks the routing gate (`handled_by_another_operation`:
    no / certified / uncertified), the `post_harvest_facilities` embed prints the facility table with
    its certificate status in the module PDF, and `_append_post_harvest_facilities` states the same records
    in the § 205.201(a)(5) narrative. `PostHarvestFacility.role` distinguishes handling from storage so
    one record answers both G6.1 §C and G6.2 §A. Guard: `certifications/tests/test_post_harvest_facility_reaches_plan.py`.'
  fix: Same as AGR 2121 §J ref 13.
- ref: '2'
  asks: Does your business physically store any certified crops or products? Yes. No — skip to next section.
  status: partial
  severity: P3
  trazo:
    prints: module NA flag — the whole g6_2_storage module is skippable when not applicable, achieving
      the same effect without a stated, printed answer to this specific question
  gap: The g6_2_storage module carries a not-applicable option that functions as this gate, but there
    is no discrete question whose answer prints 'yes, we store' or 'no, we do not' the way WSDA's item
    2 expects — a certifier sees an absent module, not an explicit no.
  fix: Low priority — cosmetic difference between an implicit module-level skip and an explicit printed
    answer; would only matter if the generated packet needs to state the negative explicitly.
- ref: '3'
  asks: Are all certified crops or products stored in sealed, impermeable packages?
  status: covered
  trazo:
    questions:
    - g6_2_storage.stored_in_sealed_packaging
    prints: modules/G6_2.pdf §A
- ref: 3a
  asks: If no, how do you prevent certified crops from contamination by prohibited substances and commingling
    with non-certified crops during storage? Certified crops are stored in rooms permanently dedicated
    for organic use only / certified crops are stored in rooms that are cleaned and dedicated for organic
    use for the entire season / certified crops are stored in areas/shelf designated with organic signage
    / other — describe.
  status: covered
  trazo:
    questions:
    - g6_2_storage.unsealed_storage_controls
    - g6_2_storage.unsealed_storage_controls_other
    - g6_2_storage.organic_storage_area_identification
    - g6_2_storage.storage_shared_with_nonorganic
    - g6_2_storage.storage_shared_separation
    prints: modules/G6_2.pdf §A (WSDA's options, asked when not all stored product is sealed)
- ref: 3b
  asks: If no, what records document where certified crops are stored and how the area was cleaned for
    organic use?
  status: covered
  trazo:
    questions:
    - g6_2_storage.storage_location_records
    - g6_2_storage.storage_location_records_other
    - g6_2_storage.storage_locations
    - g6_2_storage.storage_other_description
    - g6_2_storage.storage_cleaned_before_organic
    - g6_2_storage.storage_cleaning_method
    prints: modules/G6_2.pdf §A (the records named, each with the count of matching records logged in Trazo)
- ref: '4'
  asks: Optional space for additional information.
  status: not_covered
  severity: P3
  optional: true
  trazo:
    prints: —
  gap: Optional free space. Trazo has no general notes field on this module, so nothing extra the operator
    wants to say here has a place; the agent does not require it.
  fix: Add an optional additional-notes textarea to the storage module.
