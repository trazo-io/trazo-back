# Trazo questions in g7_0_labeling that WSDA's §N (Labeling) does not ask.
#
# §N is written for a CROP PRODUCER: it asks what nonretail containers are used, how
# certification status and a unique identifier appear on them, what the container records
# carry, whether retail packing happens and the labels were submitted for approval, whether
# product is packed under a brand the operation does not own, and whether any label names an
# agency other than WSDA. The § 205.301 category tier and the seal itself are reviewed by
# WSDA when the label copy is submitted (ref 5), not asked question by question here.
questions:
  g7_0_labeling.product_leaves_as_other: "Free-text elaboration of the `other` option inside
    Trazo's own `product_leaves_as` checkbox group. WSDA §N ref 1 has its own `other` for
    container TYPE — produce boxes, totes, bulk trailers, grain elevators — which ref 1's gap
    already records as uncaptured. Trazo's `other` describes a different axis (how product
    leaves), so citing it against ref 1 would answer a question WSDA did not ask."
  g7_0_labeling.organic_label_categories: "§ 205.301 labeling-category tier (100% organic /
    organic / made with organic). WSDA's crop-producer §N never asks which tier an operation
    sells under; the tier is asked on the handler-side product applications (AGR 2523 / 2524),
    which wsda/scope.yaml excludes as handler certification scope. The absence here is a fact
    about §N's audience, not about WSDA's forms as a whole."
  g7_0_labeling.label_states_certifier: "Whether the consumer label carries 'Certified organic
    by [agent]'. §N ref 7 asks something narrower and different: whether any label names an
    agency OTHER than WSDA below the distributor information, and how often updated certificates
    are requested to keep that displayed distributor verified. Citing this Trazo boolean there
    would answer the presence question while leaving ref 7's actual ask — the re-verification
    cadence — unanswered and looking covered."
  g7_0_labeling.label_has_usda_seal: "Whether the USDA organic seal appears on the label. WSDA
    reviews the seal when the label copy is submitted for approval under §N ref 5, and never
    asks about it as a separate question on the OSP."
  g7_0_labeling.unlabeled_bulk_notice: >-
    A write-time notice with no answer of its own (kind info): it explains § 205.307(a)(1) when unlabeled bulk is chosen. The answer it follows is mapped.
  g7_0_labeling.nonretail_label_upload: >-
    WSDA §N asks how containers show certification status and an identifier (refs 1-3) but asks for no example of a nonretail label; retail labels are submitted for approval at ref 5a. Attached for CCOF G7.0 A1 and OTCO C8 8.1-1.
  g7_0_labeling.brand_owner_certificate_check: >-
    How the operation keeps brand owners' certificates current (certificates on file, Organic Integrity Database check). OTCO C8 8.3-3 and CCOF G7.0 C2 ask it; WSDA N 7a asks only how often updated certificates are requested, which `brand_owner_certificate_frequency` answers.
  g7_0_labeling.brand_owner_certificate_check_other: >-
    The "other" description of that method; same reason.
