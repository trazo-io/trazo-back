# Trazo questions in g9_0_facility_pest that WSDA's §M (Facility Pest Management) does not ask.
questions:
  g9_0_facility_pest.preventive_measures_documentation_other: "Free-text elaboration of the
    `other` option inside Trazo's own `preventive_measures_documentation` checkbox group. WSDA
    §M asks for the narrative justification itself (why prevention was insufficient before a
    material was applied), not for a category-plus-other breakdown of how that was documented,
    so there is no WSDA question this free text answers."
  g9_0_facility_pest.facility_pest_records_upload: >-
    Files for the facility pest records the plan says are kept (`pest_control_records`). WSDA AGR
    2121 §M asks how pests are monitored and managed (item 3, covered by `pest_control_records` and
    the monitoring questions) but never asks for records to be attached; these are the § 205.103
    records an inspector reviews on site. The upload lets the packet carry them beside
    modules/G9_0.pdf.
  g9_0_facility_pest.pest_controls_sufficient: "OTCO C7 7.8-4 and CCOF G6.2 B5 ask whether the controls are sufficient. WSDA M asks the strategies used (4) and, before a synthetic, how an allowed material was found ineffective (7), not this yes/no."
  g9_0_facility_pest.additional_pest_measures: "Follow-up to pest_controls_sufficient; same reasoning."
  g9_0_facility_pest.national_list_sufficient: "CCOF G6.2 B6. WSDA M 7 asks how an allowed material is first shown ineffective, which synthetic_material_justification and preventive_measures_documentation answer."
