# Trazo questions in g8_0_record_keeping that WSDA's §O (Recordkeeping) and §Q (International
# Trade) do not ask.
#
# §O is the closest match anywhere in this register — seven of its eight rows are `covered` —
# and §Q asks the import and export questions in more detail than CCOF does, so most of what
# ccof/unmapped records as a Trazo superset is cited on the WSDA side. One field is left.
questions:
  g8_0_record_keeping.export_certificate_process: >-
    How export certificates are requested, verified and kept. §Q asks WHICH documents accompany
    each shipment (ref 9) and which certificates the destination requires (ref 7), and it asks
    the process question only on the IMPORT side, at ref 5 — how imported seed is verified not
    to have been treated or irradiated, with the records maintained. There is no export-side
    equivalent: WSDA takes the document list as the answer and does not ask how the operation
    obtains or retains those certificates. CCOF does not ask it either.
  g8_0_record_keeping.sources_organic_products: >-
    Whether the operation sources organic agricultural products, as a yes or no. Asked by OTCO C12 12.2-4;
    WSDA's recordkeeping section asks how records are kept (§O 7) and how they link (§O 8), not this.
  g8_0_record_keeping.sells_as_organic: >-
    Whether the operation sells crops or crop products as organic. Asked by OTCO C12 12.2-5; WSDA's
    recordkeeping section asks how records are kept (§O 7) and how they link (§O 8), not this.
  g8_0_record_keeping.records_identify_organic_status: >-
    Whether records identify organic status from harvest through sale. Asked by OTCO C12 12.2-5a; WSDA's
    recordkeeping section asks how records are kept (§O 7) and how they link (§O 8), not this.
  g8_0_record_keeping.records_organic_status_explanation: >-
    Whether records identify organic status from harvest through sale, on a No. Asked by OTCO C12 12.2-5a;
    same reason as `records_identify_organic_status`.
  g8_0_record_keeping.equivalency_compliance_method: >-
    How exported products meet the destination's equivalency arrangement (OTCO C8 8.4-4). §Q asks which
    documents accompany each shipment (9) and Canada's critical variance, not how the arrangement is met.
  g8_0_record_keeping.equivalency_compliance_method_other: >-
    The other way of `equivalency_compliance_method`, unmapped with its parent.
