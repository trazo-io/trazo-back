# Trazo questions in parcel_application that WSDA's site forms do not ask.
#
# WSDA splits what CCOF puts on one Parcel Application across three forms, all registered:
# AGR 2264 Site Application (the parcel itself, its history, borders and map), AGR 2262
# Previous Land Use (the prior manager's affidavit) and AGR 2516 Site Update (changes to an
# already-certified site). Between them they ask nearly everything this module holds. Only two
# fields have no WSDA question, and both are about a production form or an identifier WSDA does
# not use rather than about a § 205.202 obligation it skips.
questions:
  parcel_application.apn: >-
    The assessor's parcel number. WSDA identifies a site by name plus location, and its location
    ask (AGR 2264 ref 2) enumerates street address, city, state, zip, county, Township/Range/
    Section and GPS coordinates — the PLSS description, which is the survey system in use across
    Washington. It never asks for a county assessor's parcel number. CCOF's Parcel Application
    does, because an APN is how a California county identifies a parcel of record.
  parcel_application.container_production: >-
    Whether the parcel is container or greenhouse production. WSDA's crop OSP has no container
    or greenhouse section at all: AGR 2264's own header defines a site as "a distinct field,
    orchard, block, pasture, circle, or other contiguous area", and the only enclosed-production
    section in AGR 2121 is §S, which is scoped to fungi. CCOF asks it on the Parcel Application
    and follows up with a whole form, G3.1 Container and Greenhouse Production. An operation
    growing under cover in Washington is answering a different application than this register
    compares.
  parcel_application.treated_lumber_contact_prevention: >-
    Asked by OTCO C9 §9.3 (how contact between existing treated lumber and organic crops or livestock is prevented). WSDA 2264 ref 12 asks whether treated wood is located in a manner that contacts soil, plants or livestock, and 12a when it was installed — never how contact is prevented.
  parcel_application.no_lapse_attested: >-
    Asked by CCOF Parcel Application §G(2) ('verification of no lapse in organic management') and
    OTCO C2 2.4-2 ('verification there has been no lapse in organic management'). WSDA AGR 2264 ref
    6 asks whether the site is or was certified within 36 months and for the previous certificate
    and a signed AGR 2262; it never asks for a continuity statement, because a WSDA-to-WSDA site
    transfer is verified against WSDA's own records.
  parcel_application.dlpm_none_within_tenure: >-
    The operator's declaration that no PROHIBITED material was applied since it began managing the
    parcel. WSDA does not ask for that declaration. Its N/A on AGR 2264 ref 13 states that no input
    material of any kind was applied, which is a different statement; until 2026-09-30 the register
    cited this declaration there (OSP alignment audit 2026-10, T17). WSDA's land history is the dated
    list of inputs itself, which ref 13 maps to the land-history years.
  parcel_application.dlpm_in_tenure_date: >-
    The date of the last prohibited material the operation applied itself, asked of an operator who
    answers No to the no-prohibited-material declaration (CCOF ORGB49 F4; OTCO C2 2.4 starts the land
    history the day after it). WSDA does not ask for that date: AGR 2264 ref 13 lists every input applied
    under the operator's management with its date, which the land-history years answer.
  parcel_application.dlpm_none_since_in_tenure_date: >-
    The operator's statement that no prohibited material followed that date. Same reason: WSDA's land
    history is the dated list of inputs itself, and it asks for no declaration about prohibited material.
  parcel_application.transition_card: >-
    A display of what Trazo's records show about the 36-month window, not an answer. WSDA's nearest
    question, AGR 2264 ref 4, asks which status the operator is APPLYING for (organic or
    transitional); no question asks that yet, and the card is not the operator's application.
  parcel_application.planned_crops: >-
    Asked by WSDA's Site Update (AGR 2516, "your current plan for the coming year"), which is answered by
    packet documents and declares no module, so it cites the answer as a model field
    (Parcel.application_answers, planned_crops) rather than as this question. 02s prints it on each site's row.
  parcel_application.prohibited_on_excluded_ground: >-
    CCOF ORGB49 F8/F8a ask whether prohibited materials were applied, since the DLPM, to the parcel's
    borders or to land on the same APN or CA pesticide use reporting site ID not submitted for
    certification, and which, when and where. WSDA AGR 2264 asks for the site's own input history (ref
    13) and the adjoining land (ref 14), never the operator's excluded ground.
  parcel_application.prohibited_on_excluded_ground_detail: >-
    CCOF ORGB49 F8/F8a ask whether prohibited materials were applied, since the DLPM, to the parcel's
    borders or to land on the same APN or CA pesticide use reporting site ID not submitted for
    certification, and which, when and where. Not asked by WSDA.
  parcel_application.treated_lumber_noncontact_present: >-
    Asked by CCOF ORGB49 A10 and OTCO C2 2.3-2, which want every existing treated-lumber installation
    within the parcel's boundaries. WSDA AGR 2264 ref 12 asks only whether treated wood contacts soil,
    plants or livestock, which `treated_lumber_present` answers; it never asks about an installation
    touching neither.
  parcel_application.treated_lumber_noncontact_description: >-
    The description and installation date of the installation above (CCOF A10a/A10b, OTCO 2.3-2). Not
    asked by WSDA, for the same reason.
  parcel_application.block_identifiers: >-
    Asked by CCOF ORGB49 A2. AGR 2264 asks for a site name (ref 1, whose example is 'Fuji Blocks
    28-35'), not the numbering inside it as its own item.
  parcel_application.location_country: >-
    Asked by CCOF ORGB49 A3 and OTCO C2 2.1 4). AGR 2264 ref 2 asks street, city, state, ZIP, county,
    Township/Range/Section and GPS, with no country.
  parcel_application.expected_first_organic_harvest: >-
    Asked by CCOF ORGB49 A6 and OTCO C2 2.1 8) as one date per parcel. AGR 2264 ref 8 asks an estimated
    harvest date per crop, which the crop table carries.
  parcel_application.container_surface: >-
    Asked by CCOF ORGB49 F3 (containers on land vs on impermeable flooring decides whether land history
    applies). AGR 2264 does not ask what containers stand on.
  parcel_application.container_planting_date: >-
    Asked by CCOF ORGB49 §G for a container parcel's signed statement. AGR 2264 has no container
    statement.
  parcel_application.container_materials: >-
    Asked by CCOF ORGB49 §G (full names of every material since planting, growing media included). AGR
    2264 has no container statement.
  parcel_application.contamination_removal: >-
    Asked by CCOF ORGB49 §G for containers on impermeable flooring. AGR 2264 has no container statement.
  parcel_application.container_statement: >-
    The signed copy of CCOF ORGB49 §G's container statement. AGR 2264 asks for none.
