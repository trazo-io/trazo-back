# Trazo questions in g6_2_storage that WSDA's AGR 2121 section K does not ask.
questions:
  g6_2_storage.on_farm_storage_table: >-
    The operation's own storage facilities, each with its name and full address (CCOF G6.2 B1, OTCO C7 7.7-2). WSDA AGR 2121 §K asks whether crops are stored and how they are kept apart, not a list of storage facilities.
  g6_2_storage.uncertified_facility_statement_upload: >-
    The statement an uncertified storage facility's manager signs. Asked by CCOF G6.2 A2 (Exempt Handler Affidavit) and OTCO C7 7.7-2 (Independent Storage sheet); WSDA AGR 2121 K1 routes a third-party store to its AGR 2519 form instead.
