# Oregon Tilth Certified Organic (OTCO) — Field, Acreage, Crop Table (Form FACT-04).
#
# Source: https://tilth.org/help-center/blank-forms-all/ → FieldAndCropTableFACT.docx
#   (https://tilth.org/wp-content/uploads/2015/01/FieldAndCropTableFACT.docx), read 2026-09-09 from
#   the official 2025 Crop OSP bundle. Footer stamp as printed: "Rev. 2022/09/01".
#
# Ref scheme. FACT-04 is one table with no section numbers: `Hdr` is the instruction line, `col-1`
# … `col-4` are its four columns in printed order (Parcel Name/Address/Location · Total Acreage ·
# Status · Crop(s) and Acreage), and `totals` is the pair of footer cells (Total Transitional Acres /
# Total Organic Acres Requested For Certification). The form prints no NOP citation, so `nop_cites`
# is empty rather than borrowed from C2.
#
# What this form IS, per C2's header: C2 is filed once per parcel and "does not need to be updated…
# For updates to currently certified acreage, use FACT-04". So FACT-04 is OTCO's annual parcel ×
# acreage × status × crops statement, and the Trazo artifact judged against it is the Field and Crop
# Information workbook, which the packet regenerates on every filing (`_field_rows`, one row per
# parcel). The 02-annual-update.pdf carries no per-parcel acreage (verified 2026-09-09), so the
# workbook is the only carrier. Registered as a delta against CCOF NOPB49 §A and WSDA AGR 2264
# refs 4 and 8 — see certifiers/README.md.
form:
  code: FACT-04
  title: Field, Acreage, Crop Table
  document_id: FACT-04
  revision: Rev. 2022/09/01
  url: https://tilth.org/help-center/blank-forms-all/
  pdf: https://tilth.org/wp-content/uploads/2015/01/FieldAndCropTableFACT.docx
  retrieved: 2026-09-09
  nop_cites: []
  guide_trigger: >-
    Not routed by the C1 Crop Activities Checklist (which lists C2 for land history and nothing for
    FACT-04). Triggered by C2's own header: "This form [C2] must be submitted with a new application
    or to add acreage, but does not need to be updated… For updates to currently certified acreage,
    use FACT-04 Field, Acreage, Crop Table." FACT-04's instruction: "Please complete this chart for
    all physically separate locations requested for certification."
  required_of_every_grower: false
  trazo_module: parcel_application
  register_status: complete
items:
- ref: Hdr
  asks: >-
    Complete this chart for all physically separate locations requested for certification. Houses
    and barns cannot be included in acreage lists or totals. (Per C2: the form for updates to
    currently certified acreage.)
  status: covered
  trazo:
    models:
    - product.Parcel
    - product.Parcel.area
    - certifications.services.common_osp_workbooks (_field_rows — one row per Parcel, regenerated with every packet)
    prints: workbooks/Field and Crop Information Form.xlsx
  note: >-
    Every Parcel gets a workbook row even with no crop history (`_field_rows`), so the chart is
    complete by construction and is rebuilt on each filing, which is the update role C2 assigns to
    FACT-04. `Parcel.area` is the operator's stated production area for the parcel — the same
    figure CCOF A7 accepts as excluding homes and structures; Trazo does not compute it from a
    footprint, so it cannot include a barn the operator did not.
- ref: col-1
  asks: >-
    "Parcel Name, Address, Farm Location(s)" — list the name and location of the parcel(s)
    requested for certification (example: City Ranch, 260 SW Madison, Corvallis, OR 97333).
  status: partial
  severity: P3
  trazo:
    questions:
    - parcel_application.parcel_name
    - parcel_application.address
    models:
    - product.Parcel.name
    - product.Parcel.address
    - company.models.Establishment.name
    prints: workbooks/Field and Crop Information Form.xlsx ("Location Name" = establishment, "Field or Parcel ID" = parcel); address on parcels/parcel-application-<parcel>.pdf §A only
  gap: >-
    OTCO-specific. The workbook mirrors the USDA Common OSP form, whose columns are "Location
    Name" and "Field or Parcel ID"; it prints the establishment and parcel names and has no address
    cell. The parcel's address is captured (`Parcel.address`) and prints on its own application
    page in the same packet, so a reviewer finds it one page over — but not in the row FACT-04 asks
    for it. City/state/zip are the CCOF A3 gap (C2 2.1-2).
  fix: >-
    Append `Parcel.address` to the "Location Name" cell (or add an address column) when the
    certifier is OTCO.
- ref: col-2
  asks: '"Total Acreage" — enter acreage at each location (examples: 100.0; 7.5).'
  status: covered
  trazo:
    models:
    - product.Parcel.area
    prints: workbooks/Field and Crop Information Form.xlsx ("Acreage or square feet", acres via `_acres`); parcels/parcel-application-<parcel>.pdf §E
  note: >-
    Judged on the workbook, which is FACT-04's counterpart: `Parcel.area` is stored in hectares and
    converted at the boundary (`_acres`, `area_display()`), so the cell prints acres to two decimals
    (guard: product/tests/test_parcel_area_units.py). CCOF A7's P3 concerns where the same number
    sits on the parcel PAGE (C2 2.1-9), not this cell.
- ref: col-3
  asks: '"Status" — state if the location is organic and/or transitional (examples: Organic; Transitional).'
  status: partial
  severity: P2
  trazo:
    questions:
    - parcel_application.transition_card
    - parcel_application.crop_history
    models:
    - product.ParcelCropHistory.production_method
    - product.services.transition_status_service.transition_verdict
    prints: 'workbooks/Field and Crop Information Form.xlsx ("Status"); parcels/parcel-application-<parcel>.pdf §B ("Organic transition status: <verdict>")'
  gap: >-
    Same verdict as WSDA 2264 ref 4, with the workbook mechanics added. The "Status" cell is
    derived by `_field_status` from the NEWEST `ParcelCropHistory` row's `production_method`: it
    prints "Organic" or "Transitional" only when that row says so, and is BLANK when the newest row
    is conventional, fallow or regenerative, or when the parcel has no history at all — a new parcel
    with three seasons logged but no typed history row files with an empty status. The operator is
    never asked which status they are REQUESTING for the parcel; the §B card states what the
    records support, which is a different claim. And OTCO's "and/or" (a location partly organic,
    partly transitional) is not representable — one status per parcel.
  fix: >-
    Add a `certification_status_requested` radio {organic, transitional} to page B, informed by
    (never overridden by) the computed transition card, and feed the workbook's Status cell from it
    (the WSDA ref 4 fix); fall back to the derived value only when unanswered, and print that fall-
    back as such.
- ref: col-4
  asks: >-
    "Crop(s) and Acreage" — list crops, and corresponding crop acreage in parentheses, for each
    parcel (example: Alfalfa (20 acres), Oats (20 acres), Pasture (60 acres)). Cropped acreage may
    exceed total parcel acreage due to succession or multiple plantings.
  status: partial
  severity: P2
  trazo:
    questions:
    - parcel_application.crop_history
    models:
    - product.Parcel.product
    - product.ParcelCropHistory.crop_grown
    - history.models.History
    prints: workbooks/Field and Crop Information Form.xlsx ("Crop(s)/Cover Crops" — crop name only)
  gap: >-
    Same as CCOF A8 / WSDA 2264 ref 8 for acreage, and C2 2.1-10 for the crop list: the cell prints
    ONE crop name per parcel — the newest season in the ground, else the newest history row's
    `crop_grown` (`_current_season_crop`) — with no acreage in parentheses, because no per-crop
    acreage field exists anywhere (`History` carries no area). A parcel in succession plantings,
    the case OTCO's note anticipates, shows one crop and no split.
  fix: >-
    The `crops_planned` rows answer (crop, acres) from the CCOF A8 fix, printed here as "Crop (N
    acres), …" and allowed to exceed the parcel total with the succession note.
- ref: totals
  asks: >-
    Footer — "Total Transitional Acres Requested For Certification" and "Total Organic Acres
    Requested For Certification".
  status: not_covered
  severity: P2
  trazo:
    models:
    - product.Parcel.area
    - product.ParcelCropHistory.production_method
    prints: —
  gap: >-
    OTCO-specific; CCOF NOPB49 and WSDA 2264 are per-parcel forms with no operation total. The
    workbook writes one row per parcel and no total row (`Workbook` has no footer; grep of
    common_osp_workbooks.py finds "total" only in comments), and the 02-annual-update.pdf carries no
    acreage at all. Even summing `Parcel.area` by the derived status (col-3) would total what the
    records SUPPORT, not what the operator REQUESTS, and would silently drop every parcel whose
    status cell is blank.
  fix: >-
    Once `certification_status_requested` exists (col-3 fix), append two footer cells to the
    workbook summing `Parcel.area` in acres by requested status, and name any parcel excluded for
    lack of an answer.
