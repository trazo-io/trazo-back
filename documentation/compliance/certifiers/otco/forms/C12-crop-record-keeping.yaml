# OTCO C12 — Crop Record Keeping.
# Source: https://tilth.org/help-center/blank-forms-all/ (docx
# https://tilth.org/wp-content/uploads/2015/01/C12CropRecordKeeping.docx), footer stamp
# "rev. 2023/12/18", retrieved 2026-09-09.
#
# Registered as a DELTA against CCOF G8.0 (ORGB33) and WSDA AGR 2121-O: where C12 asks an
# obligation those registers already judged, the verdict is REUSED (same questions, status,
# severity) and restated in OTCO's terms; fresh analysis only where C12 asks something neither of
# them does (12.1-1, 12.2-4b, 12.2-7) or asks it at a different grain (12.2-1).
#
# Ref scheme (re-cut 2026-09-30, OSP alignment audit T26). Refs are what the form prints: the
# subsection number and question number (`12.2-4`), a lettered sub-item (`12.2-4a`). The earlier
# version of this file numbered items by order of appearance, gave table columns rows of their own
# and folded subsection "Not applicable" lines into the first question; all three are gone. An
# unnumbered item carries the nearest printed parent plus a description in parentheses. Rows match
# `../inventory/<this file>`, derived from the docx; gaps of merged rows are carried by the row that
# absorbed them, marked with the old ref.
#
# 12.1-1 is one checkbox list of twenty record types and one row. Clean transport and co-packer
# transactions had no named row in Trazo's § 205.103 registry until 2026-10-26; both are now rows
# sourced from this form.
#
# The 12.2-6 audit-trail table has three columns (Name of Document · Activity Document Describes
# · Linking element to next and previous document). They share one verdict and one location — the
# audit-trail exhibit — so they are one row; the "Attach sample documents … Records attached"
# line that follows is a distinct ask and is 12.2-7.
form:
  code: C12
  title: Crop Record Keeping
  document_id: C12
  revision: rev. 2023/12/18
  url: https://tilth.org/help-center/blank-forms-all/
  pdf: https://tilth.org/wp-content/uploads/2015/01/C12CropRecordKeeping.docx
  retrieved: 2026-09-09
  nop_cites:
  - § 205.103
  - § 205.201
  guide_trigger: >-
    C1 Crop Activities Checklist — "I/We grow crops" routes to C2 Land History, C4 Fertility
    Management, C5 Pest, Weed & Disease Management, C6 Natural Resources & Biodiversity, C9
    Contamination Prevention and C12 Crop Recordkeeping; "I/We are applying for certification of
    wild crops" also routes to C12.
  required_of_every_grower: true
  trazo_module: g8_0_record_keeping
  register_status: complete
  source_sha256: 0f1f210688dd9d1e4c43d8244bb668d439bb223594a39e819d8a1fa245fc7a06
items:
- ref: 12.1-1
  asks: Indicate which types of records you currently maintain or plan to maintain for your organic production
    (all checkboxes, including Other).
  status: covered
  trazo:
    questions:
    - g8_0_record_keeping.s11_records
    - g8_0_record_keeping.records_retention_attestation
    - g6_1_harvest_transport.transport_units_inspected_clean
    - g6_1_harvest_transport.non_own_transport_records
    - g6_1_harvest_transport.handled_by_another_operation
    - g6_1_harvest_transport.off_farm_handler_table
    - g8_0_record_keeping.import_export_activity
    - g8_0_record_keeping.import_documentation
    - g8_0_record_keeping.import_documentation_other
    - g8_0_record_keeping.import_export_records
    models:
    - certifications.services.common_osp_records — the Common OSP § 11 registry (Common OSP rows, seven rows
      sourced from WSDA AGR 2121-O, two sourced from this form (clean transport records, with a count of
      shipments that record it; co-packer transactions, kept outside Trazo), and the free-text `other_records`
      row); only CONFIRMED rows print
    prints: modules/G8_0.pdf §A — the confirmed record types with their evidence, then the retention attestation
- ref: 12.2-1
  asks: 'RECORDKEEPING SYSTEM — what method(s) do you use to keep records? Select all that apply: Paper/Notebooks
    · Computer Software/Spreadsheet · Phone App · Online/Cloud Program · Other (describe).'
  status: partial
  severity: P3
  trazo:
    questions:
    - g8_0_record_keeping.records_maintained_as
    prints: 'modules/G8_0.pdf §A — "Records are maintained as: …"'
  gap: '`records_maintained_as` offers {electronic, hardcopy} — WSDA §O 7''s two boxes, against which it is
    `covered`. OTCO splits electronic three ways (software/spreadsheet, phone app, online/cloud) and offers
    an `other` with a description line; Trazo''s closed pair has no `other` and no description, so a reviewer
    reading G8.0 §A learns electronic vs paper but not which of OTCO''s five boxes the operation would tick.
    `partial` beside WSDA''s `covered` is the register''s rule for a form that asks the same fact at finer
    grain.'
  fix: Add `software_spreadsheet`, `phone_app`, `online_cloud` and `other` (with a `records_method_other` text)
    to `records_maintained_as`, compiling any of the three to "electronic" for WSDA's form.
- ref: 12.2-2
  asks: Do you maintain organic records for a minimum of five (5) years? Yes / No (explain).
  status: covered
  trazo:
    questions:
    - g8_0_record_keeping.records_retention_attestation
    prints: 'modules/G8_0.pdf §A — "Operator attests that the records confirmed in the § 11 registry are maintained,
      retained at least five years, and available at inspection: …"'
- ref: 12.2-3
  asks: How do your records trace from sale/disposition through transport, storage, packaging, and harvest,
    to the field of production? Lot numbers · Field numbers or names · Julian date codes · Farm name (if the
    operation is all organic with only one field) · Other (describe).
  status: partial
  severity: P1
  trazo:
    questions:
    - g8_0_record_keeping.lot_numbering
    - g8_0_record_keeping.lot_numbering_description
    - g6_1_harvest_transport.lot_identification_on_every_load
    - g7_0_labeling.container_markings_tie_to_lot
    prints: modules/G8_0.pdf §B; modules/G6_1.pdf §C; modules/G7_0.pdf §B
  gap: 'Reused from CCOF G8.0 B2 / WSDA §O 8 (P1). OTCO offers five trace mechanisms; Trazo''s `lot_numbering`
    radio names one: {own_system, none} (`trazo_lots` retired 2026-11-04; it claimed Trazo issues lot numbers
    and carries them on storage and sales records, and a stored answer of it now reads as unanswered). "Field
    numbers or names", "Julian date codes" and "farm name (single-field, all-organic)" have no option, so an
    operation that traces by field name must either pick `none` ("No lot numbering is used"), which reads as
    no trace at all, or bury it in the `own_system` description.'
  fix: Add a `trace_mechanisms` checkbox_group {lot_numbers,
    field_names, julian_date_codes, farm_name_single_field, other} mirroring this question; compile a Code/Signifies
    table from the farm's real `lot_id` values for the operator to confirm or edit (the CCOF B2 fix).
- ref: 12.2-4
  asks: Do you source organic agricultural products, such as but not limited to seed or other agricultural
    products, for your operation? Yes / No — skip to question 5.
  status: partial
  severity: P2
  trazo:
    questions:
    - g6_5_sales_soe.sales_soe_supplier_verification
    - g3_0_seeds.seeds_used
    - g3_0_seeds.seedlings_used
    - g3_0_seeds.planting_stock_used
    - g2_0_fraud_prevention.fraud_risk_areas
    prints: modules/G6_5.pdf §A; modules/G3_0.pdf §A; modules/G2_0.pdf §A
  gap: Reused from CCOF G8.0 D1 (P2). There is no single "do you source organic agricultural products" yes/no;
    OTCO's gate is the union of three pages — G3.0 (organic seed, seedlings or planting stock purchased), G6.5
    ("Do you buy or resell organic product from anyone else?") and G2.0's risk areas — and a reviewer assembles
    it. The follow-ups 12.2-4a and 12.2-4b hang off a gate the packet never states in one place.
  fix: Reuse D1 — derive a sourcing yes/no from the three source modules and print it at the head of G8.0 §B
    (or G2.0 §A) so the gate and its follow-ups read together.
- ref: "12.2-4a"
  asks: If yes — do you maintain records that clearly link the purchase and transport of all sourced organic agricultural products through the supply chain back to the last certified entity? Yes / No — explain.
  status: covered
  trazo:
    questions:
    - g6_5_sales_soe.sales_soe_verification_method
    - g2_0_fraud_prevention.fraud_mitigation_practices
    - g3_2_planting_stock.stock_records_kept
    - g3_2_planting_stock.suppliers_on_supplier_list
    - g6_5_sales_soe.sourced_records_link_to_certified
    - g6_5_sales_soe.sourced_records_link_detail
    - g6_5_sales_soe.sourced_products_panel
    prints: "modules/G6_5.pdf (the answer, then each sourcing supplier with its copy)"
  # Closed 2026-11-08 by the sourced-products slice: asked as OTCO prints it, with an explanation when the answer is No; the sourcing panel prints each supplier's certificate or affidavit beside it.
- ref: 12.2-4b
  asks: If yes — do you ensure records identify all sourced organic agricultural products as "organic" through
    the entire supply chain and on each piece of documentation? Yes / No — explain.
  status: covered
  trazo:
    questions: [g6_5_sales_soe.sourced_products_identified_organic, g6_5_sales_soe.sourced_products_identification_detail, g2_0_fraud_prevention.fraud_mitigation_practices, g3_2_planting_stock.stock_records_kept]
    prints: "modules/G6_5.pdf §A; modules/G2_0.pdf §B; modules/G3_0b.pdf §D"
  # Closed 2026-11-02 by the third-party certificates slice.
- ref: 12.2-5
  asks: Do you sell any crops and/or crop products as organic? Yes / No.
  status: partial
  severity: P3
  trazo:
    questions:
    - g7_0_labeling.organic_label_categories
    prints: modules/G7_0.pdf §A
  gap: No explicit yes/no; it is implied by the label categories and by `SalesRecord.organic_on_invoice`.
  fix: Ask it as its own question, or print it derived from the label categories.
- ref: 12.2-5a
  asks: If yes, do you ensure the records identify all crops and/or crop products with organic status?
  status: partial
  severity: P2
  trazo:
    questions:
    - g7_0_labeling.invoices_identify_lot
    - g7_0_labeling.organic_label_categories
    - g6_2_storage.lot_identity_maintained
    models:
    - history.SalesRecord.organic_on_invoice
    - history.SalesRecord.organic_label_category
    prints: modules/G7_0.pdf §A–B; modules/G6_2.pdf §B; the audit dossier's sales table prints the § 205.301
      category per live sale (a certifier document, not one of the packet's files)
  gap: 'The gate is not asked (every certified crop operation on Trazo sells as organic; G7.0''s label categories
    and the sales records show it). The substance is half-answered: `invoices_identify_lot` ("Do your invoices
    or bills of lading identify each organic shipment as organic and show its lot number?") is the SALES half
    and prints; per-sale `organic_on_invoice` and the § 205.103(b)(3) label category back it. OTCO asks about
    ALL records — harvest, storage, shipping — and Trazo''s storage question (`lot_identity_maintained`) is
    about lot identity, not organic status, while harvest records carry organic status only implicitly through
    the production they belong to.'
  fix: Add `records_identify_organic_status` (boolean, explain when No) to G8.0 §B covering harvest, storage
    and shipping records, beside the existing invoice question.
- ref: 12.2-6
  asks: 'Complete the table below or attach a separate diagram illustrating how the recordkeeping system allows
    for a complete audit trail/trace-back for all crops and/or crop products produced and sold by your operation
    — columns: Name of Document · Activity Document Describes · Linking element to next and previous document
    in chain. The audit trail should include all steps in the supply chain during the time your operation owns
    the crop: sourcing/origin, crop production activities or product processing, storage, transport, to final
    end use/sale/disposition.'
  status: partial
  severity: P3
  trazo:
    questions:
    - g8_0_record_keeping.audit_trail_exhibit
    - g7_0_labeling.invoices_identify_lot
    prints: '05-audit-trail-exhibit.pdf — Part A: the table OTCO draws (Name of Document · Activity · Linking
      element), one row per record type the operator confirmed in G8.0 §A, the linking element stated from
      Trazo''s own record shapes; Part B: the sample trail'
  gap: 'Closed 2026-09-09 to the table itself: document 05 prints OTCO''s three columns for every record type
    the operator confirmed in G8.0 §A, with the linking element named for each record Trazo holds (lot ID,
    invoice number, parcel + date, storage location). A confirmed record type Trazo cannot hold — weigh tickets,
    delivery slips, the operator''s own ''other'' — prints with its linking cell left for the operator to state,
    so a paper-heavy operation completes those rows by hand on the printed page.'
  fix: Let the operator type the linking element for an external record type in G8.0 §A (a per-row free text
    on the confirmation), so document 05 prints it instead of leaving the cell.
- ref: 12.2-6a
  asks: Attach sample documents (e.g. seed purchase records, planting records, input application records, harvest
    records, storage records, transport records, sales records, BOLs) to demonstrate your audit trail system.
    Records attached.
  status: partial
  severity: P2
  trazo:
    questions:
    - g8_0_record_keeping.audit_trail_exhibit
    - g6_5_sales_soe.sales_soe_upload
    prints: 05-audit-trail-exhibit.pdf Part B — the harvest, storage and sales records of one finished lot
      rendered as the sample set, from the operation's own dated records
  gap: 'Partly closed 2026-09-09: document 05 renders the records OTCO lists as samples — harvest records,
    storage location, sales records with invoice and BOL — for one finished lot, from the operation''s own
    dated records. Seed purchase, planting and input-application records are not yet in the trace. Since
    2026-10-01 the operator''s own samples uploaded for `audit_trail_exhibit` or `sales_soe_upload` ride in
    the packet under attachments/.'
  fix: Extend Part B back through the season's planting and input-application events.
- ref: 12.2-7
  asks: Describe the crop and/or crop product inventory system. This should include how often inventory is
    conducted and recorded.
  status: not_covered
  severity: P2
  trazo:
    triggered_by:
    - g8_0_record_keeping.s11_records
    - g6_2_storage.storage_locations
    models:
    - certifications.services.common_osp_records — the `inventory_records` row is external_by_design (evidence
      always 0)
    prints: —
  gap: 'FRESH — no question in any module describes the inventory system or its frequency. The § 205.103 registry
    can record that "Inventory records" are maintained (a row Trazo structurally cannot see, so it is confirmed
    from the operator''s own knowledge and prints as a bare line), and G6.2 records WHERE product is stored;
    neither says how inventory is taken or how often. Grepped `trazo_questions.txt` and the G6.2 and G8.0 modules
    for inventory: nothing. Neither CCOF G8.0 nor WSDA §O asks this either, which is why no verdict existed
    to reuse.'
  fix: Add `inventory_system_description` (textarea) and `inventory_frequency` (radio {per_movement, weekly,
    monthly, seasonal, annual, other}) to G6.2 page B — the storage module owns the stored product — compiling
    into § 205.201(a)(4).
- ref: 12.3-1
  asks: MONITORING — how do you ensure your recordkeeping practices are effective, and how often do you monitor
    the practices?
  status: partial
  severity: P2
  trazo:
    questions:
    - g2_0_fraud_prevention.osp_implementation_monitoring
    - g2_0_fraud_prevention.fraud_review_process
    - g2_0_fraud_prevention.osp_review_frequency
    prints: modules/G2_0.pdf §B–C
  gap: Reused from CCOF G8.0 D3 / WSDA §P 2 (P2). `record_review` ("Review the operation's records against
    the plan") and `internal_review` are the monitoring; `osp_review_frequency` gives the plan-review cadence
    {annually, on_change, before_inspection, other}. None of the monitoring ticks carries its own frequency,
    and the questions are about the PLAN's implementation generally, not recordkeeping practice specifically
    — OTCO asks for both the method and how often, for recordkeeping.
  fix: Per-item frequency on `osp_implementation_monitoring` (the fix WSDA §P 2 already proposes); the recordkeeping-specific
    reading needs no new field once the frequency is there.
- ref: 12.4-1
  asks: RECORDKEEPING FOR ORGANIC AND NON-ORGANIC CROP PRODUCTION — do you produce both organic and non-organic
    crops and/or crop products? No, section not applicable / Yes — identify the non-organic crops and/or crop
    products produced.
  status: covered
  trazo:
    questions:
    - g6_0_production.split_operation
    - g6_0_production.nonorganic_crops_products
    - g6_0_production.nonorganic_product_source
    - g6_0_production.nonorganic_product_source_other
    prints: modules/G6_0.pdf §A
  # Closed 2026-11-06. The non-organic crops are named (`nonorganic_crops_products`, 2026.11.09) and where the
  # non-organic product comes from is asked. A buffer-only farm answering Yes is right under § 205.2, not pushed.
- ref: 12.4-1a
  asks: How do your input records distinguish between materials used on organic and non-organic crops and/or
    crop products?
  status: partial
  severity: P2
  trazo:
    questions:
    - g6_0_production.split_operation_separation
    prints: modules/G6_0.pdf §A
  gap: Reused from CCOF G8.0 C2 (P2). Trazo asks only a general separation textarea; it never asks specifically
    how INPUT records (receipts, application records) distinguish organic from nonorganic material use.
  fix: Reuse C2 — add `split_input_records_distinction` (textarea) to G6.0, visible when `split_operation`
    is true; pre-suggest "block_id flags buffer rows; identical organic inputs used throughout" for the buffer-only
    case.
- ref: 12.4-1b
  asks: How do your harvest, shipping, and sales records distinguish between organic and non-organic crops
    and/or crop products?
  status: partial
  severity: P2
  trazo:
    questions:
    - g6_0_production.parallel_production_distinction
    - g6_0_production.buffer_strategies
    prints: modules/G6_0.pdf §A–B
  gap: Reused from CCOF G8.0 C3 (P2). Covered for the buffer case (`buffer_strategies` plus the harvest event's
    buffer-disposition field and the § 11 buffer-separation record). For a true split operation the equivalent
    question, `parallel_production_distinction`, is hidden unless `parallel_production` is true, so a split-but-not-parallel
    operation is never asked.
  fix: Reuse C3 — show a harvest/shipping/sales distinction textarea whenever `split_operation` is true, not
    only when `parallel_production` is true.
