  asks: Complete the table below, or attach a separate sheet, to describe the results of the vulnerability assessment
    — Attached.
  status: covered
  trazo:
    questions:
    - g2_0_fraud_prevention.critical_control_points
    prints: modules/G2_0.pdf §D
  note: 'Closed 2026-11-14. The table is completed on the page, not attached: each control point picked asks its
    strategies and its monitoring (3-1a to 3-1c). A table kept elsewhere can ride as the separate plan (1-4).'
- ref: 3-1a
  asks: 'Section 3. VULNERABILITY ASSESSMENT & CRITICAL CONTROL POINTS — table column "Critical Control Point":
    identify critical control points where there is a potential risk for fraud, considering the supplier''s certification
    status (certified vs. exempt), where the supplier is located (domestic or foreign), economic factors (high value,
    hard to find, high demand), agronomic factors (pests or plant diseases), how products are handled (organic and
    conventional), and your relationship with the supplier (if you have a supplier approval program). Example: "Use
    of uncertified transportation".'
  status: covered
  trazo:
    questions:
    - g2_0_fraud_prevention.critical_control_points
    - g2_0_fraud_prevention.ccp_other_name
    prints: modules/G2_0.pdf §D
  note: 'Closed 2026-11-14. `critical_control_points` lists the steps where fraud enters a grower''s chain (seed
    and planting stock, inputs, organic product bought in, contracted work, transport including by an uncertified
    carrier, storage and packing away from the farm, shared people, equipment or space, selling, importing or exporting),
    other named. Its coaching names the form''s factors: certified or exempt, domestic or foreign, economic and
    agronomic pressure, organic and nonorganic handled together, the supplier relationship. `fraud_risk_areas` stays
    as it was answered.'
- ref: 3-1b
  asks: 'Table column "Fraud Prevention and Mitigation Strategies" — the strategies that will be implemented for
    each critical control point, considering the records that are maintained and the practices that prevent commingling
