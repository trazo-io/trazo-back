- ref: 2-2
  asks: How do you approve and keep track of organic suppliers in your records? We use a supplier list to track
    organic suppliers · we ensure our suppliers are listed in our OSP on our Master Ingredient List or Master
    Product List · we have a supplier approval program to review and approve new organic suppliers · we check
    that the supplier's organic certificate is current, lists the certified products, and shows the products
    we buy from them · we confirm the supplier agrees to meet product specifications for every shipment · we
    check that the supplier passes a 3rd-party food safety audit (like GFSI) every year · we confirm the supplier
    can meet our quality and quantity needs · we make sure the supplier gives us updated organic certificates
    at least once a year, or when requested · we get product residue testing results from the supplier on a
    regular schedule (every shipment, weekly, quarterly) · the supplier will immediately notify us in writing
    if any residue is found on products we receive · we require suppliers to allow an annual on-site visit
    from someone at our operation · other (describe).
  status: covered
