# OTCO OFPP — Organic Fraud Prevention Plan.
# Source: https://tilth.org/help-center/blank-forms-all/ (docx
# https://tilth.org/wp-content/uploads/2024/01/OFPP-OrganicFraudPreventionPlan.docx), footer stamp
# "rev 2025/08/27", retrieved 2026-09-09.
#
# Registered as a DELTA against CCOF G8.0 §D (D1–D3), the CCOF Certification Contract B2, and WSDA
# AGR 2121-P. OTCO's form is the third shape of the same § 205.201(a)(3) obligation: CCOF asks a
# scenario checklist and a verification cadence, WSDA asks what the operation DOES (SOPs, audits,
# sampling, supplier approval, reporting criteria), and OTCO asks for a PLAN document — a team, a
# supply-chain map, a vulnerability table by critical control point, training, and monitoring.
# Trazo's G2.0 is the federal Common OSP Section 2 shape (risk areas → mitigations → keeping the
# plan accurate), so most OTCO asks land on a G2.0 question that already carries a verdict; the
# fresh findings are the team table (1-1), the reporting CHANNELS (1-2), the supply-chain map
# (2-1), and the per-CCP table shape (3-1..3-3).
#
# Ref scheme (re-cut 2026-09-30, OSP alignment audit T26). Refs are what the form prints: the
# subsection number and question number (`2-2`), a lettered sub-item (`3-1a`). The earlier
# version of this file numbered items by order of appearance, gave table columns rows of their own
# and folded subsection "Not applicable" lines into the first question; all three are gone. An
# unnumbered item carries the nearest printed parent plus a description in parentheses. Rows match
# `../inventory/<this file>`, derived from the docx; gaps of merged rows are carried by the row that
# absorbed them, marked with the old ref.
#
# ⚠️ THE DIVERGENCE TO KNOW BEFORE READING. OTCO's Section 1 lets a perennial or wild-crop grower
# who buys no certified organic seed or planting stock declare the whole plan not applicable and
# stop. Trazo's G2.0 deliberately carries NO "Not applicable" attestation
# (`allows_not_applicable=False`, g2_0_fraud_prevention.py): the federal Common OSP offers none for
# Section 2, because Strengthening Organic Enforcement made § 205.201(a)(3) part of EVERY
# operation's plan. Row 1-3 records that divergence as its gap and does NOT propose an N/A gate as
# the fix — the right move is to say on the packet that the plan answers the module in full where
# OTCO's form would have accepted "not applicable".
form:
  code: OFPP
  title: Organic Fraud Prevention Plan
  document_id: OFPP
  revision: rev 2025/08/27
  url: https://tilth.org/help-center/blank-forms-all/
  pdf: https://tilth.org/wp-content/uploads/2024/01/OFPP-OrganicFraudPreventionPlan.docx
  retrieved: 2026-09-09
  nop_cites:
  - § 205.201
  - § 205.2
  guide_trigger: >-
    C1 Crop Activities Checklist — "I/We are applying for Oregon Tilth organic certification for
    crop production" routes to "O1: Operation Information (required)" and "OFPP: Organic Fraud
    Prevention Plan". The form itself carries a not-applicable stop for perennial or wild-crop
    growers who buy no certified organic seed or planting stock (row 1-3).
  required_of_every_grower: true
  trazo_module: g2_0_fraud_prevention
  register_status: complete
  source_sha256: 97be17b9d1e28708d4fbede4a7f53f55989c57aba93d41a487cc6b6b539e9432
items:
- ref: 1-1
  asks: 'Section 1. ORGANIC FRAUD PREVENTION TEAM — identify the person or people responsible for approving, implementing,
    training staff, and monitoring the Organic Fraud Prevention Plan. Table: Name · Job Title/Role · Contact Info
    (Phone/Email).'
  status: covered
  trazo:
    questions:
    - g2_0_fraud_prevention.ofpp_team
    prints: modules/G2_0.pdf §C
  note: 'Closed 2026-11-14. `ofpp_team` asks each member''s name, job title or role, and phone or email, one person
    per line as the form''s table rows; its coaching names the four duties (approve, implement, train, monitor)
    and says one person may hold all four. The farm profile''s `ofpp_responsible_person` is not copied in: it carries
    no title or contact, and the operator names the team.'
- ref: 1-2
  asks: 'How will you report possible organic fraud? Check all that apply: report to your Oregon Tilth Client Services
    Team · report to the supplier''s certifying agent · report to the USDA National Organic Program · report to
    the California Department of Food and Agriculture (CDFA) State Organic Program, for CA operations · other (describe).'
  status: covered
  trazo:
    questions:
    - g2_0_fraud_prevention.fraud_reporting_channels
    - g2_0_fraud_prevention.fraud_reporting_channels_other
    prints: modules/G2_0.pdf §B
  note: 'Closed 2026-11-14. `fraud_reporting_channels` asks the routes: the operation''s own certifying agent (the
    form''s Client Services Team, in words that do not name an agency), the supplier''s certifying agent, the NOP,
    and the California State Organic Program for a California operation, other described. Asked of every operation,
    not only one that ticked `report_suspected`, which keeps the meaning it was answered with.'
- ref: 1-3
  asks: If you grow perennial crops or harvest wild crops, do you buy certified organic products like seeds
    or planting stock? Yes / No — the Organic Fraud Prevention Plan is not applicable (stop here; you do not
    need to fill out the rest of the form) / N/A — I don't grow perennial crops or harvest wild crops.
  status: partial
  severity: P3
  trazo:
    questions:
    - g2_0_fraud_prevention.fraud_risk_areas
    triggered_by:
    - g3_0_seeds.seeds_used
    - g3_0_seeds.planting_stock_used
    - g3_2_planting_stock.stock_organic_status
    - g4_0_rotation_soil.system_type
    prints: modules/G2_0.pdf §A — the exclusive `none` option ("None of these — we grow and sell only our own
      certified organic crop") is the nearest statement
  gap: A DIVERGENCE, not a missing field. OTCO lets a perennial or wild-crop grower who buys no certified organic
    inputs declare the whole plan not applicable and stop. Trazo's G2.0 has `allows_not_applicable=False` on
    purpose — the federal Common OSP Section 2 offers no N/A, because SOE applies § 205.201(a)(3) to every
    certified operation — so the same grower answers all four pages, briefly (the `none` risk area, the mitigations
    they actually run, the review cadence). The packet therefore carries a full plan where OTCO would have
    accepted a stopped form, and nothing on the packet says this is deliberate, so a reviewer may read the
    extra pages as the operation misjudging its own scope. The three facts OTCO's gate turns on — perennial
    system (G4.0), wild crop (W2.0), certified inputs purchased (G3.0/G3.2) — are all in the plan but are never
    stated together.
  fix: Do NOT add an N/A gate to G2.0. For an OTCO packet, state on 04-coverage-and-scope.pdf (or in the G2.0
    module header) that the plan answers the fraud-prevention module in full under the federal template even
    where OTCO's OFPP would accept "not applicable", and print the three trigger facts beside it so the reviewer
    sees why the pages are short.
- ref: 1-4
  asks: Does your operation already have an Organic Fraud Prevention Plan? No — complete this module / Yes — plan
    is attached; you can skip the rest of this module if your plan includes all the required sections, and complete
    any that are missing.
  status: covered
  trazo:
    questions:
    - g2_0_fraud_prevention.fraud_plan_kept_separately
    - g2_0_fraud_prevention.fraud_plan_upload
    models:
    - company.Establishment.fraud_prevention_plan_document
    - company.Establishment.fraud_prevention_plan_date
    - company.Establishment.ofpp_on_file
    prints: modules/G2_0.pdf §B; attachments/g2_0_fraud_prevention/fraud_plan_upload/ in the packet ZIP
  note: Closed 2026-11-14. `fraud_plan_kept_separately` is the form's No or Yes; the upload hides only on the No,
    so a Yes with no file reads as an attachment missing. Module uploads ride in the packet since 2026-10-01 (packet_attachments.py),
    which retired the old gap. A file filed before the question existed stays on the G2.0 page that names it in the
    packet; the row reads open until the question is answered. The farm profile's `fraud_prevention_plan_document` does not travel and
    answers nothing here.
- ref: 2-1
  asks: Attach a map or flow chart of your supply chain. Start with the certified operations that supply to you.
  status: covered
  trazo:
    questions:
    - g2_0_fraud_prevention.supply_chain_shown_as
    - g2_0_fraud_prevention.supply_chain_map_upload
    - g2_0_fraud_prevention.supply_chain_description
    prints: modules/G2_0.pdf §D; attachments/g2_0_fraud_prevention/supply_chain_map_upload/ in the packet ZIP
  note: 'Closed 2026-11-14. `supply_chain_shown_as` is the form''s own choice, a map or flow chart attached or a
    simple chain described; the upload shows on the map, the description on the other. The coaching on `supply_chain_shown_as`
    names what the form asks the map to show: the certified operations that supply the operation and where they
    are, where the product changes ownership, importing or exporting, each step done away from the farm such as
    transport and storage, and the critical control points marked. The map or the description is the operator''s
    own; Trazo does not read what a map shows. The records behind the chain''s nodes still print on their own pages
    (Supplier List, G6.1 §D handlers, G6.2 §A off-farm storage), and no listing of the chain is generated from them.'
- ref: 2-1a
  kind: instruction
  asks: Submit multiple maps only if the supply chains are very different.
- ref: 2-1b
  asks: Highlight the Critical Control Points in your plan; these are important steps in a process where you can
