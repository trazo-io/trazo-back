# OTCO — Organic System Plan Update Application & Agreement ("OSP Update Form"; OTCO gives it no
# code). Source: https://tilth.org/help-center/renewals/ (docx
# https://tilth.org/wp-content/uploads/2023/03/OSPUpdateFormWeb.docx; also online at
# tilth.org/renew), footer stamp "Rev. 2024/09/20", retrieved 2026-09-09.
#
# This is OTCO's RENEWAL application — the form the ICP files every year — and its substance is
# § 205.406(a): confirm the OSP is accurate and current or list the sections that changed, and
# re-sign the continuation agreement. The precedent for this file is WSDA AGR 2516 Site Update
# (wsda/forms/2516-site-update.yaml), whose header reasoning is mirrored here.
#
# Ref scheme (re-cut 2026-09-30, OSP alignment audit T26). Refs are what the form prints: Step 5's
# (1)-(5) as `5-1`..`5-5`; every other item is its Step plus a description (`Step 4 (OSP updates and changes)`). The earlier
# version of this file numbered items by order of appearance, gave table columns rows of their own
# and folded subsection "Not applicable" lines into the first question; all three are gone. An
# unnumbered item carries the nearest printed parent plus a description in parentheses. Rows match
# `../inventory/<this file>`, derived from the docx; gaps of merged rows are carried by the row that
# absorbed them, marked with the old ref.
#
# COMPLETE, ANSWERED BY PACKET DOCUMENTS — 2026-09-10 (draft since first registration, 2026-09-09).
#
# This form has NO OSP module to declare. Its substance lives in two MODELS, not in a module:
# `OSPAnnualUpdate` (§ 205.406(a)(1)–(2): the year's changes, reaffirmation without a new version,
# per-section unchanged attestations) and `OSPChangeNotification` (§ 205.400(f): every notice
# already sent to the certifier), which print as 02-annual-update.pdf and
# 03-change-notifications.pdf in every packet. Because the file carries no `trazo_module`, no row
# below may cite `trazo.questions` — the loader treats a form that cites questions without
# declaring a module as an error — so rows point at models, `triggered_by` and `prints`.
#
# `packet_documents` is the third state `packet_coverage._classify` lacked. While it knew only
# modules, (complete, no module) would have printed "Trazo does not generate this form" beside
# documents 02 and 03 of the same ZIP, so the file sat in draft — and draft printed "1 further
# Oregon Tilth form have not yet been compared against this plan" on the coverage page. A desk
# read of an OTCO packet (2026-09-10) found that sentence standing where a reviewer looks first
# for the agent's own renewal application. The coverage page now lists this form with the two
# documents that answer it. The rows keep their own `partial` verdicts: listing a form says where
# it is answered, not that it is answered in full.
form:
  code: ''
  title: Organic System Plan Update Application & Agreement
  document_id: OSP Update Form
  revision: Rev. 2024/09/20
  url: https://tilth.org/help-center/renewals/
  pdf: https://tilth.org/wp-content/uploads/2023/03/OSPUpdateFormWeb.docx
  retrieved: 2026-09-09
  nop_cites:
  - § 205.406
  - § 205.400(f)
  - § 205.401
  guide_trigger: >-
    OTCO's renewal application, not routed by the C1 Activities Checklist — "To continue your
    certification with OTCO, please submit this completed form AND your certification fees as per
    the OTCO Fee Schedule before your established renewal deadline date." Filed annually by every
    certified operation.
  required_of_every_grower: true
  filed_with_agent: true
  requires_signature: true
  accepted_format: agent_form
  renewal_role: annual_renewal
  format_source: >-
    OSP Update Form Step 5, "Sign Continuation of Certification Agreement" (rows 5-1, 5-3); OTCO
    renewals page: "please submit this completed form AND your certification fees".
  register_status: complete
  source_sha256: c1d81ce1c8c3140829e35bf8c974ae378b96006224a5c7ae69f7038d461bfe35
  packet_documents:
  - 02-annual-update.pdf
  - 03-change-notifications.pdf
items:
- ref: Step 1 (business name, client ID, DBA)
  asks: Step 1. General Information — Registered Business Name; Client ID (listed on all correspondence and
    your certificate); DBA (if any).
  status: covered
  trazo:
    where: '00-cover.pdf: Legal name, Trade name (DBA), Client ID'
    models:
    - company.Company.name
    - company.Company.tradename
    - company.Establishment.certifier_client_id
    - company.Establishment.certifier_client_id_agent
    prints: '00-cover.pdf ("Legal name"; "Trade name (DBA)"; "Client ID", printed only when recorded against
      this agent); the in-app copy sheet gives all three to copy'
  note: 'Covered since 2026-10-23. The Client ID is the operator''s own entry, made once from the copy sheet and
    kept with the agent that issued it (certifier_client_id_agent), so an operation that moves agent never shows
    one agent''s ID as another''s. Until it is entered, the sheet says where OTCO prints it (certificate and
    correspondence) and that it is not the certificate number.'
- ref: Step 1 (primary contact)
  asks: Primary Contact Name; Email; Phone.
  status: partial
  severity: P3
  trazo:
    where: '00-cover.pdf: Responsible person, Phone, Email'
    models:
    - company.Establishment.contact_person
    - company.Establishment.contact_email
    - company.Establishment.contact_phone
    prints: 00-cover.pdf ("Responsible person", "Phone", "Email")
  gap: Name and email print (the cover has printed Email since 2026-10-24). The phone printed is the operation's
    main phone (`Establishment.phone` before `contact_phone`), which need not be the contact's. The in-app copy
    sheet reads the contact's phone first since 2026-11-04. (OTCO's update form does not ask for a title, so the
    CCOF C1 title gap does not apply here.)
  fix: Print the contact's own phone beside the responsible person on the cover.
- ref: Step 1 (public contact)
  asks: Public Email (or "same as above"); Public Phone (or "same as above").
  status: partial
  severity: P2
  trazo:
    where: '00-cover.pdf: Phone'
    models:
    - company.Company.contact_email
    - company.Establishment.email
    - company.Establishment.phone
    prints: 00-cover.pdf ("Phone") — no public email prints
  gap: Reused from the CCOF Contract A1 (P2). A public email exists on the model and never prints; nothing
    records that the operation consents to it being shared publicly.
  fix: Reuse A1 — print the public email on the cover with a `public_contact` consent flag.
- ref: Step 1 (contact change form)
  asks: If additional contact changes are needed, or if the primary contact above was not previously listed,
    complete and attach a Contact Change form (available from www.tilth.org).
  status: partial
  severity: P2
  trazo:
    where: '02-annual-update.pdf: (a)(3), whether the company details changed this year'
    models:
    - certifications.OSPAnnualUpdate.sections_unchanged_attestation
    - certifications.OSPAnnualUpdate.application_info_changes
    prints: '02-annual-update.pdf (a)(3): the dated "changed from/added/removed" lines, the contradiction
      sentence when both are set, ''No changes. The operator attests…'' or ''Not stated on this filing'''
  gap: Since 2026-11-02 the annual update's company-details step writes a dated line for each detail the
    operator changes, adds or removes (business name, responsible person, address, phone, email), and 02
    prints those lines under (a)(3). The comparison is against the values Trazo held, never against OTCO's
    client file, so a primary contact that was never listed with OTCO still reads "No changes" when the
    operator marks it correct. Trazo also holds one named person and no additional contacts or their
    permissions, which is what OTCO's Contact Change form records. Whether the form is owed is not readable
    from the packet.
  fix: Have 02 say that the comparison is against the details Trazo held, not the agent's file; model
    additional contacts with their roles.
- ref: Step 2 (continue or withdraw)
  asks: 'Step 2. Request Renewal (select one) — I wish to continue certification with OTCO; my sales information
    is included and I have paid my certification fees or arranged a payment plan. OR: I no longer require certification
    from OTCO; I am notifying OTCO of my intent to withdraw completely from the certification program and surrender
    my OTCO certification.'
  status: out_of_scope
  scope_basis: not_an_operation_obligation
  reason: An election made to OTCO on OTCO's form. A renewal packet exists only for an operation that is continuing
    — its cover reads "Continuation of certification (7 CFR 205.406)" — and a surrender is a decision about
    the certificate, not a fact of the organic system plan.
- ref: Step 3 (services)
  asks: 'Step 3. Renewal Type — I would like to renew/apply for the following services (each box may incur
    an additional fee): USDA National Organic Program (NOP) · US-Canada Equivalency · OTCO Transitional · Mexico
    Organic Program (LPO) · OPT Grass Fed Standards · Bee Better · EU Certification · NSF/ANSI 305 Personal
    Care · Salmon Safe · Global Organic Textile Standards (GOTS). EU and LPO, and all operations in Mexico,
    must file the International Programs Addendum.'
  status: partial
  severity: P3
  trazo:
    where: 'modules/operation_profile.pdf: E. Standards and regulatory agencies'
    triggered_by:
    - certification_contract.standards_requested
    - certification_contract.standards_requested_other
    prints: modules/operation_profile.pdf §E
  gap: The services answer lives on the contract module (registered against O1 C-2, where every service on this
    list is an option, Bee Better and GOTS included) and prints in the module PDF. The copy sheet leaves Step 3's
    boxes to the operator, since each service is a fee-bearing election on OTCO's form. As with Step 3 (scopes), `OSPAnnualUpdate` has no field for it, so a service added or dropped at renewal shows
    only as a module change, never as a line on the filing.
  fix: Print the contract module's standards on 02-annual-update.pdf as "services continued", with the scopes.
- ref: Step 3 (scopes)
  asks: 'I would like to renew the following scopes of certification under the OTCO program: Crop · Livestock
    · Wild-crop · Handling · Restaurant · Retail (i.e. grocery store).'
  status: partial
  severity: P3
  trazo:
    where: 'modules/operation_profile.pdf: Certification scopes'
    triggered_by:
    - certification_contract.contract_scopes
    prints: 'modules/operation_profile.pdf §A ("Certification scopes: …")'
  gap: The scope answer lives on the contract module (registered against O1 C-1, where its option list is judged)
    and prints in the module PDF; the renewal-specific gap is that `OSPAnnualUpdate` has no scope field, so
    a scope dropped or added at renewal shows only as a module change, never as a line on the filing OTCO reads
    for it.
  fix: Print the contract module's scopes on 02-annual-update.pdf as "scopes continued", and reuse the O1 C-1
    option additions.
- ref: Step 3 (production partners)
  asks: Production Partners (as defined by the OTCO Fee Schedule) — Yes, my certification is a production partnership
    with the following OTCO-certified company; please bill the primary company for the certification and inspection
    fees (75% of sales of certified product must be sold to the primary company).
  status: out_of_scope
  scope_basis: agent_administration
  reason: An OTCO fee-schedule billing arrangement (same as O1 G-1) — who pays OTCO's invoice is not a fact
    about the operation's organic system.
- ref: Step 4 (OSP updates and changes)
  asks: 'Please select one of the options below: the OSP is reviewed, accurate and current / the OSP needs
    to be updated, list the updated sections and attach.'
  status: partial
  severity: P3
  trazo:
    where: below, under OSP Update Form Step 4
    models:
    - certifications.OSPAnnualUpdate.changes_summary
    - certifications.OSPAnnualUpdate.additions
    - certifications.OSPAnnualUpdate.deletions
    - certifications.OSPAnnualUpdate.new_osp
    - certifications.OSPAnnualUpdate.prior_plan_basis
    - certifications.OrganicSystemPlan.module_responses
    - certifications.PlanMaterialEntry
    - certifications.OrganicSystemPlan.sections
    prints: 02s-renewal-status-and-routing.pdf, "OSP Update Form Step 4" (each OTCO form whose answers differ
      between the two plan versions, with its module file); 02-annual-update.pdf, "(a)(1) Summary" and "(a)(2)
      Additions / Deletions" in the operator's words
  gap: 'Since 2026-10-22 02s lists the changed sections by OTCO form code, compared from the plan versions the
    update moved between: module answer values and the not-applicable election, the catalogue lists and
    materials rows, and each § 205.201(a) section''s own narrative and confirmed record types (listed by
    section, as no OTCO form maps them). Write times and fork bookkeeping are ignored. The (a)(2) entries
    could not carry the code: the annual-update card stores them as free-text lines. A packet built from the
    prior version points to the newer one rather than listing changes its module files do not hold. Still
    open: land. Parcels are not versioned with the plan, so the comparison cannot see new land or edits to an
    existing parcel''s application (C2, FACT-04); 02s says so, and lists parcels whose stated
    `date_began_managing` is on or after the prior version''s submitted (else effective) date, and those with
    no date as not stated. The packet still attaches every module; 02s names the changed files. In a first
    year on Trazo (`prior_plan_basis` agent_file, 2026-11-14) OTCO holds the plan filed before Trazo and Trazo
    has no copy of it, so nothing is listed: 02s says why and leaves the list to the operator.'
  fix: Per-parcel land changes are the next slice (CCOF ORGB88 and WSDA AGR 2516 ask for them per parcel and
    site), which would let this row read covered.
  note: The 'reviewed and current' election is OSPAnnualUpdate's reaffirmation and the OSPChangeNotification
    trail (was row 4-1, covered).
- ref: 5-1
  kind: instruction
  asks: (1) You have read the above information and attest that it is true to the best of your knowledge.
- ref: 5-2
  kind: instruction
  asks: (2) You are duly authorized to bind the Operator to this Agreement.
- ref: 5-3
  kind: instruction
  asks: (3) You affirm that you have read, fully understand and agree to be bound by the standards, procedures, fees, policies,
    assessments, obligations, and requirements as presented in the current Oregon Tilth Manuals.
- ref: 5-4
  kind: instruction
  asks: (4) You will continue to operate in accordance with applicable standards and Oregon Tilth policies.
- ref: 5-5
  kind: instruction
  asks: (5) You affirm that you have read, fully understand and agree to be bound by this Agreement, which includes the
    Terms & Conditions (Oregon Tilth Certification Services and Trademark Use), incorporated by reference.
- ref: Step 5 (electronic signature consent)
  asks: 'Electronic signatures — by checking the box you willingly consent to the use of electronic signatures
    in the conduct of your business with Oregon Tilth: AGREE.'
  status: out_of_scope
  scope_basis: agent_administration
  reason: Consent to OTCO's own e-signature process — a term of OTCO's agreement, not of the operation's plan.
- ref: Step 5 (signature, date, title)
  asks: Signature; Date; Title.
  status: out_of_scope
  scope_basis: agent_agreement
  reason: 'Step 5 reads "Sign Continuation of Certification Agreement: By signing this form, you are stating that:"
    and lists (1) to (5), which are instruction rows. The signature executes OTCO''s agreement on OTCO''s form.
    The signature 02 prints is the operation''s on its own record of the update, not on OTCO''s form, and is
    never offered as one. (5-1 was "covered" by that signature and this row "partial" until 2026-11-04.)'
- ref: Step 6 (gross organic sales and period)
  asks: 'Step 6. Submit Completed Application and Payment — "The gross organic sales for my operation are $
    …; time period of this reported sales amount: from … to …." Sales reported at renewal should include all
    products, land, etc. that are listed on your certificate, even if they are not sold as organic; a portion
    not sold as organic may be excluded from the fee calculation only by written petition to the Finance &
    Administration Director.'
  status: partial
  severity: P2
  trazo:
    where: '02-annual-update.pdf: Sales records subtotal (not reconciled)'
    models:
    - history.SalesRecord.sale_amount
    - history.SalesRecord.voided_at
    - history.SalesRecord.sale_date
    - certifications.OSPAnnualUpdate.sales_period_start
    - certifications.OSPAnnualUpdate.sales_period_end
    prints: 02-annual-update.pdf, "Sales records subtotal, <from> to <to> (not reconciled)" over the period the
      operator stated on the update (else the prior calendar year, said as "calendar"), stated there as not any
      agent's fee figure; 02s states OTCO's own Step 6 scope beside it; the in-app copy sheet gives the same
      figure and period, withheld while any sale in the period has no amount
  gap: 'Since 2026-10-23 the operator states the sales period on the annual update (both ends, at most 12
    months, already over; signed with the filing and carried by a correction), and 02 and the copy sheet count
    live sales invoiced as organic inside it. What stays the operator''s: OTCO''s figure covers everything on
    the certificate "even if not sold as organic" (excluded only by OTCO''s written petition), so a subtotal of
    organic invoices is a floor, and both say so. Voided rows are excluded, as everywhere.'
  fix: None in the packet beyond the starting figure. Sales of products not sold as organic are not recorded as
    such in Trazo, and the reconciliation is the operator's.
- ref: Step 6 (payment included)
  asks: I have included payment according to the OTCO fee schedule (contact us to arrange a payment plan if
    you cannot send the full fee with this form).
  status: out_of_scope
  scope_basis: payment_data
  reason: Reused from the CCOF Contract H — payment mechanics for OTCO's own invoicing.
- ref: Step 6 (billing contact)
  asks: 'Check if the billing contact is the same as the primary contact identified above; if invoices should
    be sent to a particular contact, identify: Billing Contact Name, Email, Phone.'
  status: out_of_scope
  scope_basis: agent_administration
  reason: Who receives OTCO's invoices is the operation's arrangement with OTCO, like production partners (who
    pays the invoice). Nothing in the organic system plan depends on it.
- ref: Step 6 (comments)
  asks: 'Comments:'
  status: out_of_scope
  scope_basis: agent_administration
  reason: A free correspondence field to OTCO; not a question about the operation.
