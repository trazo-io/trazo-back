# Oregon Tilth Certified Organic (OTCO) — C2 Crops Acreage & Land History.
#
# Source: https://tilth.org/help-center/blank-forms-all/ → C2CropsAcreageLandHistory.docx
#   (https://tilth.org/wp-content/uploads/2015/05/C2CropsAcreageLandHistory.docx), read 2026-09-09
#   from the official 2025 Crop OSP bundle. Footer stamp as printed: "rev. 2024/06/05".
#
# Ref scheme (re-cut 2026-09-30, OSP alignment audit T26). The form prints its numbers: 2.1-2.5
# as headings, and under 2.1 the questions 1) to 10) with 7a) and 7b). The earlier version of this
# file numbered items by order of appearance and gave table columns rows of their own; both are
# gone. Rows now follow `../inventory/C2-crops-acreage-land-history.yaml`, derived from the file:
# 2.2 to 2.5 are each one item (a table or a block), unnumbered items carry the nearest printed
# parent plus a description (`2.1 (alternative location)`, `2.5 (electronic signatures)`), and the
# instruction block is `Preamble (instructions)`. Gaps of merged rows are carried by the row that
# absorbed them, marked with the old ref.
#
# Registered as a DELTA against the CCOF Parcel Application (ORGB49) and WSDA AGR 2264 / AGR 2262
# — see certifiers/README.md, "The delta rule". Where OTCO asks an obligation those registers
# already judged, the verdict (questions, status, severity) is reused and restated in OTCO's terms;
# rows marked "OTCO-specific" are fresh analysis of asks the other two forms do not make.
form:
  code: C2
  title: Crops Acreage & Land History
  document_id: C2
  revision: rev. 2024/06/05
  url: https://tilth.org/help-center/blank-forms-all/
  pdf: https://tilth.org/wp-content/uploads/2015/05/C2CropsAcreageLandHistory.docx
  retrieved: 2026-09-09
  nop_cites:
  - § 205.202
  guide_trigger: >-
    C1 Crop Activities Checklist: "I/We grow crops → C2: Land History (one C2 document for each
    non-adjacent parcel)". C2's own header: "This form must be submitted with a new application or
    to add acreage, but does not need to be updated. Future crop updates may be submitted to Oregon
    Tilth in any written format or by phone… For updates to currently certified acreage, use FACT-04
    Field, Acreage, Crop Table." So C2 is filed ONCE per parcel (at application, or when acreage is
    added); the annual parcel × acreage × status × crops statement is FACT-04.
  required_of_every_grower: true
  trazo_module: parcel_application
  register_status: complete
  source_sha256: 24785f863cbd165fb04354dd0ba9d6dbd55f9ab0cfe21a7eb773b676e9d9fb9f
items:
- ref: Preamble (instructions)
  kind: instruction
  asks: Complete a separate C2 for each physically separate, non-adjacent parcel (a parcel may be one or many
    fields), and a separate C2 for any adjacent parcel with a different organic eligibility date. Use this
    form to add acreage to an already certified operation. ALL sections must be complete before OTCO can add
    the land to the certificate. Submitted with a new application or to add acreage; it does not need to be
    updated — future crop updates in any written format, and FACT-04 for updates to currently certified acreage.
    If transferring land between two OTCO certified operations and the field was inspected in the last 12 months,
    use the Land Transfer Form instead (no inspection required before addition to the new manager's certificate).
- ref: 2.1 (alternative location)
  asks: If the parcel does not have a street address, provide alternative location information (e.g., direction
    and distance from nearest crossroads/landmark, GPS coordinates, etc.).
  status: covered
  trazo:
    questions:
    - parcel_application.location_coordinates
    - parcel_application.location_notes
    models:
    - product.Parcel.polygon
    - product.Parcel.address
    - product.Parcel.application_answers
    prints: >-
      parcels/parcel-application-<name>.pdf §A
  note: >-
    Since 2026-11-10 §A prints the drawn boundary's centre (the same computation as the §E map caption)
    or states that no boundary is drawn. A parcel with no street address is asked for coordinates, a
    cross street or road, or directions in their own field; with a street address that field does not
    apply. The address itself is cited on the street-address row.
- ref: 2.1-1
  asks: Parcel name and/or ID code.
  status: covered
  trazo:
    questions:
    - parcel_application.parcel_name
    models:
    - product.Parcel.name
    prints: parcels/parcel-application-<parcel>.pdf §A; workbooks/Field and Crop Information Form.xlsx ("Field
      or Parcel ID")
- ref: 2.1-2
  asks: 'Street address:'
  status: covered
  trazo:
    questions:
    - parcel_application.address
    prints: parcels/parcel-application-<parcel>.pdf §A
- ref: 2.1-3
  asks: 'City: County:'
  status: covered
  trazo:
    questions:
    - parcel_application.location_same_as_operation
    - parcel_application.location_city
    - parcel_application.county
    models:
    - product.Parcel.application_answers
    - company.models.Establishment.city
    prints: >-
      parcels/parcel-application-<name>.pdf §A
  note: >-
    Asked per parcel since 2026-11-10. When the operator answers that the parcel shares the operation's
    city, state, ZIP code and country, the page prints the operation's address on file beside that
    answer, with a [REVIEW] line naming any part of it that is blank. The operation's address is never
    copied in without that answer.
- ref: 2.1-4
  asks: 'State/Province: Zip: Country:'
  status: covered
  trazo:
    questions:
    - parcel_application.location_same_as_operation
    - parcel_application.location_state
    - parcel_application.location_zip
    - parcel_application.location_country
    models:
    - product.Parcel.application_answers
    - company.models.Establishment.state
    - company.models.Establishment.zip_code
    - company.models.Establishment.country
    prints: >-
      parcels/parcel-application-<name>.pdf §A
  note: >-
    Asked per parcel since 2026-11-10. When the operator answers that the parcel shares the operation's
    city, state, ZIP code and country, the page prints the operation's address on file beside that
    answer, with a [REVIEW] line naming any part of it that is blank. The operation's address is never
    copied in without that answer.
- ref: 2.1-5
  asks: County Assessor's parcel number, Section/Township/Range, Tax Map Key, or other legal description.
  status: covered
  trazo:
    questions:
    - parcel_application.apn
    - parcel_application.section_township_range
    models:
    - product.Parcel.apn
    - product.Parcel.section_township_range
    prints: parcels/parcel-application-<parcel>.pdf §A
  note: Same as CCOF A4. OTCO additionally names Hawaii's Tax Map Key; both Trazo fields are free text, so
    a TMK or any "other legal description" fits `apn`. Completion requires one of the two.
- ref: 2.1-6
  asks: 'Do you: Own / Lease/Rent / Manage this parcel? Other: ____.'
  status: covered
  trazo:
    questions:
    - parcel_application.site_tenure
    - parcel_application.site_tenure_other
    prints: parcels/parcel-application-<parcel>.pdf §A
- ref: 2.1-7
  asks: When did you begin managing this parcel? (i.e., the date you bought, began leasing, or otherwise became
    responsible for management of the land.) M/D/Y.
  status: covered
  trazo:
    questions:
    - parcel_application.date_began_managing
    models:
    - product.Parcel.date_began_managing
    prints: parcels/parcel-application-<parcel>.pdf §B
- ref: 2.1-7a
  asks: Is the parcel in question currently certified organic? Yes / No.
  status: covered
  trazo:
    questions:
    - parcel_application.currently_certified
    prints: parcels/parcel-application-<name>.pdf §F — the answer, the certifying agency, the certified operation's
      name when it is not this operation, and the certificate-of-record line
- ref: 2.1-7b
  asks: 'If Yes, provide the certified operation''s name and certification agency (example: "ABC Farm; OTCO
    or Oregon Tilth"). If this parcel is currently certified by OTCO and has been inspected in the last year,
    complete the Land Transfer Form instead.'
  status: covered
  trazo:
    questions:
    - parcel_application.prior_certifier_name
    - parcel_application.certified_operation_name
    - parcel_application.certificate_card
    models:
    - certifications.models.Certification
    prints: parcels/parcel-application-<name>.pdf §F — the answer, the certifying agency, the certified operation's
      name when it is not this operation, and the certificate-of-record line
  note: 'Closed 2026-09-09 (fix/parcel-page-land-history): `currently_certified` is asked as the certifiers
    ask it (no ''by another certifier''), is part of completion (`certification_status`), and gates a certificate-of-record
    line on the parcel''s own page — number, issuing agent, effective and expiry dates from ONE record (`certificate_line`,
    built on `operation_certificate`), never assembled field by field. Printing the record replaced the suggest→confirm
    prefill this row asked for: a record printed beside the operator''s own answer is stronger evidence than
    the same value typed back, and § 205.201(a) authorship is untouched because the operator still answers
    the question. `certified_operation_name` carries OTCO''s ''ABC Farm; OTCO'' pair. The Land Transfer routing
    (OTCO-to-OTCO, inspected within 12 months) depends on OTCO''s own inspection record and stays OTCO''s step.'
- ref: 2.1-8
  asks: 'When do you plan on harvesting a certified organic crop from this parcel? M/D/Y. Note: for new applicants,
    crops harvested before inspection cannot be certified.'
  status: covered
  trazo:
    questions:
    - parcel_application.expected_first_organic_harvest
    models:
    - product.Parcel.application_answers
    prints: >-
      parcels/parcel-application-<name>.pdf §B
  note: >-
    Asked in the form's terms since 2026-11-10, without the old '(if in transition)'. Hidden for a
    parcel stated currently certified. Not one of the completion checks: those read live records, and
    every parcel question is optional by design.
- ref: 2.1-9
  asks: Total acres to be certified organic at this location.
  status: partial
  severity: P3
  trazo:
    where: 'each parcel''s application under parcels/: Section E, the map caption; workbooks/Field and Crop Information Form.xlsx: Acreage or square feet'
    models:
    - product.Parcel.area
    prints: parcels/parcel-application-<parcel>.pdf §E (map caption); workbooks/Field and Crop Information
      Form.xlsx ("Acreage or square feet")
  gap: Same as CCOF A7. `Parcel.area` (stored in hectares, converted at the boundary by `area_display()` /
    `_acres`) is the figure OTCO wants and it prints — but on the parcel page it appears only in the §E map
    caption, not in the location-and-description block where OTCO asks for it. The workbook row carries it
    in acres.
  fix: Duplicate the acreage line into §A as "Total acres to be certified organic".
- ref: 2.1-10
  asks: 'Use the following table to list crops you currently grow (and/or plan to grow) on this parcel: Crop
    / Acres or SQ FT. Attach an additional list if necessary.'
  status: partial
  severity: P2
  trazo:
    questions:
    - parcel_application.crop_history
    models:
    - product.Parcel.product
    - product.ParcelCropHistory.crop_grown
    - history.models.History
    prints: workbooks/Field and Crop Information Form.xlsx ("Crop(s)/Cover Crops"); parcels/parcel-application-<parcel>.pdf
      §F (per year)
  gap: 'OTCO-specific split of the crop table CCOF A8 / WSDA 8 judge as one row. Crop NAMES do reach two artifacts,
    but the workbook cell prints ONE crop per parcel — the newest season in the ground, else the newest `ParcelCropHistory.crop_grown`
    (`_current_season_crop`) — and §F lists crops by year, not as the current/planned set. A parcel carrying
    three crops this season (OTCO''s own example lists five) shows one; "plan to grow" has no field at all.
    (2.1-11) Same as CCOF A8 / WSDA 2264 ref 8: no per-crop acreage field exists anywhere — `History` carries
    no area and `Parcel.product` is a single FK. A single-crop parcel can imply the whole parcel''s acreage;
    a multi-crop parcel cannot be split. OTCO also accepts square feet (greenhouse and container ground); `Parcel.area`
    prints in acres only.'
  fix: Add a `crops_planned` rows answer (crop, acres) on page A prefilled with the crop names from open seasons
    for the operator to confirm; print it as a table in §A and feed the workbook's crop cell from it (the CCOF
    A8 fix). The `crops_planned` rows answer from 2.1-10 with an `acres` (or `sq_ft`) cell per crop; validate
    the sum against parcel acreage and note when cropped acreage exceeds it.
- ref: '2.2'
  asks: BOUNDARIES AND BUFFERS — provide the information below for all areas adjacent to this parcel (one table
    row per border). Attach an additional list if necessary.
  status: covered
  trazo:
    questions:
    - parcel_application.buffer_editor
    - parcel_application.no_adjoining_prohibited
    - parcel_application.parcel_change_notifications
    - parcel_application.contamination_incidents
    - parcel_application.adjoining_affidavit_card
    models:
    - product.Parcel.buffer_zones
    - product.services.buffer_zones
    prints: parcels/parcel-application-<parcel>.pdf §D
  note: Closed 2026-11-06. OTCO's column "Is crop grown in buffer area? (Y/N)" is `buffer_crop_grown` beside the
    crop's name, so a bare farm-road buffer can say No ("no crop grown in the buffer"). The wizard shows the
    change notifications and contamination incidents §D prints, read-only.
- ref: '2.3'
  asks: 'MAPS — attach an 8.5" x 11" map of the parcel (an Assessor''s Parcel Map, an aerial photo, or other
    map that clearly shows the boundaries). The layout MUST include: Parcel Name or Code; indication of North;
    location, description and size of buffer areas; location of buildings in relation to other fields or useful
    landmarks (buildings, distinctive features, roads, etc.); organic and non-organic production/processing
    areas; existing installations of treated lumber; and, if your irrigation source is used to apply prohibited
    materials to non-organic land, a piping diagram of valves and/or backflow prevention devices (or a separate
    diagram).'
  status: covered
  trazo:
    questions:
    - parcel_application.map_status
    - parcel_application.map_upload
    - parcel_application.map_elements_shown
    - parcel_application.treated_lumber_present
    - parcel_application.treated_lumber_description
    - parcel_application.treated_lumber_install_date
    - parcel_application.treated_lumber_noncontact_present
    - parcel_application.treated_lumber_noncontact_description
    - g4_2_natural_resources.shared_irrigation_with_prohibited
    - g4_2_natural_resources.shared_irrigation_responsible
    - g4_2_natural_resources.irrigation_piping_map_upload
    models:
    - product.Parcel.polygon
    - product.Parcel.buffer_zones
    - certifications.services.parcel_map
    prints: parcels/parcel-application-<parcel>.pdf §A, §E; packet ZIP parcels/maps/; modules/G4_2.pdf
  note: 'Closed 2026-11-08. The operator''s map ships under `parcels/maps/` and §E names the file. `map_elements_shown`
    asks which of OTCO''s seven elements it shows (parcel name or code, north, buffers with their size, buildings
    and landmarks, organic and non-organic areas, treated lumber, irrigation valves and backflow devices); §E names
    each one not ticked, the conditional ones only when they apply: organic and non-organic areas when G6.0 says the
    operation is split, treated lumber when the parcel says it has any, the valves when G4.2 says organic cropland
    shares irrigation with land where prohibited materials go into the water and no separate piping diagram is
    filed. (2.3-2) `treated_lumber_noncontact_present` asks for installations touching neither crops nor soil
    when the contact question is No, so a legacy end post is no longer answered "No". (2.3-3) G4.2 already asks
    it (2026-11-03, back #273): `shared_irrigation_with_prohibited`, `shared_irrigation_responsible` and the
    `irrigation_piping_map_upload` diagram, which rides in the packet as a requirement upload. The gap text before
    this said no question mentions piping; it predated #273.'
- ref: '2.4'
  asks: LAND HISTORY — provide a complete land history of all crops and applied substances for this parcel
    for the 36 months preceding the first planned harvest of organic crops. If it has been less than 3 years
    since the last application of a prohibited substance, the history may begin at the start of transition
    (the day after the last prohibited application date). Required retroactive conversion periods may vary
    by country (Mexico Organic Program, IACB-EU Standard).
  status: covered
  trazo:
    questions:
    - parcel_application.crop_history
    - parcel_application.transition_card
    - parcel_application.certificate_card
    - parcel_application.no_lapse_attested
    - parcel_application.certified_branch
    - parcel_application.certificate_reference
    - parcel_application.continuity_reference
    models:
    - product.ParcelCropHistory
    - product.services.land_history
    - product.services.transition_status_service
    prints: >-
      parcels/parcel-application-<name>.pdf §F (rows per year, typed and derived from seasons); §B
      (computed transition status)
  note: >-
    Since 2026-11-11 each land-history row carries the columns C2 2.4 prints: the crop or land use
    (pasture and other added), an optional month range so a history can start the month after the last
    prohibited application, and the seed / planting stock information: type (seed, seedling, planting
    stock), GMO or non-GMO, treated or untreated with the treatment's name. Once any of the three is
    stated, all three print, a blank one as 'not stated', so a type with no GMO answer never reads as
    non-GMO. Materials and dates print per year as before. The first planned organic harvest that
    anchors the 36 months is asked on page B (2.1 8)) and optional, like every parcel question. A
    currently certified parcel follows OTCO's own route (certificate and no-lapse statement), and a
    certificate copy ships under parcels/certificates/.
- ref: '2.5'
  asks: AFFIRMATION STATEMENTS — provide signed affirmations for the land history in 2.4. Every distinct party
    that has had management of the parcel during the past 36 months is required to sign; a separate narrative
    affirmation may be submitted. In order for the land to qualify for organic status, every day for the past
    36 months must be accounted for in this section.
  status: partial
  severity: P2
  trazo:
    questions:
    - parcel_application.affidavit_card
    - parcel_application.date_began_managing
    - parcel_application.dlpm_none_within_tenure
    models:
    - certifications.models.LandownerAffidavit (management_period_start/end, signed_document)
    - product.Parcel.date_began_managing
    prints: parcels/parcel-application-<name>.pdf §F — the manager table with the current manager first, the
      36-month accounting naming any uncovered dates, and each prior manager's signed affidavit in the ZIP
      under parcels/affidavits/
  gap: 'Closed 2026-09-09 for every PRIOR party: name, period, last prohibited date and signed document, plus
    `coverage()` stating whether the periods and `date_began_managing` account for every day of the window.
    Remaining: OTCO requires the CURRENT manager to sign as well; the operator''s `dlpm_none_within_tenure`
    declaration prints, but is not a signed affirmation. (2.5-7) Same as CCOF Affidavit C / WSDA AGR 2262 Signature:
    a prior manager''s name, signed date and scanned signature are captured, but the stored `attestation_text`
    is MOFGA''s wording ("no prohibited materials … since the date provided above") rather than OTCO''s "complete
    and accurate to the best of my knowledge", and there is no signature block for the CURRENT manager on the
    parcel page at all. OTCO accepts a separate narrative affirmation, so the wording is not disqualifying
    by itself.'
  fix: Allow a `signer_role = operator` affidavit (the CCOF G (affidavit) fix) so the current manager's affirmation
    is signed and shipped like the others. Store an `attestation_template = 'otco'` variant carrying C2's wording
    when the certifier is OTCO, and print a current-manager attestation line with the operation name and plan
    date.
- ref: 2.5 (retroactive recognition, Mexico LPO)
  asks: 'Retroactive Recognition of Conversion for operations requesting Mexico LPO Organic Certification:
    by checking this box you request retroactive recognition for this parcel per LOOAA Article 214. AGREE.'
  status: not_covered
  severity: P3
  trazo:
    prints: —
  gap: Applies only to an operation requesting Mexico LPO certification. Trazo covers the NOP scope and asks
    nothing that says whether LPO is requested, so it cannot show this does not apply.
  fix: Ask which additional standards the operation requests (O1 C-2) and make this conditional on LPO.
- ref: 2.5 (electronic signatures)
  asks: 'Electronic signatures: Oregon Tilth permits electronic signatures; by checking the box you consent
    to their use in the conduct of your business with Oregon Tilth. AGREE.'
  status: out_of_scope
  scope_basis: agent_administration
  trazo:
    prints: —
  reason: A consent between the operator and OTCO about how OTCO's own paperwork may be signed, not a fact
    about the organic system — no NOP citation attaches to it, the same reasoning as WSDA 2264 ref 3 (the late-site
    fee). The operator signs OTCO's C2 directly; Trazo's parcel page is evidence attached to it, not the signed
    instrument.
- ref: 2.5 (release by current OTCO client)
  asks: 'For current OTCO clients (previous landowner/manager): by signing you acknowledge release of this
    parcel from your OTCO organic certification once the new landowner/manager''s certification has been established;
    a later return to organic management may use a Land Transfer Form if the land is active on an OTCO certificate
    and inspected in the last year, otherwise a new C2 and a full inspection.'
  status: out_of_scope
  scope_basis: not_an_operation_obligation
  trazo:
    prints: —
  reason: A statement made by the OTHER certified operation about ITS OWN certificate, addressed to OTCO —
    the releasing party is not the Trazo user, and the fact ("this parcel leaves my certificate") belongs to
    that operation's plan. It is the same transfer OTCO's Land Transfer Form handles, which is recorded in
    otco/scope.yaml rather than generated.
