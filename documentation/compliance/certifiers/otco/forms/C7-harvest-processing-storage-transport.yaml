    with no cross-reference from G6_2.pdf.
  fix: Add the missing distinct options; a cross-reference line on G6.2 ("facility pest management is detailed
    in G9.0") — the CCOF B3 fix.
- ref: 7.8-3
  asks: Which of the following methods do you use to control pests in organic production and storage areas?
