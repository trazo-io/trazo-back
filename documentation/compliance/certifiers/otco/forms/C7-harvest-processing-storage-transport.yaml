# OTCO C7 — Crop Harvest, Processing, Storage, & Transport.
#
# Source: https://tilth.org/help-center/blank-forms-all/ (blank forms index), docx
# https://tilth.org/wp-content/uploads/2015/01/C7CropHarvestStorageTransport.docx, footer stamp
# "rev. 2025/08/27", read 2026-09-09 from the extracted text. Registered as a DELTA against the
# CCOF (G6.1, G6.2, G6.4) and WSDA (§J, §K, §L, §M) registers: where C7 asks an obligation those
# forms already judged, the verdict is reused; fresh analysis only where OTCO asks something the
# other two do not (facility layout as a required attachment; packaging material class, non-GMO
# compostable packaging, food-grade proof; the OC / IS / OWN documentation column; the
# retained-ownership clause on off-site processing; the "how do you check the processor's
# certificate" method).
#
# Ref scheme (re-cut 2026-09-30, OSP alignment audit T26). Refs are what the form prints: the
# subsection number and question number (`7.5-1`), a lettered sub-item (`7.5-1a`). The earlier
# version of this file numbered items by order of appearance, gave table columns rows of their own
# and folded subsection "Not applicable" lines into the first question; all three are gone. An
# unnumbered item carries the nearest printed parent plus a description in parentheses. Rows match
# `../inventory/<this file>`, derived from the docx; gaps of merged rows are carried by the row that
# absorbed them, marked with the old ref.
#
# ⚠️ C7 asks NOTHING about who harvests, harvest containers, who transports or transport-unit
# cleaning — despite its title. OTCO puts shared and custom-hired equipment (harvest, in-field
# washing, transport) on C9 Contamination Prevention §9.1 and harvest / clean-transport records on
# C12 Crop Recordkeeping; those forms are registered separately. The g6_1 questions C7 does not
# reach are in otco/unmapped/g6_1_harvest_transport.yaml with that routing, never as "OTCO does
# not ask".
form:
  code: C7
  title: Crop Harvest, Processing, Storage, & Transport
  document_id: C7
  revision: rev. 2025/08/27
  url: https://tilth.org/help-center/blank-forms-all/
  pdf: https://tilth.org/wp-content/uploads/2015/01/C7CropHarvestStorageTransport.docx
  retrieved: 2026-09-09
  nop_cites:
  - § 205.272
  - § 205.271
  guide_trigger: >-
    C1 Crop Activities Checklist — "I/We conduct one or more of the following activities
    post-harvest: handle/process (e.g., wash/clean, cut, sort, mix, dry, blend, chill, freeze,
    package), transport, and/or store crops" → C7. The form's own header: fill out 7.1–7.9 for any
    on-farm facilities, 7.10 for any offsite facilities you contract with to process or store crops
    you still own.
  required_of_every_grower: false
  trazo_module:
  - g6_1_harvest_transport
  - g6_2_storage
  - g6_4_handling
  - g9_0_facility_pest
  register_status: complete
  source_sha256: a8bc4d74d97cc1cb238ed4d2746c52c17440d66b598256b776959cfe39c3d70e
items:
- ref: 7.1 (facility information)
  asks: ON FARM FACILITY INFORMATION (the site location is shown on the farm map). Facility Name; Site Address,
    City, State/Province, Zip/Postal Code, Country.
  status: covered
  trazo:
    triggered_by:
    - g6_4_handling.handling_activities
    - g6_2_storage.storage_locations
    questions:
    - g6_4_handling.on_farm_facility_table
    - g6_2_storage.on_farm_storage_table
    models:
    - certifications.PostHarvestFacility.operated_by
    - certifications.PostHarvestFacility.name
    - certifications.PostHarvestFacility.address
    - certifications.PostHarvestFacility.postal_code
    - certifications.PostHarvestFacility.country
    prints: modules/G6_4.pdf §B and modules/G6_2.pdf §A (each own facility with its full address); the plan's
      commingling narrative names them under "On-farm handling and storage facilities"
  # Closed 2026-11-07. The operation's own facilities are facility records operated by this operation, with
  # name, street, city, state, postal code and country, and no certificate of their own.
- ref: 7.1-1
  asks: Describe the activities that take place at this facility — Handling/Processing (washing, sorting, mixing,
    drying, blending, packaging) / Storage / Other.
  status: partial
  severity: P2
  trazo:
    questions:
    - g6_4_handling.handling_activities
    - g6_2_storage.storage_locations
    prints: modules/G6_4.pdf §A (handling_activities); modules/G6_2.pdf §A (storage_locations — on_farm_cold
      / on_farm_dry / bins_silos)
  gap: 'Both halves are captured and print, but for the OPERATION, not per facility: `handling_activities`
    lists what is done anywhere on the farm and `storage_locations` lists storage types anywhere on the farm.
    With no facility name (7.1-1) there is nothing to attribute either answer to, so an operation with a wash
    shed and a separate cold room prints one merged list.'
  fix: Once a facility name exists (7.1-1 fix), key both answers to it — or state on the module PDF that the
    activities and storage types are listed for the whole operation.
- ref: 7.1-2
  asks: List the organic crops that are handled or stored at this facility, or attach a separate list (Attached).
  status: partial
  severity: P2
  trazo:
    questions:
    - g6_4_handling.products_handled
    prints: modules/G6_4.pdf §B (products_handled)
  gap: The HANDLED half reuses CCOF G6.4 A2 — `products_handled` is one flat text field, functionally answered,
    with no attach-a-list alternative for a high-SKU operation. The STORED half has no field at all — G6.2
    records storage TYPES with no crops-stored breakdown (the gap CCOF G6.2 B1 records for the storage table).
    Neither is per facility.
  fix: Structured storage rows {name, address or "same as establishment", type, crops} on G6.2 (the CCOF B1
    fix); an optional list upload beside products_handled.
- ref: 7.2-1
  asks: Attach a facility layout, either hand drawn or digital, that shows the areas used for organic processing
    and storage. Attached.
  status: covered
  trazo:
    questions:
    - g6_4_handling.on_farm_facility_table
    - g6_2_storage.on_farm_storage_table
    - g6_4_handling.facility_docs
    models:
    - certifications.PostHarvestFacility.layout_document
    prints: facilities/<id>-<name>-layout in the packet ZIP, named beside its facility on modules/G6_4.pdf §B and
      modules/G6_2.pdf §A; a facility without one prints "no layout attached"
  # Closed 2026-11-07. A layout per own facility, as OTCO asks it, rather than one optional file for the module.
- ref: 7.2-2
  asks: Attach a flow chart or describe how crops are harvested, received, processed, packaged, and stored.
    Include all equipment, machinery, and storage areas. Attached / Describe.
  status: partial
  severity: P2
  trazo:
    questions:
    - g6_4_handling.process_flow
    - g6_4_handling.handling_site
    - g6_4_handling.facility_docs
    prints: modules/G6_4.pdf §C (process_flow); §B (handling_site — buildings, pads, equipment); facility_docs
      under attachments/g6_4_handling/facility_docs/ when uploaded
  gap: 'Reuses CCOF G6.4 A3. The written-description half is covered: `process_flow` asks for the steps in
    order from harvest to shipment and `handling_site` names the buildings, pads and equipment, both printed.
    The flow-chart half (`facility_docs`) is an optional upload on a later page (it rides in the packet when
    uploaded, since 2026-10-01), and nothing frames the two as OTCO''s either/or.'
  fix: Relabel to make the either/or explicit.
- ref: 7.3-1
  asks: What processing activities are performed? Not applicable or use contract processor (skip to section
    7.4) / Washing / Sorting / Freezing / Cutting / Cooking / Mixing / Packaging / Fermenting / Drying/dehydrating
    / Seed Cleaning / Other.
  status: covered
  trazo:
    questions:
    - g6_4_handling.handling_activities
    - g6_4_handling.handling_activities_other
    - g6_1_harvest_transport.handled_by_another_operation
    prints: "modules/G6_4.pdf §A (every OTCO processing step is an option, named as ticked); modules/G6_1.pdf §D (handled_by_another_operation answers the contract-processor skip)"
  note: "Closed 2026-11-10 (content 2026.11.29)."
- ref: 7.3-2
  asks: Do any processed products contain ingredients that come from off the farm (except salt)? No / Yes —
    if yes, you may need an organic handling certification; OTCO will contact you to discuss this.
  status: covered
  trazo:
    questions:
    - g6_4_handling.simple_handling_disqualifiers
    prints: "modules/G6_4.pdf §A (off-farm ingredients ticked prints a [REVIEW] that the agent decides the certification scope; \"none of these\" is the No)"
  note: "Closed 2026-11-10 (content 2026.11.29)."
- ref: 7.3-3
  asks: Do you also process non-organic products at this facility? No / Yes — if yes, you may need an organic
