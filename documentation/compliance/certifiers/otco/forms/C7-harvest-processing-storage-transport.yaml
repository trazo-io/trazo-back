  gap: Reuses WSDA §M Applicability. The module's own N/A attestation implements this skip, and its wording
    matches OTCO's clause, but no discrete question prints an explicit answer to this line — a reviewer sees
    an attested-absent module rather than a ticked box.
  fix: Low priority — cosmetic; see WSDA §K 2 / §M Applicability.
- ref: 7.8-1
  asks: What types of pests do you currently have or are included in your pest control plan? N/A – No pests
    in facilities / Flying insects / Crawling insects / Rats / Mice / Spiders / Birds / Other (please specify).
  status: not_covered
  severity: P2
  trazo:
    triggered_by:
    - g6_2_storage.storage_locations
    - g6_4_handling.handling_activities
    prints: —
  gap: Reuses WSDA §M 2. No question names the target pests — G9.0 goes from the pest-control-company gate
    straight to prevention, mechanical controls and materials. OTCO's list is finer than WSDA's (rats and mice
    separately, spiders).
  fix: Add `facility_pest_problems` [checkbox_group] {none, flying_insects, crawling_insects, rats, mice, spiders,
    birds, other} to G9.0 page A ahead of the strategy questions.
- ref: 7.8-2
  asks: Which of the following management practices do you use to prevent pests? Remove pest habitat, food
    sources, and breeding areas / Prevent pest access to handling facilities / Vents, doors, and/or windows
    are sealed or screened / Inspect all incoming ingredients for pests / The facility uses positive air pressure
    / Sheet metal installed on the exterior sides of the building / Inspection zones are maintained along the
    interior perimeter / Lighting fixtures are located away from vents, windows, or doors / Control environmental
    factors like temperature, light, humidity, air flow, and atmosphere to prevent pest reproduction / Other
    (specify).
  status: partial
  severity: P2
  trazo:
    questions:
    - g9_0_facility_pest.preventive_practices
    - g9_0_facility_pest.preventive_practices_other
    prints: modules/G9_0.pdf §B (preventive_practices, other)
  gap: Reuses WSDA §M 4 (prevention half) and CCOF G6.2 B3. Habitat removal, access prevention and sealed/screened
    openings (Trazo's `exclusion`) and environmental control map to options; incoming-ingredient inspection,
