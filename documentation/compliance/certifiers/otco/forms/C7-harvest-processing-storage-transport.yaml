  severity: P2
  trazo:
    questions:
    - g9_0_facility_pest.mechanical_controls
    - g9_0_facility_pest.material_tier
    - g6_2_storage.storage_pest_control_materials_used
    prints: modules/G9_0.pdf §B (mechanical_controls); §C (material_tier); modules/G6_2.pdf §B (storage_pest_control_materials_used
      — the storage-area yes/no)
