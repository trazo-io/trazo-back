  status: covered
  trazo:
    questions:
    - g6_4_handling.simple_handling_disqualifiers
    prints: "modules/G6_4.pdf §A (non-organic product handled here ticked prints a [REVIEW]; \"none of these\" is the No)"
  note: "Closed 2026-11-10 (content 2026.11.29)."
- ref: 7.3-4
  asks: Do you use any substances to help process your products (processing aids)? No / Yes — list these products
