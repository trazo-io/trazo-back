# OTCO C7 — Crop Harvest, Processing, Storage, & Transport.
#
# Source: https://tilth.org/help-center/blank-forms-all/ (blank forms index), docx
# https://tilth.org/wp-content/uploads/2015/01/C7CropHarvestStorageTransport.docx, footer stamp
# "rev. 2025/08/27", read 2026-09-09 from the extracted text. Registered as a DELTA against the
# CCOF (G6.1, G6.2, G6.4) and WSDA (§J, §K, §L, §M) registers: where C7 asks an obligation those
# forms already judged, the verdict is reused; fresh analysis only where OTCO asks something the
# other two do not (facility layout as a required attachment; packaging material class, non-GMO
# compostable packaging, food-grade proof; the OC / IS / OWN documentation column; the
# retained-ownership clause on off-site processing; the "how do you check the processor's
# certificate" method).
#
# Ref scheme (re-cut 2026-09-30, OSP alignment audit T26). Refs are what the form prints: the
# subsection number and question number (`7.5-1`), a lettered sub-item (`7.5-1a`). The earlier
# version of this file numbered items by order of appearance, gave table columns rows of their own
# and folded subsection "Not applicable" lines into the first question; all three are gone. An
# unnumbered item carries the nearest printed parent plus a description in parentheses. Rows match
# `../inventory/<this file>`, derived from the docx; gaps of merged rows are carried by the row that
# absorbed them, marked with the old ref.
#
# ⚠️ C7 asks NOTHING about who harvests, harvest containers, who transports or transport-unit
# cleaning — despite its title. OTCO puts shared and custom-hired equipment (harvest, in-field
# washing, transport) on C9 Contamination Prevention §9.1 and harvest / clean-transport records on
# C12 Crop Recordkeeping; those forms are registered separately. The g6_1 questions C7 does not
# reach are in otco/unmapped/g6_1_harvest_transport.yaml with that routing, never as "OTCO does
# not ask".
form:
  code: C7
  title: Crop Harvest, Processing, Storage, & Transport
  document_id: C7
  revision: rev. 2025/08/27
  url: https://tilth.org/help-center/blank-forms-all/
  pdf: https://tilth.org/wp-content/uploads/2015/01/C7CropHarvestStorageTransport.docx
  retrieved: 2026-09-09
  nop_cites:
  - § 205.272
  - § 205.271
  guide_trigger: >-
    C1 Crop Activities Checklist — "I/We conduct one or more of the following activities
    post-harvest: handle/process (e.g., wash/clean, cut, sort, mix, dry, blend, chill, freeze,
    package), transport, and/or store crops" → C7. The form's own header: fill out 7.1–7.9 for any
    on-farm facilities, 7.10 for any offsite facilities you contract with to process or store crops
    you still own.
  required_of_every_grower: false
  trazo_module:
  - g6_1_harvest_transport
  - g6_2_storage
  - g6_4_handling
  - g9_0_facility_pest
  register_status: complete
  source_sha256: a8bc4d74d97cc1cb238ed4d2746c52c17440d66b598256b776959cfe39c3d70e
items:
- ref: 7.1 (facility information)
  asks: ON FARM FACILITY INFORMATION (the site location is shown on the farm map). Facility Name; Site Address,
    City, State/Province, Zip/Postal Code, Country.
  status: not_covered
  severity: P1
  trazo:
    triggered_by:
    - g6_4_handling.handling_activities
    - g6_2_storage.storage_locations
    models:
    - 'nearest existing field: g6_4_handling.handling_site (describes buildings, pads and equipment in prose
      — no name or address)'
    - certifications.PostHarvestFacility.name / address hold a name and address for OFF-farm facilities only
    prints: —
  gap: No field anywhere names an on-farm handling or storage facility or gives its address. Same verdict as
    CCOF G6.4 A1 (Site Name & Location) — `handling_site` describes the buildings and equipment used, not a
    formal name and address, and `PostHarvestFacility` models the facilities the crop is sent TO, never the
    operation's own shed or cooler. OTCO asks it of every on-farm facility on the first line of the form.
  fix: Add `handling_site_name_address` [text] to G6.4 page B (the CCOF A1 fix), visible when handling_activities
    is truthy and not no_onfarm_handling, and print it as the heading of the G6.4 §B block.
- ref: 7.1-1
  asks: Describe the activities that take place at this facility — Handling/Processing (washing, sorting, mixing,
    drying, blending, packaging) / Storage / Other.
  status: partial
  severity: P2
  trazo:
    questions:
    - g6_4_handling.handling_activities
    - g6_2_storage.storage_locations
    prints: modules/G6_4.pdf §A (handling_activities); modules/G6_2.pdf §A (storage_locations — on_farm_cold
      / on_farm_dry / bins_silos)
  gap: 'Both halves are captured and print, but for the OPERATION, not per facility: `handling_activities`
    lists what is done anywhere on the farm and `storage_locations` lists storage types anywhere on the farm.
    With no facility name (7.1-1) there is nothing to attribute either answer to, so an operation with a wash
    shed and a separate cold room prints one merged list.'
  fix: Once a facility name exists (7.1-1 fix), key both answers to it — or state on the module PDF that the
    activities and storage types are listed for the whole operation.
- ref: 7.1-2
  asks: List the organic crops that are handled or stored at this facility, or attach a separate list (Attached).
  status: partial
  severity: P2
  trazo:
    questions:
    - g6_4_handling.products_handled
    prints: modules/G6_4.pdf §B (products_handled)
  gap: The HANDLED half reuses CCOF G6.4 A2 — `products_handled` is one flat text field, functionally answered,
    with no attach-a-list alternative for a high-SKU operation. The STORED half has no field at all — G6.2
    records storage TYPES with no crops-stored breakdown (the gap CCOF G6.2 B1 records for the storage table).
    Neither is per facility.
  fix: Structured storage rows {name, address or "same as establishment", type, crops} on G6.2 (the CCOF B1
    fix); an optional list upload beside products_handled.
- ref: 7.2-1
  asks: Attach a facility layout, either hand drawn or digital, that shows the areas used for organic processing
    and storage. Attached.
  status: partial
  severity: P1
  trazo:
    questions:
    - g6_4_handling.facility_docs
    prints: attachments/g6_4_handling/facility_docs/ (files uploaded for facility_docs, since 2026-10-01), named
      on modules/G6_4.pdf
  gap: '`facility_docs` accepts a site map, but it is optional, lives on the last page of G6.4. Since
    2026-10-01 a file uploaded for it rides in the packet and is named on the G6.4 page. OTCO makes the facility layout a required attachment for
    every on-farm facility, so a packet without it draws a request for information the moment the form applies.
    CCOF G6.4 A3 folds this into the flow-chart ask at P2; OTCO asks for the layout on its own line, hence
    P1.'
  fix: In `generate_osp_packet`, pull DMS uploads tagged to facility_docs into `facilities/` and name the file
    in the G6.4 §D block — the same attachment loop proposed for labels and handler certificates.
- ref: 7.2-2
  asks: Attach a flow chart or describe how crops are harvested, received, processed, packaged, and stored.
    Include all equipment, machinery, and storage areas. Attached / Describe.
  status: partial
  severity: P2
  trazo:
    questions:
    - g6_4_handling.process_flow
    - g6_4_handling.handling_site
    - g6_4_handling.facility_docs
    prints: modules/G6_4.pdf §C (process_flow); §B (handling_site — buildings, pads, equipment); facility_docs
      under attachments/g6_4_handling/facility_docs/ when uploaded
  gap: 'Reuses CCOF G6.4 A3. The written-description half is covered: `process_flow` asks for the steps in
    order from harvest to shipment and `handling_site` names the buildings, pads and equipment, both printed.
    The flow-chart half (`facility_docs`) is an optional upload on a later page (it rides in the packet when
    uploaded, since 2026-10-01), and nothing frames the two as OTCO''s either/or.'
  fix: Relabel to make the either/or explicit.
- ref: 7.3-1
  asks: What processing activities are performed? Not applicable or use contract processor (skip to section
    7.4) / Washing / Sorting / Freezing / Cutting / Cooking / Mixing / Packaging / Fermenting / Drying/dehydrating
    / Seed Cleaning / Other.
  status: partial
  severity: P2
  trazo:
    questions:
    - g6_4_handling.handling_activities
    - g6_4_handling.handling_activities_other
    - g6_1_harvest_transport.handled_by_another_operation
    prints: modules/G6_4.pdf §A (handling_activities, other); modules/G6_1.pdf §D (handled_by_another_operation
      answers the 'use contract processor' option)
  gap: Washing, sorting, packaging and drying map to Trazo options and the module's own N/A plus `handled_by_another_operation`
    cover OTCO's skip option. Five of OTCO's activities — cutting, cooking, mixing, fermenting, seed cleaning
    — and freezing have no option and land only in `other`. Those are exactly the activities C1 routes toward
    handling certification ("Contact OTCO to determine whether Handling Certification scope is required"),
    so the packet cannot show the routing decision the checklist exists to make — the same shape CCOF G6.4's
    applicability row records.
  fix: Add the missing activities as options (or a `complex_processing` group carrying them) so a complex-handling
    answer prints as the scope signal it is, alongside the `simple_handling_disqualifiers` group CCOF's applicability
    row proposes.
- ref: 7.3-2
  asks: Do any processed products contain ingredients that come from off the farm (except salt)? No / Yes —
    if yes, you may need an organic handling certification; OTCO will contact you to discuss this.
  status: not_covered
  severity: P2
  trazo:
    triggered_by:
    - g6_4_handling.handling_activities
    prints: —
  gap: No question anywhere asks whether a product made on the farm contains off-farm ingredients. CCOF's G6.4
    applicability gate names multi-ingredient products as a disqualifier and its register row records the same
    absence. For a raw-crop grower the answer is "No", but the packet cannot state it, and a "Yes" is a certification-scope
    fact OTCO acts on.
  fix: A `simple_handling_disqualifiers` checkbox_group on G6.4 page A {off_farm_ingredients, nonorganic_processing,
    complex_handling, none} — one field answers CCOF's gate and OTCO's 7.3-2 / 7.3-3.
- ref: 7.3-3
  asks: Do you also process non-organic products at this facility? No / Yes — if yes, you may need an organic
    handling certification.
  status: partial
  severity: P2
  trazo:
    questions:
    - g6_0_production.split_operation
    prints: modules/G6_0.pdf §A (split_operation) — operation-wide, not printed on G6.4
  gap: Reuses WSDA §L 3. `split_operation` states whether the operation produces or handles any conventional
    crop at all, asked once on G6.0 — not whether non-organic product goes through THIS facility. `own_products_only`
    on G6.4 asks a different thing (another grower's organic crop, not conventional product).
  fix: A handling-step `handles_noncertified_crops_here` [boolean] on G6.4 page B, defaulting from split_operation
    (the WSDA L3 fix), printed in the G6.4 §B block.
- ref: 7.3-4
  asks: Do you use any substances to help process your products (processing aids)? No / Yes — list these products
    on the C11 Materials List form and submit a product label or a photo of the container.
  status: partial
  severity: P2
  trazo:
    questions:
    - materials_application.post_harvest_contact_listed
    - materials_application.post_harvest_contact_none_used
    - g6_4_handling.wash_water_additives_added
    prints: modules/materials_application.pdf §A post-harvest contact block and §B (post_harvest_contact_listed);
      workbooks/Materials List.xlsx (the materials themselves); modules/G6_4.pdf §C (wash_water_additives_added)
  gap: Reuses WSDA §L 9. Since 2026-09-12 `wash_water_additives_added` is the yes/no for the commonest processing
    aid — anything added to contact water — with coaching that sends each to the materials list, and the operator's
    post-harvest rows print under their own heading. A processing aid that is not a water additive (an anti-foam,
    a release agent) still has no yes/no of its own, and the product label or container photo OTCO asks for
    has no slot.
  fix: A `processing_aids_used` [boolean] on G6.4 page C covering non-water aids; carry the label/photo through
    the attachment loop.
- ref: 7.4-1
  asks: Is the handling area or equipment used for BOTH organic and non-organic crops? No (skip to section
    7.5) / Yes.
  status: partial
  severity: P2
  trazo:
    questions:
    - g6_4_handling.commingling_controls
    prints: modules/G6_4.pdf §C (commingling_controls — dedicated_equipment / organic_only_facility options)
  gap: Reuses WSDA §L 6. `commingling_controls` is a list of separation approaches; selecting `dedicated_equipment`
    or `organic_only_facility` implicitly answers "no, not shared", but there is no standalone yes/no gate
    matching OTCO's question and no distinct downstream branch for the case where the area or equipment IS
    shared.
  fix: A `shares_handling_area_or_equipment` [boolean] gate on G6.4 page C, pre-filled from whether commingling_controls
    excludes dedicated_equipment and organic_only_facility.
- ref: 7.4-1a
  asks: If yes, how do you make sure that organic crops are not commingled with or contaminated by nonorganic
    crops during processing? Separate equipment is used for organic crops / Cleaning equipment thoroughly between
    uses / Processing organic crops before non-organic crops / Storing organic and non-organic crops in separate
    areas / Other (explain).
  status: partial
  severity: P3
  trazo:
    questions:
    - g6_4_handling.commingling_controls
    - g6_4_handling.commingling_controls_other
    - g6_2_storage.storage_shared_with_nonorganic
    - g6_2_storage.storage_shared_separation
    prints: modules/G6_4.pdf §C (commingling_controls, other); modules/G6_2.pdf §A (storage_shared_with_nonorganic,
      storage_shared_separation) for the separate-storage-areas option
  gap: 'WSDA §L 3a marks the same field covered for a free "describe your procedures". OTCO offers a checklist,
    and two of its options have no Trazo option of their own: "processing organic crops before non-organic"
    (Trazo''s `single_product_runs` is one lot at a time, not sequencing) and "storing organic and non-organic
    in separate areas", which is answered on G6.2 as the shared- storage boolean plus prose rather than here.
    Both can be written into `other`.'
  fix: Add an `organic_first_sequencing` option to commingling_controls and a coaching line pointing to G6.2
    for storage separation.
- ref: 7.5 (not applicable)
  asks: N/A - no water used in contact with crops (skip to section 7.6)
  status: covered
  trazo:
    questions:
    - g6_4_handling.uses_water
    prints: modules/G6_4.pdf §C (uses_water)
- ref: 7.5-1
  asks: Do you use water that comes in direct contact with your organic product (such as wash water)? No /
    Yes.
  status: covered
  trazo:
    questions:
    - g6_4_handling.uses_water
    - g6_4_handling.post_harvest_water_uses
    prints: modules/G6_4.pdf §C (uses_water — asked of every handler; post_harvest_water_uses)
  note: 'Closed 2026-09-12: ungated from handling_activities.'
- ref: 7.5-1a
  asks: If yes, what is the water source? Municipal Source / Well / Other (describe).
  status: covered
  trazo:
    questions:
    - g6_4_handling.water_source_sanitizer
    - g6_4_handling.post_harvest_water_source
    prints: 'modules/G6_4.pdf §C (post_harvest_water_source: municipal / on-site well / other; water_source_sanitizer
      describes it)'
  note: Closed 2026-09-12.
- ref: 7.5-1b
  asks: If the water is not from a municipal source, how do you make sure it is safe to drink (potable)? The
    well provides drinking water for the household / Water is tested regularly for contaminants / Water is
    treated with an approved disinfectant following the Safe Drinking Water Act (list the materials used to
    treat the water) / Other (describe).
  status: not_covered
  severity: P2
  trazo:
    triggered_by:
    - g6_4_handling.uses_water
    models:
    - 'nearest existing field: g6_4_handling.water_source_sanitizer (free prose; nothing prompts potability)'
    prints: —
  gap: Reuses WSDA §L 14 / 14a / 14b and the SDWA half of CCOF G6.1 B3. Nothing asks how non- municipal water
    is shown potable — household use, regular testing, or SDWA-conformant treatment — and no field names the
    treatment materials. The G4.2 water-quality questions are about irrigation water, a different use.
  fix: Add `post_harvest_water_potability` [checkbox_group] {household_drinking_water, tested_regularly, treated_sdwa,
    other} plus a treatment-materials text, visible when the 7.5-2 source is not municipal; cite § 205.605(b).
- ref: 7.5-1c
  asks: If you test the water, have any tests come back positive for contaminants? Yes / No. If yes, explain;
    test results are attached.
  status: not_covered
  severity: P2
  trazo:
    triggered_by:
    - g6_4_handling.uses_water
    prints: —
  gap: No field records a positive water test or attaches results for post-harvest water. `g4_2_natural_resources.water_quality_tested`
    is the irrigation-water fact and is not scoped to handling water. Companion to 7.5-3.
  fix: A `post_harvest_water_positive_test` [boolean] + explanation textarea, visible when tested_regularly
    is selected in the 7.5-3 group; results through the attachment loop.
- ref: 7.5-1d
  asks: If you add chlorine to water that directly contacts organic products, explain how you make sure the
    chlorine level stays at or below the limit allowed by the Safe Drinking Water Act (4 ppm) where the water
    last contacts the product. Not applicable, no chlorine is added / Final rinse uses water only / Final rinse
    uses chlorine at or below 4 ppm / Other (describe).
  status: covered
  trazo:
    questions:
    - g6_4_handling.uses_water
    - g6_4_handling.water_source_sanitizer
    - g6_4_handling.wash_water_additives_added
    - g6_4_handling.wash_water_chlorine_added
    - g6_4_handling.wash_water_chlorine_final_rinse
    - g6_4_handling.wash_water_chlorine_final_rinse_other
    prints: modules/G6_4.pdf §C (wash_water_chlorine_added; wash_water_chlorine_final_rinse — water only /
      chlorine at or below 4 ppm / other with its text)
  note: Closed 2026-09-12 — OTCO's four options are the radio's three plus the gate (no chlorine added = the
    boolean answered No).
- ref: 7.6 (not applicable)
  asks: N/A – No cleaners or sanitizers are used (skip to section 7.7).
  status: covered
  trazo:
    questions:
    - g6_4_handling.uses_equipment_sanitizer_or_cleaner
    prints: modules/G6_4.pdf §C
- ref: 7.6-2
  asks: Describe how you clean and sanitize organic food contact surfaces (like counters, mixers, grinders,
    and storage areas), including any final rinse step. You may attach a Standard Operating Procedure (SOP).
    (The form prints this as 2); there is no 1).)
  status: partial
  severity: P2
  trazo:
    questions:
    - g6_2_storage.storage_cleaned_before_organic
    - g6_2_storage.storage_cleaning_method
    - g6_4_handling.facility_docs
    - g6_4_handling.food_contact_cleaning_methods
    - g6_4_handling.food_contact_cleaning_methods_other
    - g6_4_handling.equipment_sanitizer_where_used
    - g6_4_handling.sanitizer_residual_free_assurance
    prints: modules/G6_4.pdf §C (food_contact_cleaning_methods; equipment_sanitizer_where_used; sanitizer_residual_free_assurance
      — the final-rinse clause); modules/G6_2.pdf §B (storage_cleaned_before_organic, storage_cleaning_method
      — the storage-areas clause); facility_docs (SOP upload) under attachments/g6_4_handling/facility_docs/ when uploaded
  gap: 'Since 2026-09-12 the equipment half has a home asked of every handler: the cleaning-methods group,
    the per-product where-used text and the residual-assurance group (which carries the final-rinse clause).
    The SOP OTCO invites is uploadable as `facility_docs`, and since 2026-10-01 it rides in the packet and is
    named on the G6.4 page; nothing asks which SOP sections it covers.'
  fix: Ask which SOP sections the uploaded file covers.
- ref: 7.6-3
  asks: Do you use sanitizers or cleansers on equipment? No / Yes, materials have been added to the C11.
  status: covered
  trazo:
    questions:
    - g6_4_handling.uses_equipment_sanitizer_or_cleaner
    - g6_4_handling.equipment_sanitizer_types
    - g6_4_handling.equipment_sanitizer_types_rinsed
    - g6_4_handling.equipment_sanitizer_where_used
    - materials_application.post_harvest_contact_listed
    prints: modules/G6_4.pdf §C (uses_equipment_sanitizer_or_cleaner; equipment_sanitizer_types; equipment_sanitizer_where_used);
      modules/materials_application.pdf §B (post_harvest_contact_listed — the 'added to the C11' half)
  note: Closed 2026-09-12 — asked independently of water contact; the coaching sends every named product to
    the materials list.
- ref: 7.6-3a
  asks: If yes, explain how you make sure that contact surfaces are free of residue. Let chlorine materials
    and/or sanitizers fully evaporate / Thorough rinse (explain how you rinse surfaces to remove all cleaning
    materials) / Residue testing — explain the methods you use to check for leftover residues (such as swab
    tests, test strips, or visual checks) / Other (explain).
  status: covered
  trazo:
    questions:
    - g6_4_handling.water_source_sanitizer
    - g6_4_handling.sanitizer_residual_free_assurance
    - g6_4_handling.sanitizer_residual_free_assurance_other
    - g6_4_handling.sanitizer_residual_testing_protocol
    - g6_4_handling.equipment_sanitizer_types_rinsed
    prints: modules/G6_4.pdf §C (sanitizer_residual_free_assurance — evaporate / thorough rinse / double rinse
      / residue testing / other; sanitizer_residual_testing_protocol — swabs, strips, visual and how results
      are kept; equipment_sanitizer_types_rinsed)
  note: Closed 2026-09-12.
- ref: 7.7-1
  asks: Do you store crops? No, not applicable or I no longer own the product after harvest or delivery (skip
    to section 7.8) / Yes, I still own crops while they are in storage.
  status: partial
  severity: P2
  trazo:
    questions:
    - g6_2_storage.storage_locations
    prints: modules/G6_2.pdf §A (storage_locations — any selection is 'yes, we store'); module N/A flag ('product
      is never stored') is the printed 'no'
  gap: 'The store / do-not-store half reuses WSDA §K 2: the module''s N/A attestation and the location list
    between them state it. The OWNERSHIP clause has no question — nothing asks whether the operation still
    owns the crop while it sits in storage, and `storage_locations`'' off-farm options read the same whether
    the crop is the operation''s or was sold at the dock. OTCO uses that clause to decide whether §7.7 applies
    at all, and the same fact gates 7.10 (retained ownership during off-site processing) and CCOF G6.2 A(1).'
  fix: An `owns_crop_in_storage` [boolean] on G6.2 page A, visible when an off-farm option is selected, printed
    with the facility table; reuse it for the 7.10-1 ownership branch.
- ref: 7.7-2
  asks: 'Complete the table below to list the storage facilities you use: Storage Facility Name and Location
    / Products/Crops Stored / Type of Storage / Documentation (OC, IS, OWN).'
  status: partial
  severity: P1
  trazo:
    questions:
    - g6_2_storage.storage_locations
    - g6_2_storage.uncertified_facility_records
    - g6_2_storage.off_farm_storage_table
    - g6_2_storage.storage_other_description
    - g6_2_storage.third_party_storage_contracted
    models:
    - certifications.PostHarvestFacility.cert_document
    - certifications.PostHarvestFacility.cert_is_current
    - certifications.PostHarvestFacility.certifier_name
    prints: modules/G6_2.pdf §A — the post_harvest_facilities embed prints each off-farm facility's certificate
      number, certifier and a current / expired / not-stated line; the certificate file is not in the ZIP;
      nothing prints for the IS sheet
  gap: 'Reuses CCOF G6.2 A (partial P1). OC: the certificate is CHECKED and its currency printed as the record
    supports it, but the document itself is uploadable and not written into the packet. IS: OTCO''s sheet is
    signed by the WAREHOUSE manager and attests sealed tamper-evident packaging, no repacking or relabeling,
    and inventory records — Trazo holds only the grower''s free-text account of the facility''s records (`uncertified_facility_records`)
    and has no representation of an IS sheet on file, its date, or that it was re-signed on change (the OTCO
    analogue of the CCOF Exempt Handler Affidavit gap). OWN: on-farm options imply it but no documentation
    class is stated per facility. (7.7-2a) Reuses CCOF G6.2 B1 for on-farm storage and G6.2 A for off-farm.
    Off-farm facilities print by name and address from `PostHarvestFacility`; on-farm locations are TYPE checkboxes
    with no name or location — the pilot prints "On-farm cold storage; On-farm dry storage" and nothing a reviewer
    could put in OTCO''s first column. There is no single table joining the two. (7.7-2b) No field lists which
    crops are stored where. G6.2 records storage types, `PostHarvestFacility` has no products column, and `products_handled`
    on G6.4 is the handling list. The per-lot storage location on harvest events could feed this but nothing
