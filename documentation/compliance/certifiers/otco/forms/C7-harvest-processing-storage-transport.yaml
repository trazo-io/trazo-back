      are kept; equipment_sanitizer_types_rinsed)
  note: Closed 2026-09-12.
- ref: 7.7-1
  asks: Do you store crops? No, not applicable or I no longer own the product after harvest or delivery (skip
    to section 7.8) / Yes, I still own crops while they are in storage.
  status: partial
  severity: P2
  trazo:
    questions:
    - g6_2_storage.storage_locations
    prints: modules/G6_2.pdf §A (storage_locations — any selection is 'yes, we store'); module N/A flag ('product
      is never stored') is the printed 'no'
  gap: 'The store / do-not-store half reuses WSDA §K 2: the module''s N/A attestation and the location list
    between them state it. The OWNERSHIP clause has no question — nothing asks whether the operation still
    owns the crop while it sits in storage, and `storage_locations`'' off-farm options read the same whether
    the crop is the operation''s or was sold at the dock. OTCO uses that clause to decide whether §7.7 applies
    at all, and the same fact gates 7.10 (retained ownership during off-site processing) and CCOF G6.2 A(1).'
  fix: An `owns_crop_in_storage` [boolean] on G6.2 page A, visible when an off-farm option is selected, printed
    with the facility table; reuse it for the 7.10-1 ownership branch.
- ref: 7.7-2
  asks: 'Complete the table below to list the storage facilities you use: Storage Facility Name and Location / Products/Crops
