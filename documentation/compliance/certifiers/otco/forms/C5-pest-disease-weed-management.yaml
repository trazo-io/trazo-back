# Oregon Tilth Certified Organic (OTCO) — C5 Crop Pest, Weed & Disease Management.
#
# Source: https://tilth.org/help-center/blank-forms-all/ → C5CropPestDiseaseManagement.docx
#   (https://tilth.org/wp-content/uploads/2015/01/C5CropPestDiseaseManagement.docx). Footer stamp
#   `rev. 2023/09/14`. Text read from the official 2025 docx, retrieved 2026-09-09.
#
# Ref scheme (re-cut 2026-09-30, OSP alignment audit T26). Refs are what the form prints: the
# subsection number and question number (`5.1-2`), a lettered sub-item (`5.2-1`). The earlier
# version of this file numbered items by order of appearance, gave table columns rows of their own
# and folded subsection "Not applicable" lines into the first question; all three are gone. An
# unnumbered item carries the nearest printed parent plus a description in parentheses. Rows match
# `../inventory/<this file>`, derived from the docx; gaps of merged rows are carried by the row that
# absorbed them, marked with the old ref.
#
# Registered as a DELTA against ccof/forms/G5.0-pest-management.yaml and wsda/forms/2121-F-weed,
#   2121-G-pest and 2121-H-disease: every obligation those registers already judged is restated
#   here with the SAME questions, status, severity and root_cause. Fresh analysis only where OTCO's
#   packaging changes the answer — its § 5.1 practice list is ONE flat checklist for weeds, pests
#   and diseases together, the same shape as Trazo's, so CCOF's pest-type-matrix gap and WSDA's
#   three-section duplication gap do not arise here — and where OTCO asks something neither
#   sibling asks (5.1-1, a named list of the pests and diseases that threaten the crops).
#
# OTCO asks about monitoring ONCE (5.3-1, the method) and never asks frequency or how results are
#   recorded, so `monitoring_frequency` and `monitoring_records` are in otco/unmapped/g5_0_pest.yaml
#   with that reason — a statement about OTCO's form, not about the fields, which exist and print
#   (the fourth trap in ../README.md).
form:
  code: C5
  title: Crop Pest, Weed & Disease Management
  document_id: C5
  revision: rev. 2023/09/14
  url: https://tilth.org/help-center/blank-forms-all/
  pdf: https://tilth.org/wp-content/uploads/2015/01/C5CropPestDiseaseManagement.docx
  retrieved: 2026-09-09
  nop_cites:
  - § 205.206
  guide_trigger: >-
    C1 Crop Activities Checklist — "I/We grow crops" → C2 Land History, C4 Fertility Management,
    C5 Pest, Weed, & Disease Management, C6 Natural Resources & Biodiversity, C9 Contamination
    Prevention, C12 Crop Recordkeeping. The form's own instruction: "Complete this form for all
    acreage to be included under certification."
  required_of_every_grower: true
  trazo_module: g5_0_pest
  register_status: complete
  source_sha256: 30bfc7bf913579203cb983ad794a0b5059f53105206cd41d4a279cbcd296b107

items:
- ref: "5.1-1"
  asks: >-
    List the pests/diseases (or potential pests/diseases) that threaten your crops.
  status: partial
  severity: P2
  trazo:
    where: not in this packet; the operation's audit export, a separate document, lists the species observed on each scouting and control record
    models:
    - history.PestManagementEvent.pest_species
    prints: >-
      audit dossier (per-event "Species observed" column on scouting, monitoring and control
      records); no G5.0 question and nothing on modules/G5_0.pdf
  gap: >-
    Neither CCOF's G5.0 nor WSDA's §F/§G/§H asks for a named list of the pests and diseases the
    operation actually faces (WSDA G3 asks for taxa classes — insects, rodents, birds — and is
    `not_covered` there on that axis), so this is a fresh OTCO ask. The fact is captured, but only
    per logged event: `PestManagementEvent.pest_species` names the organism observed on each
    scouting or control record and prints in the audit dossier. There is no plan-level statement,
    so an operation whose records are thin — a first-year pilot, or a season with no pest events
    yet — shows nothing, and even a well-logged one gives the reviewer a column of observations to
    deduplicate rather than the list OTCO asks for.
  fix: >-
    Add `pests_diseases_of_concern` [textarea] on page A, ahead of `prevention_practices`, cite
    § 205.206; suggest the distinct `pest_species` values from logged Pest-Management events as a
    prefill the operator confirms (suggest→confirm — the plan is the producer's statement under
    § 205.201(a), not a reading of the log); compile "Pests and diseases of concern: {answer}."
- ref: 5.1-2
  asks: 'Select all preventative practices you use for management of weeds, pests and diseases: Crop rotation
    / Release of beneficial insects / Nutrient management / Sanitation / Planting resistant varieties / Water
    management / Hand weeding / Timing of planting / Mechanical/physical methods / Inter-planting species /
    Cover cropping / Trap crops / Construct predator habitat / Flaming/burning / Other.'
  status: covered
  trazo:
    questions: [g5_0_pest.practices_weeds, g5_0_pest.practices_weeds_other, g5_0_pest.practices_insects, g5_0_pest.practices_insects_other, g5_0_pest.practices_diseases, g5_0_pest.practices_diseases_other, g5_0_pest.practices_vertebrates, g5_0_pest.practices_vertebrates_other, g5_0_pest.prevention_practices, g5_0_pest.prevention_practices_other, g5_0_pest.weed_management_practices, g5_0_pest.weed_management_other, g5_0_pest.burns_crop_residue]
    prints: "modules/G5_0.pdf §A, §B; narrative § 205.206(a), § 205.206(c)"
  # Closed 2026-11-02 by the monitoring slice.

- ref: "5.1-3"
  asks: >-
    Do you use materials for controlling weeds, pests, and/or diseases? (No / Yes, complete
    questions 4 and 5 below.)
  status: covered
  trazo:
    questions:
    - g5_0_pest.applies_pest_weed_disease_inputs
    prints: modules/G5_0.pdf §C; narrative § 205.206(e)

- ref: "5.1-4"
  asks: >-
    Describe the conditions that must exist before you will resort to using substances for weed,
    pest, and/or disease control: Preventative measures described above are insufficient / Economic
    thresholds for pest damage are exceeded / Other.
  status: covered
  trazo:
    questions: [g5_0_pest.input_use_conditions, g5_0_pest.input_use_triggers]
    prints: "modules/G5_0.pdf §C; narrative § 205.206(e)"
  # Closed 2026-11-02 by the monitoring slice.

- ref: "5.1-5"
  asks: >-
    Do you use plastic mulch, landscape fabric, or other physical weed barriers? (No / Yes, include
    manufacturer and brand name on the C11 or provide a product label.)
  status: partial
  severity: P2
  trazo:
    questions:
    - g5_0_pest.plastic_mulch_used
    prints: modules/G5_0.pdf §B; narrative § 205.206(c)(6)
  gap: >-
    The use is captured and prints (`plastic_mulch_used`, "plastic or other synthetic mulch" — a
    reading that takes in landscape fabric). What OTCO attaches to a Yes is a hand-off: the product's
    manufacturer and brand go on C11, or a label is supplied. Trazo never makes that hand-off — a
    Yes here does not prompt a materials-list row, the Materials Application's category
    attestations have no mulch/barrier category, and the operator-entered row that could hold it
    (`PlanMaterialEntry`, category `production_aid` or `other`) has no label attachment (see C11
    11.1 (labels or photos attached)). OTCO does not ask the season-end removal question here (§ 205.206(c)(6)), so
    `plastic_mulch_removal` is not cited; WSDA F4/F5 and CCOF §A carry that half.
  fix: >-
    When `plastic_mulch_used` is true, prompt the operator to add the barrier product (brand +
    manufacturer) to the materials list and link the entry; give `PlanMaterialEntry` a label
    upload that ships in the packet (the C11 "11.1 (labels or photos attached)" fix).

- ref: "5.1-6"
  asks: >-
    I have listed all substances on my OSP Materials List section C11. (Yes.)
  status: covered
  trazo:
    questions:
    - materials_application.materials_list_complete
    - materials_application.pest_disease_weed_listed
    prints: modules/materials_application.pdf §A and §B; narrative § 205.201(a)(2)
    where: 'modules/materials_application.pdf: Section A (every input material) and Section B'
  # Covered 2026-11-04. "All substances" is the every-material statement, so it is cited beside the
  # pest row. Either "Yes" is refused while the records name a product the list does not hold, by
  # exact name or a current identity decision (attestation_gates, reconciliation); the prefill
  # suggests "Yes" only under the same condition; and a stored "Yes" from before the gate prints with
  # the unmatched products named beside it.
- ref: 5.2-1
  asks: 'Do you burn crop residue? No / Yes: identify type(s) of crop residue and how often burning is conducted.'
  status: covered
  trazo:
    questions: [g5_0_pest.burns_crop_residue, g5_0_pest.burn_crops, g5_0_pest.burn_frequency]
    prints: "modules/G5_0.pdf §A; narrative § 205.203(e)(3)"
  # Closed 2026-11-02 by the monitoring slice.

- ref: "5.2-2"
  asks: >-
    Which diseases are to be suppressed and/or which seeds require burning to stimulate
    germination?
  status: partial
  severity: P2
  trazo:
    questions:
    - g5_0_pest.burn_reason
    - g5_0_pest.burn_reason_other
    prints: modules/G5_0.pdf §A; narrative § 205.203(e)(3)
  gap: >-
    Same verdict as CCOF G5.0 C3: `burn_reason` records only the category (disease suppression /
    seed germination / other); the specific disease or seed is never named unless the operator
    happened to pick 'other' and use `burn_reason_other`.
  fix: >-
    Add `burn_target_detail` [text] ("Name the disease suppressed or the seed germinated"), visible
    when `burn_reason` includes_any (disease_suppression, seed_germination); cite § 205.203(e)(3).

- ref: "5.3-1"
  asks: >-
    How do you monitor the effectiveness of your pest, disease, and weed management plan? Crop
    health observations / Crop yield comparison / Pest and disease scouting / Pest traps/lures /
    Other.
  status: covered
  trazo:
    questions: [g5_0_pest.monitoring_scope, g5_0_pest.monitoring_methods, g5_0_pest.monitoring_methods_other]
    prints: "modules/G5_0.pdf §D; narrative § 205.206(a)"
  # Closed 2026-11-02 by the monitoring slice.
