# OTCO O1 — Operation Information.
# Source: https://tilth.org/help-center/blank-forms-all/ (docx
# https://tilth.org/wp-content/uploads/2015/05/O1OperationInformation.docx), footer stamp
# "rev. 2026/03/25", retrieved 2026-09-30. Its rows are checked one to one against
# `../inventory/O1-operation-information.yaml`, derived from that file (sha256 below).
#
# 2026-09-30 (OSP alignment audit, T27): first transcribed from rev. 2025/08/27, the copy in OTCO's
# 2025 crop ZIP. The same URL now serves rev. 2026/03/25, which widens section D to "you, the
# responsibly connected, or this operation", adds D-2A, D-2B and D-3A, and drops the membership
# benefits from H-1. Section D was also re-lettered to the form's own A-E, and D-2 to D-6 split.
#
# Registered as a DELTA against the CCOF Certification Contract (ORGB06), which is the same
# document in CCOF's packaging: legal identity, addresses, contacts, adverse certification
# history, California registration, fees, and a signed agreement. Where O1 asks what the Contract
# asks, the Contract's verdict is reused row for row (named in each row). Fresh analysis: C-1
# (OTCO's scope list maps DIRECTLY onto `contract_scopes`), C-2 (standards and equivalencies
# requested), C-5/C-6 (regulatory agencies and adverse non-organic reports), and B-6 (the
# responsibly-connected list, reused from A4's owners/officers gap).
#
# Rows about OTCO's own intake (anticipated date, expedited service, fees, membership, e-signature
# consent) are `out_of_scope` with `scope_basis: agent_administration`; card and payment details
# are `payment_data`. Certification history is NOT out of scope: it is a requirement Trazo does
# not collect, so those rows are `not_covered`.
#
# ref scheme: the form's own numbering, section-letter prefixed (`A-1`, `D-1A`, `F-2a`). Where the
# form prints no number the ref is the nearest printed parent plus a description in parentheses:
# `Intro (anticipated date)`, `B-1 (mailing)`, `D-1 (certificate attachment)`, `F (payment note)`,
# `I-B (signature)`. Repeated contact blocks (name/title/phone/email) are one row each.
form:
  code: O1
  title: Operation Information
  document_id: O1
  revision: rev. 2026/10/02
  url: https://tilth.org/help-center/blank-forms-all/
  pdf: https://tilth.org/wp-content/uploads/2015/05/O1OperationInformation.docx
  retrieved: 2026-10-24
  nop_cites:
  - § 205.401
  - § 205.201
  guide_trigger: >-
    C1 Crop Activities Checklist — "I/We are applying for Oregon Tilth organic certification for
    crop production" routes to "O1: Operation Information (required)" and "OFPP: Organic Fraud
    Prevention Plan".
  required_of_every_grower: true
  filed_with_agent: true
  requires_signature: true
  accepted_format: agent_form
  format_source: >-
    O1 section I-B, "with my signature affixed below" (row I-B2); C1 Crop Activities Checklist routes
    every crop applicant to "O1: Operation Information (required)".
  trazo_module: certification_contract
  register_status: complete
  source_sha256: 2e8aa7b75032d2f395d4adfb110dc81b78fa50bb2c3be17dd52d0301117034df
items:
- ref: Intro (anticipated date)
  asks: When do you anticipate the need for certification?
  status: out_of_scope
  scope_basis: agent_administration
  reason: Reused from the CCOF Contract D3 — a one-time initial-application timing question. Trazo's ICP is
    an already-certified operation doing an annual renewal, not a first-time applicant.
- ref: Intro (expedited services)
  asks: I request Oregon Tilth's Expedited Services and I understand that if approved, I will be assessed an
    additional expedited services fee.
  status: out_of_scope
  scope_basis: agent_administration
  reason: A new applicant's election of an OTCO service tier and its fee — nothing about the operation's organic
    system, and never filled by a renewing operation.
- ref: A-1
  asks: Is the Operation Name listed above a legally registered business? Yes / No.
  status: covered
  trazo:
    questions:
    - certification_contract.legally_registered
    - certification_contract.legal_structure
    - certification_contract.legal_structure_other
    - certification_contract.state_of_incorporation
    prints: >-
      modules/operation_profile.pdf §D
  note: >-
    Closed 2026-11-13 with the CCOF Contract A4 structure.
- ref: A-2
  asks: >-
    The Operation Name listed above produces or handles: Both organic and nonorganic product(s) /
    Organic product(s) only.
  status: covered
  trazo:
    questions:
    - g6_0_production.split_operation
    - g6_0_production.nonorganic_product_source
    - g6_0_production.nonorganic_product_source_other
    prints: >-
      00-cover.pdf: "Organic and non-organic product", Both / Organic only, with where the non-organic
      product comes from
  # Closed 2026-11-06 with the CCOF Contract D1. § 205.2 makes a farm selling buffer crop as non-organic a
  # split operation, so "Both" is its answer; the source beside it says the buffer crop is all there is.
- ref: A-3
  asks: >-
    Provide a list of the registered DBA(s) (doing business as) associated with your operation. The
    DBA will appear on the organic certificate; each certified operation must have its own
    certificate, and the DBA(s) must be a legal part of the same operation listed under Operation
    Name.
  status: covered
  trazo:
    questions:
    - certification_contract.contract_notes
    - certification_contract.uses_dba
    - certification_contract.dba_names
    - certification_contract.dba_registration
    - certification_contract.dba_use
    - certification_contract.dba_use_detail
    models:
    - company.Company.tradename
    prints: >-
      00-cover.pdf "Trade name (DBA)"; modules/operation_profile.pdf §D (every DBA, where each is
      registered and used)
  note: >-
    Closed 2026-11-13 with the CCOF Contract A1 and A3.
- ref: A-4
  asks: >-
    Oregon Tilth primarily communicates and sends notifications via email to the primary contact.
    If you prefer not to receive correspondence via email, indicate that here and tell us your
    preferred method: email is fine / do NOT send communications via email — use my preferred
    method: phone / mail.
  status: out_of_scope
  scope_basis: agent_administration
  reason: >-
    Reused from the CCOF Contract A9 — sets how OTCO itself contacts the operation, an OTCO account
    setting rather than a fact about the operation's organic system that a packet or a reviewer
    needs.
- ref: B-1 (mailing)
  asks: 'Operation Mailing Address — where all certification communications will be sent: address, city, state,
    zip, country.'
  status: covered
  trazo:
    questions:
    - certification_contract.mailing_address_is
    - certification_contract.mailing_address_street
    - certification_contract.mailing_address_city
    - certification_contract.mailing_address_state
    - certification_contract.mailing_address_zip
    - certification_contract.mailing_address_country
    prints: >-
      modules/operation_profile.pdf §D
  note: >-
    Closed 2026-11-13 with the CCOF Contract A6. OTCO's mailing address has no "same as" box; Trazo's
    "same as the legal or physical address" names the address it means, printed above it.
- ref: B-1 (billing)
  asks: 'Operation Billing Address (or "same as mailing address"): address, city, state, zip, country, Billing
    Contact Name, Billing Email Address.'
  status: covered
  trazo:
    questions:
    - certification_contract.billing_address_is
    - certification_contract.billing_address_street
    - certification_contract.billing_address_city
    - certification_contract.billing_address_state
    - certification_contract.billing_address_zip
    - certification_contract.billing_address_country
    - certification_contract.operation_contacts
    models:
    - certifications.models.OperationContact
    prints: >-
      modules/operation_profile.pdf §D (address); §A (the billing contact's name and email)
  note: >-
    Closed 2026-11-13 with the CCOF Contract A7. The billing contact name and email are the person
    marked billing contact on page A.
- ref: B-1 (inspected location)
  asks: 'Operation Primary Location to be inspected (or "same as mailing address"): address, city, state, zip,
    country. If multiple locations will be inspected, complete the applicable C2 or H2 form for each location.'
  status: covered
  trazo:
    where: '00-cover.pdf: Address'
    models:
    - company.Establishment.address
    - company.Establishment.city
    - company.Establishment.state
    - company.Establishment.zip_code
    prints: 00-cover.pdf ("Address" — the establishment's physical location)
- ref: B-2
  asks: >-
    Legally Responsible Contact (CEO, COO, Executive Director, Managing Director, or Registered
    Agent): name, title, phone, email(s).
  status: covered
  trazo:
    questions:
    - certification_contract.operation_contacts
    models:
    - certifications.models.OperationContact.is_legally_responsible
    prints: >-
      modules/operation_profile.pdf §A (the people table)
  note: >-
    Since 2026-11-12 the Operation module's page A lists the people the operation names to its agent
    (`OperationContact`), each with name, title, phone and email and the roles they hold; the table
    prints in §A, a blank cell as 'Not stated'. The legally responsible contact is the row so marked
    (one per farm); none named prints a [REVIEW] line.
- ref: B-3
  asks: >-
    Primary Contact — designate one person to be Oregon Tilth's primary contact: an authorized
    representative with a working knowledge of the operation, the OSP and the standards. Name,
    title, phone, email(s).
  status: covered
  trazo:
    questions:
    - certification_contract.operation_contacts
    models:
    - certifications.models.OperationContact.is_primary_contact
    prints: >-
      modules/operation_profile.pdf §A (the people table)
  note: >-
    Since 2026-11-12 the Operation module's page A lists the people the operation names to its agent
    (`OperationContact`), each with name, title, phone and email and the roles they hold; the table
    prints in §A, a blank cell as 'Not stated'. The primary contact is the row so marked (one per farm),
    with title and email; none named prints a [REVIEW] line.
- ref: B-4
  asks: >-
    Billing Contact — the contact person/department to contact if there are payment questions or
    issues: name/title, phone, email.
  status: covered
  trazo:
    questions:
    - certification_contract.operation_contacts
    models:
    - certifications.models.OperationContact.is_billing_contact
    prints: >-
      modules/operation_profile.pdf §A (the people table)
  note: >-
    Since 2026-11-12 the Operation module's page A lists the people the operation names to its agent
    (`OperationContact`), each with name, title, phone and email and the roles they hold; the table
    prints in §A, a blank cell as 'Not stated'. The billing contact is the row marked so. The billing
    ADDRESS is B-1 (billing).
- ref: B-5
  asks: >-
    Additional Contacts — list all people at your operation who are authorized to participate in
    inspections, meet with inspectors, modify the OSP, or otherwise act on behalf of the company:
    name/title, phone, email (attach a page if necessary). Oregon Tilth will not conduct business
    with any individual whose name does not appear on this list.
  status: covered
  trazo:
    questions:
    - certification_contract.operation_contacts
    models:
    - certifications.models.OperationContact.is_authorized_representative
    prints: >-
      modules/operation_profile.pdf §A (the people table)
  note: >-
    Since 2026-11-12 the Operation module's page A lists the people the operation names to its agent
    (`OperationContact`), each with name, title, phone and email and the roles they hold; the table
    prints in §A, a blank cell as 'Not stated'. Everyone authorized to take part in inspections, meet
    inspectors, modify the OSP or act for the operation is marked so and listed; the list is what OTCO
    will do business with.
- ref: B-6
  asks: 'Responsibly Connected — the NOP defines "responsibly connected" as any person who is a partner, officer,
    director, holder, manager, or owner of 10 percent or more of the voting stock of an applicant or a recipient
    of certification. List all people responsibly connected to your operation: name/title, phone, email, connection
    (attach a page if necessary).'
  status: covered
  trazo:
    questions:
    - certification_contract.operation_contacts
    models:
    - certifications.models.OperationContact.is_responsibly_connected
    - certifications.models.OperationContact.connection
    prints: >-
      modules/operation_profile.pdf §A (the people table)
  note: >-
    Since 2026-11-12 the Operation module's page A lists the people the operation names to its agent
    (`OperationContact`), each with name, title, phone and email and the roles they hold; the table
    prints in §A, a blank cell as 'Not stated'. Each responsibly connected person (7 CFR 205.2) is
    marked so, with the connection (partner, officer, director, holder, manager, owner of 10 percent or
    more, or other described); none named prints a [REVIEW] line. Section D's history questions are
    asked of the operation and these people.
- ref: B-7
  asks: >-
    Public Contact Information — OTCO is required to share public contact information; list which
    can be shared publicly: public phone, public email, public website.
  status: covered
  trazo:
    questions:
    - certification_contract.public_contact_shared
    - certification_contract.public_phone
    - certification_contract.public_email
    - certification_contract.public_website
    prints: >-
      modules/operation_profile.pdf §D
  note: >-
    Closed 2026-11-13 with the CCOF Contract A1.
- ref: C-1
  asks: >-
    Indicate all scopes of certification you are applying for (described in the OTCO Certification
    Manual): Crop · Livestock · Handling/Processing/Distribution · Wild-crop · Transitional ·
    Restaurant · Retail · Fungi.
  status: covered
  trazo:
    where: >-
      modules/operation_profile.pdf: A. Contract on file, certification scopes
    questions:
    - certification_contract.contract_scopes
    prints: >-
      modules/operation_profile.pdf §A ("Certification scopes: ...")
  note: >-
    Closed 2026-11-13: Transitional and Fungi added to the scopes, so every scope a farm can hold is an
    option. Restaurant and Retail are OTCO application classes for businesses Trazo does not serve (the
    form routes retail to its own application).
- ref: C-2
  asks: >-
    Check all certification standards for which you are requesting an assessment: USDA NOP
    (Organic) · US-Canada Equivalency · European Union (EU) (requires the EU Supplement) · Mexico
    Ley de Productos Orgánicos (LPO) (requires the MX Supplement) · Salmon Safe · NSF/ANSI 305
    Personal Care · Oregon Tilth Certified Transitional (Class T) · Organic Plus Trust
    (OPT) Grass-Fed Standards.
  status: covered
  trazo:
    where: >-
      modules/operation_profile.pdf: E. Standards and regulatory agencies
    questions:
    - certification_contract.standards_requested
    - certification_contract.standards_requested_other
    prints: >-
      modules/operation_profile.pdf §E
  note: >-
    Closed 2026-11-13 by the Operation profile's page E. Every standard O1 lists is an option; Oregon Tilth
    Certified Transitional (Class T) is the certified transitional option. Bee Better and GOTS, which the OSP
    Update Form also lists, are options too, so one answer serves both forms. The asks text no longer lists
    Bee Better: the O1 file re-downloaded on 2026-11-13 (its hash matches source_sha256 above, rev. 2026/10/02)
    does not print it, so the earlier transcription's Bee Better was dropped.
- ref: C-3
  asks: >-
    Have you reviewed the applicable standards and any other applicable international standards or
    equivalency arrangements (NOP, EU, LPO, US-Canada Equivalency, etc.)? Yes / No.
  status: out_of_scope
  scope_basis: agent_administration
  reason: >-
    An applicant's acknowledgment to OTCO of having read the standards — part of OTCO's own intake
    agreement, not a fact about the operation's organic system. The signed agreement that carries
    such acknowledgments is the contract upload judged at I-A.
- ref: C-4
  asks: Have you reviewed the OTCO Certification Manual and Fee Schedule? Yes / No.
  status: out_of_scope
  scope_basis: agent_administration
  reason: >-
    Same as C-3 — an acknowledgment of having read OTCO's own manual and fee schedule.
- ref: C-5
  asks: Which, if any, regulatory agencies inspect your operations?
  status: covered
  trazo:
    where: >-
      modules/operation_profile.pdf: E. Standards and regulatory agencies
    questions:
    - certification_contract.regulatory_agencies
    prints: >-
      modules/operation_profile.pdf §E
  note: >-
    Closed 2026-11-13 by the Operation profile's page E, in the operation's own words; "None" is an
    answer.
- ref: C-6
  asks: >-
    Have you ever had a negative scoring report from any regulatory agency including, but not
    limited to, FDA, OSHA, or a state's Department of Health or Agriculture? No / Yes — reports are
    attached along with the operation's corresponding written responses/corrective actions.
  status: covered
  trazo:
    where: >-
      modules/operation_profile.pdf: E. Standards and regulatory agencies; the reports under
      attachments/certification_contract/
    questions:
    - certification_contract.regulatory_negative_report
    - certification_contract.regulatory_reports_upload
    prints: >-
      modules/operation_profile.pdf §E; attachments/certification_contract/regulatory_reports_upload/
  note: >-
    Closed 2026-11-13 by the Operation profile's page E. A yes opens the upload for the reports with the
    operation's written responses, as the form's yes says; a yes with nothing attached keeps the row
    open.
- ref: D-1
  asks: 'CERTIFICATION HISTORY. NOTE: "You" here means the person completing the application, the legally responsible
    contact, the primary contact and anyone responsibly connected to the operation (rev. 2026/03/25). Have
    you, the responsibly connected, or this operation ever been certified organic? No, skip to question 5 /
    Yes, complete questions (A)-(E) below.'
  status: covered
  trazo:
    where: 'modules/operation_profile.pdf: B. Certification history, ever certified; 00-cover.pdf: Certificate (the certificate of record)'
    questions:
    - certification_contract.history_ever_certified
    models:
    - certifications.Certification
    - certifications.OrganicSystemPlan.approval_certificate_number
    - certifications.OrganicSystemPlan.approval_certifier_name
    prints: 'modules/operation_profile.pdf §B; 00-cover.pdf ("Certificate: <number> — <certifying agent>", the certificate of record)'
  note: Closed 2026-11-09 by the Operation profile's certification history page. One answer covers "you, the
    responsibly connected, or this operation", as the form asks it. The transfer case (A) and (B) stays open on
    its own rows, D-1A and D-1B.
- ref: D-1A
  asks: Are you currently certified organic by another certification agency? Yes / No.
  status: covered
  trazo:
    where: >-
      modules/operation_profile.pdf: B. Certification history, certified today by another agency
    questions:
    - certification_contract.history_ever_certified
    - certification_contract.history_certified_elsewhere_now
    models:
    - certifications.OrganicSystemPlan.approval_certifier_name
    prints: >-
      modules/operation_profile.pdf §B; 00-cover.pdf (the certifying agent of record)
  note: >-
    Closed 2026-11-13. Asked as "another agency, not the one you file this plan with", which is O1's
    "another certification agency" whichever agency the plan goes to.
- ref: D-1B
  asks: If the answer to (A) is yes, will you be maintaining your other organic certification(s)? Yes / No.
  status: covered
  trazo:
    where: >-
      modules/operation_profile.pdf: B. Certification history, keeping the other certification
    questions:
    - certification_contract.history_ever_certified
    - certification_contract.history_certified_elsewhere_now
    - certification_contract.history_keeping_other_certification
    prints: >-
      modules/operation_profile.pdf §B
  note: >-
    Closed 2026-11-13. Shown only on a yes to D-1A, as the form asks it.
- ref: D-1 (certificate attachment)
  asks: If you are currently certified, attach a copy of your most recent organic certificate(s) — Attached.
  status: covered
  trazo:
    questions:
    - certification_contract.history_ever_certified
    - certification_contract.history_certified_by_this_agency
    - certification_contract.history_this_agency_certificate_upload
    - certification_contract.history_certified_elsewhere_now
    - certification_contract.history_current_certificate_upload
    prints: attachments/certification_contract/history_this_agency_certificate_upload/ and attachments/certification_contract/history_current_certificate_upload/
      in the packet ZIP; modules/operation_profile.pdf §B
  note: Closed 2026-11-15. A currently certified operation holds the certificate of the agency it files with, of
    another agency, or both. `history_certified_by_this_agency` asks the first, with its most recent certificate
    attached on the yes (`history_this_agency_certificate_upload`); D-1A's `history_certified_elsewhere_now` asks
    the second, with its certificate. A yes with no file reads as an attachment missing. The plan's `approval_document`
    is the approval letter the activation gate asks for, not necessarily the certificate, so it is not offered as
    the answer.
- ref: D-1C
  asks: By which agency(ies) were/are you certified?
  status: covered
  trazo:
    where: '00-cover.pdf: Certificate'
    models:
    - certifications.Certification.certifier_name
    - certifications.OrganicSystemPlan.approval_certifier_name
    prints: '00-cover.pdf ("Certificate: <number> — <agent>") — number and agent come from ONE record via `certificate_of_record`,
      never mixed across sources'
- ref: D-1D
  asks: What were the dates that the organic certification was maintained?
  status: covered
  trazo:
    where: 'modules/operation_profile.pdf: B. Certification history, agencies and the dates each certification was held'
    questions:
    - certification_contract.history_prior_agents
    models:
    - certifications.Certification.effective_date
    - certifications.Certification.expiry_date
    prints: modules/operation_profile.pdf §B
  note: Closed 2026-11-09 by the Operation profile's certification history page (B) and its follow-up page (C, shown on any yes). The operation states each agency's dates in its own words. The certificate of record's
    effective and expiry dates on the `Certification` row still do not print on the cover; the answer here is
    what a reviewer reads.
- ref: D-1E
  asks: Are there any outstanding non-compliances that have been issued by any of the agencies identified above?
    Yes / No.
  status: covered
  trazo:
    where: "modules/operation_profile.pdf: B. Certification history, a notice still unresolved; 02s-renewal-status-and-routing.pdf also counts the current agent's notices with no resolution notice attached"
    questions:
    - certification_contract.history_outstanding_noncompliances
    models:
    - certifications.models.CertifierNotice.kind
    - certifications.models.CertifierNotice.resolution_document
    prints: modules/operation_profile.pdf §B; 02s-renewal-status-and-routing.pdf, the count of notices of noncompliance with no resolution
      notice attached
  note: Closed 2026-11-09 by the Operation profile's certification history page (B) and its follow-up page (C, shown on any yes). The operation answers for every agency D-1 lists; the inspection record (2026-11-08) is named
    in the coaching for the current agent but never fills the answer, since it holds only what the operation
    recorded.
- ref: D-2
  asks: Have you, the responsibly connected, or this operation ever had its certification suspended? No / Yes,
    explain.
  status: covered
  trazo:
    where: 'modules/operation_profile.pdf: B. Certification history, suspended; C. What happened (the explanation)'
    questions:
    - certification_contract.history_suspended
    - certification_contract.history_adverse_explanation
    prints: modules/operation_profile.pdf §B; modules/operation_profile.pdf §C
  note: Closed 2026-11-09 by the Operation profile's certification history page (B) and its follow-up page (C, shown on any yes). One answer covers "you, the responsibly connected, or this operation", as the form asks it;
    a per-person list waits on B-6.
- ref: D-2A
  asks: If Yes, check here to affirm that products have not been sold or represented as organic since date
    of suspension.
  status: covered
  trazo:
    where: 'modules/operation_profile.pdf: C. What happened, the affirmation after a suspension'
    questions:
    - certification_contract.history_not_sold_since_suspension
    prints: modules/operation_profile.pdf §C
  note: Closed 2026-11-09 by the Operation profile's certification history page (B) and its follow-up page (C, shown on any yes). Shown only when the suspension answer is yes.
- ref: D-2B
  asks: If your operation is currently suspended and you request that NOP reinstate your operation's certification,
    check here.
  status: covered
  trazo:
    where: 'modules/operation_profile.pdf: C. What happened, suspended today and the reinstatement request'
    questions:
    - certification_contract.history_currently_suspended
    - certification_contract.history_request_reinstatement
    prints: modules/operation_profile.pdf §C
  note: Closed 2026-11-09 by the Operation profile's certification history page (B) and its follow-up page (C, shown on any yes). The request shows only when the operation says it is suspended today (§ 205.662(f)(1)).
- ref: D-3
  asks: Have you, the responsibly connected, or this operation ever had its certification revoked? No / Yes,
    explain.
  status: covered
  trazo:
    where: 'modules/operation_profile.pdf: B. Certification history, revoked; C. What happened (the explanation)'
    questions:
    - certification_contract.history_revoked
    - certification_contract.history_adverse_explanation
    prints: modules/operation_profile.pdf §B; modules/operation_profile.pdf §C
  note: Closed 2026-11-09 by the Operation profile's certification history page (B) and its follow-up page (C, shown on any yes).
- ref: D-3A
  asks: If Yes, check here to affirm that products have not been sold or represented as organic since date
    of revocation.
  status: covered
  trazo:
    where: 'modules/operation_profile.pdf: C. What happened, the affirmation after a revocation'
    questions:
    - certification_contract.history_not_sold_since_revocation
    prints: modules/operation_profile.pdf §C
  note: Closed 2026-11-09 by the Operation profile's certification history page (B) and its follow-up page (C, shown on any yes). Shown only when the revocation answer is yes.
- ref: D-4
  asks: Have you, the responsibly connected, or this operation ever surrendered certification with outstanding
    points of non-compliance? Yes / No.
  status: covered
  trazo:
    where: 'modules/operation_profile.pdf: B. Certification history, surrendered with findings or conditions unresolved'
    questions:
    - certification_contract.history_surrendered_outstanding
