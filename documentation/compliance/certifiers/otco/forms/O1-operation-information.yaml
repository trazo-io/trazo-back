- ref: F-1
  kind: instruction
  asks: Fees for Handlers, Processors or Farm Processors (a lead-in to a) and b)).
- ref: F-1a
  asks: 'Handlers, processors and farm processors that have had organic sales in the previous year: gross organic
    sales and period, check attached or pay by credit card.'
  status: out_of_scope
  scope_basis: agent_administration
  reason: Reused from the CCOF Contract F1 — sets OTCO's own fee schedule for a handler scope Trazo does not
    serve, on a new applicant's form. Computing a certifier's fee basis is not Trazo's job.
- ref: F-1b
  asks: 'Handlers, processors and farm processors with no previous organic certification: the new-applicant
    fee.'
  status: out_of_scope
  scope_basis: agent_administration
  reason: Reused from the CCOF Contract F1 — sets OTCO's own fee schedule for a handler scope Trazo does not
    serve, on a new applicant's form. Computing a certifier's fee basis is not Trazo's job.
- ref: F-2
  kind: instruction
  asks: Fees for Farm Operations (a lead-in to a), b) and c)).
- ref: F-2a
  asks: >-
    For farm operations: (a) farms with organic sales in the previous 12 months but new to OTCO
    reference the Fee Schedule for Certified Farm/Grower Operations, based on the previous year's
    gross organic sales, plus a $300 new applicant fee (and $150 if livestock is requested) — "The
    gross organic sales for my operation are $ …; period for reported sales amount: from … to …";
    check in the amount of $ attached / paying by credit card.
  status: out_of_scope
  scope_basis: agent_administration
  reason: >-
    Reused from the CCOF Contract F1 — a NEW applicant's fee basis. The same gross-sales figure is
    asked of every renewing operation on the OSP Update Form Step 6, where it is judged on its
    merits (`partial`) because Trazo does hold live sales amounts; on O1 it is a first-time
    applicant's line an ICP farm never fills.
- ref: F-2b
  asks: >-
    (b) Operations with no previous organic certification pay a $325 certification fee and a $300
    new applicant fee (plus $150 for livestock): check for $625 / check for $775 (requesting
    livestock) attached / paying by credit card.
  status: out_of_scope
  scope_basis: agent_administration
  reason: Reused from the CCOF Contract F1 — a new applicant's flat fee; nothing about the organic system.
- ref: F-2c
  asks: >-
    (c) Veteran-Owned Farm Operation Fee Waiver — veteran-owned farms with documentation of primary
    ownership by a military veteran are exempt from certification base fees: "I confirm I am a
    military veteran and primary owner of this farm. I have attached documentation to support this
    request."
  status: out_of_scope
  scope_basis: agent_administration
  reason: >-
    A fee-waiver eligibility declaration between the owner and OTCO, with its own supporting
    documentation; not a fact about the operation's organic system.
- ref: F (payment note)
  asks: To pay online, visit tilth.org/certification/fees or call the Oregon Tilth office for a credit card
    payment.
  status: out_of_scope
  scope_basis: payment_data
  reason: Reused from the CCOF Contract H — payment mechanics for OTCO's own invoicing. Trazo has no reason
    to hold payment data.
- ref: G
  asks: PRODUCTION PARTNERSHIP (if applicable) — an OTCO-specific fee schedule arrangement in which a primary
    OTCO-certified production partner pays this operation's certification fees; qualifies only if 75% of certified
    organic sales go to the primary operation. Provide the full legal name and mailing address of your production
    partner.
  status: out_of_scope
  scope_basis: agent_administration
  reason: An OTCO fee-schedule billing arrangement between two certified operations. The 75% sales concentration
    could in principle be read from live sales by buyer, but who pays OTCO's invoice is not a fact about the
    operation's organic system.
- ref: H-1
  kind: instruction
  asks: 'Membership: Oregon Tilth, Inc. is a membership-based organization. A certified operator may choose
    to be a member of Oregon Tilth for no additional charge. Membership is not required for certification.'
- ref: H-1a
  asks: Do you wish to become a member of Oregon Tilth, Inc.? Yes / No.
  status: out_of_scope
  scope_basis: agent_administration
  reason: Membership in the certifying agent's parent organization — unrelated to the organic system plan.
- ref: H-2
  asks: >-
    Certification Services — comment on the areas where OTCO is succeeding in providing quality
    services and any points where OTCO could improve (or email organic@tilth.org).
  status: out_of_scope
  scope_basis: agent_administration
  reason: Feedback to OTCO about OTCO's own service; not a fact about the operation.
- ref: I-A
  asks: >-
    AFFIRMATIONS — the undersigned authorized representative affirms: the persons listed in Contact
    Information are authorized to act for the operation in all things related to certification; all
    certification applications are an accurate account and full representation of all materials and
    methods used; copies of all application documents shall be maintained as required; willful
    misrepresentation nullifies the application and revokes dependent certifications, with
    certificates returned on request and damages possible; all records required by Oregon Tilth
    shall be maintained ONSITE and made available for inspection immediately upon request; the OTCO
    Program Manuals have been reviewed and understood; the operation shall report any significant
    changes to the information provided; all crops or products designated organic shall be
    continuously maintained in accordance with all relevant regulations; consent to OTCO
    subcontracting testing or inspection; the signer is a legally authorized agent bound by this
    Agreement and the Terms & Conditions, incorporated by reference; Oregon Tilth shall have access
    to all facilities, personnel, records and materials.
  status: covered
  trazo:
    where: >-
      attachments/certification_contract/contract_upload/ (the signed form);
      modules/operation_profile.pdf: A. Contract on file, who signed it and when
    questions:
    - certification_contract.contract_upload
    - certification_contract.contract_signed_by
    - certification_contract.contract_signed_on
    - g8_0_record_keeping.records_retention_attestation
    - g8_0_record_keeping.records_location
    - g8_0_record_keeping.additional_records_locations
    - g8_0_record_keeping.primary_contact_records_access
    - g8_0_record_keeping.records_access_delegate
    models:
    - certifications.OSPAnnualUpdate
    - certifications.OSPChangeNotification
    prints: >-
      attachments/certification_contract/contract_upload/; modules/operation_profile.pdf §A; 02-annual-
      update.pdf; 03-change-notifications.pdf; modules/G8_0.pdf §A
  note: >-
    Closed 2026-11-13. The affirmations are executed by signing OTCO's own form, which the operation
    attaches; the profile names who signed it and when. The ones that are facts about the operation have
    records behind them: significant changes (OSPChangeNotification, OSPAnnualUpdate, documents 02 and
    03) and records kept and available (G8.0 section A). Which edition of OTCO's manuals was read is
    OTCO's own intake, like C-3 and C-4.
