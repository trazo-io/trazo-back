# OTCO C3 — Seeds, Planting Stock & Transplants.
#
# Source: https://tilth.org/help-center/blank-forms-all/ → C3SeedsPlantingStockTransplants.docx (the
# 2025 Crop OSP ZIP, folder "Main - Crop OSP"). Footer stamp `rev. 2025/08/27`. Read 2026-09-09.
#
# Ref scheme (re-cut 2026-09-30, OSP alignment audit T26). Refs are what the form prints: the
# subsection number and question number (`3.1-5`), a lettered sub-item (`3.1-5a`). The earlier
# version of this file numbered items by order of appearance, gave table columns rows of their own
# and folded subsection "Not applicable" lines into the first question; all three are gone. An
# unnumbered item carries the nearest printed parent plus a description in parentheses. Rows match
# `../inventory/<this file>`, derived from the docx; gaps of merged rows are carried by the row that
# absorbed them, marked with the old ref.
#
# Registered as a DELTA against ccof/forms/G3.0-seeds-planting-stock.yaml and wsda/forms/2121-A/B/C.
# Where OTCO asks an obligation those registers already judged, the verdict is REUSED — same
# `trazo.questions`, `status`, `severity` — restated in OTCO's terms. Fresh analysis only for what
# OTCO asks differently or additionally: 3.1-4 (organic status of vegetative "other planting stock",
# separate from nursery perennials), 3.1-5 (contract-produced planting stock and its documentation),
# 3.2-1/3.2-3 (farm-grown facility location; contracted seed cleaning), 3.3-4 (a BUYER-conducted
# commercial-availability search), 3.5-1 (an inventory of seed-treatment types).
#
# What OTCO's C3 does NOT ask, checked against the form text and the whole 2025 form set: grafting
# (no OTCO crop form mentions it), the § 205.204(a)(4) twelve-month rule for selling stock as organic,
# treatments on non-organic planting stock (3.5 is scoped to SEED), and a supplier-list attestation.
# Those questions are in otco/unmapped/g3_0_seeds.yaml and g3_2_planting_stock.yaml with the reasons.

form:
  code: C3
  title: "Seeds, Planting Stock, & Transplants"
  document_id: C3
  revision: "rev. 2025/08/27"
  url: "https://tilth.org/help-center/blank-forms-all/"
  pdf: "https://tilth.org/wp-content/uploads/2015/01/C3SeedsPlantingStockTransplants.docx"
  retrieved: 2026-09-09
  nop_cites: ["§ 205.204"]
  guide_trigger: "C1 Crop Activities Checklist — 'I/We plant seeds, annual planting stock, or perennial planting stock → C3: Seeds, Planting Stock, & Transplants'. Triggered, not required of every grower; the form's opening instruction extends it to cover-crop and green-manure seed."
  required_of_every_grower: false
  trazo_module: [g3_0_seeds, g3_1_seedlings, g3_2_planting_stock]
  register_status: complete
  source_sha256: 3a528be3b9657045ca565a7f72417dc18255ab907b231a5adb094445f665eca3

items:
  - ref: Preamble (instructions)
    kind: instruction
    asks: C1 routes 'I/We plant seeds, annual planting stock, or perennial planting stock' to C3, to be completed
      'for all seeds, seedlings and planting stock, including those used for cover crops and green manure'. The
      form has no form-level not-applicable line; section 3.1 carries one per topic — 'Not applicable; no seed
      used', 'Not applicable; no annual seedlings/transplants used', 'Not applicable; no perennial stock used',
      'Not applicable; no planting stock used' — and 3.2 opens with 'Not applicable; no seeds produced on-farm'.

  - ref: "3.1-1"
    asks: "Seeds — check which you use for planting: Not applicable, no seed used / Organic seed / Non-organic, untreated seed / Non-organic, treated or inoculated seed (complete part 3.5 Seed Treatments below)."
    status: covered
    trazo:
      questions: [g3_0_seeds.seeds_used]
      prints: "modules/G3_0.pdf §A; narrative § 205.204"
    # Closed 2026-11-17 by the seeds and planting stock slice: a transplant is not seed, so the Seeds suggestion reads
    # seed planting records only, and a record of a tree, vine or berry plant, or one naming a rootstock, now suggests
    # Planting stock instead (osp_prefill.is_planting_stock_record).

  - ref: "3.1-2"
    asks: "Annual Seedlings/Transplants: Not applicable, no annual seedlings/transplants used / Certified organic seedlings (list supplier(s), attach certificate(s))."
    status: covered
    trazo:
      questions: [g3_0_seeds.seedlings_used, g3_1_seedlings.seedlings_description, g3_1_seedlings.seedling_suppliers_panel]
      prints: "modules/G3_0.pdf §A; modules/G3_0a.pdf §A supplier panel (the suppliers, each certificate's state); suppliers/ in the ZIP"
    # Closed 2026-11-05 by the supplier register slice (same evidence as CCOF G3.0 A2).

  - ref: "3.1-3"
    asks: "Perennial Planting Stock: Not applicable, no perennial stock used / Not applicable, established perennials in place (e.g., existing orchard or vineyard) / Organic perennial stock / Non-organic perennial stock."
    status: covered
    trazo:
      questions: [g3_0_seeds.planting_stock_used, g3_2_planting_stock.stock_organic_status]
      prints: "modules/G3_0.pdf §A; modules/G3_0b.pdf §A; a [REVIEW] line on both when the answers disagree"
    # Closed 2026-11-17 by the seeds and planting stock slice: the two answers are read against each other
    # (seed_stock_review). Where G3.0b names a status G3.0 leaves out, or describes stock established this period
    # beside G3.0's None used or Established perennials only, both module PDFs print a [REVIEW] line and the plan
    # review lists it. G3.0's Established perennials only is OTCO's second not-applicable line.

  - ref: "3.1-4"
    asks: "Planting Stock other than seedlings — includes rhizomes, shoots, tubers, cuttings, clones or roots (including strawberry crowns, raspberry canes, potato eyes, etc.): Not applicable, no planting stock used / Organic planting stock other than seedlings / Non-organic planting stock other than seedlings."
    status: covered
    trazo:
      questions: [g3_0_seeds.planting_stock_used, g3_0_seeds.other_planting_stock_used, g3_2_planting_stock.stock_types_established]
      prints: "modules/G3_0.pdf §A, with a [REVIEW] line when it names a status the answer on all planting stock does not"
    # Closed 2026-11-17 by the seeds and planting stock slice: G3.0 asks the status of planting stock other than
    # perennial nursery stock in OTCO's words (other_planting_stock_used), read against planting_stock_used, which
    # covers all planting stock.
  - ref: 3.1-5
    asks: Do you contract with another operation to produce planting stock for you? Yes / No (skip to section
      3.2).
    status: covered
    trazo:
      questions: [g3_2_planting_stock.stock_source]
      prints: "modules/G3_0b.pdf §A"
    # Closed 2026-10-31 by the seed and planting stock slice.
  - ref: 3.1-5a
    asks: If yes, do you collect documentation to verify that the planting stock was produced using allowed inputs
      for organic production? Yes / No.
    status: covered
    trazo:
      questions: [g3_2_planting_stock.contract_stock_input_documentation]
      prints: "modules/G3_0b.pdf §A"
    # Closed 2026-10-31 by the seed and planting stock slice.
  - ref: 3.2 (not applicable)
    asks: Not applicable; no seeds produced on-farm
    status: covered
    trazo:
      questions: [g3_0_seeds.seed_source, g3_0_seeds.seedlings_used, g3_2_planting_stock.stock_source]
      prints: "modules/G3_0.pdf §A; modules/G3_0b.pdf §A"
    # Closed 2026-10-31 by the seed and planting stock slice.
  - ref: 3.2-1
    asks: 'Location of growing facility/facilities (must be Certified Organic):'
    status: covered
    trazo:
      questions: [g3_1_seedlings.seedlings_grown_on_site, g3_1_seedlings.seedling_growing_location, g3_1_seedlings.seedling_facility_certified]
      prints: "modules/G3_0a.pdf"
    # Closed 2026-10-31 by the seed and planting stock slice.

  - ref: "3.2-2"
    asks: "2) Check which of the following you use for planting or sale that are farm grown: Seeds / Annual Seedlings / Perennial Planting Stock / Other Planting Stock (describe)."
    status: covered
    trazo:
      questions: [g3_0_seeds.seed_source, g3_0_seeds.seedlings_used, g3_1_seedlings.seedlings_sold_as_organic, g3_2_planting_stock.stock_source, g3_2_planting_stock.planting_stock_description, g3_2_planting_stock.stock_sold_as_organic]
      prints: "modules/G3_0.pdf §A; modules/G3_0a.pdf; modules/G3_0b.pdf §A, §C"
    # Closed 2026-10-31 by the seed and planting stock slice.

  - ref: "3.2-3"
    asks: "3) Is any post harvest processing contracted for your seeds, seedlings, or transplants (e.g., seed cleaners)? No / Yes, describe."
    status: covered
    trazo:
      questions: [g3_0_seeds.farm_grown_processing_contracted, g3_0_seeds.farm_grown_processing_description]
      prints: "modules/G3_0.pdf §A"
    # Closed 2026-10-31 by the seed and planting stock slice.
  - ref: 3.3 (not applicable)
    asks: Commercial Availability — Not applicable, all planting materials are certified organic. (The section
      applies to all non-organic seed or planting stock.)
    status: covered
    trazo:
      questions:
      - g3_0_seeds.ca_search_before_use
      prints: modules/G3_0.pdf §B; narrative § 205.204(a)(1)
    note: 'Closed 2026-11-08. G3.0 page B opens on non-organic seed OR non-organic planting stock (`ModulePage.visible_when_any`, content 2026.11.25), so an orchard planting non-organic nursery stock with organic or no seed is asked it. Its seed-only questions (characteristics, search method, search records) keep the seed gate. `all_organic` is retired (it contradicted the answer that opened the page; a stored one reads as given and counts unanswered), and `no_documented_search` says plainly that no search is documented, with a [REVIEW] citing § 205.204(a)(1). OTCO''s Not applicable box is the page not opening: a plan with only organic
      seed and stock reads this row as not applicable, with those answers as the evidence.'
  - ref: 3.3-1
    asks: For all non-organic seed or planting stock, what qualities and characteristics do you seek? Germination
      rate / Drought tolerance / Bulk quantity / Disease resistance / Greater crop yield / Season and/or location
      specific traits / Other.
    status: covered
    trazo:
      questions: [g3_0_seeds.seed_required_characteristics, g3_0_seeds.seed_required_characteristics_other, g3_2_planting_stock.nonorganic_stock_justification, g3_2_planting_stock.nonorganic_stock_justification_other]
      prints: "modules/G3_0.pdf §B (seed); modules/G3_0b.pdf §B (planting stock)"
    # Closed 2026-10-31 by the seed and planting stock slice.
  - ref: 3.3-2
    asks: Explain how you determine that organic seed or planting stock is not available for equivalent varieties
      and include how this will be recorded. Additional documents attached.
    status: covered
    trazo:
      questions: [g3_0_seeds.ca_search_method, g3_0_seeds.ca_search_method_other, g3_0_seeds.seed_search_records, g3_2_planting_stock.stock_search_method, g3_2_planting_stock.stock_search_process, g3_2_planting_stock.stock_search_records, g3_2_planting_stock.planting_stock_upload]
      prints: "modules/G3_0.pdf §B (seed); modules/G3_0b.pdf §B, §D (planting stock)"
    # Closed 2026-10-31 by the seed and planting stock slice.
  - ref: 3.3-3
    asks: Do you grow crops on contract such that seed or planting stock is supplied by someone else? Yes / No.
      If yes, you must maintain documentation that demonstrates your buyer has conducted a commercial availability
      search. What documents do you maintain? Seed search log / Invoices / Letters from seed suppliers / Organic
      certificates / Other.
    status: covered
    trazo:
      questions: [g3_0_seeds.seed_source, g3_0_seeds.buyer_search_documents]
      prints: "modules/G3_0.pdf §A"
    # Closed 2026-10-31 by the seed and planting stock slice.
  - ref: 3.4 (not applicable)
    asks: Not applicable; all planting materials are organic or unavailable in genetically modified form
    status: covered
    trazo:
      questions: [g3_0_seeds.gmo_documentation, g3_2_planting_stock.stock_gmo_documentation]
      prints: "modules/G3_0.pdf §C (seed); modules/G3_0b.pdf §B (planting stock)"
    # Closed 2026-10-31 by the seed and planting stock slice.
  - ref: 3.4-1
    asks: Which methods do you use to document that non-organic seeds and planting stock are not genetically
      modified? Non-GMO statement from the supplier / Catalog statement / Other.
    status: covered
    trazo:
      questions: [g3_0_seeds.gmo_documentation, g3_2_planting_stock.stock_gmo_documentation]
      prints: "modules/G3_0.pdf §C (seed); modules/G3_0b.pdf §B (planting stock)"
    # Closed 2026-10-31 by the seed and planting stock slice.
  - ref: 3.5 (not applicable)
    asks: Not applicable; no treatment (supporting documentation required, e.g., manufacturer receipt or statement)
    status: covered
    trazo:
      questions: [g3_0_seeds.seeds_used, g3_0_seeds.untreated_seed_documentation]
      prints: "modules/G3_0.pdf §A"
    # Closed 2026-10-31 by the seed and planting stock slice.
  - ref: 3.5-1
    asks: 'Identify all seed treatments in use and/or intended for use: Pelletization / Coating / Inoculant /
      Fungicide / Insecticide / Disinfectant / Other.'
    status: covered
    trazo:
      questions: [g3_0_seeds.seed_treatment_types]
      prints: "modules/G3_0.pdf §D"
    # Closed 2026-10-31 by the seed and planting stock slice.

  - ref: "3.5-2"
    asks: "All seed treatments must also be identified in Organic System Plan C11 Materials List. C11 attached."
    status: covered
    trazo:
      questions: [g3_0_seeds.treatments_on_inputs_list]
      prints: "modules/G3_0.pdf §D, with a [REVIEW] line for a No or for unlisted treatments the records name; workbooks/Materials List.xlsx"
    # Closed 2026-11-17 by the seeds and planting stock slice: a Yes is refused at the write while a seed planting
    # record names a treatment the materials list does not hold, and a stored one prints those names; a No prints a
    # [REVIEW] line and is listed on the plan review. Seed treatments are on the Materials List as production aids
    # (CCOF Materials Application section C).
