# Oregon Tilth Certified Organic (OTCO) — C11 Crop Materials List.
#
# Source: https://tilth.org/help-center/blank-forms-all/ → C11CropMaterialsList.docx
#   (https://tilth.org/wp-content/uploads/2015/01/C11CropMaterialsList.docx). Footer stamp
#   `rev. 2023/09/14`. Text read from the official 2025 docx, retrieved 2026-09-09.
#
# Ref scheme: C11 has no section numbers — it is an instruction block, four header checkboxes and
#   one table. Header lines are `Hdr-1` … `Hdr-5` in the order printed; the table's four columns are
#   `Col-1` … `Col-4` (Full Product Name incl. formulation · Full Manufacturer Name · Third Party
#   Review Agency OMRI/WSDA/OTHER · Intended Use). The OMRI/WSDA/OTHER checkbox trio is the
#   Col-3 cell, so it is judged there rather than as a separate row.
#
# Registered as a DELTA against ccof/forms/Materials-Application.yaml (NOPB41) and
#   wsda/forms/2196-input-material-list.yaml (AGR 2196): every obligation those registers already
#   judged is restated here with the SAME questions, status, severity and root_cause. Two of those
#   verdicts were re-read against the CURRENT renderer before reuse and are stale on one point each
#   (noted in Col-2 and Hdr-4 — the register is the burn-down, and a stale gap is a gap that will
#   never be flipped). Fresh analysis for what OTCO alone asks: the per-row review-agency column
#   with its "OTHER" position (Col-3), the label-or-photo requirement for anything not OMRI or WSDA
#   listed (Hdr-5), and the "add to my current Materials List" mode that makes C11 the year-round
#   add-a-material form (Hdr-4).
#
# Language rule kept throughout: Trazo RESOLVES a product name against OMRI, the WSDA Brand Name
#   list and the National List, and states what it found. It never verifies or approves a material,
#   and a logged product the registries do not resolve is UNMATCHED, never "unapproved".
#
# The two `fumigant_prohibited_material_*` questions are in otco/unmapped/materials_application.yaml:
#   C11 never asks about prohibited-material HISTORY — that disclosure is C2 § 2.4 Land History.
form:
  code: C11
  title: Crop Materials List
  document_id: C11
  revision: rev. 2023/09/14
  url: https://tilth.org/help-center/blank-forms-all/
  pdf: https://tilth.org/wp-content/uploads/2015/01/C11CropMaterialsList.docx
  retrieved: 2026-09-09
  nop_cites:
  - § 205.105
  - § 205.272
  guide_trigger: >-
    C1 Crop Activities Checklist — "I/We utilize material inputs/products in our organic
    production system" → C11 Crop Materials. The form's own first checkbox ("Not Applicable; no
    materials/inputs are used") is how a grower with no inputs answers it, so in practice every
    grower files C11; it is also the form a certified operation files during the year to add a
    product to its current Materials List ("The products identified below are to be added to my
    current Materials List").
  required_of_every_grower: false
  # The Materials List workbook lists every product the records and the plan name, with maker,
  # reason for use and in-use status — this form's own columns — so the coverage page names it
  # first. The module page is the plan's approved list alone (WSDA desk read, 2026-09-10).
  packet_documents:
  - workbooks/Materials List.xlsx
  trazo_module: materials_application
  register_status: complete

items:
- ref: "Hdr-1"
  asks: >-
    Provide the names of ALL input materials and substances in use or intended for use in your
    Organic system. This Materials List must include all fertilizers, pest and disease control
    materials, compost and manure products, inoculants, planting mixes, seed treatments, cleaners
    and sanitizers, adjuvants, mulches, etc.
  status: partial
  severity: P2
  trazo:
    questions:
    - materials_application.materials_list_panel
    - materials_application.materials_list_complete
    - materials_application.fertilizers_listed
    - materials_application.pest_disease_weed_listed
    - materials_application.production_aids_listed
    - materials_application.post_harvest_contact_listed
    models:
    - certifications.services.plan_materials (all FOUR sources — National List, OMRI, WSDA, operator-entered)
    - certifications.PlanMaterialEntry.status
    prints: modules/materials_application.pdf §A, §B; workbooks/Materials List.xlsx; narrative § 205.201(a)(2)
  gap: >-
    Same verdict as WSDA AGR 2196 Hdr and CCOF NOPB41 Header B, brought up to date. OTCO asks for
    ONE list covering every category; Trazo holds one list, read through `plan_materials()` from
    all four sources, and attests completeness four times, once per category (fertilizers and soil
    amendments; pest, disease and weed control; production aids; post-harvest contact materials) —
    a more demanding shape than OTCO's single list, and a reviewer can see which class was left
    unattested. Since 2026-08-28 an operator-entered row (`PlanMaterialEntry`) can hold any of
    OTCO's named classes — compost, manure, planting mixes, mulches, inoculants — with a
    planned/in-use `status`, so "in use or intended for use" is stated for those rows and prints
    in the workbook's In use / Intended for use columns. Two gaps remain. (1) A material attached
    straight from a catalog (an OMRI, WSDA or National List FK with no operator row) carries no
    status, so the list states use for only part of itself. (2) Seed treatments logged on planting
    events and sanitizers logged on post-harvest events are never read into the rows (CCOF §C/§D
    carry this), so the operator has to retype them; the [REVIEW] reconciliation that names logged
    products missing from the plan reads chemical-application and soil-amendment events only. The
    siblings' gap text — "nothing records whether a row is planned, in use, or discontinued" — is
    now true only of catalog-attached rows.
  fix: >-
    Require `status` on a catalog attach (create the operator row alongside the FK, as the fold in
    `plan_materials` already anticipates); read distinct `seed_treatment` and `sanitizer_name`
    values into `_material_rows` so the reconciliation and the workbook cover every class OTCO
    names; keep the four attestations.

- ref: Hdr-2
  asks: >-
    Not Applicable; no materials/inputs are used.
  status: covered
  trazo:
    questions:
    - materials_application.no_materials_used
    - materials_application.fertilizers_none_used
    - materials_application.pest_disease_weed_none_used
    - materials_application.production_aids_none_used
    - materials_application.post_harvest_contact_none_used
    - materials_application.materials_list_complete
    models:
    - certifications.services.plan_materials.none_used_contradictions
    prints: >-
      modules/materials_application.pdf §A — 'The operator states that no input materials or
      substances are used in the organic system.' replaces the empty-list sentence when the operator
      states it; narrative § 205.201(a)(2); contradicted by rows or logged applications → '[REVIEW]'
      beside the statement
  note: >-
    Closed 2026-09-09 with CCOF NOPB41 Header C: `no_materials_used` is the affirmative statement
    OTCO's checkbox makes (an absence stays an absence when it is not made), it hides page B and the
    completeness attestation, and it is checked against the records rather than taken on its own.
- ref: "Hdr-3"
  asks: >-
    I have attached my own list with this information.
  status: partial
  severity: P2
  trazo:
    questions:
    - materials_application.materials_list_panel
    prints: modules/materials_application.pdf §A; workbooks/Materials List.xlsx
  gap: >-
    Trazo's generated list IS the operator's own list, so this is the path an OTCO operation using
    Trazo takes — and OTCO's condition is that the attached list carry "this information", the four
    columns of the table. The two Trazo artifacts between them do not: the module PDF prints name —
    manufacturer — identifier grouped by source (no intended use); the workbook prints Product,
    Manufacturer, Reason for use, In use, Intended for use (no review agency). Neither prints the
    per-row OMRI / WSDA / OTHER position or a label reference. The column rows below state each
    shortfall; this row records that an OTCO reviewer receiving either artifact under this
    checkbox will find columns missing.
  fix: >-
    Give the module PDF a four-column table matching C11 (name incl. formulation · manufacturer ·
    review agency + identifier · intended use), built from the same `plan_materials()` rows the
    grouped list already uses, so the attachment carries every column the form asks for.

- ref: "Hdr-4"
  asks: >-
    The products identified below are to be added to my current Materials List.
  status: partial
  severity: P2
  trazo:
    questions:
    - materials_application.materials_list_panel
    models:
    - certifications.models.ApprovedInputChangeLog (append-only; written by add_approved_input for catalog rows only)
    - certifications.models.OSPChangeNotification (category "Practice / input / procedure change — § 205.400(f)(2)")
    - certifications.PlanMaterialEntry.created_at
    prints: 03-change-notifications.pdf (filed notifications only); audit dossier (approved-input change log); plan_review flags inputs_changed
  gap: >-
    CCOF NOPB41 Header E ("to add or remove materials after your initial application, update your
    OSP Materials List") is `covered` on `ApprovedInputChangeLog` + `OSPChangeNotification`, and
    that verdict was right for the product it described: a material can be added to the list at any
    time, and a CATALOG attach writes a dated, append-only change-log row that the audit dossier
    prints and `plan_review` reads to flag `inputs_changed`. It is stale on one point since the
    operator-entered row shipped (2026-08-28): `ApprovedInputChangeLog` is written only by
    `add_approved_input` (kinds national_list / omri / wsda), so a `PlanMaterialEntry` added
    mid-year has a `created_at` and nothing else — no change-log row, nothing for `plan_review` to
    flag, and nothing in 03-change-notifications.pdf unless the operator files a § 205.400(f)(2)
    notification by hand. OTCO's checkbox exists precisely to separate "new since approval" from
    the standing list; Trazo cannot make that separation for operator-entered rows, which is the
    same "list what is NEW" gap WSDA AGR 2196 Hdr names.
  fix: >-
    Write an `ApprovedInputChangeLog` row (or a parallel `PlanMaterialEntryChangeLog`) on every
    operator-entered create/delete; let the packet's materials page mark rows added since the plan
    was last submitted, and let a "C11 additions" view filter to them.

- ref: "Hdr-5"
  asks: >-
    Labels or photos of container are attached for each product that is not OMRI or WSDA listed.
  status: not_covered
  severity: P1
  trazo:
    models:
    - certifications.PlanMaterialEntry.listing_basis (identifies which rows have no OMRI or WSDA basis)
    - certifications.PlanMaterialEntry.national_list_substance
    prints: —
  gap: >-
    A fresh OTCO ask with no home in either sibling register. Trazo knows WHICH rows this applies to
    — every `PlanMaterialEntry` whose `listing_basis` is `national_list`, `certifier_letter` or
    `none_unlisted`, and every bare National List attach — but there is no per-material label or
    photo attachment anywhere: the row has no document field, DMS uploads are tagged by module
    rather than by material, and no module upload reaches the generated packet in any case.
    OTCO's rule also cuts across Trazo's claim ladder: a row whose basis is a National List
    SUBSTANCE prints "National List substance", which is a correct statement of its basis and is
    still, for OTCO, a product that is "not OMRI or WSDA listed" and needs its label — the
    statement can read as sufficient when for this form it is not. Nothing prompts the operator,
    so an OTCO reviewer receives the rows and no labels.
  fix: >-
    Add a `label_document` upload on `PlanMaterialEntry`, prompted in the editor whenever
    `listing_basis` is not `omri` or `wsda` (including National List rows), shipped in the packet
    under `attachments/materials/<row>/` and named on the module page; print "label attached /
    label needed" beside each such row.

- ref: Col-1
  asks: >-
    Full Product Name, including any formulation (ex: "ABC Super Sulfur DF").
  status: partial
  severity: P2
  trazo:
    questions:
    - materials_application.materials_list_panel
    models:
    - certifications.PlanMaterialEntry.product_name
    - certifications.services.plan_materials.PlanMaterial.display
    prints: >-
      modules/materials_application.pdf §A and 01-organic-system-plan.pdf — a bare National List
      substance prints 'brand and formulation not stated'; an operator row prints its full label
      name; workbooks/Materials List.xlsx
  gap: >-
    Closed 2026-09-09 (fix/parcel-page-land-history, materials cut): the certifier-facing line
    (`PlanMaterial.display(stated_absences=True)`, used by the module PDF and the plan snapshot)
    states a missing cell as missing — 'manufacturer not stated', 'reason for use not stated', and
    for a bare National List substance 'brand and formulation not stated' — instead of omitting it,
    so a row that needs the cell no longer reads like a row that never did. The Materials List
    workbook already counts each blank per row (`fix_hint="materials_list"`) and the editor names
    where it is answered. Remaining, as CCOF A (product name): no separate `formulation` field, and
    a National List attach does not yet require the operator row naming the brand applied.
  fix: >-
    Same as CCOF A (product name).
- ref: Col-2
  asks: >-
    Full Manufacturer Name (ex: "XYZ Manufacturing, LLC"). The specific brand name and manufacturer
    must be provided; products without a manufacturer name cannot be reviewed and will not be
    approved for use.
  status: partial
  severity: P2
  trazo:
    questions:
    - materials_application.materials_list_panel
    models:
    - certifications.PlanMaterialEntry.manufacturer
    - certifications.services.plan_materials.PlanMaterial.display
    prints: >-
      modules/materials_application.pdf §A and 01-organic-system-plan.pdf — 'manufacturer not
      stated' rather than a silent blank; workbooks/Materials List.xlsx (blank counted per row)
  gap: >-
    Closed 2026-09-09 (fix/parcel-page-land-history, materials cut): the certifier-facing line
    (`PlanMaterial.display(stated_absences=True)`, used by the module PDF and the plan snapshot)
    states a missing cell as missing — 'manufacturer not stated', 'reason for use not stated', and
    for a bare National List substance 'brand and formulation not stated' — instead of omitting it,
    so a row that needs the cell no longer reads like a row that never did. The Materials List
    workbook already counts each blank per row (`fix_hint="materials_list"`) and the editor names
    where it is answered. P1 → P2 because the row OTCO 'cannot review' now announces itself on the
    page and in the blank counter. Remaining: nothing requires the maker before submission (see CCOF
    A (manufacturer) for why not at create time).
  fix: >-
    Completion gate on `manufacturer` for rows marked in use.
- ref: "Col-3"
  asks: >-
    Third Party Review Agency (ex: OMRI, WSDA) — per row, check OMRI / WSDA / OTHER.
  status: partial
  severity: P2
  trazo:
    questions:
    - materials_application.materials_list_panel
    models:
    - certifications.PlanMaterialEntry.listing_basis
    - certifications.PlanMaterialEntry.certifier_letter_reference
    - certifications.PlanMaterialEntry.omri_product
    - certifications.PlanMaterialEntry.wsda_material
    - certifications.PlanMaterialEntry.national_list_substance
    prints: modules/materials_application.pdf §A (source heading — National List / OMRI / WSDA / Operator-entered — plus OMRI # or WSDA product # per row); narrative § 205.201(a)(2)
  gap: >-
    A fresh OTCO column, adjacent to WSDA AGR 2196's "WSDA List cross-reference" row but a
    different ask (that row is about surfacing the per-source badge to the OPERATOR). For the OMRI
    and WSDA positions Trazo already prints the answer: each row sits under its source heading with
    the registry's own identifier, and the basis is checkable — `listing_basis` may say OMRI or
    WSDA only while the matching FK resolves, and the fold refuses to print a catalog number onto a
    row whose FK does not point at that exact listing. Trazo resolves the name; the operator's
    confirmed FK is the statement, and it is never OTCO's review. The OTHER position is the gap:
    everything else — a National List substance basis, a certifier's written approval, a row with
    no third-party listing — lands under OTHER on OTCO's form, and Trazo has no field to name the
    other reviewer. `certifier_letter_reference` is the nearest and covers only the letter case;
    there is nowhere to record that a manufacturer has supplied OTCO's Crop Input Verification
    Evaluation (a manufacturer-signed declaration, valid five years, which is what OTCO's OTHER
    column typically points at) or another ACA's review. The `listing_statement` for those rows —
    "National List substance", "no third-party listing on file" — is honest about the basis and
    says nothing about which agency, if any, reviewed the product.
  fix: >-
    Add `other_review_agency` [text] and `other_review_reference` [text] on `PlanMaterialEntry`,
    visible when `listing_basis` is not `omri` or `wsda`; print the C11 trio per row (OMRI / WSDA /
    OTHER: <agency, reference>) in the module PDF table proposed at Hdr-3. Never print a
    resolution as a review.

- ref: "Col-4"
  asks: >-
    Intended Use (ex: Fertility, Pest Control, Post-Harvest Sanitation).
  status: partial
  severity: P2
  trazo:
    questions:
    - materials_application.materials_list_panel
    models:
    - certifications.PlanMaterialEntry.category
    - certifications.PlanMaterialEntry.reason_for_use
    prints: workbooks/Materials List.xlsx ("Reason for use" — the operator's reason, else the event-type word); absent from modules/materials_application.pdf
  gap: >-
    Same verdict as WSDA AGR 2196 "Intended purpose" — OTCO, like WSDA, wants a category word, not
    CCOF's specific reason ("zinc deficiency"), and Trazo has that word: `PlanMaterialEntry.
    category` is exactly OTCO's granularity (fertilizers and soil amendments / pest, weed and
    disease control / production aids / post-harvest / other) and `reason_for_use` is the
    operator's fuller answer. Both exist only on operator-entered rows, and neither reaches the
    module PDF: `display()` prints name — manufacturer — identifier and nothing about use, so the
    list a reviewer reads has an empty Intended Use column on every row. The workbook prints the
    reason (or, for an event-derived row with no plan entry, the event type word — "Fertilizer",
    "Pest control"); a catalog-attached row with no operator entry and no logged application prints
    nothing anywhere.
  fix: >-
    Print `category` (falling back to `reason_for_use`, then the event-type word) beside each row
    in the module PDF; require `category` on a catalog attach, the same way Hdr-1's fix requires
    `status`.
