# Oregon Tilth Certified Organic (OTCO) — C11 Crop Materials List.
#
# Source: https://tilth.org/help-center/blank-forms-all/ → C11CropMaterialsList.docx
#   (https://tilth.org/wp-content/uploads/2015/01/C11CropMaterialsList.docx). Footer stamp
#   `rev. 2023/09/14`. Text read from the official 2025 docx, retrieved 2026-09-09.
#
# Ref scheme (re-cut 2026-09-30, OSP alignment audit T26): C11 prints one numbered heading,
#   "11.1 INPUT MATERIALS LIST", with its Not Applicable checkbox; everything else is unnumbered, so
#   refs are `11.1 (…)` for the header checkboxes and `11.1 Table (…)` for the four columns a person
#   fills per material. The OMRI/WSDA/OTHER checkbox trio is the review-agency cell. The earlier
#   `Hdr-n` / `Col-n` refs were not on the form.
#
# Registered as a DELTA against ccof/forms/Materials-Application.yaml (ORGB41) and
#   wsda/forms/2196-input-material-list.yaml (AGR 2196): every obligation those registers already
#   judged is restated here with the SAME questions, status, severity and root_cause. Two of those
#   verdicts were re-read against the CURRENT renderer before reuse and are stale on one point each
#   (noted in the manufacturer column and the additions row — the register is the burn-down, and a stale gap is a gap that will
#   never be flipped). Fresh analysis for what OTCO alone asks: the per-row review-agency column
#   with its "OTHER" position, the label-or-photo requirement for anything not OMRI or WSDA
#   listed, and the "add to my current Materials List" mode that makes C11 the year-round
#   add-a-material form.
#
# Language rule kept throughout: Trazo RESOLVES a product name against OMRI, the WSDA Brand Name
#   list and the National List, and states what it found. It never verifies or approves a material,
#   and a logged product the registries do not resolve is UNMATCHED, never "unapproved".
#
# The two `fumigant_prohibited_material_*` questions are in otco/unmapped/materials_application.yaml:
#   C11 never asks about prohibited-material HISTORY — that disclosure is C2 § 2.4 Land History.
form:
  code: C11
  title: Crop Materials List
  document_id: C11
  revision: rev. 2023/09/14
  url: https://tilth.org/help-center/blank-forms-all/
  pdf: https://tilth.org/wp-content/uploads/2015/01/C11CropMaterialsList.docx
  retrieved: 2026-09-09
  nop_cites:
  - § 205.105
  - § 205.272
  guide_trigger: >-
    C1 Crop Activities Checklist — "I/We utilize material inputs/products in our organic
    production system" → C11 Crop Materials. The form's own first checkbox ("Not Applicable; no
    materials/inputs are used") is how a grower with no inputs answers it, so in practice every
    grower files C11; it is also the form a certified operation files during the year to add a
    product to its current Materials List ("The products identified below are to be added to my
    current Materials List").
  required_of_every_grower: false
  # The Materials List workbook lists every product the records and the plan name, with maker,
  # reason for use and in-use status — this form's own columns — so the coverage page names it
  # first. The module page is the plan's approved list alone (WSDA desk read, 2026-09-10).
  packet_documents:
  - workbooks/Materials List.xlsx
  trazo_module: materials_application
  register_status: complete
  source_sha256: ab22abe1e0c91b545941b67eac7a6037c92fbb139ea9ceb9911be1b2a2986f40

items:
- ref: Instructions (all input materials)
  asks: Provide the names of ALL input materials and substances in use or intended for use in your Organic
    system. This Materials List must include all fertilizers, pest and disease control materials, compost and
    manure products, inoculants, planting mixes, seed treatments, cleaners and sanitizers, adjuvants, mulches,
    etc.
  status: covered
  trazo:
    where: 'modules/materials_application.pdf: the materials list, which on an OTCO plan is C11''s table with
      in use or intended for use stated in each row''s Intended use cell, and the four category attestations'
    questions:
    - materials_application.materials_list_panel
    - materials_application.materials_list_complete
    - materials_application.fertilizers_listed
    - materials_application.pest_disease_weed_listed
    - materials_application.production_aids_listed
    - materials_application.crop_production_aids_listed
    - materials_application.post_harvest_contact_listed
    models:
    - certifications.services.plan_materials (all FOUR sources — National List, OMRI, WSDA, operator-entered)
    - certifications.PlanMaterialEntry.status
    - certifications.views.OrganicSystemPlanViewSet.add_approved_input (status and category taken with the attach)
    prints: modules/materials_application.pdf §A (C11 table on an OTCO plan), §B; workbooks/Materials List.xlsx; narrative § 205.201(a)(2)
  gap: Same verdict as WSDA AGR 2196 Hdr and CCOF ORGB41 Header B, brought up to date. OTCO asks for ONE list
    covering every category; Trazo holds one list, read through `plan_materials()` from all four sources, and
    attests completeness four times, once per category (fertilizers and soil amendments; pest, disease and
    weed control; production aids; post-harvest contact materials) — a more demanding shape than OTCO's single
    list, and a reviewer can see which class was left unattested. Since 2026-08-28 an operator-entered row
    (`PlanMaterialEntry`) can hold any of OTCO's named classes — compost, manure, planting mixes, mulches,
    inoculants — with a planned/in-use `status`, so "in use or intended for use" is stated for those rows and
    prints in the workbook's In use / Intended for use columns. One gap remains. A material attached straight
    from a catalog (an OMRI, WSDA or National List FK with no operator row) carries no status, so the list
    states use for only part of itself. Since 2026-11-09 seed treatments on planting records and tank-mix
    partners on application records join the Materials List and its reconciliation, as post-harvest sanitizers
    have since 2026-09-12. Closed 2026-11-16 (feat/c11-materials-list). The catalog attach asks the material's
    use (in use or intended for use) and its section, and files both on the operator's row for that product,
    carrying the catalog FK, as the fold anticipated; adding a material in the operator's own words asks the
    same. A material attached before then, or by an older client, prints "use not stated" until the
    Materials List editor answers it.
- ref: 11.1 (not applicable)
  asks: Not Applicable; no materials/inputs are used.
  status: covered
  trazo:
    questions:
    - materials_application.no_materials_used
    - materials_application.fertilizers_none_used
    - materials_application.pest_disease_weed_none_used
    - materials_application.production_aids_none_used
    - materials_application.crop_production_aids_none_used
    - materials_application.post_harvest_contact_none_used
    - materials_application.materials_list_complete
    models:
    - certifications.services.plan_materials.none_used_contradictions
    prints: modules/materials_application.pdf §A — 'The operator states that no input materials or substances
      are used in the organic system.' replaces the empty-list sentence when the operator states it; narrative
      § 205.201(a)(2); contradicted by rows or logged applications → '[REVIEW]' beside the statement
  note: 'Closed 2026-09-09 with CCOF ORGB41 Header C: `no_materials_used` is the affirmative statement OTCO''s
    checkbox makes (an absence stays an absence when it is not made), it hides page B and the completeness
    attestation, and it is checked against the records rather than taken on its own.'
- ref: 11.1 (own list attached)
  asks: I have attached my own list with this information.
  status: covered
  trazo:
    where: 'modules/materials_application.pdf: on an OTCO plan the list prints as C11''s table, one row per product
      with its full product name, manufacturer, third party review agency and intended use, each cell filled
      or stated as not stated'
    questions:
    - materials_application.materials_list_panel
    models:
    - certifications.services.plan_materials.c11_product_cell
    - certifications.services.plan_materials.c11_review_cell
    - certifications.services.plan_materials.c11_use_cell
    prints: modules/materials_application.pdf §A (C11 table); workbooks/Materials List.xlsx
  gap: 'Closed 2026-11-16 (feat/c11-materials-list). Trazo''s generated list is the operator''s own list, and
    OTCO''s condition is that it carry "this information", the four columns of the table. The module page now
    prints the list in those columns for a plan whose agent is OTCO (`C11_TABLE_AGENTS`), from the same
    `plan_materials()` rows, in place of the grouped list: the listing moves to the review agency cell, reason
    and use to the intended use cell, and the agent''s review, [REVIEW] lines and label line sit under the row.
    Another agent''s plan keeps the grouped list and never sees OTCO''s form named.'
- ref: 11.1 (additions to current list)
  asks: The products identified below are to be added to my current Materials List.
  status: covered
  trazo:
    where: 'modules/materials_application.pdf: a row added since the plan was filed says "Added to the list on
      <date>, after the plan was filed on <date>", and the page lists every material added to and taken off
      the list since that filing'
    questions:
    - materials_application.materials_list_panel
    models:
    - certifications.models.ApprovedInputChangeLog (append-only; catalog attaches, and operator-entered materials
      as kind operator_entered since 2026-11-16)
    - certifications.services.plan_materials.materials_changes_since_filing
    - certifications.models.OSPChangeNotification (category "Practice / input / procedure change, § 205.400(f)(2)")
    prints: modules/materials_application.pdf §A (C11 table and the additions since the filing); audit dossier
      (approved-input change log); plan_review flags inputs_changed
  gap: 'Closed 2026-11-16 (feat/c11-materials-list). An operator-entered material added or removed writes the
    same dated, append-only `ApprovedInputChangeLog` row a catalog attach does (kind `operator_entered`), from
    the add-your-own path, from the Materials List editor when an answer puts a logged material on the plan,
    and from its removal; an answers row about a catalog-attached product is not a second material and logs
    nothing. `plan_review` reads it as `inputs_changed`. The module page separates the new from the standing
    list: the window opens at the newest filing in the plan''s lineage (`submitted_at`, this version''s or the
    one it continues) and the change log decides, net per material.'
- ref: 11.1 (labels or photos attached)
  asks: Labels or photos of container are attached for each product that is not OMRI or WSDA listed.
  status: covered
  trazo:
    where: 'modules/materials_application.pdf: the line under each material, giving its label''s path in this
      packet (attachments/materials/), or that none is on file for a product not OMRI or WSDA listed'
    models:
    - certifications.PlanMaterialEntry.label_document
    - certifications.services.plan_materials.PlanMaterial.needs_label
    - certifications.services.packet_attachments.material_label_path
    prints: modules/materials_application.pdf (label line under each material); attachments/materials/ in the
      packet ZIP
  gap: 'Closed 2026-11-04 (feat/material-labels). Each material row in the editor takes a label or container
    photo, filed in the farm''s Documents and linked to the row (`PlanMaterialEntry.label_document`, PROTECT, so
    the file cannot be deleted while a material names it). The packet carries it under attachments/materials/,
    and the module page states, under each material, the path of the label in the packet, or for an OTCO plan
    that none is on file when the product is not OMRI or WSDA listed: a National List substance counts as not
    listed, as does an OMRI listing that has lapsed. Only a file the packet actually carries is given as in it.
    Nothing requires the upload before filing; the missing label is stated, not refused.'
- ref: 11.1 Table (full product name)
  asks: 'Full Product Name, including any formulation (ex: "ABC Super Sulfur DF").'
  status: partial
  severity: P2
  trazo:
    questions:
    - materials_application.materials_list_panel
    models:
    - certifications.PlanMaterialEntry.product_name
    - certifications.services.plan_materials.PlanMaterial.display
    prints: modules/materials_application.pdf §A and 01-organic-system-plan.pdf — a bare National List substance
      prints 'brand and formulation not stated'; an operator row prints its full label name; workbooks/Materials
      List.xlsx
  gap: 'Closed 2026-09-09 (fix/parcel-page-land-history, materials cut): the certifier-facing line (`PlanMaterial.display(stated_absences=True)`,
    used by the module PDF and the plan snapshot) states a missing cell as missing — ''manufacturer not stated'',
    ''reason for use not stated'', and for a bare National List substance ''brand and formulation not stated''
    — instead of omitting it, so a row that needs the cell no longer reads like a row that never did. The Materials
    List workbook already counts each blank per row (`fix_hint="materials_list"`) and the editor names where
    it is answered. Remaining, as CCOF A (product name): no separate `formulation` field, and a National List
    attach does not yet require the operator row naming the brand applied. Since 2026-11-16 an operator row
    that carries only the substance''s own name (a use answered, no brand) still prints ''brand and formulation
    not stated'', in the plan line and in the C11 table''s product cell.'
  fix: Same as CCOF A (product name).
- ref: 11.1 Table (manufacturer)
  asks: 'Full Manufacturer Name (ex: "XYZ Manufacturing, LLC"). The specific brand name and manufacturer must
    be provided; products without a manufacturer name cannot be reviewed and will not be approved for use.'
  status: partial
  severity: P2
  trazo:
    questions:
    - materials_application.materials_list_panel
    models:
    - certifications.PlanMaterialEntry.manufacturer
    - certifications.services.plan_materials.PlanMaterial.display
    prints: modules/materials_application.pdf §A and 01-organic-system-plan.pdf — 'manufacturer not stated'
      rather than a silent blank; workbooks/Materials List.xlsx (blank counted per row)
  gap: 'Closed 2026-09-09 (fix/parcel-page-land-history, materials cut): the certifier-facing line (`PlanMaterial.display(stated_absences=True)`,
    used by the module PDF and the plan snapshot) states a missing cell as missing — ''manufacturer not stated'',
    ''reason for use not stated'', and for a bare National List substance ''brand and formulation not stated''
    — instead of omitting it, so a row that needs the cell no longer reads like a row that never did. The Materials
    List workbook already counts each blank per row (`fix_hint="materials_list"`) and the editor names where
    it is answered. P1 → P2 because the row OTCO ''cannot review'' now announces itself on the page and in
    the blank counter. Remaining: nothing requires the maker before submission (see CCOF A (manufacturer) for
    why not at create time).'
  fix: Completion gate on `manufacturer` for rows marked in use.
- ref: 11.1 Table (third party review agency)
  asks: 'Third Party Review Agency (ex: OMRI, WSDA) — per row, check OMRI / WSDA / OTHER.'
  status: covered
  trazo:
    where: 'modules/materials_application.pdf: the C11 table''s Third party review agency cell: OMRI or WSDA with
      the listing''s own identifier, "Other: <agency>, <reference>" as the operator names it, or "No review
      agency named" with the row''s basis'
    questions:
    - materials_application.materials_list_panel
    models:
    - certifications.PlanMaterialEntry.other_review_agency
    - certifications.PlanMaterialEntry.other_review_reference
    - certifications.PlanMaterialEntry.listing_basis
    - certifications.PlanMaterialEntry.omri_product
    - certifications.PlanMaterialEntry.wsda_material
    - certifications.PlanMaterialEntry.national_list_substance
    - certifications.services.plan_materials.c11_review_cell
    prints: modules/materials_application.pdf §A (C11 table)
  gap: 'Closed 2026-11-16 (feat/c11-materials-list). The OMRI and WSDA boxes are the catalog listing the operator
    attached, with the registry''s own identifier; Trazo resolves the name and the operator''s confirmed FK is
    the statement, never a review Trazo made, and a lapsed OMRI listing no longer fills the OMRI box. OTHER is
    `other_review_agency` and `other_review_reference`, which the operator records from the review''s own
    document (a manufacturer''s Crop Input Verification Evaluation, another agent''s review) in the Materials
    List editor, offered only on a row that is neither OMRI nor WSDA and refused by the serializer on one that
    is. A row with none of the three says "No review agency named" beside its basis (National List substance
    with its paragraph, nonsynthetic, or no third-party listing on file) rather than ticking a box nobody
    ticked.'
- ref: 11.1 Table (intended use)
  asks: 'Intended Use (ex: Fertility, Pest Control, Post-Harvest Sanitation).'
  status: covered
  trazo:
    where: 'modules/materials_application.pdf: the C11 table''s Intended use cell: the category word, the reason
      for use and in use or intended for use, each stated or said to be not stated'
    questions:
    - materials_application.materials_list_panel
    models:
    - certifications.PlanMaterialEntry.category
    - certifications.PlanMaterialEntry.reason_for_use
    - certifications.PlanMaterialEntry.status
    - certifications.services.plan_materials.C11_USE_WORDS
    prints: modules/materials_application.pdf §A (C11 table); workbooks/Materials List.xlsx ("Reason for use")
  gap: 'Closed 2026-11-16 (feat/c11-materials-list). OTCO wants a category word, and `PlanMaterialEntry.category`
    is its granularity; the cell prints it in words of its own (`C11_USE_WORDS`, not the picker labels, which
    name CCOF''s sections), then the operator''s reason and the use. The catalog attach asks the section with the
    use, so a newly attached material carries the word; one attached earlier prints "use category not stated"
    until the Materials List editor answers it.'
