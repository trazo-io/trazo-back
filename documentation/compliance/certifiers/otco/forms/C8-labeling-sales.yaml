# OTCO C8 — Crop Labeling & Sales.
#
# Source: https://tilth.org/help-center/blank-forms-all/ (blank forms index), docx
# https://tilth.org/wp-content/uploads/2015/01/C8CropLabelingSales.docx, footer stamp
# "rev. 2025/08/27", read 2026-09-09 from the extracted text. Registered as a DELTA against CCOF
# G7.0 / G6.5 and WSDA §N (Labeling) / §Q (International Trade): reused verdicts wherever C8 asks
# an obligation those rows judged; fresh analysis for what OTCO asks differently — the lot-number-
# to-origin description on §8.1, the Private Label Agreement route for an uncertified brand owner,
# the per-product label-claim table, PFS-02, and the export label / transaction-certificate /
# equivalency-arrangement questions.
#
# Ref scheme (re-cut 2026-09-30, OSP alignment audit T26). Refs are what the form prints: the
# subsection number and question number (`8.3-2`), a lettered sub-item (`8.1-1a`). The earlier
# version of this file numbered items by order of appearance, gave table columns rows of their own
# and folded subsection "Not applicable" lines into the first question; all three are gone. An
# unnumbered item carries the nearest printed parent plus a description in parentheses. Rows match
# `../inventory/<this file>`, derived from the docx; gaps of merged rows are carried by the row that
# absorbed them, marked with the old ref.
#
# ⚠️ "Sales" in C8's title is private-label packing and export. C8 asks nothing about sales
# CHANNELS or about buying in / reselling other operations' product: OTCO asks supplier approval
# and certificate checks on the OFPP (Organic Fraud Prevention Plan) and sourced-product records on
# C12 §12.2, both registered separately. The g6_5 questions C8 does not reach are in
# otco/unmapped/g6_5_sales_soe.yaml with that routing.
form:
  code: C8
  title: Crop Labeling & Sales
  document_id: C8
  revision: rev. 2025/08/27
  url: https://tilth.org/help-center/blank-forms-all/
  pdf: https://tilth.org/wp-content/uploads/2015/01/C8CropLabelingSales.docx
  retrieved: 2026-09-09
  nop_cites:
  - § 205.303
  - § 205.304
  - § 205.305
  - § 205.306
  - § 205.307
  guide_trigger: >-
    C1 Crop Activities Checklist — "I/We label or sell crops" → C8. The form's own header: complete
    this form if you label organic products, or contract with another certified operation to
    process and package organic products using your brand or label.
  required_of_every_grower: false
  trazo_module:
  - g7_0_labeling
  - g6_5_sales_soe
  register_status: complete
  source_sha256: 1f236a94554c9345b2a49958907f7b9188d32d2df5b6070a73743004b0c1bb03
items:
- ref: 8.1-1
  asks: 'Do you use wholesale or bulk (non-retail) containers to ship or store organic crops or crop products?
    No / Yes: how is the organic status of the product inside the non-retail container identified?'
  status: covered
  trazo:
    questions:
    - g7_0_labeling.product_leaves_as
    - g7_0_labeling.nonretail_container_types
    - g7_0_labeling.nonretail_organic_identification
    - g7_0_labeling.nonretail_identification_other
    prints: modules/G7_0.pdf §A (product_leaves_as, with a [REVIEW] line under unlabeled bulk citing § 205.307(a)(1));
      §B (container types, how they show organic status, notes)
- ref: 8.1-1 (non-retail label example)
  asks: Attach an example of the non-retail shipping or storage label. Example of non-retail label(s) are attached.
  status: covered
  trazo:
    questions:
    - g7_0_labeling.nonretail_label_upload
    prints: modules/G7_0.pdf §B; attachments/g7_0_labeling/nonretail_label_upload/ (the files uploaded for it);
      labels/lot-tags/ (Trazo's lot-tag sheets)
- ref: 8.1-1a
  asks: How does the lot number or other unique identifier on the non-retail container(s) link to the origin
    of the organic product in your records?
  status: covered
  trazo:
    questions:
    - g7_0_labeling.container_lot_linkage_description
    - g7_0_labeling.container_lot_identifier_types
    - g7_0_labeling.container_markings_tie_to_lot
    prints: modules/G7_0.pdf §B (container_lot_linkage_description, the one description OTCO asks for, with the
      identifier types). The lot booleans of G6.1, G6.2 and G7.0 and the sample sales record stay cited at C12.
  note: Until 2026-10-26 this row cited six questions across four modules and no description of the container
    to lot link; it now cites the description OTCO asks for.
- ref: 8.2-1
  asks: 'Do you use retail labels? No, not applicable / Yes — attach a color copy of EVERY retail label you
    use (all retail labels are attached), or no labels are currently in use but they will be submitted to OTCO
    for review and approval before printing or using on organic products. Samples no larger than 8.5 x 11 in.
    Form header: for packaged products of which your operation is the final handler, the label must state "Certified
    Organic by Oregon Tilth" or similar directly below your operation''s name and contact information; the
    USDA Organic Seal and/or the Oregon Tilth logo may be used provided the USDA Seal is displayed more prominently.'
  status: partial
  severity: P1
  trazo:
    questions:
    - g7_0_labeling.product_leaves_as
    - g7_0_labeling.label_states_certifier
    - g7_0_labeling.label_has_usda_seal
    - g7_0_labeling.label_files_upload
    prints: modules/G7_0.pdf §A (consumer_packaging selection, label_states_certifier, label_has_usda_seal
      print); labels/ (the files uploaded for label_files_upload; since 2026-10-01)
  gap: Reuses CCOF G7.0 B1 and WSDA §N 5. The yes/no (`consumer_packaging`), the certifier statement and the
    seal are asked and print; the statement's placement below the operation's name is not asked; the "will
    be submitted before printing" state has no field. Since 2026-10-01 every label uploaded for the question
    rides in the packet under labels/; nothing checks that a color copy of EVERY label is there.
  fix: Add `certifier_statement_below_operation_info` [boolean] and a `labels_pending_submission` state.
- ref: 8.3-1
  asks: How do you make sure that only compliant labels are used for organic products? N/A – No labels used
    (explain) / Labels are submitted to OTCO for review and approval before printing / Other (explain).
  status: partial
  severity: P1
  trazo:
    questions:
    - g7_0_labeling.label_claim_review_process
    prints: modules/G7_0.pdf §B (label_claim_review_process)
  gap: Reuses WSDA §N 5 and CCOF G7.0 A1. `label_claim_review_process` records WHO reviews new labels and claims
    internally, never whether a label was submitted to or approved by the certifier before printing — the fact
    OTCO's checkbox asks for. Submission itself is a transaction between the operation and OTCO; what the plan
    can and should hold is its status per label.
  fix: Per-label {sent_to_certifier_on, approved_on} rows instead of one review-process textarea — the WSDA
    N5 fix.
- ref: 8.3-2
  asks: Do you pack your own organic crops into packages that use another company's organic brand or label?
    Yes / No, not applicable (skip to section 8.4).
  status: partial
  severity: P1
  trazo:
    questions:
    - g7_0_labeling.product_leaves_as
    prints: modules/G7_0.pdf §A (product_leaves_as — buyer_label)
  gap: Reuses CCOF G7.0 C1 and WSDA §N 6. `buyer_label` ("sold under the buyer's own label") is one option
    inside `product_leaves_as` with no follow-up of any kind; no brand-owner entity exists anywhere in the
    schema.
  fix: When buyer_label is selected, open the repeatable `brand_owners` block described at 8.3-3 / 8.3-4 instead
    of leaving the fact a dead end.
- ref: 8.3-2 (brand owner certified)
  asks: If you answered yes, is that company certified organic? Yes – attach their valid organic certificate
    (Attached) / No – attach a completed Private Label Agreement (PLA) form (Attached).
  status: not_covered
  severity: P1
  trazo:
    triggered_by:
    - g7_0_labeling.product_leaves_as
    prints: —
  gap: Reuses CCOF G7.0 C2 and WSDA §N 7. No brand-owner record, certification status or certificate exists
    for a company whose brand the crop is packed into — `PostHarvestFacility` models the handler the crop is
    sent TO, not the owner of the brand it is packed under. OTCO routes an uncertified brand owner to its Private
    Label Agreement (PLA) form the way CCOF routes one to the Co-Packer Application; Trazo has no trigger for
    either and does not generate the PLA.
  fix: 'Repeatable `brand_owners` rows {legal name, brand names, certified yes/no, certifier, certificate on
    file + date}; when uncertified, print a checklist line "Private Label Agreement (PLA) required for: <owner>"
    — the CCOF C2 fix with OTCO''s form name.'
- ref: 8.3-3
  asks: How do you make sure that each brand owner you pack your crops for has a current organic certificate?
    Keep valid certificates onsite that list the branded products and receive updated certificates every year
    / Check the Organic Integrity Database (OID) to confirm certificates are valid / Other (explain).
  status: not_covered
  severity: P1
  trazo:
    triggered_by:
    - g7_0_labeling.product_leaves_as
    models:
    - history.SalesRecord.buyer_name is a bare string — no brand-owner record to hang a certificate or a check
      on
    prints: —
  gap: Reuses WSDA §N 7. No brand-owner entity, so nowhere to record that owner's certificate, whether it is
    current, or how it is re-checked. `sales_soe_verification_method` runs the other direction — suppliers
    the operation BUYS from — and citing it here would answer a question OTCO did not ask.
  fix: Add certificate-on-file and verification-method / cadence columns to the `brand_owners` rows (8.3-3
    fix); reuse the Organic Integrity Database check `PostHarvestFacility.verify()` already performs, stated
    as "checked against", never "verified by".
- ref: 8.3-4
  asks: 'Complete the following table with all the products you will pack for other companies: Name of Product
    / Brand or Company Name You are Packing For / Label Organic Claim.'
  status: not_covered
  severity: P1
  trazo:
    triggered_by:
    - g7_0_labeling.product_leaves_as
    prints: —
    questions:
    - g7_0_labeling.organic_label_categories
  gap: Reuses CCOF G7.0 C2. No product × brand-owner table exists; `buyer_label` says only that some product
    leaves under a buyer's label, not which product or whose brand. (8.3-5b) The § 205.301 category prints
    once for the operation, not per packed product; without the product rows (8.3-5a) there is nothing to attach
    a per-product claim to. CCOF and WSDA never ask a crop grower the tier — OTCO does, here and on C7 §7.10.
  fix: Product rows {product, brand owner} under each `brand_owners` entry (8.3-3 fix). A label-claim column
    on the 8.3-5a product rows, defaulting from organic_label_categories.
- ref: 8.3-5
  asks: Attach a Product Formulation Sheet Form (PFS-02) for each multi-ingredient product. Attached / Not
    applicable (only single ingredient products) / No products at this time.
  status: not_covered
  severity: P3
  applies_when:
  - question: certification_contract.contract_scopes
    op: includes
    value: handling
  trazo:
    triggered_by:
    - g7_0_labeling.organic_label_categories
    prints: —
  gap: Applies to an operation that handles or processes a multi-ingredient product. Trazo collects no formulation;
    whether it applies is read from the certification scopes the operation answered.
  fix: No handling module exists; the condition closes it for an operation whose answered scopes exclude handling.
- ref: 8.4 (not applicable)
  asks: N/A - No exporting activities (skip this section)
  status: covered
  trazo:
    questions:
    - g8_0_record_keeping.import_export_activity
    prints: modules/G8_0.pdf §C
- ref: 8.4-1
  asks: INTERNATIONAL LABELING AND EXPORT COMPLIANCE — N/A, no exporting activities (skip this section). Which
    countries do you export organic ingredients or products to? Canada / Japan / South Korea / India / European
    Union / Switzerland / Mexico / United States (MX operations only) / Other (explain).
  status: covered
  trazo:
    questions:
    - g8_0_record_keeping.import_export_activity
    - g8_0_record_keeping.export_destinations
    prints: modules/G8_0.pdf §C (import_export_activity — 'export' / 'none' is the N/A; export_destinations)
- ref: 8.4-2
  asks: How does your operation make sure that only compliant labels are used for exported products? Labels
    are submitted to OTCO for review and approval before printing / Other (explain). All labels must be submitted
    to OTCO for review and approval before printing; OTCO is not responsible for costs if labels are printed
    before review.
  status: partial
  severity: P1
  trazo:
    questions:
    - g8_0_record_keeping.export_destination_requirements
    - g7_0_labeling.label_claim_review_process
    prints: modules/G8_0.pdf §C (export_destination_requirements — 'how do you ensure exported product meets
      the destination country's requirements (labeling, permitted production practices)'); modules/G7_0.pdf
      §B (label_claim_review_process)
  gap: Reuses WSDA §Q CV-1 and §N 5. Export labeling is asked in prose on G8.0 page C and the internal review
    process on G7.0, and both print — but, exactly as at 8.3-1, nothing records whether an export label was
    submitted to or approved by the certifier before printing. The label review itself is a transaction between
    the operation and OTCO (the class CCOF handles on its Global Market Access Application, which ccof/scope.yaml
    excludes as export-programme enrolment); the plan's part is the submission status, which it does not hold.
  fix: The per-label {sent_to_certifier_on, approved_on} rows proposed at 8.3-1, with a market column so export
    labels are distinguishable.
- ref: 8.4-3
  asks: How does your operation make sure that the correct export documents accompany products sent to other
    countries? Documentation for each shipment is kept on-site / A transaction certificate is requested from
    OTCO when required by the destination country / Other (explain).
  status: covered
  trazo:
    questions:
    - g8_0_record_keeping.export_certificate_types
    - g8_0_record_keeping.export_certificate_process
    - g8_0_record_keeping.import_export_records
    prints: modules/G8_0.pdf §C — export_certificate_types names which certificates the destinations require;
      export_certificate_process asks 'how do you request, verify, and keep these export certificates' (who
      requests, how far ahead of shipment, where filed); import_export_records lists the shipment documents
      kept
- ref: 8.4-4
  asks: How does your operation ensure that exported products comply with the equivalency arrangement for the
    destination country? Products are submitted to OTCO for review and approval under the equivalency arrangement
    before export / Other (explain).
  status: partial
  severity: P2
  trazo:
    questions:
    - g8_0_record_keeping.export_destination_requirements
    - g8_0_record_keeping.export_certificate_types
    prints: modules/G8_0.pdf §C (export_destination_requirements, export_certificate_types)
  gap: Reuses WSDA §Q CV-1. `export_destination_requirements` is where an operation states how it meets the
    destination's permitted-practice rules and it prints; `export_certificate_types` names the arrangement's
    certificate (EU/UK/Swiss Certificate of Inspection, Canada attestation). What is not held is OTCO's specific
    mechanism — that each product was submitted to OTCO for review under the arrangement before export — nor
    the critical variances the arrangements carry (WSDA CV-2's sodium-nitrate / Canada rule), so the prose
    is the only thing standing between the plan and a variance breach.
  fix: An `equivalency_review_submitted` [boolean] per export destination and the `sodium_nitrate_used` cross-check
    proposed for WSDA CV-2.
