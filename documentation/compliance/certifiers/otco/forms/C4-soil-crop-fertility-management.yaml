# OTCO C4 — Soil & Crop Fertility Management.
#
# Source: https://tilth.org/help-center/blank-forms-all/ → C4SoilCropFertilityManagement.docx (the
# 2025 Crop OSP ZIP, folder "Main - Crop OSP"). Footer stamp `rev. 2025/08/27`. Read 2026-09-09.
#
# Ref scheme (re-cut 2026-09-30, OSP alignment audit T26). Refs are what the form prints: the
# subsection number and question number (`4.3-2`), a lettered sub-item (`4.4-1`). The earlier
# version of this file numbered items by order of appearance, gave table columns rows of their own
# and folded subsection "Not applicable" lines into the first question; all three are gone. An
# unnumbered item carries the nearest printed parent plus a description in parentheses. Rows match
# `../inventory/<this file>`, derived from the docx; gaps of merged rows are carried by the row that
# absorbed them, marked with the old ref.
#
# Registered as a DELTA against ccof/forms/G4.0-rotation-soil.yaml, ccof/forms/G4.1-compost-manure.yaml
# and wsda/forms/2121-D-soil-fertility.yaml — verdicts reused, restated in OTCO's terms. Fresh
# analysis only where OTCO differs: 4.3-2 (purchased / off-farm raw manure and the untreated-supplier
# statement — no CCOF or WSDA grower form asks manure provenance), 4.3-4's processed-manure box,
# 4.4-4 (OTCO lists vermicompost as a THIRD production method, so the option set CCOF and WSDA call a
# category error is OTCO's own shape), 4.4-5 (three named logs), and 4.5-1 (micronutrients — asked by
# WSDA D4, never by CCOF).
#
# What C4 does NOT ask: a fertility-components / "how do you manage soil health" checklist (CCOF A2,
# WSDA D2) — OTCO reads the inputs off C11 and the practices off 4.2–4.4; and a supplier process
# description for purchased compost (routed to C11 as product information). Both are in
# otco/unmapped/g4_0_rotation_soil.yaml and g4_1_compost_manure.yaml with the reasons.

form:
  code: C4
  title: "Soil & Crop Fertility Management"
  document_id: C4
  revision: "rev. 2025/08/27"
  url: "https://tilth.org/help-center/blank-forms-all/"
  pdf: "https://tilth.org/wp-content/uploads/2015/01/C4SoilCropFertilityManagement.docx"
  retrieved: 2026-09-09
  nop_cites: ["§ 205.203", "§ 205.205"]
  guide_trigger: "C1 Crop Activities Checklist — 'I/We grow crops → C4: Fertility Management' (alongside C2, C5, C6, C9, C12). Required of every crop grower; the form opens 'Complete this form for all acreage to be included under certification.'"
  required_of_every_grower: true
  trazo_module: [g4_0_rotation_soil, g4_1_compost_manure]
  register_status: complete
  source_sha256: 409e03fd6532c98dc24a3b4ad0f906486edbf68d8db2660c42d45ea81e74fb3d

items:
  - ref: 4.1 (not applicable)
    asks: N/A; No-till (skip to Section 4.2)
    status: covered
    trazo:
      questions:
      - g4_0_rotation_soil.tillage_practices
      prints: modules/G4_0.pdf §B
    note: A no-till operation says so in the tillage narrative.
  - ref: 4.1-1
    asks: 'Select all tillage practices in use throughout the season; describe further below: Discing / Ripping
      / Mowing/weeding / Manual or hand digging / Other.'
    status: covered
    trazo:
      questions:
      - g4_0_rotation_soil.tillage_practices
      prints: modules/G4_0.pdf §B; narrative § 205.203(a)

  - ref: "4.1-2"
    asks: "Indicate practices in use to protect the soil and minimize erosion: N/A, no erosion (will be verified at inspection) / Conservation (minimum) tillage / Contour farming / Leveling / Cover crop or winter cover / Micro-irrigation / Terraces / Strip cropping / Permanent ground cover / Windbreaks / Other."
    status: partial
    severity: P2
    trazo:
      questions: [g4_0_rotation_soil.erosion_practices]
      prints: "modules/G4_0.pdf §D; narrative § 205.201(a)(1)"
    gap: "Reuses CCOF G4.0 C: terraces are merged into `contour` ('Contour farming or terraces') where OTCO lists them separately, and there is no `other`. OTCO's N/A IS answerable — `erosion_practices` carries an exclusive `no_erosion` option ('Not applicable — no erosion risk on these parcels'), which is what OTCO's 'N/A; No erosion' box says; the CCOF C row's statement that this N/A cannot be expressed describes the module before that option existed."
    fix: "Add `terraces` and `other` + free text to `erosion_practices` — CCOF C's fix minus the N/A option, which already exists (flip that half of the CCOF row)."

  - ref: "4.2-1"
    asks: "Crop Rotation — Describe your crop rotation plan."
    status: covered
    trazo:
      questions: [g4_0_rotation_soil.system_type, g4_0_rotation_soil.rotation_plan]
      prints: "modules/G4_0.pdf §A; narrative § 205.201(a)(1)"
    # Reuses CCOF G4.0 A1a (`covered`). `rotation_plan` is gated on `system_type includes annual`,
    # which is OTCO's own split: the perennial answer is the in-lieu checklist at 4.2-2.

  - ref: "4.2-2"
    asks: "For perennial cropping systems (e.g., orchard, grove, bog, pasture) select all biodiversity practices used in lieu of rotation: Native grasses or natural vegetation / Diverse mixtures of native trees, shrubs, grasses, forbs / Hedgerows / Allow non-invasive plants in fencerows, ditches, understory / Windbreaks / Replace weedy areas with native plants / Insectary plants / Cover crops / Intercropping or alley cropping / Allow flowers to go to seed / Other."
    status: partial
    severity: P2
    trazo:
      questions: [g4_0_rotation_soil.in_lieu_practices, g4_0_rotation_soil.in_lieu_other]
      prints: "modules/G4_0.pdf §A; narrative § 205.205"
    gap: "Reuses CCOF G4.0 A1b's verdict on the same field, restated for OTCO's shape. OTCO asks a checklist, not a description, so CCOF's 'checkbox list where CCOF asks for a description' critique does not apply here; and OTCO scopes the question to perennial systems, so the container-only gating gap does not either. What remains is vocabulary: Trazo's six options (ground cover, cover crops, alley cropping, hedgerows/insectary plantings, short-term rotation, other) reach four of OTCO's ten named practices; native grasses, diverse native mixtures, non-invasive plants in fencerows, windbreaks, replacing weedy areas with natives and letting flowers go to seed are reachable only through `other` — several exist as options on G4.2's habitat battery, which OTCO does not cross-reference from here."
    fix: "Add `native_vegetation`, `native_mixtures`, `windbreaks`, `fencerow_understory_plants` and `flowers_to_seed` to `in_lieu_practices`; keep `other`."

  - ref: "4.3-1"
    asks: "Manure — Do you apply uncomposted (raw) animal manure? Note: animal manure that is not composted in accordance with § 205.203(c)(2) is considered raw; records must verify the composting process for manure and all materials containing manure. Yes / No (skip to Section 4.4)."
    status: covered
    trazo:
      questions: [g4_1_compost_manure.materials_applied, g4_1_compost_manure.compost_method]
      prints: "modules/G4_1.pdf §A, §C; narrative § 205.203(c)(1)"
    # Re-read 2026-11-02 by the compost and manure slice.

  - ref: "4.3-2"
    asks: "Is the manure purchased or produced off-farm? No (skip to question 3) / Yes. If yes, provide a product label or supplier statement verifying the manure is not treated with any prohibited substance. Documentation attached."
    status: covered
    trazo:
      questions: [g4_1_compost_manure.raw_manure_source, g4_1_compost_manure.raw_manure_supplier_statement, g4_1_compost_manure.raw_manure_supplier_statement_upload]
      prints: "modules/G4_1.pdf §B; narrative § 205.203(c)(1)"
    # Re-read 2026-11-02 by the compost and manure slice.

  - ref: "4.3-3"
    asks: "Is the manure applied to crops intended for human consumption? Yes / No (skip to question 5)."
    status: covered
    trazo:
      questions: [g4_1_compost_manure.raw_manure_interval_rule]
      prints: "modules/G4_1.pdf §B; narrative § 205.203(c)(1)"
    # Re-read 2026-11-02 by the compost and manure slice.

  - ref: "4.3-4"
    asks: "How is uncomposted manure applied (check all that apply)? Incorporated at least 120 days before harvest of crops with edible portions that contact soil / Incorporated at least 90 days before harvest of crops with edible portions that do not contact soil / Manure is processed or pelleted (heated to 160 °F or 150 °F for one hour with a maximum moisture of 12%)."
    status: partial
    severity: P2
    trazo:
      questions: [g4_1_compost_manure.raw_manure_interval_rule, g4_1_compost_manure.raw_manure_timing_detail, g4_1_compost_manure.materials_applied]
      prints: "modules/G4_1.pdf §A, §B; narrative § 205.203(c)(1)"
    gap: "Several rules can now be stated at once (a checkbox group since 2026.11.02). Still open: the packet's crop classifier reads `CropType.has_soil_contact`, which is True for blueberries, caneberries, kiwi and hops, so the record validation allows only a 120-day interval for them and the packet cites § 205.203(c)(1)(ii) where (iii) applies."
    fix: "Set `has_soil_contact=False` for the elevated berry, cane, kiwi and hop crop types (seeder plus data migration), so write validation, the export classifier and the interval checks agree."
    # Re-read 2026-11-02 after review of back #254: the crop classifier fix was withdrawn.

  - ref: "4.3-5"
    asks: "How do you ensure that manure applications do not contaminate water sources?"
    status: covered
    trazo:
      questions: [g4_1_compost_manure.raw_manure_water_risk]
      prints: "modules/G4_1.pdf §B; narrative § 205.203(c)"
    # Re-read 2026-11-02 by the compost and manure slice.
  - ref: 4.4 (not applicable)
    asks: N/A, No compost use (skip to section 4.5)
    status: covered
    trazo:
      questions:
      - g4_1_compost_manure.materials_applied
      prints: modules/G4_1.pdf §A
    note: An operation that selects no compost in materials_applied, or its exclusive none, has stated it.
  - ref: 4.4-1
    asks: 'Check all that apply, and provide additional information as noted: I produce compost (and/or tea),
      this compost does not contain / does contain manure; I purchase compost (and/or tea), provide product information
      in Section C11, this compost does not contain / does contain manure.'
    status: covered
    trazo:
      questions: [g4_1_compost_manure.materials_applied, g4_1_compost_manure.compost_contains_manure, g4_1_compost_manure.compost_tea_made_on_farm, g4_1_compost_manure.vermicompost_made_on_farm, g4_0_rotation_soil.fertility_inputs_listed]
      prints: "modules/G4_1.pdf §A, §C; narrative § 205.203(c)(2)"
    # Re-read 2026-11-02 by the compost and manure slice.
  - ref: 4.4-2
    asks: List all compost feedstocks/ingredients and describe the initial C:N ratio of the compost you produce.
    status: covered
    trazo:
      questions: [g4_1_compost_manure.compost_feedstocks, g4_1_compost_manure.compost_feedstocks_detail, g4_1_compost_manure.compost_initial_cn_ratio]
      prints: "modules/G4_1.pdf §C; narrative § 205.203(c)(2)"
    # Re-read 2026-11-02 by the compost and manure slice.
  - ref: 4.4-3
    asks: How is your compost produced? Windrows — must be aerated, reach 131–170 °F (55–76.7 °C) for at least
      15 days, and be turned a minimum of 5 times during the 15-day period / In-vessel or static system — must
      be aerated and reach 131–170 °F for at least 3 days / Manure-fed vermicompost with a 70–90 % moisture level,
      made under aerobic conditions.
    status: partial
    severity: P1
    trazo:
      questions: [g4_1_compost_manure.compost_method, g4_1_compost_manure.compost_temp_and_days, g4_1_compost_manure.compost_turnings, g4_1_compost_manure.vermicompost_moisture, g4_1_compost_manure.vermicompost_conditions_met]
      prints: "modules/G4_1.pdf §C; narrative § 205.203(c)(2)"
    gap: "The method, the numbers and vermicompost's conditions are all asked and print. Still open: `compost_temp_and_days` is gated on what is applied, not on the method, so a vermicompost producer must still type a thermophilic temperature answer."
    fix: "Gate `compost_temp_and_days` and `compost_turnings` on `compost_method` rather than `materials_applied`; keep the `vermicompost` option, which is OTCO's own shape."
    # Re-read 2026-11-02 by the compost and manure slice.
  - ref: 4.4-4
    asks: How and where do you document your composting processes? (will be verified at inspection) Temperature
      log / Turning log / Moisture level log / Other.
    status: covered
    trazo:
      questions: [g4_1_compost_manure.compost_temp_logs_kept, g4_1_compost_manure.compost_logs_kept, g4_1_compost_manure.compost_logs_location]
      prints: "modules/G4_1.pdf §C; narrative § 205.203(c)(2)"
    # Re-read 2026-11-02 by the compost and manure slice.

  - ref: "4.5-1"
    asks: "Micronutrients — Do you apply micronutrients (boron, zinc, copper, etc.)? Yes / No. If yes, describe how the deficiency is documented to comply with the restriction."
    status: not_covered
    severity: P2
    trazo:
      triggered_by: [g4_0_rotation_soil.fertility_components]
    gap: "Reuses WSDA D4 (`not_covered`): no field asks whether synthetic micronutrients are applied or how the deficiency is documented — the condition attached to them on the National List. `fertility_components` has a generic `blended_fertilizers` option and nothing micronutrient-specific. CCOF's G4.0 does not ask this; WSDA and OTCO both do."
    fix: "Same fix as WSDA D4: `applies_synthetic_micronutrients` [boolean] and, visible when yes, `micronutrient_deficiency_documentation` [checkbox_group]. Author the options from the CURRENT text of § 205.601(j)(7) — soil testing, plant tissue testing, or another documented and verifiable method approved by the certifying agent — not from the superseded soil-or-tissue-test-only wording."

  - ref: "4.6-1"
    asks: "Monitoring — Indicate how you monitor the effectiveness of your fertility management plan (select all that apply): Soil observation / Crop health observation / Crop yield comparison / Soil analysis / Crop quality analysis / Plant tissue analysis / Microbiological analysis / Other."
    status: partial
    severity: P1
    trazo:
      questions: [g4_0_rotation_soil.fertility_monitoring]
      prints: "modules/G4_0.pdf §C; narrative § 205.201(a)(3)"
    gap: "Reuses WSDA D1 — OTCO uses the same merged observation-plus-testing list, so CCOF B1/B2's split critique does not apply here. Vocabulary is the gap: Trazo's five options (soil tests, tissue tests, organic-matter tracking, crop health and yield observation, no testing) reach five of OTCO's eight; soil observation, crop yield comparison as distinct from health observation, crop quality analysis and microbiological analysis have no option, there is no `other`, and the exclusive `no_testing` still blocks the honest 'we observe but do not lab-test'."
    fix: "Same fix as WSDA D1: add `soil_observation`, `crop_yield_comparison`, `crop_quality_analysis`, `microbiological_testing` and `other`; drop the exclusive flag on `no_testing`."

  - ref: "4.6-2"
    asks: "If you use crop or soil tests / lab analysis, how often do you test? (results will be verified at inspection) N/A, no testing performed / With each crop / Seasonally / Annually / Other."
    status: partial
    severity: P1
    trazo:
      questions: [g4_0_rotation_soil.monitoring_frequency, g4_0_rotation_soil.fertility_monitoring]
      prints: "modules/G4_0.pdf §C; narrative § 205.201(a)(3)"
    gap: "OTCO's N/A maps cleanly: `fertility_monitoring.no_testing` hides `monitoring_frequency`, which is the same skip. Reusing CCOF G4.0 B2 / WSDA D1a for the rest: Trazo's single frequency covers ALL monitoring where OTCO asks it of lab testing only, so an operation that walks the orchard weekly and soil-tests annually has one radio for two facts and a reviewer cannot see testing frequency on its own; and the vocabulary is off — `seasonally` and `annually` match, `monthly` and `as_needed` are Trazo's, OTCO's 'with each crop' and 'other' are absent."
    fix: "Same direction as CCOF B1/B2: a `fertility_testing_frequency` distinct from the observation frequency, with `per_crop` and `other`."
