# OTCO C6 — Natural Resources & Biodiversity.
#
# Source: https://tilth.org/help-center/blank-forms-all/ → C6NaturalResourcesBiodiversity.docx (the
# 2025 Crop OSP ZIP, folder "Main - Crop OSP"). Footer stamp `rev. 2023/09/14`. Read 2026-09-09.
#
# Ref scheme (re-cut 2026-09-30, OSP alignment audit T26). Refs are what the form prints: the
# question number alone, because C6 prints no subsection number (`3`), a lettered sub-item (`2a`). The earlier
# version of this file numbered items by order of appearance, gave table columns rows of their own
# and folded subsection "Not applicable" lines into the first question; all three are gone. An
# unnumbered item carries the nearest printed parent plus a description in parentheses. Rows match
# `../inventory/<this file>`, derived from the docx; gaps of merged rows are carried by the row that
# absorbed them, marked with the old ref.
#
# Registered as a DELTA against ccof/forms/G4.2-natural-resources.yaml and wsda/forms/2121-E-
# biodiversity.yaml. C6 is CCOF's ORGB43 in a slightly longer coat: eight of its ten asks are CCOF
# A2/A2a/A3/A4/A5/A6/A7/A9/B1 with extra boxes, and 6 is CCOF A7 verbatim — so verdicts are
# reused throughout. Where a practice OTCO names sits in WSDA's NRCS vocabulary (E2's 'Brush
# management', 'Structure for wildlife'), the same Trazo field is cited as WSDA §E cites it.
# Fresh analysis only for what OTCO adds: the agency list on 1a (NRCS / FSA / Salmon Safe / SCD /
# land trust), water framed as a SHARED resource with native species (2b), and three invasive-
# control METHODS (grazing, biological control, prescribed burning) at 5.
#
# What C6 does NOT ask: irrigation water sources, water-quality testing and irrigation-district
# additives. OTCO asks those on C9 Contamination Prevention §9.2 WATER USE ('what is the source of
# your water?', 'How do you verify that the water source is free of contaminants', 'does the district
# periodically add any substances … prohibited'), so the g4_2 water questions belong to the C9
# register, not to this file — see otco/unmapped/g4_2_natural_resources.yaml for how that is handled.

form:
  code: C6
  title: "Natural Resources & Biodiversity"
  document_id: C6
  revision: "rev. 2023/09/14"
  url: "https://tilth.org/help-center/blank-forms-all/"
  pdf: "https://tilth.org/wp-content/uploads/2015/01/C6NaturalResourcesBiodiversity.docx"
  retrieved: 2026-09-09
  nop_cites: ["§ 205.200"]
  guide_trigger: "C1 Crop Activities Checklist — 'I/We grow crops → C6: Natural Resources & Biodiversity' (alongside C2, C4, C5, C9, C12). Required of every crop grower; the form opens 'Complete this form for all acreage to be included under certification, and all operations engaged in crop and animal production including greenhouses, poultry production, and other non-field organic production systems.'"
  required_of_every_grower: true
  trazo_module: g4_2_natural_resources
  register_status: complete
  source_sha256: 40d22285fb16287108c743d2356c4cb936be74735fdf5282e84a5e9f2c81346f

items:
- ref: '1'
  asks: Do you have a current conservation plan or contract? Yes / No.
  status: covered
  trazo:
    questions:
    - g4_2_natural_resources.conservation_plan_agency
    prints: modules/G4_2.pdf §B; narrative § 205.200
  note: The exclusive none option answers No; any agency answers Yes.
- ref: 1a
  asks: 'If Yes, select the agency(ies) and describe the conservation and management practices below: NRCS / FSA
    / Salmon Safe / Soil Conservation District / Land trust / Other.'
  status: covered
  trazo:
    questions:
    - g4_2_natural_resources.conservation_plan_agency
    - g4_2_natural_resources.conservation_plan_agency_other
    - g4_2_natural_resources.conservation_plan_detail
    prints: modules/G4_2.pdf §B
  note: Closed 2026-11-15. NRCS, FSA, Salmon Safe and other are options of their own; the joint federal option is
    retired (shown only while a stored answer holds it, never remapped). Soil Conservation District is `local_district`.
    `conservation_plan_detail` is a textarea.
- ref: '2'
  kind: instruction
  asks: How do you manage water for the needs of crops, livestock, native species, and riparian ecosystems?
    (Answered in a) and b).)
- ref: 2a
  asks: 'How do you manage water for the needs of crops, livestock, native species, and riparian ecosystems?
    a) I conserve water by doing the following: Plant regionally appropriate crops / Plant drought-tolerant
    natives / Use efficient irrigation / Schedule irrigations, avoid over-drafting groundwater, facilitate
    recharge / Monitor soil moisture / Encourage infiltration in fields and pastures / Locate ponds correctly
    (adhere to federal and state regulations).'
  status: covered
  trazo:
    questions: [g4_2_natural_resources.soil_water_practices, g4_2_natural_resources.soil_water_practices_other]
    prints: "modules/G4_2.pdf §A; narrative § 205.200"
  # Closed 2026-11-02 by the monitoring slice.
- ref: 2b
  asks: 'b) I do the following to share my water resources: Use fish screens / Provide clean water sources for drinking,
    bathing, nest building / Manage water for priority species (rare fish, reptiles, amphibians, birds, beavers)
    / Retain or restore vegetated riparian buffers and wetlands / Protect or improve natural hydrology and ecological
    function of riparian areas / Other.'
  status: covered
  trazo:
    questions:
    - g4_2_natural_resources.soil_water_practices
    - g4_2_natural_resources.soil_water_practices_other
    - g4_2_natural_resources.habitat_biodiversity_practices
    - g4_2_natural_resources.habitat_biodiversity_practices_other
    - g4_2_natural_resources.waterway_practices
    - g4_2_natural_resources.waterway_practices_other
    prints: modules/G4_2.pdf §A
  note: Closed 2026-11-15. Fish screens, water for priority species and riparian hydrology are on `waterway_practices`;
    a clean water source for wildlife on `habitat_biodiversity_practices`; riparian buffers and wetlands keep their
    options.
- ref: '3'
  asks: In non-crop, fallow, border and adjacent areas, how are you improving and/or maintaining natural resources?
    Manage native plants and wildlife specific to the site / Wildlife-friendly fences / Preserve or restore wildlife
    corridors / Leave areas as undisturbed habitat refuge / Preserve or restore wetlands and riparian areas / Preserve
    or restore grasslands and woodlands / Native habitats not converted to farmland since certification / Establish
    legal conservation areas / Replace weedy areas with native plants / Minimize erosion / Standing deadwood, fallen
    or rotting trees / Allow degraded areas to be recolonized by non-invasive plants and wildlife / Recognize priority
    species and habitat and create protection plans / Other.
  status: covered
  trazo:
    questions:
    - g4_2_natural_resources.habitat_biodiversity_practices
    - g4_2_natural_resources.habitat_biodiversity_practices_other
    - g4_2_natural_resources.soil_water_practices
    - g4_2_natural_resources.soil_water_practices_other
    - g4_2_natural_resources.waterway_practices
    - g4_2_natural_resources.waterway_practices_other
    - g4_2_natural_resources.wildlife_habitat_pressure
    prints: modules/G4_2.pdf §A, §B
  note: Closed 2026-11-15. CCOF A4's options plus grasslands, standing deadwood, replacing weedy areas, recolonizing
    degraded areas and priority-species plans are options of `habitat_biodiversity_practices`.
- ref: '4'
  asks: How do you manage habitat for pollinators, natural enemy insects, and other wildlife throughout the production
    season? Hedgerows / Windbreaks / Raptor perches or trees at field edge / Bird or bat boxes / Ensure a clean
    water source / Plant flowers interspersed with crops / Brush piles / Implement measures to support a variety
    of bee species / Provide extended food supply / Allow non-invasive plants in non-cropped, fallow and border
    areas / Short, medium and tall native habitat / Timing of field activities (e.g., delayed mowing to avoid disturbing
    nesting birds) / Other.
  status: covered
  trazo:
    questions:
    - g4_2_natural_resources.habitat_biodiversity_practices
    - g4_2_natural_resources.habitat_biodiversity_practices_other
    prints: modules/G4_2.pdf §A
  note: Closed 2026-11-15. CCOF A5's options plus brush piles, layered native habitat and field work timed around
    wildlife are options of `habitat_biodiversity_practices`.
- ref: '5'
  asks: What actions do you take to prevent or control invasive plant/animal species, especially those threatening
    natural areas? Learn to identify invasive plants and animals / Monitor for new introductions and control
    immediately / Suppress or remove invasive species / Plant competing beneficial native plants / Use weed-
    and pest-free seed, planting stock, soil amendments, mulches / State or federal agency controls invasive
    species / Use grazing / Use biological control / Use prescribed burning / Other.
  status: covered
  trazo:
    questions: [g4_2_natural_resources.invasive_species_practices, g4_2_natural_resources.invasive_species_practices_other]
    prints: "modules/G4_2.pdf §B; narrative § 205.200"
  # Closed 2026-11-02 by the monitoring slice.
- ref: '6'
  asks: If you restrict wildlife from entering your production areas (for food safety requirements, crop protection,
    etc.) or eliminate wildlife habitat elsewhere, what practices do you use to mitigate loss of wildlife habitat
    or degradation of natural resources? Develop or enhance habitat in other areas / Plant buffers between
    crop and habitat areas / Leave room for habitat when using fencing (riparian or corridor) / Other / Not
    applicable (explain).
  status: covered
  trazo:
    questions:
    - g4_2_natural_resources.wildlife_habitat_pressure
    - g4_2_natural_resources.wildlife_habitat_mitigation
    - g4_2_natural_resources.wildlife_habitat_mitigation_other
    prints: modules/G4_2.pdf §B; narrative § 205.200
- ref: '7'
  asks: Describe additional measures taken to conserve natural resources and enhance biodiversity.
  status: covered
  trazo:
    questions:
    - g4_2_natural_resources.other_conservation_measures
    - g4_2_natural_resources.other_conservation_measures_detail
    prints: modules/G4_2.pdf §A
  note: Closed 2026-11-15. `other_conservation_measures` and its detail.
- ref: '8'
  asks: How do you monitor farm biodiversity? Before and after photos / Plant, animal, insect surveys / Maintain
    conservation maps / Farm logs and journals / Periodic expert evaluation and report (such as NRCS) / Other.
  status: covered
  trazo:
    questions: [g4_2_natural_resources.monitoring_method, g4_2_natural_resources.monitoring_method_other]
    prints: "modules/G4_2.pdf §C; narrative § 205.201(a)(3)"
  # Closed 2026-11-02 by the monitoring slice.
