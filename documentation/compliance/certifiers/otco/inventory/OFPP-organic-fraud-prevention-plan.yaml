items:
- ref: 1-1
  text: Identify the person or people responsible for approving, implementing, training staff, and monitoring the
    Organic Fraud Prevention Plan.
  kind: question
- ref: 1-2
  text: How will you report possible organic fraud? (check all that apply)
  kind: question
- ref: 1-3
  text: If you grow perennial crops or harvest wild crops, do you buy certified organic products like seeds or planting
    stock?
  kind: question
- ref: 1-4
  text: Does your operation already have an Organic Fraud Prevention Plan?
  kind: question
- ref: 2-1
  text: Attach a map or flow chart of your supply chain. Start with the certified operations that supply to you,
    and end with your operation. Attached
  kind: question
- ref: 2-1a
  text: Submit multiple maps only if the supply chains are very different.
  kind: instruction
- ref: 2-1b
  text: Highlight the Critical Control Points in your plan; these are important steps in a process where you can
    stop or prevent fraud (refer to section 3).
  kind: question
- ref: 2-1c
  text: Include the location of suppliers, when product changes ownership, and activities like importing or exporting.
  kind: question
- ref: 2-1d
  text: Include all handling steps that happen off-site, such as transportation and storage.
  kind: question
- ref: 2-1 (simple supply chain description)
  text: 'If your supply chain is simple, you may describe it here:'
  kind: question
  optional: true
- ref: 2-2
  text: How do you approve and keep track of organic suppliers in your records?
  kind: question
- ref: 3-1
  text: Complete the table below, or attach a separate sheet, to describe the results of the vulnerability assessment.
    Attached
  kind: question
- ref: 3-1a
  text: 'Identify critical control points where there is a potential risk for fraud. You can consider things like:'
  kind: question
- ref: 3-1b
  text: 'Fraud prevention and mitigation strategies that will be implemented. You can consider things like:'
  kind: question
- ref: 3-1c
  text: 'Monitoring practices that ensure the fraud prevention strategies are effective. You can consider things
    like:'
  kind: question
- ref: 4-1
  text: How will employees be trained on the Organic Fraud Prevention Plan (OFPP) and any updates?. (check all that
    apply)
  kind: question
- ref: 5-1
  text: How do you verify that your Organic Fraud Prevention Plan is effective?
  kind: question
- ref: 5-2
  text: How often this plan is reviewed and updated?
  kind: question
