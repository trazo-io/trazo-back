overrides:
- op: set
  ref: D-1
  text: Have you, the responsibly connected, or this operation ever been certified organic? No. Skip to question
    5. Yes. Complete questions (A)-(E) below.
  reason: Rev. 2026/10/02 prints the "Yes" option as its own paragraph, which the extractor does not join to the
    question.
- op: add
  ref: Intro (expedited services)
  after: ''
  text: I request Oregon Tilth's Expedited Services and I understand that if approved, I will be charged the expedited
    service fee.
  reason: Unnumbered intake checkbox above section A.
- op: add
  ref: Intro (anticipated date)
  after: ''
  text: When do you anticipate the need for certification?
  reason: Unnumbered intake question above section A.
- op: rename
  ref: B-1
  to: B-1 (mailing)
  reason: B 1) Addresses holds three unlettered address blocks; each gets a descriptive ref.
- op: add
  ref: B-1 (billing)
  after: B-1 (mailing)
  text: Operation Billing Address (Same as Operation Mailing address above), Billing Contact Name, Billing Email
    Address.
  reason: Second unlettered address block under B 1).
- op: add
  ref: B-1 (inspected location)
  after: B-1 (billing)
  text: Operation Primary Location to be inspected (Same as Operation Mailing address above).
  reason: Third unlettered address block under B 1).
- op: add
  ref: D-1 (certificate attachment)
  after: D-1B
  text: If you are currently certified, attach a copy of your most recent organic certificate(s). Attached.
  reason: Unlettered bullet printed between D-1B and D-1C.
- op: set
  ref: F-1
  kind: instruction
  reason: Fee heading for handlers; the fee cases are a) and b).
- op: set
  ref: F-2
  kind: instruction
  reason: Fee heading for farm operations; the fee cases are a), b) and c).
- op: add
  ref: F (payment note)
  after: F-2c
  text: To pay online, visit our website at https://tilth.org/certification/fees or contact us.
  reason: Unnumbered paragraph after F 2) c).
- op: set
  ref: H-1
  kind: instruction
  reason: The membership explanation; the question is a).
- op: rename
  ref: I-B
  to: I-B (signature)
  reason: B. Signature(s) holds an unnumbered e-signature consent and the signature block.
- op: add
  ref: I-B (e-signature consent)
  after: I-A
  text: Important Information Regarding Electronic Signatures ... AGREE
  reason: Unnumbered consent checkbox under I-B.
