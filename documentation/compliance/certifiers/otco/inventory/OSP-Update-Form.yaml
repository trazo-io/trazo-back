overrides:
- op: add
  ref: Step 1 (business name, client ID, DBA)
  after: ''
  text: 'Registered Business Name: Client ID: DBA (if any):'
  reason: The form prints Step 1 to Step 6 with no question numbers except Step 5's (1) to (5); each unnumbered
    item carries its step and a description.
- op: add
  ref: Step 1 (primary contact)
  after: Step 1 (business name, client ID, DBA)
  text: 'Primary Contact Name: Email: Phone:'
  reason: The form prints Step 1 to Step 6 with no question numbers except Step 5's (1) to (5); each unnumbered
    item carries its step and a description.
- op: add
  ref: Step 1 (public contact)
  after: Step 1 (primary contact)
  text: 'Public Email: Public Phone:'
  reason: The form prints Step 1 to Step 6 with no question numbers except Step 5's (1) to (5); each unnumbered
    item carries its step and a description.
- op: add
  ref: Step 1 (contact change form)
  after: Step 1 (public contact)
  text: If additional contact changes are needed ... complete and attach a Contact Change form.
  reason: The form prints Step 1 to Step 6 with no question numbers except Step 5's (1) to (5); each unnumbered
    item carries its step and a description.
- op: add
  ref: Step 2 (continue or withdraw)
  after: Step 1 (contact change form)
  text: Request Renewal (Select one of the following below)
  reason: The form prints Step 1 to Step 6 with no question numbers except Step 5's (1) to (5); each unnumbered
    item carries its step and a description.
- op: add
  ref: Step 3 (services)
  after: Step 2 (continue or withdraw)
  text: I would like to renew/apply for the following services
  reason: The form prints Step 1 to Step 6 with no question numbers except Step 5's (1) to (5); each unnumbered
    item carries its step and a description.
- op: add
  ref: Step 3 (scopes)
  after: Step 3 (services)
  text: I would like to renew the following scopes of certification under the OTCO program
  reason: The form prints Step 1 to Step 6 with no question numbers except Step 5's (1) to (5); each unnumbered
    item carries its step and a description.
- op: add
  ref: Step 3 (production partners)
  after: Step 3 (scopes)
  text: 'Production Partners (as defined by the OTCO Fee Schedule):'
  reason: The form prints Step 1 to Step 6 with no question numbers except Step 5's (1) to (5); each unnumbered
    item carries its step and a description.
- op: add
  ref: Step 4 (OSP updates and changes)
  after: Step 3 (production partners)
  text: Please select one of the options below.
  reason: The form prints Step 1 to Step 6 with no question numbers except Step 5's (1) to (5); each unnumbered
    item carries its step and a description.
- op: add
  ref: 5-3
  kind: instruction
  after: 5-2
  text: (3) You affirm that you have read, fully understand and agree to be bound by the ... current Oregon Tilth
    Manuals
  reason: Typed (3), which the auto-number reading misses.
- op: add
  ref: 5-4
  kind: instruction
  after: 5-3
  text: (4) You will continue to operate in accordance with applicable standards and Oregon Tilth policies.
  reason: Typed (4).
- op: add
  ref: 5-5
  kind: instruction
  after: 5-4
  text: (5) You affirm that you have read, fully understand and agree to be bound by this Agreement, which includes
    the Terms & Conditions
  reason: Typed (5).
- op: add
  ref: Step 5 (electronic signature consent)
  after: 5-5
  text: By checking the box below, you willingly consent to the use of electronic signatures ... AGREE
  reason: The form prints Step 1 to Step 6 with no question numbers except Step 5's (1) to (5); each unnumbered
    item carries its step and a description.
- op: add
  ref: Step 5 (signature, date, title)
  after: Step 5 (electronic signature consent)
  text: 'Signature: Date: Title:'
  reason: The form prints Step 1 to Step 6 with no question numbers except Step 5's (1) to (5); each unnumbered
    item carries its step and a description.
- op: add
  ref: Step 6 (gross organic sales and period)
  after: Step 5 (signature, date, title)
  text: The gross organic sales for my operation are $ ... Time period of this reported sales amount
  reason: The form prints Step 1 to Step 6 with no question numbers except Step 5's (1) to (5); each unnumbered
    item carries its step and a description.
- op: add
  ref: Step 6 (payment included)
  after: Step 6 (gross organic sales and period)
  text: I have included payment according to the OTCO fee schedule.
  reason: The form prints Step 1 to Step 6 with no question numbers except Step 5's (1) to (5); each unnumbered
    item carries its step and a description.
- op: add
  ref: Step 6 (billing contact)
  after: Step 6 (payment included)
  text: Check if billing contact is the same as the primary contact identified above
  reason: The form prints Step 1 to Step 6 with no question numbers except Step 5's (1) to (5); each unnumbered
    item carries its step and a description.
- op: add
  ref: Step 6 (comments)
  after: Step 6 (billing contact)
  text: 'Comments:'
  reason: The form prints Step 1 to Step 6 with no question numbers except Step 5's (1) to (5); each unnumbered
    item carries its step and a description.
- op: set
  ref: 5-1
  kind: instruction
  reason: Step 5 reads "By signing this form, you are stating that:" and lists (1) to (5). Each is an agreement
    term the signature row executes, not a question with its own answer (the same reading as CCOF's Annual Renewal
    Contract terms 1 to 8). 2026-11-04.
- op: set
  ref: 5-2
  kind: instruction
  reason: An agreement term executed by the Step 5 signature, as 5-1.
