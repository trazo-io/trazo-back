# Every form Oregon Tilth publishes that a CROP PRODUCER files, as read from the certifier's own
# page — the outside edge this register is measured against.
#
# `test_the_published_inventory_is_fully_accounted_for` fails when a form listed here is in
# neither `forms/` nor `scope.yaml`. Adding a row is therefore a decision that has to be
# answered, which is the point.
#
# ⛔ This is a record of what the CERTIFIER publishes. Do not delete a row because we do not
# handle the form — that is what `scope.yaml` is for.
#
# PROVENANCE. OTCO publishes its crop OSP as Word files (one per section) plus a ZIP of the
# whole set ("CROP OSP - Oregon Tilth 2025"). Revisions below are the `rev. YYYY/MM/DD` stamps
# read from each file's footer on the `retrieved` date — not inferred from the listing page, and
# not the 2015 date in the upload path, which is when the file slot was created. OTCO gives
# most forms a section code (O1, C2 … C14, W1, A1, FACT-04, IS, CAF); the rest are identified
# by their published title. The accounting guard matches on `document_id` only.
#
# ⚠️ WHAT THIS FILE CANNOT DO. It is a ratchet, not a discovery mechanism: re-read the blank
# forms page when the stamps are next checked, and add what is new.
source: https://tilth.org/help-center/blank-forms-all/
retrieved: "2026-09-09"

