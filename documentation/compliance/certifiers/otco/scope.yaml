# Oregon Tilth (OTCO) forms Trazo does NOT register — and why.
#
# OTCO's C1 Crop Activities Checklist routes a grower to forms by activity; anyone comparing the
# packet against it will notice what is missing, and an unstated absence reads as an omission.
# This file is the answer, and `reason` is rendered VERBATIM onto the packet's coverage page
# (04-coverage-and-scope.pdf) for the certifying agent to read.
#
#   decision  we are deliberately not building it, with the reason. Not a gap.
#   gap       an ICP farm can hit it and we have nothing. Names where it is triggered from.
#
# `reason` is certifier-facing prose: no backticks, no backlog phrasing, no other agent's form
# identifiers (the loader refuses them). Internal detail goes in `note`, which nothing renders.
# A form with its own file in forms/ does NOT belong here — the guard enforces that.
#
# Source: https://tilth.org/help-center/blank-forms-all/ (Crop and Renewal sections), read 2026-09-09.

forms:
  - form: "T&C – Terms and Conditions"
    document_id: T&C
    disposition: decision
    reason: >-
      The certification services and trademark-use terms (rev. 2023/09/14) that bind the
      operation to its certifying agent. They carry no signature block of their own: they are
      incorporated by reference and accepted by signing the Operation Information affirmations or
      the OSP Update Application and Agreement. Nothing is drafted from the operation's records.

  - form: "C1 – Crop Activities Checklist"
    document_id: C1
    disposition: decision
    reason: >-
      The checklist that routes an operation to the plan sections its activities require. The
      packet's coverage page performs that routing for this operation in the agent's own form
      numbers, so the checklist is not reproduced as a separate document; the operation ticks it
      directly when the agent asks for it.
    note: >-
      INTERNAL. C1's routing lines are quoted as `guide_trigger` on every OTCO form file, so the
      register knows which forms C1 demands of a crop grower (O1, OFPP, C2, C4, C5, C6, C9, C12
      for "I/We grow crops"; C3, C7, C8, C11, IS on triggers).

  - form: "A1 – Aquaponics, Container, and Greenhouse Production"
    document_id: A1
    disposition: decision
    reason: >-
      Applies to crops grown in containers or aquaponics, to seedlings or transplants grown
      indoors for sale, to indoor structures that are not on certified land, and to greenhouses
      shared by organic and non-organic production. Crops grown in the ground under a high tunnel
      or hoop house do not need it. This plan does not describe those systems, so an operation
      that has any of them completes A1 with the agent directly.
    note: >-
      INTERNAL. Same scope decision as CCOF G3.1 (container/greenhouse), which is a `gap` on the
      CCOF side because CCOF asks even an N/A stub. OTCO's C1 routes to A1 only for "I/We grow
      crops in an indoor production system", so no stub is demanded of a field grower.

  - form: "C13 – Producer Group Operation"
    document_id: C13
    disposition: decision
    reason: >-
      Applies to a grower cooperative certified as one multi-site operation under an internal
      control system (7 CFR 205.201(c)). This plan describes a single operation; a producer group
      files C13 with the agent directly.

  - form: "C14 – Incubator Operation"
    document_id: C14
    disposition: decision
    reason: >-
      Applies to an incubator operation that assists start-up farms with access to land. This
      plan describes a single operation managing its own parcels; an incubator files C14 with
      the agent directly.

  - form: "W1 – Wild Crop Harvest"
    document_id: W1
    disposition: decision
    reason: >-
      Trazo ships an N/A-attestable stub module so a crop grower can record that wild-crop
      harvesting does not apply, which is what a crop-scope plan needs. An operation that does
      harvest wild crop files the full W1 with the agent directly: its designated-area,
      harvest-site history and harvest-sustainability content is outside this plan's scope of
      cultivated orchard and berry ground.
    note: >-
      INTERNAL. Mirrors the CCOF NOPB48 decision. The W2.0 stub PDF is in the ZIP, so
      `packet_coverage._UNREGISTERED_PACKET_FORMS` carries ("otco", "W1") to keep the
      exclusions list from calling it absent.

  - form: "Commercial Availability Form (CAF)"
    document_id: CAF
    disposition: decision
    reason: >-
      A worksheet documenting one commercial-availability search, one form for each non-organic
      agricultural product or ingredient. It is written mainly for handlers; a farm may use it to
      document the search for non-organic seed, which has to be made each time non-organic seed
      is planted. The plan records whether a search precedes the use of non-organic seed and
      which search records the operation keeps; the worksheets themselves are the operation's
      own records, kept for inspection rather than generated by the plan.

  - form: "Contact Change Form"
    document_id: Contact Change Form
    disposition: decision
    reason: >-
      Notifies the agent of a change to the operation's contacts and their permissions. It is an
      administrative update to the agent's client record and is filed by the operation directly.

  - form: "Crop Input Verification Evaluation (Manufacturer Declaration for Crop Inputs)"
    document_id: Crop Input Verification Evaluation
    disposition: decision
    reason: >-
      A declaration the MANUFACTURER or its legal designee completes and signs about one input
      material — ingredients, extraction methods, excluded-methods status — valid for five years.
      The operation requests it from the manufacturer for any material that is not listed by a
      third-party review agency and keeps it with its input records; the operation cannot author
      a manufacturer's own attestation.

  - form: "Land Transfer Form"
    document_id: Land Transfer Form
    disposition: decision
    reason: >-
      Transfers a parcel between two operations both certified by this agent, when the field was
      inspected within the last twelve months, so that the parcel is added without a new
      inspection. It is signed by both the releasing and the receiving operation and filed with
      the agent directly; the receiving operation's plan records the parcel once it is on its
      certificate.

  - form: "IS – Independent & Off-Site Storage"
    document_id: IS
    disposition: gap
    triggered_from: "C1 routing (stores crops at a non-certified facility that does not open, re-label or process the product, one per facility) and the C7 §7.7 storage table documentation column IS"
    reason: >-
      Trazo does not generate this sheet. It is answered and signed by the manager of the
      uncertified warehouse or storage facility, and a copy is kept by both parties. Where this
      operation stores crop it still owns at such a facility, the plan records the facility by
      name and location in its storage section; the facility's own sheet is filed with the agent
      directly.
    note: >-
      INTERNAL. Twin of the CCOF Exempt Handler Affidavit gap (NOPB107) and WSDA AGR 2519 —
      an uncertified third party in the post-harvest chain. `PostHarvestFacility` holds most of
      the content but no OC / IS / OWN documentation tri-state; C7 §7.7 rows carry the fix.

  - form: "Manure Verification"
    document_id: Manure Verification
    disposition: decision
    reason: >-
      A statement the manure SUPPLIER completes about the source and treatment of purchased
      manure. The plan records whether raw manure is applied, the pre-harvest interval it is held
      to and how water contamination is prevented, in its soil fertility section; the supplier's
      own statement is collected by the operation and kept with its input records.
    note: >-
      INTERNAL. The plan does NOT record whether manure is purchased or produced off-farm —
      `g4_1_compost_manure.materials_applied` has `raw_manure` but no provenance question, so a
      first draft of this reason claimed a fact the module cannot hold (caught by the C4 pass:
      C4 4.3-2 is `not_covered` P1). Fix lives on that row.

  - form: "Wood and Livestock Bedding Verification"
    document_id: Wood and Livestock Bedding Verification
    disposition: decision
    reason: >-
      A statement the SUPPLIER of wood products or livestock bedding completes about treatments
      and additives. The plan lists such materials on the operation's materials list; the
      supplier's own statement is collected by the operation and kept with its input records.

  - form: "OTCO Fee Schedule 2026"
    document_id: OTCO Fee Schedule 2026
    disposition: decision
    reason: >-
      The agent's published fee schedule, used with the renewal application to compute the
      certification fee from reported gross organic sales. It is the agent's own document, not a
      form the operation completes.

  - form: "Private Label Agreement (PLA)"
    document_id: Private Label Agreement
    disposition: gap
    triggered_from: "C8 §8.3 — packing organic crop into another company's brand or label when that brand owner is not itself certified"
    reason: >-
      Trazo does not generate this agreement. The plan records, in its labeling section, that
      crop leaves the operation under a buyer's label and the label claim the operation makes;
      the brand owner's certificate, or the agreement between the operation and an uncertified
      brand owner, is collected by the operation and filed with the agent directly.
    note: >-
      INTERNAL. OTCO publishes the PLA under its Processing & Handling forms, but C8 §8.3-3 sends
      a crop grower to it. Analogue of the CCOF Co-Packer Application gap (NOPB26): Trazo has no
      brand-owner record, so a farm packing into a buyer's label cannot name the party.

