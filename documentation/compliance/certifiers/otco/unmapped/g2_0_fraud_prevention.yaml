# Trazo questions in g2_0_fraud_prevention that OTCO's OFPP (Organic Fraud Prevention Plan) does
# not ask.
#
# There were none until 2026-11-02. OTCO's form is a PLAN document — team, supply-chain map, vulnerability table by
# critical control point, training, monitoring, review cadence — and it reaches every one of the
# thirteen G2.0 questions: the risk areas and their `other` are the CCP column (3-1) and the N/A
# gate (1-3); the mitigation ticks, their `other` and the testing detail are the supplier-approval
# checklist (2-3), the reporting channels (1-2), the strategies column (3-2) and training (4-1);
# the review process and implementation monitoring are the monitoring column (3-3) and Section 5
# (5-1); the review frequency and its `other` are 5-2; who keeps the plan accurate is the team
# table (1-1); and the plan upload is "plan is attached" (1-4) and the attached vulnerability
# sheet (3-4). CCOF's G8.0 §D leaves six of these unasked and WSDA §P four; OTCO is the first
# certifier in this register whose fraud-prevention form is a superset of Trazo's module.
#
# 2026-11-02: one exception since, the written supplier approval procedure WSDA AGR 2121 P5 asks
# to have attached.
questions:
  g2_0_fraud_prevention.supplier_approval_procedure_upload: >-
    A written supplier approval procedure. Asked by WSDA AGR 2121 P5; OTCO's fraud prevention plan 2-2 asks which controls are used (supplier_approval_controls), not for the procedure as a document.
  g2_0_fraud_prevention.residue_screening_method: >-
    The screening or analysis behind the operation's own product testing (laboratory, residue panel).
    Asked by WSDA AGR 2121 P 4a; OTCO's OFPP asks whether SUPPLIERS send residue results and notify the operation in writing of a residue (an option of the supplier-approval list), never the operation's own testing method or response.
  g2_0_fraud_prevention.residue_detection_response: >-
    How the operation responds when its own testing detects a pesticide residue. Asked by WSDA AGR 2121
    P 4b; OTCO's OFPP asks whether SUPPLIERS send residue results and notify the operation in writing of a residue (an option of the supplier-approval list), never the operation's own testing method or response.
  # 2026-11-14: questions added for OTCO's fraud prevention plan and WSDA AGR 2121 section P.
  g2_0_fraud_prevention.fraud_reporting_triggers: >-
    What the operation would report as suspected fraud. Asked by WSDA AGR 2121 P 6; OTCO's OFPP asks where
    fraud is reported (1-2), not what would trigger a report.
  g2_0_fraud_prevention.fraud_reporting_triggers_other: >-
    The other trigger of `fraud_reporting_triggers`; same reason.
  g2_0_fraud_prevention.employee_evaluation_frequency: >-
    How often staff are observed or evaluated. Asked by WSDA P 2; OTCO's OFPP 5-1 lists internal audits
    and records checks, not staff evaluations.
  g2_0_fraud_prevention.internal_audits_conducted: >-
    Whether internal audits are conducted, as a yes or no. Asked by WSDA P 3; OTCO's OFPP 5-1 lists
    internal audits as one tick, read through `osp_implementation_monitoring`.
  g2_0_fraud_prevention.internal_audit_scope: >-
    The scope and frequency of internal audits. Asked by WSDA P 3a; OTCO's OFPP does not ask it.
  g2_0_fraud_prevention.written_sops_kept: >-
    Whether written SOPs for organic production or handling are kept. Asked by WSDA P 1; OTCO's OFPP does
    not ask for SOPs.
  g2_0_fraud_prevention.sop_upload: >-
    The SOPs themselves, on `written_sops_kept`; same reason.
  g2_0_fraud_prevention.fraud_additional_notes: >-
    Optional notes on the section. WSDA P 7's space; OTCO's OFPP has no notes field.
