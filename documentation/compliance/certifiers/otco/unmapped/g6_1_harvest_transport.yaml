# Trazo questions in g6_1_harvest_transport that OTCO's C7 (Crop Harvest, Processing, Storage, &
# Transport) does not ask.
#
# ⚠️ C7 carries "Harvest" and "Transport" in its title and asks about neither as an activity: read
# end to end (rev. 2025/08/27), its ten sections are the on-farm facility, site plan and flow,
# processing, commingling, water, cleaning, storage, facility pests, packaging materials and
# off-site processing. Harvest and transport appear only inside the flow-chart ask (7.2-2, "how
# crops are harvested, received, processed, packaged, and stored"). OTCO puts shared and custom-
# hired EQUIPMENT — "planting, application, harvest, in-field washing, or transport" — on C9
# Contamination Prevention §9.1 (equipment table: own / rent / borrow / custom hire; cleanout
# procedure; how cleaning is documented), and harvest records, clean-truck affidavits and shipping
# records on C12 Crop Recordkeeping §12.1. Both forms are registered separately; recording these
# questions as "OTCO does not ask" without naming where OTCO does ask them would be the
# exclusion-is-not-an-absence trap.
# 2026-09-09 — `transport_units_inspected_clean` and `non_own_transport_records` REMOVED: C12 §12.1
# lists "clean truck affidavits and/or other clean transport records" as a record type, which is
# where those two answers surface for this agent. The citation is the truth.
questions:
  g6_1_harvest_transport.who_harvests: >-
    Who physically harvests the crop (own crew / custom-hired harvester / buyer). C7 never asks
    who harvests. OTCO's nearest question is C9 §9.1, which asks whether any HARVEST or transport
    equipment is used for both organic and non-organic crops and whether it is owned, rented,
    borrowed or custom-hired — a question about the equipment's exposure, not about who runs the
    crew, and registered against C9.
  g6_1_harvest_transport.who_harvests_other: >-
    Free-text elaboration of the `other` option inside Trazo's own `who_harvests`; C7 does not ask
    who harvests, so the same reasoning as its parent applies.
  g6_1_harvest_transport.sold_standing_details: >-
    Free-text description of a crop sold standing, an option inside Trazo's own `who_harvests`; C7
    does not ask who harvests, so the same reasoning as its parent applies.
  g6_1_harvest_transport.custom_harvester_cleanout_verified: >-
    Whether the custom harvester's equipment cleanout is verified before it enters organic fields.
    The obligation lives on OTCO's C9 §9.1 (equipment table with "describe equipment cleanout
    procedures to prevent contamination" and "how do you document cleaning or purging"), which is
    registered against C9. C7 asks about cleaning only for food contact surfaces inside a facility
    (§7.6).
  g6_1_harvest_transport.custom_harvester_instructions: >-
    How the custom-hired harvester is instructed to maintain organic integrity. No OTCO crop form
    asks how a hired operator is briefed; C9 §9.1 asks about the shared equipment itself. Follow-on
    detail for `who_harvests`, which C7 does not reach either.
  g6_1_harvest_transport.custom_harvester_records: >-
    Which harvest records the custom harvester provides per pass. OTCO asks for harvest records on
    C12 §12.1 ("harvest records / field tags with field identification, date, crop name, and
    quantities") of every operation, regardless of who harvests — registered against C12. C7 asks
    for no records at all.
  g6_1_harvest_transport.container_types: >-
    Which containers or bins hold the product at harvest (field bins, totes, buckets, bulk
    trailers, lugs, single-use cartons). C7 §7.9 asks a different axis — the packaging MATERIAL in
    direct contact with the product (flexible plastic, glass, metal, paper, hard plastic,
    compostable, cardboard, twine), recorded at 7.9-1 as not covered. Citing the form-factor list
    there would answer a question OTCO did not ask; it is listed as the trigger instead.
  g6_1_harvest_transport.container_types_other: >-
    Free-text elaboration of the `other` option inside Trazo's own `container_types`; same axis
    difference as its parent.
  g6_1_harvest_transport.who_transports: >-
    Who moves product off the operation (own vehicles / commercial carrier / buyer pickup). C7 asks
    nothing about transport responsibility; C9 §9.1 asks whether TRANSPORT equipment is shared with
    non-organic crops (registered against C9) and C12 §12.1 asks whether shipping records and clean
    transport records are kept (registered against C12).
  g6_1_harvest_transport.who_transports_other: >-
    Free-text elaboration of the `other` option inside Trazo's own `who_transports`; C7 asks nothing
    about transport responsibility, so the same reasoning as its parent applies.
  g6_1_harvest_transport.harvest_method: >-
    How the crop is harvested. OTCO's C7 asks about the on-farm facility, packaging material and storage, not about harvest activities.
  g6_1_harvest_transport.harvest_records_kept: >-
    Which harvest records are kept. OTCO asks for harvest records on C12 Crop Recordkeeping §12.1 of every operation, registered against C12.
  g6_1_harvest_transport.harvest_transport_records_source: >-
    Who generates the harvest and transport records. OTCO asks which records are kept (C12 §12.1), registered there, not who generates them.
  g6_1_harvest_transport.third_party_activities: >-
    Which production work other companies do for the operation. OTCO asks about custom-hired equipment in the C9 §9.1 equipment table, registered against C9.
  g6_1_harvest_transport.third_party_equipment_controls: >-
    How others' equipment is kept from contaminating organic crops. OTCO asks the cleanout procedure per piece of equipment in C9 §9.1, registered against C9.
  g6_1_harvest_transport.third_party_cleaning_documentation: >-
    What cleaning documentation is kept for others' equipment. OTCO asks how cleaning is documented in C9 §9.1-2, registered against C9.
  g6_1_harvest_transport.harvest_container_material: >-
    What harvest containers are made of. OTCO's C7 asks about the on-farm facility, packaging material and storage, not about harvest containers; C7 §7.9 asks the material of packaging in contact with the product.
  g6_1_harvest_transport.container_cleaning_records: >-
    Which records show harvest containers are cleaned. OTCO's C7 asks about the on-farm facility, packaging material and storage, not about harvest containers.
  g6_1_harvest_transport.container_cleaning_sop_upload: >-
    The container cleaning procedure file. OTCO's C7 asks about the on-farm facility, packaging material and storage, not about harvest containers.
  g6_1_harvest_transport.harvest_containers_stamped_organic: >-
    Whether harvest containers are stamped organic. OTCO's C7 asks about the on-farm facility, packaging material and storage, not about harvest containers.
  g6_1_harvest_transport.unstamped_container_safeguards: >-
    How containers not stamped organic are kept safe. OTCO's C7 asks about the on-farm facility, packaging material and storage, not about harvest containers; C7 §7.9-5 and 7.9-6 ask about reused packaging.
  g6_1_harvest_transport.receives_nondedicated_wood_bins: >-
    Whether non-dedicated wooden bins come from a packer. OTCO's C7 asks about the on-farm facility, packaging material and storage, not about harvest bins.
  g6_1_harvest_transport.handler_bin_practice: >-
    How the packer handles non-dedicated wooden bins. OTCO's C7 asks about the on-farm facility, packaging material and storage, not about harvest bins.
  g6_1_harvest_transport.handler_bin_documentation_upload: >-
    The packer's documentation of how the bins are handled. OTCO's C7 asks about the on-farm facility, packaging material and storage, not about harvest bins.
  g6_1_harvest_transport.empty_bin_storage: >-
    Where empty bins are kept between harvests. No registered OTCO question asks it; Trazo asks because bins stacked in or beside an orchard are exposed to neighbouring sprays.
  g6_1_harvest_transport.carrier_handles_beyond_transport: >-
    Whether a carrier packs, sorts, opens or labels the load. OTCO asks about shared transport equipment in C9 §9.1, not what the carrier does.
  g6_1_harvest_transport.transport_container_types: >-
    What the crop is transported in. OTCO asks about shared transport equipment in C9 §9.1 and clean transport records in C12 §12.1, both registered.
  g6_1_harvest_transport.transport_unit_cleaning_documentation: >-
    How transport units are shown clean before loading. OTCO asks for clean truck affidavits and other clean transport records in C12 §12.1, registered against C12.
  g6_1_harvest_transport.transport_shared_with_noncertified: >-
    Whether organic product shares a transport unit with non-organic product. OTCO asks how commingling is prevented during transport from the field in C9 §9.4-2, registered against harvest_transport_separation.
  g6_1_harvest_transport.shared_transport_segregation: >-
    How organic product is kept separate in a shared unit. OTCO asks it within C9 §9.4-2, registered against harvest_transport_separation.
  g6_1_harvest_transport.first_stop_before_buyer: >-
    Whether the crop stops at a hydrocooler, cold storage or consolidation point before the buyer. OTCO asks about off-site processing in C7 §7.10, registered against handled_by_another_operation.
  g6_1_harvest_transport.packaging_contamination_safeguards: "WSDA L 17's packaging safeguards (new only, stamped organic, cleaned, cardboard unexposed, wood lined). OTCO C7 asks packaging proof and reuse (7.9-2 to 7.9-6), each registered there, not this checklist."
  g6_1_harvest_transport.packaging_contamination_safeguards_other: "WSDA L 17's packaging safeguards (new only, stamped organic, cleaned, cardboard unexposed, wood lined). OTCO C7 asks packaging proof and reuse (7.9-2 to 7.9-6), each registered there, not this checklist."
