# Trazo questions in g6_5_sales_soe that OTCO's C8 (Crop Labeling & Sales) does not ask.
#
# "Sales" in C8's title means private-label packing (§8.3) and export (§8.5). Read end to end
# (rev. 2025/08/27), C8 asks nothing about sales channels and nothing about buying in or reselling
# other operations' product. OTCO asks supplier approval and certificate checks on the OFPP
# (Organic Fraud Prevention Plan — "how do you approve and keep track of organic suppliers"; "we
# check that the supplier's organic certificate is current"; "updated organic certificates at
# least once a year") and sourced-product record linkage on C12 Crop Recordkeeping §12.2 ("do you
# source organic agricultural products … records that clearly link the purchase and transport …
# back to the last certified entity"). Both are registered separately; the entries below name that
# routing rather than a bare "OTCO does not ask".
# 2026-09-09 — `sales_soe_supplier_verification`, `sales_soe_verification_method` and
# `sales_soe_channels` REMOVED: C12 §12.2 Q4/4a ask whether sourced organic products are traced
# back to the last certified entity and how, and OFPP Section 2 asks for the supply chain to be
# described. The citation is the truth.
questions:
  g6_5_sales_soe.sales_soe_lot_linkage: >-
    Describes the link from a sale back to the harvest lot. OTCO C8 8.1-1a asks the link from the
    container identifier to the product's origin, answered by g7_0_labeling.container_lot_linkage_description;
    the sales audit trail is asked at C12.
  g6_5_sales_soe.sourcing_transport_verification: >-
    How bought-in product is kept from prohibited substances in transit. CCOF G6.5 A3 asks it; OTCO's forms ask how the operation's own transport is kept clean (C7), not a supplier's.
  g6_5_sales_soe.sourcing_transport_verification_other: >-
    The "other" description of that method; same reason.
  g6_5_sales_soe.sourcing_transport_commingling: >-
    How bought-in product is kept from commingling in transit. CCOF G6.5 A4 asks it; OTCO does not ask it of sourced product.
  g6_5_sales_soe.sourcing_transport_commingling_other: >-
    The "other" description of that measure; same reason.
  g6_5_sales_soe.sales_soe_channels: >-
    The sales channels, described. It stood in for the OFPP's simple supply chain description (2-1) until
    that row got its own question, `g2_0_fraud_prevention.supply_chain_description`, on 2026-11-14; no
    other OTCO row asks the channels as prose.
  g6_5_sales_soe.sales_soe_supplier_verification: >-
    How bought-in product is verified. It stood in for OTCO C12 12.2-4's sourcing yes or no until that row
    got its own question, `g8_0_record_keeping.sources_organic_products`, on 2026-11-15; OTCO asks
    supplier approval and certificate checks on its fraud prevention plan (2-2), answered by G2.0.
  g6_5_sales_soe.direct_sales: >-
    Direct sales to consumers, asked for CCOF G6.5 B and C. OTCO's C8 asks private-label packing and export, not direct marketing venues or point-of-sale signage.
  g6_5_sales_soe.direct_sales_venues: >-
    Direct sales to consumers, asked for CCOF G6.5 B and C. OTCO's C8 asks private-label packing and export, not direct marketing venues or point-of-sale signage.
