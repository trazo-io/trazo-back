# Trazo questions in g3_2_planting_stock that OTCO's C3 (Seeds, Planting Stock & Transplants) does
# not ask.
#
# C3 reaches more of this module than CCOF's G3.0 does and less than WSDA's §C: it asks about
# vegetative "other planting stock" as its own category (3.1-4, where `stock_types_established` is
# cited — a question both CCOF and WSDA leave unmapped), about contract-produced stock and its
# documentation (3.1-5), and about farm-grown stock used "for planting or sale" (3.2-2, where
# `stock_sold_as_organic` is cited). What it does not ask is the follow-through on any of those:
# the twelve-month rule behind a sale, treatments on the stock itself, and a supplier list.
# 2026-09-09 — `suppliers_on_supplier_list` REMOVED from this file: OTCO's C12 (sourced organic
# products trace-back) and OFPP Section 2 (supplier approval — "we use a supplier list") cite it,
# so it has a counterpart on this certifier's forms after all; the citation is the truth.
questions:
  g3_2_planting_stock.stock_treatments: >-
    Whether non-organic planting stock was treated before or at delivery (fungicide dip, wax, root
    gel). C3 §3.5 SEED TREATMENTS is scoped to seed — "Identify all seed treatments in use" — and
    3.1-5's documentation question is about the inputs a CONTRACT GROWER used in production, not
    about a nursery's post-harvest dip on stock bought off the shelf. WSDA asks the stock case at
    §C 3c; CCOF and OTCO do not.
  g3_2_planting_stock.organic_management_start_date: >-
    When organic management of planting stock that will be SOLD as organic began — the start of the
    § 205.204(a)(4) twelve-month clock. C3 §3.2 asks only whether farm-grown perennial stock is
    used "for planting or sale" (cited at 3.2-2 through `stock_sold_as_organic`) and never follows
    the sale with the one-year requirement, the date, or an attestation. CCOF asks it at G3.0 A3b
    and WSDA at §C 4a.
  g3_2_planting_stock.twelve_month_attestation: >-
    The operator's confirmation that no planting stock is sold or labelled organic before twelve
    months of organic management. Companion to `organic_management_start_date`; same reason — C3
    stops at "for planting or sale".
  g3_2_planting_stock.organic_stock_verification_method: >-
    How organic planting stock is verified. WSDA AGR 2121 C2a asks it; OTCO's C3 3.1-3 records the status only.
  g3_2_planting_stock.organic_stock_treatments: >-
    Treatment of ORGANIC planting stock. WSDA AGR 2121 C2b asks it; OTCO's C3 3.5 is about seed treatments.
  g3_2_planting_stock.nonorganic_stock_for_organic_crop: >-
    Whether nonorganic stock grows a crop sold as organic. CCOF G3.0 A3a asks it; OTCO's C3 does not.
  g3_2_planting_stock.first_organic_harvest_handling: >-
    How growth present on nonorganic stock is kept out of the first organic harvest. CCOF G3.0 A3a(i) asks it; OTCO does not.
  g3_2_planting_stock.first_organic_harvest_handling_other: >-
    The other-handling detail of the question above; same reason.
  g3_2_planting_stock.stock_treatment_applied_by: >-
    Who applied a treatment to nonorganic stock. WSDA AGR 2121 C3c asks it; OTCO's C3 does not ask about stock treatment.
  g3_2_planting_stock.twelve_month_records_description: >-
    Records behind the 12-month clock. WSDA AGR 2121 C4a asks it; OTCO's C3 3.2-2 asks only what is farm grown for sale.
  g3_2_planting_stock.resold_stock_labeling_description: >-
    How resold planting stock is labeled. WSDA AGR 2121 C4b asks it; OTCO's C3 does not.
  g3_2_planting_stock.planting_stock_additional_notes: >-
    A free-text notes field. WSDA AGR 2121 C5 offers one; OTCO's C3 has none.
  g3_2_planting_stock.resold_stock_bought_nonorganic: >-
    Whether planting stock sold as organic was bought as nonorganic stock. C3 3.2-2 stops at stock used for planting or sale; CCOF G3.0 A3b and WSDA AGR 2121 C4 ask it.
