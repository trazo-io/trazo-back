# Trazo questions in g3_1_seedlings that OTCO's C3 (Seeds, Planting Stock & Transplants) does not ask.
#
# C3 asks `seedlings_description` at 3.1-2 ("Certified organic seedlings (list supplier(s)…)"), and
# since 2026-11-05 the supplier panel answers its "attach certificate(s)"; the growing-site questions
# added 2026-10-31 answer 3.2-1 and 3.2-2. The labeling question below is WSDA's, not OTCO's; the
# plan-level upload is superseded for 3.1-2 by the supplier register copies.
questions:
  g3_1_seedlings.seedlings_labeling_description: >-
    How sold seedlings are labeled. WSDA AGR 2121 B3a asks it; OTCO's C3 3.2-2 asks only whether farm-grown seedlings are sold.
  g3_1_seedlings.seedlings_upload: >-
    A plan-level file, tied to no supplier and no purchase. Since 2026-11-05 the certificate each seedling supplier's purchase needs is the copy in the supplier register, which the G3.0a supplier panel (`seedling_suppliers_panel`) reads and the packet carries under suppliers/. A file uploaded here still rides in the packet under attachments/ and is listed on G3.0a; it answers no form item by itself.
