# Trazo questions in g4_2_natural_resources that OTCO's forms do not ask.
#
# None. C6 is CCOF's ORGB43 with more boxes, so it reaches the whole apparatus WSDA's §E leaves out —
# the conservation agreement (6.1-1/6.1-2), habitat pressure and its mitigation (6.1-5, 6.1-8),
# invasive species (6.1-7) and outcome monitoring (6.1-10) — and every non-water question of the
# module is cited by an otco/forms/C6 row.
#
# The seven WATER questions (`irrigation_water_sources`, `water_quality_tested`,
# `water_quality_test_frequency`, `water_from_irrigation_district`, `irrigation_district_additives`,
# `irrigation_district_mitigation`, `irrigation_district_documentation`) are not unmapped either:
# OTCO asks them on C9 Contamination Prevention §9.2 WATER USE ("what is the source of your water?",
# "How do you verify that the water source is free of contaminants", "does the district periodically
# add any substances … prohibited in organic production"), and the C9 register cites them there —
# the same split CCOF makes between G4.2 and G6.0 D1–D5. C6 itself asks how water is MANAGED and
# SHARED (6.1-3, 6.1-4), never where it comes from or whether it is tested.
#
# This file exists so the module's accounting is explicit rather than inferred from a missing file.
questions:
  g4_2_natural_resources.irrigation_efficiency_monitoring: >-
    How irrigation efficiency is checked. Asked by WSDA AGR 2121 E10; OTCO C6 2a lists water conservation practices, soil-moisture monitoring among them, without asking how efficiency is checked.
  g4_2_natural_resources.irrigation_efficiency_monitoring_other: >-
    Describes an "other" answer to `irrigation_efficiency_monitoring` above; same reason.
  g4_2_natural_resources.shared_irrigation_mitigation: >-
    How contact with materials in shared irrigation water is prevented (CCOF G6.0 D5). OTCO C2 2.3-3 asks
    for the valves and backflow devices on the parcel map or a piping diagram, which
    `irrigation_piping_map_upload` takes; it never asks for a description of how contact is prevented.
  g4_2_natural_resources.irrigation_district_piping_map_upload: >-
    The piping diagram when the irrigation district adds materials to the water (CCOF G6.0 D5). OTCO asks
    about district additives in C9 9.2-1b without a diagram, and asks for a diagram (C2 2.3-3) only when the
    operation's own irrigation carries prohibited materials to non-organic land.
  g4_2_natural_resources.streams_or_channels_adjacent: >-
    WSDA AGR 2121 section E ref 16 asks whether streams, shorelines, gullies or irrigation channels are
    on or adjacent to the certified sites. OTCO C6 asks how water is managed for riparian ecosystems
    (2b), never whether streams or channels are present.
