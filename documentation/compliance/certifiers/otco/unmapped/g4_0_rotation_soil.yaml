  g4_0_rotation_soil.rotation_records_kept: >-
    The records kept of the crop rotation. Asked by WSDA AGR 2121 E 1b; OTCO's rotation question asks the
    plan, not its records.
  g4_0_rotation_soil.applies_fertilizers: >-
    Whether fertilizer or other nutrients are applied, as a yes or no. Asked by WSDA AGR 2121 E 11 ahead
    of its nutrient water-quality list; OTCO reads the fertility components instead.
