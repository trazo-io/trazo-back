# Trazo questions in parcel_application that OTCO's parcel forms do not ask.
#
# OTCO's parcel content lives on two forms, both registered: C2 Crops Acreage & Land History (filed
# once per non-adjacent parcel — location, tenure, crops, boundaries and buffers, map, 36-month land
# history, signed affirmations) and FACT-04 Field, Acreage, Crop Table (the annual parcel × acreage
# × status × crops statement C2's header routes updates to). The questions below have no OTCO
# ask on either form (2026-11-06: tenure's landowner details and WSDA's whole-or-portion question
# joined the original three); each reason names where
# OTCO puts the topic instead, because an exclusion is not an absence (README, trap #1). Verified
# against the C2 and FACT-04 text on 2026-09-09: neither contains the words "container",
# "greenhouse" or "livestock".
questions:
  parcel_application.container_production: >-
    Whether the parcel is container or greenhouse production. C2 asks nothing about the production
    system — its only nod to protected ground is the "Acres or SQ FT" unit on the crops table — and
    its land-history section applies to every parcel alike. OTCO routes indoor systems to a
    different form: the C1 Crop Activities Checklist sends "I/We grow crops in an indoor production
    system (Aquaponic, Container, Greenhouse)" to A1 Aqua/Container/Greenhouse, which is not a
    parcel_application form. CCOF asks the same yes/no on its Parcel Application (A9, F3) because it
    gates the land-history section there; OTCO does not gate it.
  parcel_application.livestock_present: >-
    Whether livestock is kept on the parcel. C2 has no livestock section and FACT-04 lists pasture
    as a CROP with acreage ("Pasture (60 acres)"), not as livestock use. CCOF puts §C livestock on
    its Parcel Application because one form serves crop and livestock parcels; OTCO's crop OSP set
    (O1, OFPP, A1, C1–C14, W1, IS, FACT-04, Land Transfer) contains no livestock form, and its C1
    checklist routes crop activities only — a grazier files OTCO's separate livestock OSP.
  parcel_application.livestock_detail: >-
    The livestock and manure-management description shown when `livestock_present` is yes. Same
    reason: neither C2 nor FACT-04 asks about livestock on a crop parcel. Manure APPLIED to the
    parcel is a different question — it is a material in C2's 2.4 land-history table
    (Material Name / Manufacturer, example "Chicken Manure / On-farm"), cited at C2 2.4-8.
  parcel_application.prior_certificate_site_number: >-
    Asked by WSDA AGR 2264 ref 6 and AGR 2262 ref 5 — WSDA assigns each certified site its own
    number. OTCO C2 2.1-7 asks for the certified operation's name and agency and 2.4-2 for a copy of
    the certificate; the field or parcel is identified by name and APN on the certificate, not by a
    certifier-assigned site number.
  parcel_application.no_inputs_within_tenure: >-
    Asked by WSDA AGR 2264 ref 13 ('N/A — No input materials have been applied while under my
    management'). OTCO's C2 land history asks for the materials applied and the last prohibited
    application, not for a statement that no input of any kind was applied.
  parcel_application.planned_crops: >-
    Asked by CCOF's Crop Update (ORGB88, crops "current or planned within the next 12 months") and read for
    WSDA's Site Update (AGR 2516, "your current plan for the coming year"). OTCO updates currently certified
    acreage on FACT-04, whose "Crop(s) and Acreage" column the field and crop workbook fills from the land
    history; no OTCO question asks for a plan apart from it.
  parcel_application.landowner_name: >-
    WSDA AGR 2264 ref 7a/7b ask, for a site the operation does not own, the land owner's name, email,
    phone and address, and the lease details and who manages day to day. OTCO C2 asks the tenure (2.1-6)
    but not who the owner is or how to reach them.
  parcel_application.landowner_email: >-
    WSDA AGR 2264 ref 7a/7b ask, for a site the operation does not own, the land owner's name, email,
    phone and address, and the lease details and who manages day to day. Not asked by OTCO.
  parcel_application.landowner_phone: >-
    WSDA AGR 2264 ref 7a/7b ask, for a site the operation does not own, the land owner's name, email,
    phone and address, and the lease details and who manages day to day. Not asked by OTCO.
  parcel_application.landowner_address: >-
    WSDA AGR 2264 ref 7a/7b ask, for a site the operation does not own, the land owner's name, email,
    phone and address, and the lease details and who manages day to day. Not asked by OTCO.
  parcel_application.lease_management_detail: >-
    WSDA AGR 2264 ref 7a/7b ask, for a site the operation does not own, the land owner's name, email,
    phone and address, and the lease details and who manages day to day. Not asked by OTCO; C2 2.1-6
    records the tenure itself.
  parcel_application.full_prior_site_area: >-
    WSDA AGR 2264 ref 6b asks whether the whole previously or currently certified site is applied for or
    only a portion. OTCO C2 2.1-7 asks only whether the parcel is currently certified and by whom; the
    acreage applied for is stated on FACT-04.
