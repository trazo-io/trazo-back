# External Services for Trazo Django Development
# Use with Poetry for Django development: poetry run python manage.py runserver

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: trazo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-trazo_dev}
      POSTGRES_USER: ${DATABASE_USER:-postgres}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${DATABASE_PORT:-5432}:5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DATABASE_USER:-postgres} -d ${DATABASE_NAME:-trazo_dev}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for Celery and Caching
  redis:
    image: redis:7-alpine
    container_name: trazo-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # MailDev for Email Testing
  maildev:
    image: maildev/maildev:2.1.0
    container_name: trazo-maildev
    restart: unless-stopped
    ports:
      - "1080:1080" # Web interface
      - "3025:1025" # SMTP server
    environment:
      MAILDEV_WEB_PORT: 1080
      MAILDEV_SMTP_PORT: 1025

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
