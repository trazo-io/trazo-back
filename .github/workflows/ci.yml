# Trazo backend CI — compliance and claim-safety suites.
#
# WHY THIS FILE MOVED HERE (2026-09-07)
# -------------------------------------
# This job set was written on 2026-08-11 at `~/dev/trazo/.github/workflows/ci.yml`, against a
# monorepo layout that does not exist. `~/dev/trazo` is not a git repository; `trazo-app`,
# `trazo-back` and `trazo-landing` are three separate repos with three separate remotes. The
# file was tracked by none of them, so GitHub never saw it and **not one of these steps has
# ever run**. Every `working-directory: trazo-back` and `trazo-back/`-prefixed path in the
# original is why: they only resolve from a root that is never checked out.
#
# The content was right and is preserved verbatim below. Only the paths changed.
#
# This is the same failure class the file itself was written to fix: `npm run typecheck`
# worked perfectly and nothing ran it. A gate nobody runs is not a gate — and a gate in a
# directory git cannot see is not even a file.
#
# ENFORCEMENT POSTURE — measured 2026-08-11, carried forward unchanged
# -------------------------------------------------------------------
#   BLOCKING (green when last measured):
#     claim-safety + compliance suites ... 183 tests, OK
#     formatting (black + isort) ......... clean over 792 files
#
#   NON-BLOCKING (count recorded so drift stays visible):
#     pip-audit .......................... Was un-greenable while Django sat at 4.1.4 (EOL
#                                          2023-12-01). The 5.2 LTS upgrade landed the same
#                                          day this file did, so the blocker is gone — flip
#                                          `continue-on-error` off once one real CI run has
#                                          reported the advisory count. See ADR-010.
#
# PYTHON VERSION — 3.12 everywhere, deliberately.
# Before 2026-09-07 three places disagreed: `runtime.txt` said python-3.9.5 (EOL 2025-10-31),
# `Dockerfile` said 3.11, this file said 3.13. That stopped being a tidiness problem the
# moment Django 5.2 landed, because 5.2 requires Python >= 3.10 — a build from the old
# runtime.txt would have failed outright. All four are now 3.12 (supported to 2028-10-31,
# comfortably past Django 5.2 LTS's 2028-04-30).

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — compliance and claim-safety suites
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: trazo_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
      # dev.py points CACHES at django_redis and django_ratelimit uses the cache, so without
      # this the suite fails on cache access rather than on anything under test.
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 10s
          --health-timeout 5s --health-retries 5
    env:
      DEBUG: 'True'
      DJANGO_SETTINGS_MODULE: backend.settings.dev
      # base.py does `config("SECRET_KEY")` with NO default, so this is not optional —
      # without it Django raises UndefinedValueError before any test is collected.
      SECRET_KEY: ci-only-not-a-real-secret
      # dev.py reads these individual keys through python-decouple. It does NOT read
      # DATABASE_URL; setting that instead silently falls back to the `trazo_dev` default
      # and fails to connect.
      DATABASE_NAME: trazo_ci
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres
      DATABASE_HOST: localhost
      DATABASE_PORT: '5432'
      REDIS_URL: redis://localhost:6379/1
      CELERY_TASK_ALWAYS_EAGER: 'True'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pipx install poetry
      - run: poetry install --no-interaction

      # Scoped on purpose. The full suite takes ~24 minutes and carries pre-existing
      # failures in unrelated modules; a red-by-default job is one nobody reads. These are
      # the suites that gate regulatory claims and the certifier packet — the ones where a
      # regression is externally visible. Widen as modules go green, never by adding the
      # whole codebase in one process (that fabricates hundreds of phantom errors).
      #   test_anonymous_endpoint_inventory — fails on any anonymous API endpoint that has not
      #     been written down and reviewed. It is what caught
      #     `companies/public/establishments/<pk>/` publishing street address, coordinates, ZIP,
      #     contact details and unqualified certification claims with no permission class at all.
      #   test_public_serializer_leakage — the serializer-level counterpart to the sweep above.
      #   test_scan_count_consistency — one definition of a countable scan across the Buyer page,
      #     dashboard metrics and the billing quota.
      #   test_starter_bounded_by_outputs — the Starter/Compliance boundary. Starter is bounded
      #     by its OUTPUT, not by how much it can log. Mutation-verified: neutering the gate
      #     fails 5 of these.
      #   test_compliance_export_door_inventory — walks the URLconf and fails on any route that
      #     hands out a document while neither calling the gate nor appearing in a reviewed
      #     exemption list. Two of the six doors were found ONLY by this enumeration.
      #   test_starter_is_free_forever — Starter has no trial clock.
      #   test_binding_clause_coverage — the 7 CFR 205 clause map: every verbatim is checked
      #     against the frozen corpus, every named implementation file must exist, and every
      #     binding section must be either mapped or refused in writing. Added to CI
      #     2026-09-07: it had never run here, and it reads the corpus in setUpClass, so a
      #     missing corpus errors the suite rather than skipping it.
      #   test_certifier_conformance_register — checks the published register against
      #     MODULE_REGISTRY in both directions: a question the register cites must still
      #     exist, and a question added to a mapped module must be cited or recorded in
      #     unmapped/ with a reason. Briefly removed from this list on 2026-09-07 when it
      #     errored in CI; that was the wrong call — the register was missing because it
      #     lived outside the repository, which was a PRODUCTION defect, not a CI quirk.
      #     Restored once the register moved into this repo.
      # 🔴 2026-09-07 — the carbon.* lines are new, and the reason they are here is that the
      # factor guards were RED for nine months and nobody saw it. `test_emission_factors` demanded
      # phosphorus 1.25 / potassium 0.60 / electricity 0.40 while the registry had moved to
      # 1.19 / 0.65 / 0.39. A permanently red guard warns nobody, and no carbon test ran in CI at
      # all, so there was nothing to go red in front of anyone.
      #
      # In that state two things went unnoticed: the US electricity factor did not follow from
      # the source cited for it (0.39 is EPA's Equivalencies Calculator figure on eGRID2022 data;
      # the citation named eGRID2023, which gives 0.365), and the phosphorus/potassium factors
      # were attributed to an EPA publication that contains no fertilizer factors — an attribution
      # that had reached the public methodology page on the marketing site.
      #
      # `test_factor_sources_are_citable` is the chokepoint that makes the second class
      # impossible: a factor may only claim PROVENANCE_PUBLISHED if its source string is on an
      # allowlist of documents a human has opened. The rest of the carbon suite is NOT here —
      # 135 of its 694 tests are red against removed model kwargs, and a red-by-default job is
      # one nobody reads. Widen as those are cleaned up. See
      # documentation/audits/CARBON_SURFACE_AUDIT_2026-09-07.md.
      #
      # 🔴 2026-09-08 — `carbon.tests.test_blockchain` joins them, rewritten. The blockchain
      # tranche found the same shape one layer down: `BLOCKCHAIN_ENABLED` had defaulted False
      # since 2026-08-06, yet eight carbon routes were still live and still answering 200,
      # because the flag only put the service into mock mode. `blockchain/batch-verify/`
      # returned `{"status": "completed", "transaction_hashes": ["0x000...0", ...]}` for any
      # production ids an authenticated caller named. Those routes and six of the seven
      # blockchain service modules (3858 lines) are gone; `carbon/services/blockchain.py` stays
      # because it writes the hash the certifier packet's integrity line cites.
      #
      # Its old test file had 18 tests and 15 of them were broken: 14 errored with AttributeError
      # against 12 distinct methods that do not exist on the service, and the 15th demanded that
      # disabling blockchain CRASH production — failing against correct code, in a suite CI never
      # ran. The rewrite
      # asserts what the surviving module may say: off means off in both directions (no crash,
      # no invented record), a mock never claims verified, and a hash mismatch is never reported
      # as blockchain_verified.
      #
      # 🟡 2026-09-10 — `carbon.tests.test_voice_language_mode` pins voice recognition's default
      # to the app locale. Deepgram's language detection ("multi") dropped a word from Spanish
      # notes in 5 of 5 runs through the real app, usually the block name; a default flipped to
      # it would delete words from records with nothing on screen saying so.
      #
      # 🟡 2026-09-23 — `carbon.tests.test_offsets_are_not_self_verified` pins the offset write
      # paths. Five of them stamped `verification_status="verified"` on operator-entered offsets,
      # one deriving it from the request body's own `verification_level` and one on the same call
      # that recorded `data_source="User-created offset"`. Netted against emissions those rows
      # produced a green "Carbon Stored" badge on the public QR page — the self-created label
      # EU ECGT 2024/825 bans (effective 2026-09-27), FTC 16 CFR 260.5/260.4. The guard reads the
      # source rather than the endpoints, which need a signed session, CSRF and an anti-gaming
      # payload; a guard nobody can run is the failure this whole file was written about.
      #
      # 2026-09-24 - `certifications.tests.test_omri_seed_names` pins the committed OMRI seed
      # against the shape of OMRI's own product names. 228 of 9,230 rows carried the list's
      # printed page number glued to the front of the name ("150 Neptune's Harvest Soluble
      # Seaweed Powder"). A wrong product name under a real OMRI code puts words in a
      # third party's mouth on a certifier packet and on the buyer page.
      #
      # test_season_plan_not_records is listed CLASS BY CLASS, not as a module. Its
      # ProhibitedInputVocabularyIsOneList class reads
      # trazo-app/src/views/.../QuickStartProduction.tsx through parents[3], which resolves
      # OUTSIDE this repository, and it calls self.fail() when the sibling checkout is absent
      # rather than skipping (deliberately: a guard that no-ops in half the checkouts is
      # decorative). This job checks out one repo, so naming the module would make the job fail
      # on every run. The classes above hold the rule CLAUDE.md names: a template produces a
      # PLAN (a window), never a dated grower-attributed RECORD. The cross-repo parity class
      # stays a local-only guard, unchanged.
      - name: Claim-safety and compliance suites
        run: |
          poetry run python manage.py test \
            history.tests.test_anonymous_endpoint_inventory \
            history.tests.test_consumer_qr_privacy_regression \
            history.tests.test_cross_surface_claim_safety \
            history.tests.test_public_serializer_leakage \
            history.tests.test_public_claim_fabrication \
            history.tests.test_scan_count_consistency \
            history.tests.test_sales_and_lot_tag \
            history.tests.test_sales_disclosure_precedence \
            history.tests.test_event_subtype_validation \
            history.tests.test_business_event_validation \
            history.tests.test_models \
            history.tests.test_event_tenancy \
            history.tests.test_season_plan_not_records.StartProductionWritesNoRecords \
            history.tests.test_season_plan_not_records.APlanItemCarriesNoValues \
            history.tests.test_season_plan_not_records.WindowParsing \
            history.tests.test_season_plan_not_records.SeasonPlanEndpoints \
            history.tests.test_season_plan_not_records.PlanBuildEdgeCases \
            history.tests.test_season_plan_not_records.PlanFollowsTheRecords \
            history.tests.test_pest_zero_carbon_card \
            certifications.tests.test_osp_evidence_map \
            certifications.tests.test_certifier_conformance_register \
            certifications.tests.test_binding_clause_coverage \
            certifications.tests.test_packet_coverage_page \
            certifications.tests.test_attestation_over_empty_list \
            certifications.tests.test_parcel_page_states_only_what_records_support \
            certifications.tests.test_prohibited_input_refused \
            certifications.tests.test_post_harvest_facility_reaches_plan \
            certifications.tests.test_omri_seed_names \
            subscriptions.tests.test_starter_bounded_by_outputs \
            subscriptions.tests.test_compliance_export_door_inventory \
            subscriptions.tests.test_starter_is_free_forever \
            carbon.tests.test_factor_sources_are_citable \
            carbon.tests.test_retired_claim_routes_stay_retired \
            carbon.tests.test_offsets_are_not_self_verified \
            carbon.tests.test_factor_provenance \
            carbon.tests.test_emission_factors \
            carbon.tests_emission_factors \
            carbon.tests.test_hardcoded_factors_audit \
            carbon.tests.test_emission_factor_validation \
            carbon.tests.test_electric_equipment_emissions \
            carbon.tests.test_irrigation_pump_energy \
            carbon.tests.test_pumping_plant_and_traps \
            carbon.tests.test_zero_is_not_missing \
            carbon.tests.test_blockchain \
            carbon.tests.test_voice_language_mode \
            carbon.tests.test_voice_suggestion_has_no_date \
            carbon.tests.test_voice_transcript_is_data \
            carbon.tests.test_voice_extraction_cannot_hang \
            carbon.tests.test_voice_budget \
            fieldnotes.tests.test_inbound_webhook \
            fieldnotes.tests.test_roster_is_per_company \
            fieldnotes.tests.test_no_machine_authored_record \
            fieldnotes.tests.test_roster_admin \
            --noinput

      # The published conformance statement is generated from the register. Regenerating here and
      # comparing is what stops it from being hand-edited or left stale after a register change —
      # a document whose numbers disagree with its own source is worse than no document.
      #
      # This ran as a conditional skip for exactly one day (2026-09-07), because
      # `certifier_register.py` resolved the register through `parents[3]` — the directory
      # ABOVE this repository, which git does not track and Docker does not copy. The register
      # has since moved INTO this repo and the path is `parents[2]`, so the check is
      # unconditional again. If it starts skipping, something moved it back out.
      - name: Certifier conformance statement is current
        run: poetry run python manage.py certifier_conformance --check

  formatting:
    name: Backend formatting (Black + isort)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pipx install poetry
      - run: poetry install --no-interaction
      # Double quotes are required; single quotes fail these checks.
      - run: poetry run black --check .
      - run: poetry run isort --check-only .

  # requirements.txt is WHAT PRODUCTION INSTALLS. The Dockerfile does
  # `COPY requirements.txt .` + `pip install -r requirements.txt` — it never touches Poetry.
  # So poetry.lock is the source of truth for developers and CI, while requirements.txt is the
  # source of truth for production, and NOTHING kept them in step.
  #
  # MEASURED 2026-09-07: they had diverged for over four months. requirements.txt still pinned
  # django==4.1.4, cryptography==38.0.4 and django-allauth==0.51.0 while poetry.lock carried
  # the 5.2 upgrade. Merging that state would have deployed Django 4.1.4 onto the new
  # python:3.12-slim base — a combination Django 4.1 does not support — and shipped none of the
  # upgrade. It also means Renovate, which only ever touches pyproject.toml and poetry.lock,
  # would have been decorative for production.
  #
  # This job is BLOCKING on purpose, unlike the audit below. A drift here is not a stale
  # warning, it is a deploy that installs something nobody reviewed.
  requirements-in-sync:
    name: requirements.txt matches poetry.lock
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pipx install poetry
      # Poetry 2.x moved `export` out of core. Locally this repo runs Poetry 1.8.4, which
      # still has it built in, so the step worked on a laptop and failed here with
      # "The requested command export does not exist" — the same works-locally/breaks-in-CI
      # shape this whole workflow exists to catch, this time in the guard itself.
      - run: pipx inject poetry poetry-plugin-export
      - name: Re-export and compare
        run: |
          poetry export --without-hashes --format requirements.txt --output /tmp/expected.txt
          # Compare the resolved package==version SET, not the file byte-for-byte: poetry
          # varies marker text and ordering between versions, and a guard that fails on
          # cosmetics gets disabled.
          norm() { grep -vE '^\s*(#|$)' "$1" | sed 's/ *;.*//' | tr -d ' ' | sort -u; }
          norm /tmp/expected.txt > /tmp/a
          norm requirements.txt   > /tmp/b
          if ! diff -u /tmp/b /tmp/a > /tmp/d; then
            echo "::error title=requirements.txt is out of sync with poetry.lock::Production installs requirements.txt. Regenerate it: poetry export --without-hashes --format requirements.txt --output requirements.txt"
            echo "--- requirements.txt (what production installs)  vs  +++ poetry.lock (what was reviewed)"
            cat /tmp/d
            exit 1
          fi
          echo "in sync: $(wc -l < /tmp/a) packages"

  # Dependency currency. This is the step whose absence let django 4.1.4 (EOL 2023-12-01) sit
  # in production for 33 months without anything saying so out loud. `staging-deploy.yml`
  # already runs `safety`, but only on the `develop` branch and behind BOTH
  # `continue-on-error: true` AND `|| true`, so it cannot fail and cannot be read as a gate.
  #
  # Non-blocking on arrival by design — see the posture note in the header. The count is
  # printed either way, so "12 advisories" becoming "40" is visible in the log before it is
  # ever a build failure.
  audit:
    name: Dependency audit (non-blocking until Django 5.2 lands)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pipx install poetry
      - run: pipx install pip-audit
      # `poetry self add ... || true` was silently useless here: Poetry 2.x has no `export`
      # without the plugin, and swallowing the failure would have left the audit exporting
      # nothing while the job still reported success.
      - run: pipx inject poetry poetry-plugin-export
      # Audit the RESOLVED lockfile, not the pyproject ranges — the ranges are what we intend,
      # the lock is what ships. `poetry export` is the only view that matches the deployed set.
      - name: Export resolved dependency set
        run: |
          poetry export --without-hashes --format requirements.txt --output requirements-audit.raw
          # Strip self-references and VCS/local entries. MEASURED locally 2026-09-07: leaving
          # them in made pip-audit try to `git clone ssh://git@github.com/...traceit-back`
          # and then fail with ResolutionImpossible — an audit that errors out reads exactly
          # like an audit that found nothing.
          grep -vEi '^(trazo|-e )|@ (git|file)' requirements-audit.raw > requirements-audit.txt
          echo "--- resolved packages: $(wc -l < requirements-audit.txt) ---"
      - name: pip-audit
        run: |
          pip-audit --requirement requirements-audit.txt --desc 2>&1 | tee audit.txt
          echo "=== advisory count: $(grep -cE '^[a-zA-Z0-9._-]+ +[0-9]' audit.txt || echo 0) ==="
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pip-audit-report
          path: audit.txt
          if-no-files-found: ignore
