# =============================================================================
# Trazo Backend - Staging Deployment Pipeline
# 2025 Best Practices: Security, Performance, Observability
# =============================================================================

name: 🚀 Deploy to Staging

on:
  push:
    branches: [ develop ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [ develop ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: false
        default: 'staging'
        type: choice
        options:
          - staging
          - staging-hotfix

# Environment variables
env:
  AWS_REGION: us-east-2
  ECR_REPOSITORY: trazo-backend-staging
  ECS_CLUSTER: staging-cluster
  ECS_SERVICE_1: staging-django-service
  ECS_SERVICE_2: staging-django
  ECS_TASK_DEFINITION: staging-django
  CONTAINER_NAME: django

# Security: Restrict permissions to minimum required
permissions:
  contents: read
  id-token: write
  security-events: write
  pull-requests: write
  actions: read

jobs:
  # =============================================================================
  # Job 1: Code Quality & Security Checks
  # =============================================================================
  quality-checks:
    name: 🔍 Quality & Security
    runs-on: ubuntu-latest
    timeout-minutes: 20
    
    steps:
      - name: 🔄 Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for better analysis
          
      - name: 🐍 Setup Python
        id: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: 📦 Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: latest
          virtualenvs-create: true
          virtualenvs-in-project: true
          installer: pip
          
      - name: 🔧 Load cached venv
        id: cached-poetry-dependencies
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('**/poetry.lock') }}
          
      - name: 📦 Install Dependencies
        if: steps.cached-poetry-dependencies.outputs.cache-hit != 'true'
        run: |
          poetry install --with dev
          
      - name: ✅ Verify Installation
        run: |
          poetry --version
          poetry show --tree
          
      - name: 🔒 Security Scan with Bandit
        continue-on-error: true
        id: bandit-scan
        run: |
          echo "🔍 Running Bandit security scan..."
          poetry run bandit -r . -f json -o bandit-report.json --exclude ./tests,./migrations,./.venv,./venv,./node_modules,./static,./media
          BANDIT_EXIT_CODE=$?
          echo "bandit_exit_code=$BANDIT_EXIT_CODE" >> $GITHUB_OUTPUT
          
          echo ""
          echo "📊 Security Scan Summary:"
          poetry run bandit -r . -f txt --exclude ./tests,./migrations,./.venv,./venv,./node_modules,./static,./media -ll || true
          
          if [ $BANDIT_EXIT_CODE -ne 0 ]; then
            echo "⚠️ Bandit found security issues. Checking severity..."
            # Only fail on high severity issues
            poetry run bandit -r . -f txt --exclude ./tests,./migrations,./.venv,./venv,./node_modules,./static,./media -lll
            HIGH_SEVERITY_EXIT=$?
            if [ $HIGH_SEVERITY_EXIT -ne 0 ]; then
              echo "❌ High severity security issues found!"
              exit 1
            else
              echo "⚠️ Only low/medium severity issues found - continuing with warnings"
            fi
          else
            echo "✅ No security issues found!"
          fi
          
      - name: 🔐 Dependency Vulnerability Check
        continue-on-error: true
        id: safety-scan
        run: |
          echo "🔍 Running Safety dependency vulnerability scan..."
          
          # Generate JSON report
          poetry run safety check --json > safety-report.json || true
          SAFETY_EXIT_CODE=$?
          echo "safety_exit_code=$SAFETY_EXIT_CODE" >> $GITHUB_OUTPUT
          
          echo ""
          echo "📊 Dependency Vulnerability Summary:"
          poetry run safety check || true
          
          if [ $SAFETY_EXIT_CODE -ne 0 ]; then
            echo "⚠️ Safety found vulnerable dependencies"
            echo "📋 Check safety-report.json for details"
            # For now, continue with warnings - can be made stricter later
            echo "⚠️ Continuing with vulnerability warnings - recommend reviewing findings"
          else
            echo "✅ No known vulnerabilities found in dependencies!"
          fi
          
      - name: ⚫ Code Formatting Check
        run: |
          poetry run black --check --diff .
          poetry run isort --check-only --diff .
          
      - name: 📏 Linting
        run: |
          echo "🔍 Running flake8 linting on project code only..."
          poetry run flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=.venv,venv,node_modules,.git,__pycache__,migrations
          poetry run flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics --exclude=.venv,venv,node_modules,.git,__pycache__,migrations
          
      - name: 🏗️ Django System Check
        run: |
          poetry run python manage.py check --settings=backend.settings.test
          
      - name: 📊 Upload Security Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-reports
          path: |
            bandit-report.json
            safety-report.json
          retention-days: 30

